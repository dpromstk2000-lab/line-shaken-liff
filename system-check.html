<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DPRO CAR_SERVICE｜システム確認 R2</title><style>body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dfe5eb;border-radius:18px;padding:18px;margin-bottom:14px}.btn{border:0;border-radius:12px;padding:12px 16px;background:#17202a;color:#fff;font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf1f4}.ok{color:#087a55;font-weight:900}.ng{color:#b42318;font-weight:900}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fb;padding:12px;border-radius:12px;font-size:12px}@media(max-width:420px){.row{display:block}.wrap{padding:14px 10px}}</style></head><body><div class="wrap"><div class="card"><h1>DPRO CAR_SERVICE システム確認</h1><p>WANGAN / KSH / Reset とProduct READY互換Adapterをまとめて確認します。</p><button id="run" class="btn">全検査を実行</button></div><div class="card"><div class="row"><span>WANGAN Worker</span><span id="wangan">確認前</span></div><div class="row"><span>KSH Worker</span><span id="ksh">確認前</span></div><div class="row"><span>Reset Worker</span><span id="reset">確認前</span></div><div class="row"><span>Version整合</span><span id="versions">確認前</span></div><div class="row"><span>本番保護</span><span id="guard">確認前</span></div><div class="row"><span>LINE本人確認</span><span id="line">確認前</span></div></div><div class="card"><pre id="result">未実行</pre></div></div><script>const ADAPTER="https://ropwvdnohadwxfbkcopx.supabase.co/functions/v1/dpro-car-service-control-adapter";const WANGAN="https://dpro-wangan-biz-api.dpromstk2000.workers.dev";const KSH="https://ksh-line-demo-api.dpromstk2000.workers.dev";const RESET="https://ksh-demo-reset.dpromstk2000.workers.dev";async function run(){const out=document.getElementById("result");out.textContent="確認中…";try{const r=await fetch(ADAPTER+"/system-check");const d=await r.json();const set=(id,ok)=>{const e=document.getElementById(id);e.textContent=ok?"PASS":"NG";e.className=ok?"ok":"ng"};set("wangan",d.versions?.wangan?.ok===true);set("ksh",d.versions?.ksh?.ok===true);set("reset",d.versions?.reset?.ok===true);set("versions",d.versionsAligned===true);set("guard",d.productionGuard===true);set("line",(d.checks||[]).some(x=>x.key==="line_no_token_rejected"&&x.ok));out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent="確認できませんでした。ネットワーク状態をご確認ください。"}}document.getElementById("run").addEventListener("click",run);run();</script></body></html>
