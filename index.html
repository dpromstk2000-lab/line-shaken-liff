<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車検・整備・カスタム ご相談窓口</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { background-color: #1a1a1a; color: #eee; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .card { background-color: #2a2a2a; border: 1px solid #444; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-primary { background-color: #e67e22; border: none; font-weight: bold; }
        .btn-primary:hover { background-color: #d35400; }
        .btn-outline-light { border-color: #666; color: #ccc; }
        .step-title { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 1.5rem; }
        .progress { height: 6px; border-radius: 3px; background-color: #444; }
        .progress-bar { background-color: #e67e22; }
        .form-label { font-weight: bold; color: #ddd; }
        .badge { background-color: #555 !important; color: #ccc; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 500px;">
    <div class="text-center mb-3">
        <h5 style="letter-spacing: 2px; font-weight: bold; color: #fff;">STREET HOUSE 湾岸通り</h5>
        <p style="font-size: 0.75rem; color: #aaa; margin: 0;">車検・整備・チューニング・カスタム</p>
    </div>

    <div class="card p-4">
        <div class="progress mb-4">
            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 33%;"></div>
        </div>

        <form id="diagnosisForm">
            <div id="step1" class="step-section">
                <div class="step-title">Q1. お客様の情報を教えてください</div>
                
                <div class="mb-3">
                    <label for="userName" class="form-label" style="margin-bottom: 2px;">お名前（フルネーム）</label>
                    <div style="color: #ff6b6b; font-size: 0.75rem; font-weight: bold; margin-bottom: 8px;">※LINE名が自動入力されます。ニックネーム等の場合は本名（漢字）への修正をお願いします。</div>
                    <input type="text" id="userName" class="form-control bg-dark text-white border-secondary" placeholder="例：山田 太郎" required>
                </div>

                <div class="mb-4">
                    <label for="carName" class="form-label">お車の名前 <span class="badge">任意</span></label>
                    <input type="text" id="carName" class="form-control bg-dark text-white border-secondary" placeholder="例：シルビア、プリウス、タントなど">
                </div>

                <button type="button" class="btn btn-primary w-100 py-2" onclick="nextStep(2)">次へ進む</button>
            </div>

            <div id="step2" class="step-section d-none">
                <div class="step-title">Q2. 本日のご相談内容はどちらでしょうか？</div>
                
                <div class="mb-4">
                    <select id="consultType" class="form-select bg-dark text-white border-secondary" style="font-size: 1.1rem; padding: 10px;">
                        <option value="車検の見積もり・予約">🚗 車検の見積もり・予約</option>
                        <option value="定期点検・オイル交換">🔧 定期点検・オイル交換</option>
                        <option value="キズ・ヘコミの修理">✨ キズ・ヘコミの修理</option>
                        <option value="異音・トラブルの点検">⚠️ 異音・トラブルの点検</option>
                        <option value="パーツ持ち込み取付・カスタム">🏁 パーツ持ち込み取付・カスタム</option>
                        <option value="その他（相談・質問など）">💬 その他（相談・質問など）</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-light w-50" onclick="prevStep(1)">戻る</button>
                    <button type="button" class="btn btn-primary w-50" onclick="nextStep(3)">次へ進む</button>
                </div>
            </div>

            <div id="step3" class="step-section d-none">
                <div class="step-title">Q3. あなたのお車の「次回車検」の年月を教えてください</div>
                <div style="color: #e67e22; font-size: 0.8rem; font-weight: bold; margin-bottom: 15px;">🔔 ※車検のうっかり忘れ防止に！満了日の2ヶ月前にLINEで個別にお知らせをお届けします。</div>
                
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label for="shakenYear" class="form-label">年</label>
                        <select id="shakenYear" class="form-select bg-dark text-white border-secondary" style="padding: 10px;" onchange="updateMonths()">
                            </select>
                    </div>
                    <div class="col-6">
                        <label for="shakenMonth" class="form-label">月</label>
                        <select id="shakenMonth" class="form-select bg-dark text-white border-secondary" style="padding: 10px;">
                            </select>
                    </div>
                </div>

                <div class="mb-4 mt-4">
                    <label for="userMessage" class="form-label">ご要望や気になる症状があればご記入ください <span class="badge">任意</span></label>
                    <textarea id="userMessage" class="form-control bg-dark text-white border-secondary" rows="3" placeholder="例：ブレーキを踏むと音がする、〇〇のパーツを持ち込みで付けてほしい、など"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-light w-50" onclick="prevStep(2)">戻る</button>
                    <button type="button" class="btn btn-primary w-50" onclick="submitDiagnosis()">この内容でリクエストする</button>
                </div>
            </div>
        </form>

        <div id="thankYouSection" class="text-center d-none py-4">
