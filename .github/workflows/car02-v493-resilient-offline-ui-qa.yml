name: CAR02 V4.93 Resilient Standalone Offline UI QA (NO_GO HOLD)
'on':
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-booking-calendar-resilient-r493.mjs'
      - 'car02-standalone-preview-builder-r493.mjs'
      - 'car02-booking-resilient-ui-r493.test.mjs'
      - 'car02-v493-resilient-offline-ui-contract.json'
      - 'CAR02_V493_RESILIENT_STANDALONE_OFFLINE_PREVIEW.html'
      - 'CAR02_V493_RESILIENT_OFFLINE_UI_QA.md'
      - '.github/workflows/car02-v493-resilient-offline-ui-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resilient-standalone-offline-ui:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout review-only branch without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin accepted V4.92 and immutable R52 release lock
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = 'refs/heads/car02-v434-review-only'
          for k in CAR02_DATABASE_URL DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!k:-}" || { echo V493_CREDENTIAL_REFUSED >&2; exit 1; }
          done
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          test "$(git hash-object CAR02_V492_FIREWALLED_STANDALONE_OFFLINE_PREVIEW.html)" = '8dc616ce7d9ebba9ab577c36469d035c35f5314e'
          test "$(sha256sum CAR02_V492_FIREWALLED_STANDALONE_OFFLINE_PREVIEW.html | awk '{print $1}')" = '9ca5d6576c2ebc56f364a5e46e436df1231c0b67030e9e2969ef15681a3a4b09'
          test "$(git hash-object car02-booking-calendar-firewalled-r492.mjs)" = 'bc49d764d51772ab5296c3f42735e876cfca203b'
          for f in car02-booking-calendar-resilient-r493.mjs car02-standalone-preview-builder-r493.mjs car02-booking-resilient-ui-r493.test.mjs car02-v493-resilient-offline-ui-contract.json CAR02_V493_RESILIENT_STANDALONE_OFFLINE_PREVIEW.html CAR02_V493_RESILIENT_OFFLINE_UI_QA.md; do test -s "$f"; done
          echo V493_V492_ACCEPTED_R52_LOCK_AND_HTML_IMMUTABLE_PASS
      - name: Run 21 independent resilience and offline UI TAP tests
        shell: bash
        run: |
          set -euo pipefail
          for f in car02-booking-calendar-resilient-r493.mjs car02-standalone-preview-builder-r493.mjs car02-booking-resilient-ui-r493.test.mjs; do node --check "$f"; done
          node --test-reporter=tap car02-booking-resilient-ui-r493.test.mjs | tee "$RUNNER_TEMP/v493-new-tests.log"
          total=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v493-new-tests.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v493-new-tests.log")
          test "$total" = 21
          test "$passed" = "$total"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v493-new-tests.log"
          echo V493_RESILIENT_UI_21_PASS
      - name: Rebuild deterministic CSP-pinned offline standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          node car02-standalone-preview-builder-r493.mjs
          test "$(sha256sum CAR02_V493_RESILIENT_STANDALONE_OFFLINE_PREVIEW.html | awk '{print $1}')" = 'e663a41545136a08dbb7f0811885a9c23c7153cdef6f433615e7460398b7c9a3'
          git diff --exit-code -- CAR02_V493_RESILIENT_STANDALONE_OFFLINE_PREVIEW.html
          echo V493_DETERMINISTIC_HTML_AND_SHA_CSP_PASS
      - name: Verify no-authority contract and hostile clock containment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {mountCar02BookingCalendarResilientR493 as mount} from './car02-booking-calendar-resilient-r493.mjs';
          const c=JSON.parse(readFileSync('car02-v493-resilient-offline-ui-contract.json','utf8'));
          assert.equal(c.systemCode,'CAR02');assert.equal(c.version,'V4.93');
          assert.equal(c.baseVersion,'V4.92');assert.equal(c.baseRunId,39879720241);
          assert.equal(c.baseNodeTests,1482);assert.equal(c.newNodeTests,21);
          assert.equal(c.expectedMinimumNodeTests,1503);
          assert.equal(c.acceptedV492HtmlUnmodified,true);
          assert.equal(c.acceptedV491AndV492ModulesUnmodified,true);
          for(const k of ['bookingCreationAllowed','productionDeployAllowed','databaseMutationAllowed',
            'lineDispatchAllowed','providerConnectionAllowed','billingChangeAllowed'])assert.equal(c[k],false,k);
          assert.equal(c.releaseLock,true);assert.equal(c.commercialDecision,'NO_GO_HOLD');
          assert.equal(c.providerProofsVerified,0);assert.equal(c.requiredProviderProofs,7);
          const locked=mount(null,()=>{throw Error('hostile_clock');});
          assert.equal(locked.bookingCreationAllowed,false);
          assert.equal(locked.releaseLock,true);
          assert.deepEqual(locked.getSelected(),{day:null,time:null});
          console.log('V493_HOSTILE_CLOCK_NEVER_CREATES_BOOKING_PASS');
          NODE
      - name: Run full repository regression retaining prior accepted coverage
        shell: bash
        run: |
          set -euo pipefail
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v493-full-tests.log"
          total=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v493-full-tests.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v493-full-tests.log")
          test "$total" -ge 1503
          test "$passed" = "$total"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v493-full-tests.log"
          echo V493_FULL_REGRESSION_MINIMUM_1503_PASS
