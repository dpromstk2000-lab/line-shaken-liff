                      <strong id="countReady">-</strong>
                      <small>お客様へ連絡・引渡し</small>
                      <em class="tap-hint">一覧へ</em>
                    </div>
                    <div class="summary-card action-card" role="button" tabindex="0" onclick="jumpToday('todayTaskPanel')" onkeydown="summaryCardKey(event, 'todayTaskPanel')">
                      <span>未対応・連絡</span>
