      - name: Validate iPad HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          test -f owner-ipad.html
          test -f ksh-next-6-ipad-operations.js
          test -f .dpro/ksh-next/ksh-next-6-result.yml

          grep -q 'STEP KSH-NEXT-6: IPAD OPERATIONS' owner-ipad.html
          grep -q 'id="tab-today" class="tab-btn active"' owner-ipad.html
          grep -q 'id="section-today" class="section active"' owner-ipad.html
          grep -q 'id="intakeReceptionChannel"' owner-ipad.html
          grep -q 'id="arrivalReservationList"' owner-ipad.html
          grep -q 'id="workingReservationList"' owner-ipad.html
          grep -q 'id="readyReservationList"' owner-ipad.html
          grep -q 'ksh-next-6-ipad-operations.js' owner-ipad.html
          grep -q 'advanceIpadProgress' ksh-next-6-ipad-operations.js
          grep -q 'estimate_approval_guard_preserved: true' .dpro/ksh-next/ksh-next-6-result.yml
          grep -q 'current_step: "STEP KSH-NEXT-6"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-7"' .dpro/ksh-next/plan.yml | grep -q 'status: "next"'

          node --check ksh-next-6-ipad-operations.js

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter
          import re
          import subprocess
          import tempfile

          text = Path("owner-ipad.html").read_text(encoding="utf-8")

          class Parser(HTMLParser):
              pass

          parser = Parser()
          parser.feed(text)
          parser.close()

          ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
          duplicates = sorted(key for key, count in Counter(ids).items() if count > 1)
          if duplicates:
              raise SystemExit("owner-ipad.html duplicate IDs: " + ", ".join(duplicates))

          required_ids = [
              "countArrivalWaiting",
              "countWorking",
              "countReady",
              "countOpenTasks",
              "arrivalReservationList",
              "workingReservationList",
              "readyReservationList",
              "provisionalReservationList",
              "todayTaskList",
          ]
          for required_id in required_ids:
              if ids.count(required_id) != 1:
                  raise SystemExit(f"required ID count invalid: {required_id}")

          inline_scripts = []
          for attrs, body in re.findall(
              r"<script\b([^>]*)>(.*?)</script>",
              text,
              flags=re.I | re.S,
          ):
              if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                  continue
              if body.strip():
                  inline_scripts.append(body)

          for index, script in enumerate(inline_scripts, start=1):
              temp = Path(tempfile.gettempdir()) / f"ksh-next-6-owner-ipad-{index}.js"
              temp.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(temp)], check=True)

          print("owner-ipad HTML and inline JS OK")
          print("unique IDs:", len(ids))
          PY

      - name: Test iPad lane and metadata logic
        shell: bash
        run: |
          set -euo pipefail

          node <<'JS'
          const receptionPattern = /^【受付経路：(LINE|電話|店頭|管理者代理)】\s*/m;
          const progressPattern = /^【進捗：([^】]+)】\s*/m;
          const estimateVersionPattern = /^【見積版：(\d+)】\s*/m;
          const estimateAmountPattern = /^【見積金額：(\d+)】\s*/m;

          function inferProgress(memo, status) {
            const explicit = String(memo || "").match(progressPattern)?.[1] || "";
            if (explicit) return explicit;
            if (String(status).includes("作業中")) return "作業中";
            if (String(status).includes("入庫済み")) return "受付・入庫済み";
            return "入庫予定";
          }

          function lane(stage) {
            if (stage === "引渡し可能") return "ready";
            if (["受付・入庫済み", "点検中", "見積作成中", "お客様確認待ち", "作業中", "最終確認"].includes(stage)) return "working";
            return "arrival";
          }

          const cases = {
            "入庫予定": "arrival",
            "受付・入庫済み": "working",
            "点検中": "working",
            "見積作成中": "working",
            "お客様確認待ち": "working",
            "作業中": "working",
            "最終確認": "working",
            "引渡し可能": "ready"
          };

          for (const [stage, expected] of Object.entries(cases)) {
            if (lane(stage) !== expected) throw new Error(`lane mapping failed: ${stage}`);
          }

          const memo = [
            "【受付経路：電話】",
            "【進捗：点検中】",
            "【見積版：2】",
            "【見積金額：132000】",
            "代車希望"
          ].join("\n");

          if (memo.match(receptionPattern)?.[1] !== "電話") throw new Error("reception marker failed");
          if (inferProgress(memo, "作業中") !== "点検中") throw new Error("progress marker failed");
          if (Number(memo.match(estimateVersionPattern)?.[1]) !== 2) throw new Error("estimate version failed");
          if (Number(memo.match(estimateAmountPattern)?.[1]) !== 132000) throw new Error("estimate amount failed");

          console.log("iPad lane and metadata logic OK");
          JS

          echo "KSH-NEXT-6 logic checks passed."

      - name: Commit KSH-NEXT-6
        shell: bash
