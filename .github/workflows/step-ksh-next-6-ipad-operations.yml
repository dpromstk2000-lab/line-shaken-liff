                    </div>
                    <button class="btn btn-primary" onclick="loadToday()">今日を更新</button>
                  </div>''',
              '''        <div class="toolbar">
                    <div>
                      <h2>今日の現場ボード</h2>
                      <p>到着待ち・作業中・引渡し待ちを最初に確認します。設定と売上はPC管理画面に分けています。</p>
                    </div>
