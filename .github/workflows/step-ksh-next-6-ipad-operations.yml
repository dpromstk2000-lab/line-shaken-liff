name: STEP KSH-NEXT-6 iPad Operations

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/step-ksh-next-6-ipad-operations.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step-ksh-next-6-ipad-operations
  cancel-in-progress: false

jobs:
  ipad-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Save pre-change commit
        shell: bash
        run: |
          set -euo pipefail
          echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify KSH-NEXT-5 completion
        shell: bash
        run: |
          set -euo pipefail

          test -f owner-ipad.html
          test -f dashboard.html
          test -f ksh-next-5-owner-estimate.js
          test -f .dpro/ksh-next/plan.yml
          test -f .dpro/ksh-next/ksh-next-5-result.yml

          grep -q 'STEP KSH-PHONE-3' owner-ipad.html
          grep -q 'id="section-intake" class="section active"' owner-ipad.html
          grep -q 'id="section-today" class="section"' owner-ipad.html
          grep -q 'id="todayReservationList"' owner-ipad.html
          grep -q 'function renderReservationCard(row, mode)' owner-ipad.html
          grep -q 'function patchReservation(row, overrides = {})' owner-ipad.html
          grep -q 'function buildReservationPayload(row, overrides = {})' owner-ipad.html
          grep -q 'current_step: "STEP KSH-NEXT-5"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-6"' .dpro/ksh-next/plan.yml | grep -q 'status: "next"'

          if grep -q 'STEP KSH-NEXT-6: IPAD OPERATIONS' owner-ipad.html; then
            echo "STEP KSH-NEXT-6 is already applied."
            exit 1
          fi

          if [ -f ksh-next-6-ipad-operations.js ]; then
            echo "KSH-NEXT-6 JavaScript already exists. Stop to prevent duplicate application."
            exit 1
          fi

          echo "KSH-NEXT-5 completion verified."

      - name: Create safety tag
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_TAG="ksh-next-6-before-${{ github.run_id }}"
          git tag "$BACKUP_TAG" "$BEFORE_SHA"
          git push origin "$BACKUP_TAG"
          echo "BACKUP_TAG=$BACKUP_TAG" >> "$GITHUB_ENV"

      - name: Apply iPad operation optimization
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json
          import re

          ipad_path = Path("owner-ipad.html")
          plan_path = Path(".dpro/ksh-next/plan.yml")
          result_path = Path(".dpro/ksh-next/ksh-next-6-result.yml")
          ipad_js_path = Path("ksh-next-6-ipad-operations.js")

          original = ipad_path.read_text(encoding="utf-8")
          text = original

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return source.replace(old, new, 1)

          def quote(value):
              return json.dumps(str(value), ensure_ascii=False)

          def sha256_text(value):
              return hashlib.sha256(value.encode("utf-8")).hexdigest()

          text = replace_once(
              text,
              "<title>DPRO CAR LINE｜現場受付専用iPad STEP KSH-PHONE-3</title>",
              "<title>DPRO 車検・整備工場 LINE｜受付iPad STEP KSH-NEXT-6</title>",
              "iPad title",
          )

          text = replace_once(
              text,
              '''        <nav class="tabs">
                    <button id="tab-intake" class="tab-btn active" onclick="switchTab('intake')">受付</button>
                    <button id="tab-today" class="tab-btn" onclick="switchTab('today')">今日</button>
                    <button id="tab-reservations" class="tab-btn" onclick="switchTab('reservations')">入庫予定</button>
                    <button id="tab-customers" class="tab-btn" onclick="switchTab('customers')">顧客検索</button>
                  </nav>''',
              '''        <nav class="tabs">
                    <button id="tab-today" class="tab-btn active" onclick="switchTab('today')">今日の現場</button>
                    <button id="tab-intake" class="tab-btn" onclick="switchTab('intake')">電話・店頭受付</button>
                    <button id="tab-reservations" class="tab-btn" onclick="switchTab('reservations')">今後の予定</button>
                    <button id="tab-customers" class="tab-btn" onclick="switchTab('customers')">顧客検索</button>
                  </nav>''',
              "iPad tabs",
          )

          text = replace_once(
              text,
              '<section id="section-intake" class="section active">',
              '<section id="section-intake" class="section">',
              "intake default inactive",
          )
          text = replace_once(
              text,
              '<section id="section-today" class="section">',
              '<section id="section-today" class="section active">',
              "today default active",
          )

          text = replace_once(
              text,
              '''        <div class="workflow-guide">
                    <div class="guide-card"><strong><b>1</b>顧客・車両を入力</strong><p>電話番号が同じ場合は既存顧客として更新し、重複登録を減らします。</p></div>
                    <div class="guide-card"><strong><b>2</b>入庫日時を選択</strong><p>今日以降の日付、営業時間内の30分単位だけを選びます。</p></div>
                    <div class="guide-card"><strong><b>3</b>保存してLINE連絡</strong><p>保存後、確認文面をコピーしてLINE公式・電話対応に使います。</p></div>
                  </div>''',
              '''        <details class="ipad-guide-details">
                    <summary>受付手順を確認する</summary>
                    <div class="workflow-guide">
                      <div class="guide-card"><strong><b>1</b>顧客・車両を入力</strong><p>電話番号が同じ場合は既存顧客として更新し、重複登録を減らします。</p></div>
                      <div class="guide-card"><strong><b>2</b>入庫日時を選択</strong><p>今日以降の日付、営業時間内の30分単位だけを選びます。</p></div>
                      <div class="guide-card"><strong><b>3</b>保存してLINE連絡</strong><p>保存後、確認文面をコピーしてLINE公式・電話対応に使います。</p></div>
                    </div>
                  </details>''',
              "intake guide collapse",
          )

          text = replace_once(
              text,
              '''              <div class="form-field">
                          <label>作業内容</label>
                          <select id="intakeWorkType">''',
              '''              <div class="form-field">
                          <label>受付経路</label>
                          <select id="intakeReceptionChannel">
                            <option value="電話" selected>電話</option>
                            <option value="店頭">店頭</option>
