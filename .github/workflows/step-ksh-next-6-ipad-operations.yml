          old_summary = '''        <div class="summary-grid">
                    <div class="summary-card action-card" role="button" tabindex="0" onclick="jumpToday('todayReservationPanel')" onkeydown="summaryCardKey(event, 'todayReservationPanel')">
                      <span>本日の入庫</span>
                      <strong id="countTodayReservations">-</strong>
