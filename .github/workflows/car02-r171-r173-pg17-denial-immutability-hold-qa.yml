name: CAR02 R171-R173 PG17 Rejected Command Immutability HOLD QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: car02-r171-r173-disposable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-five-table-immutability-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r171-throwaway-admin-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAR02_RELEASE_LOCK: 'true'
      R171_DISPOSABLE_QA: 'yes'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout read only without stored credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Pin six immutable prior source identities and release lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence-r171
          test "$(git rev-parse HEAD:R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql)" = '3784f8a28549bc40343646bf88657c9d9b0b80f2'
          test "$(git rev-parse HEAD:car02_r138_pg17_lifecycle_qa.py)" = 'ff98dd74916ff3ea77412b986138151a4fddab90'
          test "$(git rev-parse HEAD:car02_r159_concurrent_booking_isolated.py)" = '318921e951cf1578bb00f32eb77f2054ca350ed6'
          test "$(git rev-parse HEAD:car02_r162_booking_stress_isolated.py)" = 'd6dd3a48a48ffe045ce4ab5df3c2fdd86b3e0e5e'
          test "$(git rev-parse HEAD:car02_r165_interleaving_isolated.py)" = 'ce9c2a3e1b2dae378ea97e097a5738868f18a19f'
          test "$(git rev-parse HEAD:car02_r168_case_race_isolated.py)" = 'a7f04ad9b7d417f450209daecb1267c88565ac79'
          echo R171_R173_IMMUTABLE_SOURCE_PINS_PASS > qa-evidence-r171/source-pins.log
          echo R171_R173_RELEASE_NO_GO_DB_MIGRATION_HOLD > qa-evidence-r171/release-lock.log
      - name: R172 negative report and file tests in three complete passes
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            python3 -m unittest -v test_car02_r172_rejection_immutability.py 2>&1 | tee "qa-evidence-r171/r172-negative-${round}.log"
            grep -Eq '^Ran 71 tests in ' "qa-evidence-r171/r172-negative-${round}.log"
            grep -Fxq OK "qa-evidence-r171/r172-negative-${round}.log"
            ! grep -Eq 'FAILED|ERROR|skipped=' "qa-evidence-r171/r172-negative-${round}.log"
          done
      - name: R173 workflow no deploy and release lock contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_car02_r173_workflow_contract.py 2>&1 | tee qa-evidence-r171/r173-workflow-contract.log
          grep -Fxq OK qa-evidence-r171/r173-workflow-contract.log
      - name: Create fresh disposable PG17 fixture with five synthetic roles
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r138_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -v ON_ERROR_STOP=1 < R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql > qa-evidence-r171/schema.log
          grep -Fxq R138_DISPOSABLE_PG17_SCHEMA_READY qa-evidence-r171/schema.log
      - name: Assert exact five table fixture starts empty
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          for table in bookings service_cases case_operations booking_operations audit_events; do
            docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -Atqc "SELECT count(*) FROM car02_r138_qa.$table;" | grep -Fxq 0
          done
          echo R171_FIVE_DISPOSABLE_TABLES_EMPTY > qa-evidence-r171/precheck.log
      - name: R171 real PG17 rejected command five table immutability checks
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          python3 car02_r171_rejection_immutability_isolated.py --cid "$CID" --commit "$GITHUB_SHA" 2>&1 | tee qa-evidence-r171/r171-probe.log
          grep -Fxq R171_PG17_FIVE_TABLE_DENIED_OPERATION_IMMUTABILITY_PASS_NO_GO_HOLD qa-evidence-r171/r171-probe.log
          python3 - <<'PYVERIFY'
          import json,os
          from pathlib import Path
          from car02_r171_rejection_immutability_isolated import verify_report,REQUIRED_CHECKS
          report=json.loads(Path('qa-evidence-r171/r171-rejected-command-immutability.json').read_text(encoding='ascii'))
          assert report['githubCommit']==os.environ['GITHUB_SHA']
          assert verify_report(report)
          assert set(report['denied'])==set(REQUIRED_CHECKS)
          assert report['release']=='NO_GO' and report['migration']=='HOLD'
          assert report['realWorldGatesOpen']==12 and report['productionTouched'] is False
          print('R171_INDEPENDENT_REPORT_REREAD_PASS_NO_GO_HOLD')
          PYVERIFY
      - name: Always drop disposable PG17 database and five synthetic identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r138_qa_ci WITH (FORCE);'
          for role in car02_r138_a_staff_ci car02_r138_a_one_ci car02_r138_a_two_ci car02_r138_b_staff_ci car02_r138_b_one_ci; do
            docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS $role;"
          done
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS(SELECT 1 FROM pg_database WHERE datname='car02_r138_qa_ci') AND NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname LIKE 'car02_r138_%_ci') THEN 'R171_ALL_THROWAWAY_RESOURCES_DELETED' ELSE 'R171_CLEANUP_FAILED' END" | grep -Fxq R171_ALL_THROWAWAY_RESOURCES_DELETED
          echo R171_ALL_THROWAWAY_RESOURCES_DELETED > qa-evidence-r171/cleanup.log
      - name: Confirm cleanup source pins and unconditional NO GO HOLD
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq R171_ALL_THROWAWAY_RESOURCES_DELETED qa-evidence-r171/cleanup.log
          grep -Fxq R171_R173_RELEASE_NO_GO_DB_MIGRATION_HOLD qa-evidence-r171/release-lock.log
          test "$(git rev-parse HEAD:R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql)" = '3784f8a28549bc40343646bf88657c9d9b0b80f2'
          test "$(git rev-parse HEAD:car02_r138_pg17_lifecycle_qa.py)" = 'ff98dd74916ff3ea77412b986138151a4fddab90'
          test "$(git rev-parse HEAD:car02_r159_concurrent_booking_isolated.py)" = '318921e951cf1578bb00f32eb77f2054ca350ed6'
          test "$(git rev-parse HEAD:car02_r162_booking_stress_isolated.py)" = 'd6dd3a48a48ffe045ce4ab5df3c2fdd86b3e0e5e'
          test "$(git rev-parse HEAD:car02_r165_interleaving_isolated.py)" = 'ce9c2a3e1b2dae378ea97e097a5738868f18a19f'
          test "$(git rev-parse HEAD:car02_r168_case_race_isolated.py)" = 'a7f04ad9b7d417f450209daecb1267c88565ac79'
          python3 - <<'PYHOLD'
          import json,os
          from pathlib import Path
          from car02_r171_rejection_immutability_isolated import verify_report
          report=json.loads(Path('qa-evidence-r171/r171-rejected-command-immutability.json').read_text())
          assert report['githubCommit']==os.environ['GITHUB_SHA'] and verify_report(report)
          assert report['release']=='NO_GO' and report['migration']=='HOLD'
          assert report['realWorldGatesOpen']==12
          assert report['realAuthenticationVerified'] is False and report['realRLSVerified'] is False
          assert report['productionAuthorized'] is False and report['externalSignatureVerified'] is False
          print('R171_R173_CLEANUP_AND_RELEASE_HOLD_PASS')
          PYHOLD
      - name: Upload seven day synthetic only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car02-r171-r173-disposable-rejection-immutability
          path: qa-evidence-r171/
          if-no-files-found: warn
          retention-days: 7
