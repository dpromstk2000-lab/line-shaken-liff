      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter
          import re
          import subprocess
          import tempfile

          text = Path("dashboard.html").read_text(encoding="utf-8")

          class Parser(HTMLParser):
              pass

          parser = Parser()
          parser.feed(text)
          parser.close()

          ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
          duplicates = sorted(key for key, count in Counter(ids).items() if count > 1)
          if duplicates:
              raise SystemExit("duplicate IDs: " + ", ".join(duplicates))

          required = [
              "STEP KSH-NEXT-4: WORK PROGRESS",
              'id="reservationProgressStage"',
              'id="reservationStatus" type="hidden"',
              "RESERVATION_PROGRESS_STAGES",
              "RESERVATION_PROGRESS_MARKER_PATTERN",
              "applyReservationMetadataMarkers",
              "inferReservationProgressStage",
              "renderReservationProgress",
              "advanceReservationProgress",
              "引渡し可能",
              "お客様確認待ち",
              "<th>作業進捗</th>",
              "STEP KSH-NEXT-4",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit("missing marker: " + marker)

          if text.count('id="reservationProgressStage"') != 1:
              raise SystemExit("reservationProgressStage ID count is not 1")

          if text.count('id="reservationStatus"') != 1:
              raise SystemExit("reservationStatus ID count is not 1")

          if '<select id="reservationStatus"' in text:
              raise SystemExit("old visible reservation status select remains")

          inline_scripts = []
          for attrs, body in re.findall(
              r"<script\b([^>]*)>(.*?)</script>",
              text,
              flags=re.I | re.S,
          ):
              if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                  continue
              if body.strip():
                  inline_scripts.append(body)

          if not inline_scripts:
              raise SystemExit("inline JavaScript was not found")

          for index, script in enumerate(inline_scripts, start=1):
              temp = Path(tempfile.gettempdir()) / f"ksh-next-4-script-{index}.js"
              temp.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(temp)], check=True)
              print("JavaScript syntax OK:", index)

          print("HTML parser OK")
          print("ID uniqueness OK:", len(ids), "IDs")
          PY

      - name: Test progress mapping
        shell: bash
        run: |
          set -euo pipefail

          node <<'JS'
          const stages = [
            "仮入庫",
            "入庫予定",
            "受付・入庫済み",
            "点検中",
            "見積作成中",
            "お客様確認待ち",
            "作業中",
            "最終確認",
            "引渡し可能",
            "引渡し完了"
          ];

          const receptionPattern = /^【受付経路：(LINE|電話|店頭|管理者代理)】\s*/;
          const progressPattern = /^【進捗：(仮入庫|入庫予定|受付・入庫済み|点検中|見積作成中|お客様確認待ち|作業中|最終確認|引渡し可能|引渡し完了|キャンセル)】\s*/m;

          function stripReception(memo) {
            return String(memo || "").replace(receptionPattern, "").trim();
          }

          function stripProgress(memo) {
            return String(memo || "").replace(progressPattern, "").trim();
          }

          function stripAll(memo) {
            return stripProgress(stripReception(memo)).trim();
          }

          function apply(memo, channel, stage) {
            return [
              `【受付経路：${channel}】`,
              `【進捗：${stage}】`,
              stripAll(memo)
            ].filter(Boolean).join("\n");
          }

          function status(stage) {
            if (stage === "仮入庫") return "仮入庫";
            if (stage === "入庫予定") return "入庫予定";
            if (stage === "受付・入庫済み") return "入庫済み";
            if (stage === "引渡し完了") return "作業完了";
            if (stage === "キャンセル") return "キャンセル";
            return "作業中";
          }

          for (const stage of stages) {
            const saved = apply("代車希望", "電話", stage);
            const progress = saved.match(progressPattern)?.[1] || "";
            if (progress !== stage) throw new Error(`progress marker failed: ${stage}`);
            if (stripAll(saved) !== "代車希望") throw new Error(`plain memo failed: ${stage}`);
            if ((saved.match(/【受付経路：/g) || []).length !== 1) throw new Error("reception marker duplicate");
            if ((saved.match(/【進捗：/g) || []).length !== 1) throw new Error("progress marker duplicate");
          }

          const expectedStatus = {
            "仮入庫": "仮入庫",
            "入庫予定": "入庫予定",
            "受付・入庫済み": "入庫済み",
            "点検中": "作業中",
            "見積作成中": "作業中",
            "お客様確認待ち": "作業中",
            "作業中": "作業中",
            "最終確認": "作業中",
            "引渡し可能": "作業中",
            "引渡し完了": "作業完了"
          };

          for (const [stage, expected] of Object.entries(expectedStatus)) {
            if (status(stage) !== expected) throw new Error(`status mapping failed: ${stage}`);
          }

          const quickStages = stages.slice(0, -1);
          if (quickStages[quickStages.length - 1] !== "引渡し可能") {
            throw new Error("quick progression must stop at ready");
          }

          console.log("Work progress marker and status mapping OK");
          JS

          test -f .dpro/ksh-next/ksh-next-4-result.yml
          grep -q 'step: "STEP KSH-NEXT-4"' .dpro/ksh-next/ksh-next-4-result.yml
          grep -q 'database_changed: false' .dpro/ksh-next/ksh-next-4-result.yml
          grep -q 'worker_changed: false' .dpro/ksh-next/ksh-next-4-result.yml
          grep -q 'completed_sales_validation_preserved: true' .dpro/ksh-next/ksh-next-4-result.yml
          grep -q 'current_step: "STEP KSH-NEXT-4"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-5"' .dpro/ksh-next/plan.yml | grep -q 'status: "next"'

          echo "KSH-NEXT-4 policy checks passed."

