name: CAR02 V4.68 Actual R46 Mock-Provider Session Bridge QA (NO_GO HOLD)
# Review-only Node suite: imports actual R46, but all provider responses are offline.
# NO real Supabase/LINE/SQL, worker deploy, customer data, secrets, or GO.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-supabase-session-bridge-r468.mjs'
      - 'car02-supabase-session-bridge-r468.test.mjs'
      - 'car02-v468-r46-session-bridge-contract.json'
      - '.github/workflows/car02-v468-r46-session-bridge-offline-qa.yml'
      - 'car02-auth-providers-r46.mjs'
      - 'car02-edge-entry-r52.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only-provider-session-bridge:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout actual R46 and locked R52 with no stored credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject live credentials and require immutable original R46 R52
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = 'refs/heads/car02-v434-review-only'
          for secret in CAR02_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!secret:-}" || { echo "V468_LIVE_SECRET_DENIED" >&2; exit 1; }
          done
          test "$(git hash-object car02-auth-providers-r46.mjs)" = 'd90404a880c06b809c30685654029a938913ec09'
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          test -s car02-supabase-session-bridge-r468.mjs
          test -s car02-supabase-session-bridge-r468.test.mjs
          test -s car02-v468-r46-session-bridge-contract.json
          test -s .github/workflows/car02-v468-r46-session-bridge-offline-qa.yml
          test ! -e car02-v468-r46-session-bridge-offline-qa.yml
          echo V468_ACTUAL_R46_R52_SOURCE_PINS_AND_RELEASE_LOCK_PASS
      - name: Actual R46 imported with injected fake provider and full regression
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-supabase-session-bridge-r468.mjs
          node --check car02-supabase-session-bridge-r468.test.mjs
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v468-node.log"
          tests=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v468-node.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v468-node.log")
          test "$tests" -ge 612
          test "$passed" = "$tests"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v468-node.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V468_RELEASE_LOCK} from './car02-supabase-session-bridge-r468.mjs';
          const c=JSON.parse(readFileSync('car02-v468-r46-session-bridge-contract.json','utf8'));
          assert.equal(CAR02_V468_RELEASE_LOCK,true);
          assert.equal(c.releasePermitted,false);
          assert.equal(c.r46PinnedGitBlob,'d90404a880c06b809c30685654029a938913ec09');
          assert.equal(c.r52PinnedGitBlob,'f0e31fb9f9d98524519d01dffd3489893d3d3302');
          assert.equal(c.fixtures.alwaysReturns,'NO_GO');
          console.log('V468_ACTUAL_R46_MOCK_FETCH_SESSION_CLAIM_AND_INDEPENDENT_MOCK_FENCE_PASS');
          NODE
          echo V468_NODE_ALL_REGRESSION_NO_REAL_PROVIDER_OR_BUSINESS_WRITES_PASS
          echo V468_FINAL_RELEASE_NO_GO_HOLD_TRUE
