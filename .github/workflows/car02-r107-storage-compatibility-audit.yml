name: DPRO CAR02 R107 Storage Compatibility Source-Only Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r107-source-only-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source-only repository
        uses: actions/checkout@v5
      - name: Verify protected hashes and hard release lock
        run: |
          set -euo pipefail
          test "$(git hash-object car02-private-photo-r47.mjs)" = e0f3abec6bcf57830d9f3b72fe2eee099b1dff1d
          test "$(git hash-object car02-unified-runtime-r50.mjs)" = 76e4e8cae27599f27e3d887118148718c32ebb80
          test "$(git hash-object car02-edge-boundary-r51.mjs)" = 6614f2ed1933aa787576cb8074cb7d4bc704efa0
          test "$(git hash-object car02-edge-entry-r52.ts)" = f0e31fb9f9d98524519d01dffd3489893d3d3302
          test "$(git hash-object car02-private-photo-upload-http-r82.mjs)" = 78f8b0f80fcc1f89d15fd25e4593c660cd197ea3
          test "$(git hash-object car02-r93q-single-schema-lifecycle-isolated.mjs)" = be1cd3feb78e26fb4759d9a86ecbd835d7ada144
          test "$(git hash-object car02-r93s-durable-upload-intent-isolated.mjs)" = 64e907008448264512594573cdcdcd8773c4c29d
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
      - name: Run R94B through R107 offline regression
        run: |
          set -euo pipefail
          node --check car02-r107-storage-compatibility-gate.mjs
          node --check car02-r107-workflow-guard.mjs
          node --test test-car02-r94b-backup-restore-contract.mjs test-car02-r94b-workflow-guard.mjs test-car02-r95-restore-drift-qa.mjs test-car02-r96-backup-recovery-qa.mjs test-car02-r97-product-readiness.mjs test-car02-r98-order-intake.mjs test-car02-r98-browser-events.mjs test-car02-r99-upload-boundary.mjs test-car02-r100-tenant-rls-qa.mjs test-car02-r101-session-reuse-qa.mjs test-car02-r102-early-ingress.mjs test-car02-r103-recovery-worker.mjs test-car02-r104-fenced-recovery.mjs test-car02-r105-generation-lease.mjs test-car02-r106-versioned-delete.mjs test-car02-r107-storage-compatibility.mjs > /tmp/car02-r107-tests.log
          grep -Fq '# fail 0' /tmp/car02-r107-tests.log
          grep -Fq '# tests 298' /tmp/car02-r107-tests.log
          tail -n 8 /tmp/car02-r107-tests.log
          node car02-r107-workflow-guard.mjs
      - name: Audit actual source and provider capability blockers
        run: |
          set -euo pipefail
          node car02-r107-storage-compatibility-gate.mjs > /tmp/car02-r107-report.log
          grep -Fxq R107_STORAGE_COMPATIBILITY_SOURCE_GATE_NO_GO_HOLD_PASS /tmp/car02-r107-report.log
          grep -Fq '"openGates": [' /tmp/car02-r107-report.log
          grep -Fq '"releaseDecision": "NO_GO"' /tmp/car02-r107-report.log
          grep -Fq '"migrationDecision": "HOLD"' /tmp/car02-r107-report.log
          echo R107_PROVIDER_STORAGE_CAPABILITY_NOT_YET_VERIFIED
      - name: Assert release remains NO_GO migration HOLD
        run: |
          set -euo pipefail
          node car02-r107-workflow-guard.mjs
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          echo R107_PRODUCTION_NO_GO_MIGRATION_HOLD
