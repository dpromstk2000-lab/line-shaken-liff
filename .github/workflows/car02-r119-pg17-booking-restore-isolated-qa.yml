name: DPRO CAR02 R119 PG17 Booking Tenant and Restore QA (Isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: car02-r119-disposable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r119-disposable-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r119-disposable-superuser-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAR02_RELEASE_LOCK: 'true'
      R119_DISPOSABLE_QA: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: car02_r119_qa_ci
    steps:
      - name: Checkout read-only sources without retained credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify protected original sources and release lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence-r119
          python3 car02_r118_readonly_source_gate.py --strict --out qa-evidence-r119/original-source-gate.json
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
      - name: Run offline contract guard and parse JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-r119-pg17-booking-qa.mjs
          node --test test-car02-r119-contract.mjs | tee qa-evidence-r119/contract-tests.txt
          grep -Fq '# fail 0' qa-evidence-r119/contract-tests.txt
      - name: Install disposable runner PG client dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Create PG17 disposable database and tenant accounts
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r119_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r119_qa_ci -v ON_ERROR_STOP=1 < R119_PG17_BOOKING_RLS_QA_ONLY.sql > qa-evidence-r119/schema-setup.log
          grep -Fxq R119_DISPOSABLE_PG17_SCHEMA_READY qa-evidence-r119/schema-setup.log
      - name: Test six-way concurrent booking and tenant restrictions in PG17
        shell: bash
        env:
          R119_EVIDENCE_FILE: qa-evidence-r119/pg17-source-qa.json
        run: |
          set -euo pipefail
          node car02-r119-pg17-booking-qa.mjs | tee qa-evidence-r119/pg17-source-results.log
          grep -Fxq R119_PG17_CONCURRENCY_TENANT_RLS_PASS qa-evidence-r119/pg17-source-results.log
          grep -Fxq R119_PRODUCTION_NO_GO_DATABASE_MIGRATION_HOLD qa-evidence-r119/pg17-source-results.log
      - name: Create and verify entirely synthetic backup and separate restoration
        shell: bash
        env:
          PGDATABASE: car02_r119_restore_ci
          R119_EVIDENCE_FILE: qa-evidence-r119/pg17-restore-qa.json
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" pg_dump -U postgres -d car02_r119_qa_ci --format=custom --no-owner > /tmp/car02-r119-synthetic.dump
          sha256sum /tmp/car02-r119-synthetic.dump | awk '{print $1}' > qa-evidence-r119/backup-sha256.txt
          docker exec -i "$CID" pg_restore -l < /tmp/car02-r119-synthetic.dump > /dev/null
          head -c 16 /tmp/car02-r119-synthetic.dump > /tmp/car02-r119-corrupt.dump
          if docker exec -i "$CID" pg_restore -l < /tmp/car02-r119-corrupt.dump > /dev/null 2>&1; then
            echo 'R119_CORRUPT_BACKUP_WAS_ACCEPTED' >&2
            exit 1
          fi
          echo 'R119_CORRUPT_BACKUP_REJECTED' > qa-evidence-r119/corruption-guard.log
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r119_restore_ci;'
          docker exec -i "$CID" pg_restore -U postgres -d car02_r119_restore_ci --no-owner < /tmp/car02-r119-synthetic.dump
          node car02-r119-pg17-booking-qa.mjs --restore | tee qa-evidence-r119/pg17-restore-results.log
          grep -Fxq R119_PG17_RESTORE_RLS_AND_IDEMPOTENCY_PASS qa-evidence-r119/pg17-restore-results.log
          echo R119_DISPOSABLE_BACKUP_SEPARATE_RESTORE_PASS
      - name: Always remove the disposable DBs roles and synthetic dump
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r119_restore_ci WITH (FORCE);'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r119_qa_ci WITH (FORCE);'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP ROLE IF EXISTS car02_r119_a_ci;'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP ROLE IF EXISTS car02_r119_b_ci;'
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM pg_database WHERE datname IN ('car02_r119_qa_ci','car02_r119_restore_ci')) AND NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname IN ('car02_r119_a_ci','car02_r119_b_ci')) THEN 'R119_DISPOSABLE_RESOURCES_DELETED' ELSE 'R119_CLEANUP_FAILED' END" | grep -Fxq R119_DISPOSABLE_RESOURCES_DELETED
          rm -f /tmp/car02-r119-synthetic.dump /tmp/car02-r119-corrupt.dump
      - name: Ensure closed release and migration decisions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('qa-evidence-r119/pg17-source-qa.json').read_text())
          b=json.loads(Path('qa-evidence-r119/pg17-restore-qa.json').read_text())
          for x in (a,b):
              assert x['releaseDecision']=='NO_GO' and x['migrationDecision']=='HOLD'
              assert x['realSupabaseTested'] is False and x['realProductionBackup'] is False
              assert x['rowCount']==2 and x['productionReady'] is False
          print('R119_SOURCE_AND_RESTORED_PG17_PASS_NO_GO_HOLD')
          PY
      - name: Upload synthetic and non-secret audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car02-r119-disposable-pg17-evidence
          path: qa-evidence-r119/
          retention-days: 7
          if-no-files-found: warn
