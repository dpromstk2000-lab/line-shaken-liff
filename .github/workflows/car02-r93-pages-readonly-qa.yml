name: DPRO CAR02 R93 Pages Readonly Preflight QA
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  r93-pages-readonly-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout current reviewed main without production credentials
        uses: actions/checkout@v5
      - name: Confirm R90 R91 R92 and all browser module files are in repository
        run: |
          for f in CAR02_R92_COMPANY_PC_START.html CAR02_R90_COMPANY_PC_RECORD.html CAR02_R91_COMPANY_PC_TRIAGE.html car02-staff-review-app-r90.mjs car02-r91-triage-app.mjs car02-r91-triage-model.mjs car02-staff-review-model-r86.mjs car02-company-pc-record-r90.mjs car02-r89-acceptance-model.mjs; do test -f "$f" || exit 1; done
      - name: Syntax and review-only unit tests
        run: |
          node --check car02-r93-pages-readonly-audit.mjs
          node --check test-car02-r93-pages-readonly-audit.mjs
          node --test test-car02-r93-pages-readonly-audit.mjs
      - name: Verify static navigation CSP and NO_GO source policy
        run: |
          node --input-type=module -e 'import {validateLocalR93Sources,loadR93LocalSources} from "./car02-r93-pages-readonly-audit.mjs"; const r=validateLocalR93Sources(loadR93LocalSources()); if(!r.valid||r.productionReady!==false||r.releaseDecision!=="NO_GO"||r.migrationDecision!=="HOLD")process.exit(1); console.log("R93 REVIEW ONLY: 9 static files under locked public preview policy")'
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          node car02-integration-audit-r80.mjs > /tmp/car02-r93-safety-gate.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("/tmp/car02-r93-safety-gate.json"));if(!r.staticEvidenceOk||r.productionReady!==false||r.releaseDecision!=="NO_GO"||r.migrationDecision!=="HOLD")process.exit(1);'
      - name: Read GitHub Pages actual metadata and GET-only static site files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node car02-r93-pages-readonly-audit.mjs
      - name: Remove temporary QA snapshot
        if: always()
        run: rm -f /tmp/car02-r93-safety-gate.json
