name: DPRO CAR02 R43 PostgreSQL QA (root compatible)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r43-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: qa_only_local
          POSTGRES_USER: postgres
          POSTGRES_DB: car02_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d car02_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: qa_only_local
      PGDATABASE: car02_qa
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client package
        run: npm install --no-save --ignore-scripts --no-audit pg@8
      - name: Confirm all 15 R43 QA source files are in repository root
        shell: bash
        run: |
          for file in BASELINE_QA_ONLY.sql R13_MIGRATION_QA_ONLY.sql R13_EMPTY_ONLY_ROLLBACK_QA.sql car02-core.mjs car02-api.mjs car02-pg-adapter.mjs car02-pg-photo-repo.mjs car02-photo-flow.mjs pg17-integration.mjs test-car02.mjs test-car02-api.mjs test-car02-photo-flow.mjs test-pg-adapter-r42.mjs test-pg-photo-repo.mjs test-pg-relational.mjs; do
            test -f "$file" || { echo "MISSING: $file"; exit 1; }
          done
      - name: Verify all R43 business logic and API unit tests
        run: node --test test-*.mjs
      - name: Run R13 schema and R43 integration against isolated PostgreSQL 17
        run: node pg17-integration.mjs
      - name: R45 HTTP + identity + real PostgreSQL transaction integration (CI fake credentials only)
        run: node pg17-http-integration-r45.mjs
      - name: R46 verified LINE and staff membership PostgreSQL QA (disposable CI only)
        run: node pg17-staff-integration-r46.mjs
      - name: R48 private photo read, customer authorization and real PostgreSQL 17 QA (disposable only)
        run: node pg17-photo-view-integration-r48.mjs
      - name: R50 unified verified HTTP, PostgreSQL and private photo QA (isolated CI only)
        run: node pg17-unified-integration-r50.mjs
