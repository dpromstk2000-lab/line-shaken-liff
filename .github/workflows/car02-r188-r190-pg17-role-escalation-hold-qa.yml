name: CAR02 R188-R190 Disposable PG17 Role Escalation HOLD QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: car02-r188-r190-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-postgres17-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r188-disposable-admin-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAR02_RELEASE_LOCK: 'true'
      R188_DISPOSABLE_QA: 'yes'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout without retained GitHub credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Pin immutable R138B R182 R185 originals before tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence-r188
          test "$(git rev-parse HEAD:R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql)" = '3784f8a28549bc40343646bf88657c9d9b0b80f2'
          test "$(git rev-parse HEAD:car02_r138_pg17_lifecycle_qa.py)" = 'ff98dd74916ff3ea77412b986138151a4fddab90'
          test "$(git rev-parse HEAD:car02_r182_acl_catalog_isolated.py)" = 'e63558a7fca0684e4f144d61363fc3b3b9db9718'
          test "$(git rev-parse HEAD:car02_r185_rls_session_spoof_isolated.py)" = '9900472e32d4af13804657149c9429d8b3495437'
          echo R188_R190_ORIGINALS_LOCKED > qa-evidence-r188/original-pins.log
          echo R188_R190_RELEASE_NO_GO_DB_MIGRATION_HOLD > qa-evidence-r188/release-lock.log
      - name: R189 synthetic negative and proof I O tests three times
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            python3 -m unittest -v test_car02_r189_role_escalation.py 2>&1 | tee "qa-evidence-r188/r189-negative-${round}.log"
            grep -Eq '^Ran 95 tests in ' "qa-evidence-r188/r189-negative-${round}.log"
            grep -Fxq OK "qa-evidence-r188/r189-negative-${round}.log"
            ! grep -Eq 'FAILED|ERROR|skipped=' "qa-evidence-r188/r189-negative-${round}.log"
          done
      - name: R190 static no production workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_car02_r190_workflow_contract.py 2>&1 | tee qa-evidence-r188/r190-workflow-contract.log
          grep -Fxq OK qa-evidence-r188/r190-workflow-contract.log
      - name: Create disposable PG17 fixture and five synthetic roles only
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r138_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -v ON_ERROR_STOP=1 < R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql > qa-evidence-r188/schema.log
          grep -Fxq R138_DISPOSABLE_PG17_SCHEMA_READY qa-evidence-r188/schema.log
      - name: Verify five business tables begin completely empty
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          for table in bookings service_cases case_operations booking_operations audit_events; do
            docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -Atqc "SELECT count(*) FROM car02_r138_qa.$table;" | grep -Fxq 0
          done
          echo R188_EMPTY_PG17_BEFORE_PROBE > qa-evidence-r188/empty-fixture.log
      - name: Run R188 actual PG17 forbidden role and RLS escalation matrix
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          python3 car02_r188_role_escalation_isolated.py --cid "$CID" --commit "$GITHUB_SHA" 2>&1 | tee qa-evidence-r188/r188-probe.log
          grep -Fxq R188_DISPOSABLE_PG17_SYNTHETIC_ROLE_ESCALATION_DENIED_PASS_NO_GO_HOLD qa-evidence-r188/r188-probe.log
          python3 - <<'PYVERIFY'
          import json,os
          from pathlib import Path
          from car02_r188_role_escalation_isolated import verify_report,CASE_MATRIX
          x=json.loads(Path('qa-evidence-r188/r188-role-escalation-proof.json').read_text(encoding='ascii'))
          assert verify_report(x) and x['githubCommit']==os.environ['GITHUB_SHA']
          assert len(x['denials'])==len(CASE_MATRIX)==40
          assert x['release']=='NO_GO' and x['migration']=='HOLD' and x['realWorldGatesOpen']==12
          assert x['productionAuthorized'] is False and x['realAuthenticationVerified'] is False
          print('R188_ALL_FORTY_SYNTHETIC_PRIVILEGE_DENIALS_VERIFIED')
          PYVERIFY
      - name: Always drop disposable database and all five roles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r138_qa_ci WITH (FORCE);'
          for role in car02_r138_a_staff_ci car02_r138_a_one_ci car02_r138_a_two_ci car02_r138_b_staff_ci car02_r138_b_one_ci; do
            docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS $role;"
          done
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS(SELECT 1 FROM pg_database WHERE datname='car02_r138_qa_ci') AND NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname LIKE 'car02_r138_%_ci') THEN 'R188_ALL_DISPOSABLE_RESOURCES_DELETED' ELSE 'R188_CLEANUP_FAILED' END" | grep -Fxq R188_ALL_DISPOSABLE_RESOURCES_DELETED
          echo R188_ALL_DISPOSABLE_RESOURCES_DELETED > qa-evidence-r188/cleanup.log
      - name: Recheck original identities and NO GO HOLD after cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq R188_ALL_DISPOSABLE_RESOURCES_DELETED qa-evidence-r188/cleanup.log
          grep -Fxq R188_R190_RELEASE_NO_GO_DB_MIGRATION_HOLD qa-evidence-r188/release-lock.log
          test "$(git rev-parse HEAD:R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql)" = '3784f8a28549bc40343646bf88657c9d9b0b80f2'
          test "$(git rev-parse HEAD:car02_r138_pg17_lifecycle_qa.py)" = 'ff98dd74916ff3ea77412b986138151a4fddab90'
          test "$(git rev-parse HEAD:car02_r182_acl_catalog_isolated.py)" = 'e63558a7fca0684e4f144d61363fc3b3b9db9718'
          test "$(git rev-parse HEAD:car02_r185_rls_session_spoof_isolated.py)" = '9900472e32d4af13804657149c9429d8b3495437'
          python3 - <<'PYHOLD'
          import json,os
          from pathlib import Path
          from car02_r188_role_escalation_isolated import verify_report
          r=json.loads(Path('qa-evidence-r188/r188-role-escalation-proof.json').read_text(encoding='ascii'))
          assert verify_report(r) and r['githubCommit']==os.environ['GITHUB_SHA']
          assert r['release']=='NO_GO' and r['migration']=='HOLD'
          assert r['realWorldGatesOpen']==12 and r['productionTouched'] is False
          assert r['realRLSVerified'] is False and r['realAuthenticationVerified'] is False
          print('R188_R190_ISOLATED_CLEANUP_NO_GO_HOLD_PASS')
          PYHOLD
      - name: Preserve only isolated short retention evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: car02-r188-r190-pg17-privilege-denial-evidence
          path: qa-evidence-r188/
          if-no-files-found: warn
          retention-days: 7
