name: CAR02 V4.96 Commercial Readiness Freshness QA (NO_GO HOLD)
'on':
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-commercial-readiness-freshness-r496.mjs'
      - 'car02-commercial-readiness-freshness-r496.test.mjs'
      - 'car02-v496-commercial-readiness-freshness-contract.json'
      - 'CAR02_V496_COMMERCIAL_READINESS_FRESH_OFFLINE_BOARD.html'
      - 'CAR02_V496_COMMERCIAL_READINESS_FRESH_OFFLINE_QA.md'
      - '.github/workflows/car02-v496-commercial-readiness-freshness-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-readiness-freshness:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated review branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin R52 and accepted V4.95 baseline without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = 'refs/heads/car02-v434-review-only'
          for k in CAR02_DATABASE_URL DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!k:-}" || { echo V496_CREDENTIAL_REFUSED >&2; exit 1; }
          done
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          test "$(git hash-object CAR02_V495_COMMERCIAL_READINESS_OFFLINE_BOARD.html)" = '61f8aad153e47ec695513c935a250a53af3bea5a'
          test "$(sha256sum CAR02_V495_COMMERCIAL_READINESS_OFFLINE_BOARD.html | awk '{print $1}')" = '1e6b3a6da1c3145cb733bd4596b3bc5ed65d783afa991e1fb8afcac9c6679b0a'
          test "$(git hash-object car02-commercial-readiness-board-r495.mjs)" = 'de0f4a0d76478d3164677092ac4edb29275b5e7e'
          test "$(git hash-object car02-commercial-readiness-board-r495.test.mjs)" = 'cb98cb7cc3731fd4de64c04f9837b7b0077bc3cf'
          for f in car02-commercial-readiness-freshness-r496.mjs car02-commercial-readiness-freshness-r496.test.mjs car02-v496-commercial-readiness-freshness-contract.json CAR02_V496_COMMERCIAL_READINESS_FRESH_OFFLINE_BOARD.html CAR02_V496_COMMERCIAL_READINESS_FRESH_OFFLINE_QA.md; do test -s "$f"; done
          echo V496_ACCEPTED_V495_R52_LOCK_PIN_PASS
      - name: Run 28 new version-freshness tests
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-commercial-readiness-freshness-r496.mjs
          node --check car02-commercial-readiness-freshness-r496.test.mjs
          node --test --test-reporter=tap car02-commercial-readiness-freshness-r496.test.mjs | tee "$RUNNER_TEMP/v496-new-tests.log"
          total=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v496-new-tests.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v496-new-tests.log")
          test "$total" = 28
          test "$passed" = "$total"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v496-new-tests.log"
          echo V496_NEW_FRESHNESS_TESTS_28_PASS
      - name: Rebuild immutable offline-only status board
        shell: bash
        run: |
          set -euo pipefail
          node car02-commercial-readiness-freshness-r496.mjs
          test "$(sha256sum CAR02_V496_COMMERCIAL_READINESS_FRESH_OFFLINE_BOARD.html | awk '{print $1}')" = '4a22a08f20be84da340ac85962d9be3035cc46625f6c82e4d039e8f0bdda3171'
          git diff --exit-code -- CAR02_V496_COMMERCIAL_READINESS_FRESH_OFFLINE_BOARD.html
          echo V496_DETERMINISTIC_NO_NETWORK_BOARD_PASS
      - name: Verify NO_GO HOLD remains immutable
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {buildCar02ReadinessFreshBoardR496} from './car02-commercial-readiness-freshness-r496.mjs';
          const c=JSON.parse(readFileSync('car02-v496-commercial-readiness-freshness-contract.json','utf8'));
          assert.equal(c.systemCode,'CAR02');assert.equal(c.version,'V4.96');
          assert.equal(c.acceptedBaseRunId,39888313357);
          assert.equal(c.acceptedBaseNodeTests,1549);assert.equal(c.newNodeTests,28);
          assert.equal(c.expectedMinimumNodeTests,1577);
          assert.equal(c.changeKind,'accepted_ci_freshness_only_offline_readiness_report');
          assert.equal(c.acceptedV495SourceUnmodified,true);assert.equal(c.acceptedV495HtmlUnmodified,true);
          assert.equal(c.humanVisualAcceptanceVerified,false);
          assert.equal(c.offlineBoardCannotGrantCommercialAuthority,true);
          assert.equal(c.releaseLock,true);assert.equal(c.commercialDecision,'NO_GO_HOLD');
          assert.equal(c.independentlyVerifiedRealProviderProofs,0);assert.equal(c.requiredRealProviderProofs,7);
          for(const k of ['bookingCreationAllowed','productionDeployAllowed','databaseMutationAllowed',
            'lineDispatchAllowed','providerConnectionAllowed','billingChangeAllowed',
            'githubMainMutationAllowed'])assert.equal(c[k],false,k);
          const html=buildCar02ReadinessFreshBoardR496();
          assert.ok(html.includes('NO_GO / HOLD'));
          assert.ok(html.includes('0 / 7'));
          assert.ok(html.includes('1,549 / 1,549'));
          assert.ok(html.includes("script-src 'none'"));
          assert.ok(html.includes("connect-src 'none'"));
          console.log('V496_FRESH_BOARD_NO_COMMERCIAL_GO_PASS');
          NODE
      - name: Full regression retains all 1549 previously accepted tests
        shell: bash
        run: |
          set -euo pipefail
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v496-full-tests.log"
          total=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v496-full-tests.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v496-full-tests.log")
          test "$total" -ge 1577
          test "$passed" = "$total"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v496-full-tests.log"
          echo V496_FULL_REGRESSION_MINIMUM_1577_PASS
