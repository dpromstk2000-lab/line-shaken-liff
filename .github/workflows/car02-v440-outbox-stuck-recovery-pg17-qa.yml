name: CAR02 V4.40 Stuck Outbox Quarantine Disposable PG17 (NO_GO HOLD)
# REVIEW ONLY. Read-only repository, disposable PostgreSQL 17, offline mocks.
# This does not deploy or grant authorization for real delivery or Supabase use.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-outbox-recovery-r440.mjs'
      - 'car02-outbox-recovery-r440.test.mjs'
      - 'car02-v440-disposable-pg17.sql'
      - '.github/workflows/car02-v440-outbox-stuck-recovery-pg17-qa.yml'
      - 'car02-outbox-r439.mjs'
      - 'car02-edge-entry-r52.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-quarantine-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v440_disposable_only
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: v440_disposable_only
    steps:
      - name: Checkout review branch without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify 87 offline tests, lock and source isolation
        shell: bash
        run: |
          set -euo pipefail
          for name in CAR02_DATABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN; do
            test -z "${!name:-}" || { echo "Unexpected credential: $name" >&2; exit 1; }
          done
          for file in car02-outbox-recovery-r440.mjs car02-outbox-recovery-r440.test.mjs car02-v440-disposable-pg17.sql; do test -s "$file"; done
          node --check car02-outbox-recovery-r440.mjs
          node --check car02-outbox-recovery-r440.test.mjs
          node --test car02-staff-generation-r434.test.mjs car02-staff-authority-r435.test.mjs car02-transaction-gate-r436.test.mjs car02-tenant-cas-gate-r437.test.mjs car02-idempotency-r438.test.mjs car02-outbox-r439.test.mjs car02-outbox-recovery-r440.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V440_RELEASE_LOCK,CAR02_V440_QUARANTINE_SQL,CAR02_V440_COUNTS_SQL} from './car02-outbox-recovery-r440.mjs';
          assert.equal(CAR02_V440_RELEASE_LOCK,true);
          assert.equal(CAR02_V440_QUARANTINE_SQL,'SELECT event_id,review_state FROM public.v440_qa_quarantine_next($1::text)');
          assert.equal(CAR02_V440_COUNTS_SQL,'SELECT status,total FROM public.v440_qa_status_counts($1::text)');
          const source=readFileSync('car02-edge-entry-r52.ts','utf8');
          assert.match(source,/const\s+CAR02_RELEASE_LOCK\s*=\s*true\s*;/);
          assert.doesNotMatch(source,/car02-outbox-recovery-r440|v440_qa_/);
          for (const file of ['car02-outbox-r439.mjs','car02-idempotency-r438.mjs']) {
            assert.match(readFileSync(file,'utf8'),/RELEASE_LOCK\s*=\s*true/);
          }
          console.log('V440_SOURCE_LOCK_AND_REVIEW_ONLY_PASS');
          console.log('V440_LIVE_PROVIDER_ATTESTATION_AND_DELIVERY_STILL_NO_GO');
          NODE
      - name: Real disposable PostgreSQL 17 expiry, no retry, and parallel quarantine
        shell: bash
        run: |
          set -euo pipefail
          pg(){ docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17 psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55440 -U postgres "$@"; }
          pg -d postgres -c 'CREATE DATABASE car02_v440_disposable' >/dev/null
          pg -d car02_v440_disposable -f /workspace/car02-v440-disposable-pg17.sql | tee "$RUNNER_TEMP/v440-pg.log"
          for mark in V440_PG17_UNPRIVILEGED_DENY_PASS V440_PG17_STALE_QUARANTINE_TENANT_ISOLATION_PASS V440_PG17_LATE_ACK_NO_RESURRECTION_PASS V440_PG17_TENANT_ONLY_STATE_COUNTS_PASS; do
            grep -Fq "$mark" "$RUNNER_TEMP/v440-pg.log"
          done
          pg -d car02_v440_disposable -c "INSERT INTO public.v440_qa_outbox(id,shop_code,status,claim_token,claimed_at) VALUES ('00000000-0000-0000-0000-000000004405','qa_shop_a','dispatching','00000000-0000-0000-0000-000000004415',clock_timestamp()-interval '15 minutes')" >/dev/null
          pids=()
          for i in 1 2 3 4 5 6 7 8; do
            (pg -Atq -d car02_v440_disposable -c "SELECT * FROM public.v440_qa_quarantine_next('qa_shop_a')" > "$RUNNER_TEMP/v440-worker-$i.out") &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          total=0
          for i in 1 2 3 4 5 6 7 8; do
            count=$(grep -c '|manual_review' "$RUNNER_TEMP/v440-worker-$i.out" || true)
            total=$((total+count))
          done
          test "$total" -eq 1 || { echo "V440_PARALLEL_QUARANTINE_BAD: $total" >&2; exit 1; }
          state=$(pg -Atq -d car02_v440_disposable -c "SELECT status FROM public.v440_qa_outbox WHERE id='00000000-0000-0000-0000-000000004405'")
          test "$state" = 'manual_review'
          late=$(pg -Atq -d car02_v440_disposable -c "SELECT public.v440_qa_finish('qa_shop_a','00000000-0000-0000-0000-000000004405','00000000-0000-0000-0000-000000004415')")
          test "$late" = 'f'
          # An unrelated PENDING event may be claimed; quarantined item may NEVER be requeued.
          fresh=$(pg -Atq -d car02_v440_disposable -c "SELECT event_id FROM public.v440_qa_claim_next('qa_shop_a','00000000-0000-0000-0000-000000004416')")
          test "$fresh" = '00000000-0000-0000-0000-000000004403' || { echo "V440_REQUEUED_STALE: $fresh" >&2; exit 1; }
          test "$(pg -Atq -d car02_v440_disposable -c "SELECT status FROM public.v440_qa_outbox WHERE id='00000000-0000-0000-0000-000000004405'")" = 'manual_review'
          test "$(pg -Atq -d car02_v440_disposable -c "SELECT status FROM public.v440_qa_outbox WHERE id='00000000-0000-0000-0000-000000004404'")" = 'dispatching'
          echo V440_PG17_EIGHT_WORKERS_ONE_QUARANTINE_PASS
          echo V440_PG17_NO_AUTO_RETRY_NO_LATE_ACK_FLIP_PASS
          echo V440_FINAL_RELEASE_NO_GO_HOLD_TRUE
