name: DPRO CAR02 R122 PG17 Photo Ledger Bridge QA (Isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: car02-r122-disposable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r122-disposable-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r122-ci-disposable-db-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAR02_RELEASE_LOCK: 'true'
      R122_DISPOSABLE_QA: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: car02_r122_qa_ci
    steps:
      - name: Read-only checkout with no retained credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Confirm protected originals and closed release gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence-r122
          python3 car02_r118_readonly_source_gate.py --strict --out qa-evidence-r122/protected-sources.json
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
      - name: Check SQL safety contract and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-r121-photo-failclosed-isolated.mjs
          node --check car02-r122-pg17-photo-ledger-isolated.mjs
          node --check car02-r122-pg17-photo-bridge-qa.mjs
          node --check test-car02-r122-contract.mjs
          node --check car02-r122-restore-readonly-qa.mjs
          node --test test-car02-r122-contract.mjs > qa-evidence-r122/contract-tests.txt
          grep -Fq '# pass 14' qa-evidence-r122/contract-tests.txt
          grep -Fq '# fail 0' qa-evidence-r122/contract-tests.txt
          tail -n 7 qa-evidence-r122/contract-tests.txt
      - name: Install ephemeral PostgreSQL driver on CI runner only
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Create disposable database and synthetic tenants
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r122_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r122_qa_ci -v ON_ERROR_STOP=1 < R122_PG17_PHOTO_LEDGER_QA_ONLY.sql > qa-evidence-r122/schema.log
          grep -Fxq R122_DISPOSABLE_PG17_LEDGER_SCHEMA_READY qa-evidence-r122/schema.log
      - name: Verify live PG17 ledger integration with simulated photo bytes
        shell: bash
        env:
          R122_EVIDENCE_FILE: qa-evidence-r122/source-proof.json
        run: |
          set -euo pipefail
          node car02-r122-pg17-photo-bridge-qa.mjs > qa-evidence-r122/source.log
          grep -Fxq R122_PG17_LEDGER_R121_BRIDGE_PASS qa-evidence-r122/source.log
          grep -Fxq R122_RELEASE_NO_GO_MIGRATION_HOLD qa-evidence-r122/source.log
      - name: Test synthetic backup corruption and restore into separate database
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          docker exec -i "$CID" pg_dump -U postgres -d car02_r122_qa_ci --format=custom --no-owner > /tmp/car02-r122-ci.dump
          sha256sum /tmp/car02-r122-ci.dump | awk '{print $1}' > qa-evidence-r122/dump-sha256.txt
          docker exec -i "$CID" pg_restore -l < /tmp/car02-r122-ci.dump > /dev/null
          head -c 16 /tmp/car02-r122-ci.dump > /tmp/car02-r122-bad.dump
          if docker exec -i "$CID" pg_restore -l < /tmp/car02-r122-bad.dump > /dev/null 2>&1; then
            echo R122_CORRUPT_BACKUP_ACCEPTED >&2; exit 1
          fi
          echo R122_CORRUPT_BACKUP_REJECTED > qa-evidence-r122/corrupt-guard.txt
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r122_restore_ci;'
          docker exec -i "$CID" pg_restore -U postgres -d car02_r122_restore_ci --no-owner < /tmp/car02-r122-ci.dump
          docker exec -i "$CID" psql -X -U postgres -d car02_r122_restore_ci -v ON_ERROR_STOP=1 -Atqc "SELECT CASE WHEN (SELECT count(*) FROM car02_r122_qa.photo_intents)=4 AND (SELECT count(*) FROM car02_r122_qa.audit_events)=7 AND (SELECT count(*) FROM car02_r122_qa.photo_intents WHERE state='QUARANTINED')=1 AND (SELECT count(*) FROM car02_r122_qa.photo_intents WHERE state='READY')=2 THEN 'R122_RESTORE_COUNTS_PASS' ELSE 'R122_RESTORE_MISMATCH' END" | tee qa-evidence-r122/restore-result.txt
          grep -Fxq R122_RESTORE_COUNTS_PASS qa-evidence-r122/restore-result.txt
          R122_RESTORE_QA=yes R122_RESTORE_PROOF=qa-evidence-r122/restore-rls-proof.json node car02-r122-restore-readonly-qa.mjs | tee qa-evidence-r122/restore-rls.log
          grep -Fxq R122_RESTORED_DB_TENANT_RLS_AND_AUDIT_PASS qa-evidence-r122/restore-rls.log
      - name: Always remove both test databases, roles and synthetic dump
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r122_restore_ci WITH (FORCE);'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r122_qa_ci WITH (FORCE);'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP ROLE IF EXISTS car02_r122_a_ci;'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP ROLE IF EXISTS car02_r122_b_ci;'
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS(SELECT 1 FROM pg_database WHERE datname IN ('car02_r122_qa_ci','car02_r122_restore_ci')) AND NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname IN ('car02_r122_a_ci','car02_r122_b_ci')) THEN 'R122_DISPOSABLE_RESOURCES_DELETED' ELSE 'R122_CLEANUP_FAILED' END" | grep -Fxq R122_DISPOSABLE_RESOURCES_DELETED
          rm -f /tmp/car02-r122-ci.dump /tmp/car02-r122-bad.dump
      - name: Recheck release gate and verify safe QA result
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('qa-evidence-r122/source-proof.json').read_text())
          assert p['release']=='NO_GO' and p['migration']=='HOLD'
          assert p['realSupabaseTested'] is False and p['realStorageTested'] is False
          assert p['storageDeleteCalls']==0 and p['legacySourceMutations']==0
          assert Path('qa-evidence-r122/restore-result.txt').read_text().strip()=='R122_RESTORE_COUNTS_PASS'
          print('R122_QA_ONLY_NO_GO_HOLD_PASS')
          PY
      - name: Upload synthetic redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car02-r122-disposable-pg17-photo-ledger-proof
          path: qa-evidence-r122/
          retention-days: 7
          if-no-files-found: warn
