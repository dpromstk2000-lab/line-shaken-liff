          set -euo pipefail

          test -f member.html
          test -f ksh-next-5-member-estimate.js
          test -f ksh-next-7-member-history.js
          test -f .dpro/ksh-next/ksh-next-7-result.yml

          grep -q 'STEP KSH-NEXT-7 / member.html' member.html
          grep -q 'const VERSION = "STEP KSH-NEXT-7"' member.html
          grep -q 'STEP KSH-NEXT-7: MEMBER HISTORY' ksh-next-7-member-history.js
          grep -q 'ksh-next-5-member-estimate.js' member.html
          grep -q 'ksh-next-7-member-history.js' member.html
          grep -q 'renderCurrentWork' ksh-next-7-member-history.js
          grep -q 'renderVehicleMaintenance' ksh-next-7-member-history.js
          grep -q 'renderMaintenanceHistory' ksh-next-7-member-history.js
          grep -q 'copyRepeatMaintenance' ksh-next-7-member-history.js
          grep -q 'full_history_claimed: false' .dpro/ksh-next/ksh-next-7-result.yml
          grep -q 'current_step: "STEP KSH-NEXT-7"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-8"' .dpro/ksh-next/plan.yml | grep -q 'status: "next"'

          ESTIMATE_LINE=$(grep -n 'ksh-next-5-member-estimate.js' member.html | cut -d: -f1)
          HISTORY_LINE=$(grep -n 'ksh-next-7-member-history.js' member.html | cut -d: -f1)
          if [ -z "$ESTIMATE_LINE" ] || [ -z "$HISTORY_LINE" ] || [ "$ESTIMATE_LINE" -ge "$HISTORY_LINE" ]; then
            echo "見積JSより後に整備履歴JSが読み込まれていません。"
            exit 1
          fi

          node --check ksh-next-5-member-estimate.js
          node --check ksh-next-7-member-history.js

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter
          import re
          import subprocess
          import tempfile

          text = Path("member.html").read_text(encoding="utf-8")

          class Parser(HTMLParser):
              pass

          parser = Parser()
          parser.feed(text)
          parser.close()

          ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
          duplicates = sorted(key for key, count in Counter(ids).items() if count > 1)
          if duplicates:
              raise SystemExit("member.html duplicate IDs: " + ", ".join(duplicates))

          inline_scripts = []
          for attrs, body in re.findall(
              r"<script\b([^>]*)>(.*?)</script>",
              text,
              flags=re.I | re.S,
          ):
              if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                  continue
              if body.strip():
                  inline_scripts.append(body)

          for index, script in enumerate(inline_scripts, start=1):
              temp = Path(tempfile.gettempdir()) / f"ksh-next-7-member-{index}.js"
              temp.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(temp)], check=True)

          print("member HTML and inline JS OK")
          print("unique IDs:", len(ids))
          PY

      - name: Test member history logic
        shell: bash
        run: |
          set -euo pipefail

          node <<'JS'
          const progressPattern = /^【進捗：([^】]+)】\s*/m;

          function stage(row) {
            const explicit = String(row?.memo || "").match(progressPattern)?.[1] || "";
            if (explicit) return explicit;
            const status = String(row?.status || "");
            if (status.includes("作業完了") || status.includes("納車済")) return "引渡し完了";
            if (status.includes("作業中")) return "作業中";
            if (status.includes("入庫済")) return "受付・入庫済み";
            return "入庫予定";
          }

          function completed(row) {
            return stage(row) === "引渡し完了" || Boolean(row?.completed_date);
          }

          function current(row) {
            return stage(row) !== "キャンセル" && !completed(row);
          }

          const cases = [
            [{ memo: "【進捗：点検中】", status: "作業中" }, "点検中", true, false],
            [{ memo: "【進捗：引渡し完了】", status: "作業完了" }, "引渡し完了", false, true],
            [{ memo: "", status: "納車済み" }, "引渡し完了", false, true],
            [{ memo: "", status: "入庫予定" }, "入庫予定", true, false]
          ];

          for (const [row, expectedStage, expectedCurrent, expectedCompleted] of cases) {
            if (stage(row) !== expectedStage) throw new Error(`stage failed: ${expectedStage}`);
            if (current(row) !== expectedCurrent) throw new Error(`current failed: ${expectedStage}`);
            if (completed(row) !== expectedCompleted) throw new Error(`completed failed: ${expectedStage}`);
          }

          const reservations = [
            { id: "a", vehicle_id: "v1", completed_date: "2026-01-03" },
            { id: "b", vehicle_id: "v2", completed_date: "2026-01-02" },
            { id: "c", vehicle_id: "v1", completed_date: "2026-01-01" }
          ];

          const v1 = reservations
            .filter(row => row.vehicle_id === "v1")
            .sort((a, b) => String(b.completed_date).localeCompare(String(a.completed_date)));

          if (v1.map(row => row.id).join(",") !== "a,c") {
            throw new Error("vehicle history grouping failed");
          }

          console.log("Member progress and vehicle history logic OK");
          JS

          echo "KSH-NEXT-7 logic checks passed."

