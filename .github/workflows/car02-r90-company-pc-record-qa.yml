name: DPRO CAR02 R90 Company PC Local Record Isolated QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r90-company-pc-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout review-only sources without production credentials
        uses: actions/checkout@v5
      - name: Validate R90 scripts and enforce offline-only data handling
        run: |
          node --check car02-company-pc-record-r90.mjs
          node --check car02-staff-review-app-r90.mjs
          node --check test-car02-r90-record.mjs
          node --check test-car02-r90-ui-safety.mjs
          node --test test-car02-r90-record.mjs test-car02-r90-ui-safety.mjs
      - name: Preserve R89 company-PC checklist and R88 accessibility regressions
        run: |
          node --test test-car02-r89-acceptance-model.mjs test-car02-r89-ui-safety.mjs
          node --test test-car02-r88-a11y-contract.mjs test-car02-r88-release-safety.mjs
      - name: Ensure R52 is hard locked and R90 never wired to production
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const edge=readFileSync("car02-edge-entry-r52.ts","utf8");
            const unified=readFileSync("car02-unified-runtime-r50.mjs","utf8");
            const snap=JSON.parse(readFileSync("R79_EVIDENCE_SNAPSHOT.json","utf8"));
            if(!/const\s+CAR02_RELEASE_LOCK\s*=\s*true/.test(edge))process.exit(1);
            if(!edge.includes("if(CAR02_RELEASE_LOCK)throw Error("))process.exit(1);
            if([edge,unified].some(s=>s.includes("car02-company-pc-record-r90")||s.includes("car02-staff-review-app-r90")))process.exit(1);
            if(snap.release_decision!=="NO_GO"||snap.migration_decision!=="HOLD_BACKUP_AND_RESTORE"||snap.edge_stage?.CAR02_RELEASE_LOCK!==true)process.exit(1);
            console.log("R90 isolated: R52 hard lock and migration HOLD unchanged");'
      - name: Re-run R80 source gate and prohibit release verdict
        run: |
          node car02-integration-audit-r80.mjs > /tmp/car02-r90-release.json
          node --input-type=module -e 'import fs from "node:fs";const x=JSON.parse(fs.readFileSync("/tmp/car02-r90-release.json","utf8"));if(!x.staticEvidenceOk||x.productionReady!==false||x.releaseDecision!=="NO_GO"||x.migrationDecision!=="HOLD")process.exit(1);console.log("R90 REVIEW ONLY — NO_GO/HOLD retained");'
      - name: Erase temporary checks
        if: always()
        run: rm -f /tmp/car02-r90-release.json
