name: DPRO CAR_SERVICE Product READY R2 Apply and Final QA

'on':
  push:
    paths:
      - '.github/workflows/dpro-car-service-r2-apply-and-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-car-service-r2-apply-and-qa
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASELINE_SHA: faed30cf6f1f013edd540c1c8db0df3ca3af9b81
      ADAPTER: https://ropwvdnohadwxfbkcopx.supabase.co/functions/v1/dpro-car-service-control-adapter
      FRONT_BASE: https://dpromstk2000-lab.github.io/line-shaken-liff
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/car-service.html
      LP_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/lp-car-service.html
      A4_HTML_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-car-service.html
      A4_PDF_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-car-service.pdf
      WANGAN_API: https://dpro-wangan-biz-api.dpromstk2000.workers.dev
      KSH_API: https://ksh-line-demo-api.dpromstk2000.workers.dev
      RESET_API: https://ksh-demo-reset.dpromstk2000.workers.dev
      FRONTEND_VERSION: CAR-SERVICE-PR2-FRONTEND-20260823
      ADAPTER_VERSION: DPRO-CONTROL-ADAPTER-1.0-CAR-SERVICE-20260823-R2V2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard source baseline and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/car-service-r2/screens
          BEFORE="$(git rev-parse HEAD)"
          echo "workflow_start_head=$BEFORE" | tee product-ready-evidence/car-service-r2/workflow-start.txt
          if ! git merge-base --is-ancestor "$BASELINE_SHA" "$BEFORE"; then
            echo "Baseline $BASELINE_SHA is not an ancestor of current HEAD $BEFORE" >&2
            exit 2
          fi

      - name: Apply CAR_SERVICE-only R2 remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re,json

          ADAPTER='https://ropwvdnohadwxfbkcopx.supabase.co/functions/v1/dpro-car-service-control-adapter'
          FRONTEND_VERSION='CAR-SERVICE-PR2-FRONTEND-20260823'

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def must_replace(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'PATCH_MISS:{label}')
              return s.replace(old,new,1)
          def must_re(s, pat, repl, label, flags=0):
              out,n=re.subn(pat,repl,s,count=1,flags=flags)
              if n!=1: raise SystemExit(f'PATCH_MISS:{label}:{n}')
              return out

          # dashboard.html: remove production fallback to demo code and bind WANGAN through adapter.
          p='dashboard.html'; s=read(p)
          s=must_replace(s,
              'const WORKER_API_BASE = "https://dpro-wangan-biz-api.dpromstk2000.workers.dev";',
              f'const CONTROL_ADAPTER_BASE = "{ADAPTER}";\n    const WORKER_API_BASE = `${{CONTROL_ADAPTER_BASE}}/wangan`;',
              'dashboard-worker')
          s=must_replace(s,'const DEFAULT_DASHBOARD_TOKEN = "1234";','const DEMO_DASHBOARD_TOKEN = "1234";','dashboard-demo-token')
          s=must_replace(s,
              'let dashboardToken = localStorage.getItem("ksh_dashboard_token") || DEFAULT_DASHBOARD_TOKEN;',
              'let dashboardToken = localStorage.getItem("dpro_car_service_owner_session") || "";',
              'dashboard-init')
          s=s.replace('dashboardToken = "1234";\n        try { localStorage.setItem("ksh_dashboard_token", "1234"); } catch (error) {}',
                      'dashboardToken = DEMO_DASHBOARD_TOKEN;\n        try { localStorage.removeItem("dpro_car_service_owner_session"); } catch (error) {}',1)
          s=s.replace('localStorage.setItem("ksh_dashboard_token", dashboardToken);','if (IS_EMBED_DEMO) localStorage.removeItem("dpro_car_service_owner_session"); else if (dashboardToken) localStorage.setItem("dpro_car_service_owner_session", dashboardToken); else localStorage.removeItem("dpro_car_service_owner_session");')
          s=s.replace('dashboardToken = DEFAULT_DASHBOARD_TOKEN;','dashboardToken = IS_EMBED_DEMO ? DEMO_DASHBOARD_TOKEN : "";')
          s=must_re(s,
              r'const headers = \{\s*"Content-Type": "application/json",\s*"X-Dashboard-Token": dashboardToken,\s*\.\.\.\(options\.headers \|\| \{\}\)\s*\};',
              'const headers = {\n        "Content-Type": "application/json",\n        ...(IS_EMBED_DEMO ? { "X-DPRO-Demo": "1" } : {}),\n        ...(!IS_EMBED_DEMO && dashboardToken ? { "Authorization": `Bearer ${dashboardToken}` } : {}),\n        ...(options.headers || {})\n      };',
              'dashboard-api-headers',re.S)
          write(p,s)

          # owner-ipad.html: same fail-closed owner-session model, KSH through adapter.
          p='owner-ipad.html'; s=read(p)
          s=must_replace(s,
              'const WORKER_API_BASE = "https://ksh-line-demo-api.dpromstk2000.workers.dev";',
              f'const CONTROL_ADAPTER_BASE = "{ADAPTER}";\n    const WORKER_API_BASE = `${{CONTROL_ADAPTER_BASE}}/ksh`;',
              'ipad-worker')
          s=must_replace(s,'const DEFAULT_DASHBOARD_TOKEN = "1234";','const DEMO_DASHBOARD_TOKEN = "1234";','ipad-demo-token')
          s=must_replace(s,
              'let dashboardToken = localStorage.getItem("ksh_dashboard_token") || DEFAULT_DASHBOARD_TOKEN;',
              'let dashboardToken = localStorage.getItem("dpro_car_service_owner_session") || "";',
              'ipad-init')
          s=s.replace('dashboardToken = "1234";\n        try { localStorage.setItem("ksh_dashboard_token", "1234"); } catch (error) {}',
                      'dashboardToken = DEMO_DASHBOARD_TOKEN;\n        try { localStorage.removeItem("dpro_car_service_owner_session"); } catch (error) {}',1)
          s=s.replace('dashboardToken = document.getElementById("tokenInput").value.trim() || DEFAULT_DASHBOARD_TOKEN;',
                      'dashboardToken = document.getElementById("tokenInput").value.trim();')
          s=s.replace('localStorage.setItem("ksh_dashboard_token", dashboardToken);','if (IS_EMBED_DEMO) localStorage.removeItem("dpro_car_service_owner_session"); else if (dashboardToken) localStorage.setItem("dpro_car_service_owner_session", dashboardToken); else localStorage.removeItem("dpro_car_service_owner_session");')
          s=s.replace('dashboardToken = DEFAULT_DASHBOARD_TOKEN;','dashboardToken = IS_EMBED_DEMO ? DEMO_DASHBOARD_TOKEN : "";')
          s=s.replace('if (!isPublicApi && dashboardToken) {\n        url.searchParams.set("token", dashboardToken);\n      }',
                      '// R2: credential is carried only by adapter Authorization/demo headers; never in URL.')
          s=must_replace(s,
              'const headers = { ...(options.headers || {}) };',
              'const headers = {\n        ...(IS_EMBED_DEMO ? { "X-DPRO-Demo": "1" } : {}),\n        ...(!IS_EMBED_DEMO && dashboardToken ? { "Authorization": `Bearer ${dashboardToken}` } : {}),\n        ...(options.headers || {})\n      };',
              'ipad-api-headers')
          write(p,s)

          # index.html: all KSH calls use adapter; customer identity is verified from LIFF ID Token server-side.
          p='index.html'; s=read(p)
          s=must_replace(s,
              'const WORKER_API_BASE = "https://ksh-line-demo-api.dpromstk2000.workers.dev";',
              f'const CONTROL_ADAPTER_BASE = "{ADAPTER}";\n    const WORKER_API_BASE = `${{CONTROL_ADAPTER_BASE}}/ksh`;',
              'index-worker')
          anchor='const SHOP_CODE = "street_house_kitsuki";'
          inject='''const SHOP_CODE = "street_house_kitsuki";\n    let lineIdToken = "";\n    const IS_DPRO_DEMO = new URLSearchParams(location.search).get("demo") === "1";\n    const DPRO_ORIGINAL_FETCH = window.fetch.bind(window);\n    window.fetch = function(resource, options = {}) {\n      const headers = new Headers(options.headers || {});\n      const url = String(resource || "");\n      if (IS_DPRO_DEMO && url.startsWith(CONTROL_ADAPTER_BASE)) headers.set("X-DPRO-Demo", "1");\n      if (lineIdToken && url.includes("/api/public/customer-profile")) headers.set("X-Line-ID-Token", lineIdToken);\n      return DPRO_ORIGINAL_FETCH(resource, { ...options, headers });\n    };'''
          s=must_replace(s,anchor,inject,'index-fetch-wrapper')
          s=must_replace(s,'const profile = await liff.getProfile();','const profile = await liff.getProfile();\n        lineIdToken = liff.getIDToken() || "";','index-id-token')
          s=s.replace('`${WORKER_API_BASE}/api/public/customer-profile?lineUserId=${encodeURIComponent(lineProfile.userId)}`','`${WORKER_API_BASE}/api/public/customer-profile`')
          write(p,s)

          # member.html: ignore client lineUserId query/body identity and require ID Token in normal mode.
          p='member.html'; s=read(p)
          s=must_replace(s,
              'const WORKER_API_BASE = "https://ksh-line-demo-api.dpromstk2000.workers.dev";',
              f'const CONTROL_ADAPTER_BASE = "{ADAPTER}";\n    const WORKER_API_BASE = `${{CONTROL_ADAPTER_BASE}}/ksh`;',
              'member-worker')
          anchor='const VERSION = "STEP KSH-NEXT-7";'
          inject='''const VERSION = "STEP KSH-NEXT-7";\n    let lineIdToken = "";\n    const IS_DPRO_DEMO = new URLSearchParams(location.search).get("demo") === "1";\n    const DPRO_ORIGINAL_FETCH = window.fetch.bind(window);\n    window.fetch = function(resource, options = {}) {\n      const headers = new Headers(options.headers || {});\n      const url = String(resource || "");\n      if (IS_DPRO_DEMO && url.startsWith(CONTROL_ADAPTER_BASE)) headers.set("X-DPRO-Demo", "1");\n      if (lineIdToken && url.includes("/api/public/customer-profile")) headers.set("X-Line-ID-Token", lineIdToken);\n      return DPRO_ORIGINAL_FETCH(resource, { ...options, headers });\n    };'''
          s=must_replace(s,anchor,inject,'member-fetch-wrapper')
          s=must_replace(s,'state.lineProfile = await liff.getProfile();','state.lineProfile = await liff.getProfile();\n            lineIdToken = liff.getIDToken() || "";','member-id-token')
          s=s.replace('const lineUserId = state.lineProfile?.userId || queryLineUserId;','const lineUserId = state.lineProfile?.userId || "";')
          s=s.replace('`${WORKER_API_BASE}/api/public/customer-profile?lineUserId=${encodeURIComponent(lineUserId)}`','`${WORKER_API_BASE}/api/public/customer-profile`')
          write(p,s)

          # index-product-demo.html: explicit product demo stays usable through the adapter and can never become production authority.
          p='index-product-demo.html'; s=read(p)
          s=must_replace(s,
              'const WORKER_API_BASE = "https://ksh-line-demo-api.dpromstk2000.workers.dev";',
              f'const CONTROL_ADAPTER_BASE = "{ADAPTER}";\n    const WORKER_API_BASE = `${{CONTROL_ADAPTER_BASE}}/ksh`;',
              'product-demo-worker')
          anchor='const SHOP_CODE = "street_house_kitsuki";'
          inject='''const SHOP_CODE = "street_house_kitsuki";\n    const DPRO_PRODUCT_DEMO_FETCH = window.fetch.bind(window);\n    window.fetch = function(resource, options = {}) {\n      const headers = new Headers(options.headers || {});\n      const url = String(resource || "");\n      if (url.startsWith(CONTROL_ADAPTER_BASE)) headers.set("X-DPRO-Demo", "1");\n      return DPRO_PRODUCT_DEMO_FETCH(resource, { ...options, headers });\n    };'''
          s=must_replace(s,anchor,inject,'product-demo-fetch-wrapper')
          write(p,s)

          # Formal frontend compatibility marker consumed by adapter health/system-check.
          write('car-service-runtime-contract.js',f'''// DPRO CAR_SERVICE Product READY R2 runtime contract\nconst CAR_SERVICE_FRONTEND_VERSION = "{FRONTEND_VERSION}";\nconst CAR_SERVICE_ADAPTER_VERSION = "DPRO-CONTROL-ADAPTER-1.0-CAR-SERVICE-20260823-R2V2";\nconst CAR_SERVICE_SOURCE_ROLE = "WANGAN+KSH compatibility";\n''')

          # Replace stale KSH-only system-check with the Product READY adapter contract check.
          system_check='''<!DOCTYPE html>\n<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DPRO CAR_SERVICE｜システム確認 R2</title><style>body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:920px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dfe5eb;border-radius:18px;padding:18px;margin-bottom:14px}.btn{border:0;border-radius:12px;padding:12px 16px;background:#17202a;color:#fff;font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf1f4}.ok{color:#087a55;font-weight:900}.ng{color:#b42318;font-weight:900}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fb;padding:12px;border-radius:12px;font-size:12px}@media(max-width:420px){.row{display:block}.wrap{padding:14px 10px}}</style></head><body><div class="wrap"><div class="card"><h1>DPRO CAR_SERVICE システム確認</h1><p>WANGAN / KSH / Reset とProduct READY互換Adapterをまとめて確認します。</p><button id="run" class="btn">全検査を実行</button></div><div class="card"><div class="row"><span>WANGAN Worker</span><span id="wangan">確認前</span></div><div class="row"><span>KSH Worker</span><span id="ksh">確認前</span></div><div class="row"><span>Reset Worker</span><span id="reset">確認前</span></div><div class="row"><span>Version整合</span><span id="versions">確認前</span></div><div class="row"><span>本番保護</span><span id="guard">確認前</span></div><div class="row"><span>LINE本人確認</span><span id="line">確認前</span></div></div><div class="card"><pre id="result">未実行</pre></div></div><script>const ADAPTER="https://ropwvdnohadwxfbkcopx.supabase.co/functions/v1/dpro-car-service-control-adapter";const WANGAN="https://dpro-wangan-biz-api.dpromstk2000.workers.dev";const KSH="https://ksh-line-demo-api.dpromstk2000.workers.dev";const RESET="https://ksh-demo-reset.dpromstk2000.workers.dev";async function run(){const out=document.getElementById("result");out.textContent="確認中…";try{const r=await fetch(ADAPTER+"/system-check");const d=await r.json();const set=(id,ok)=>{const e=document.getElementById(id);e.textContent=ok?"PASS":"NG";e.className=ok?"ok":"ng"};set("wangan",d.versions?.wangan?.ok===true);set("ksh",d.versions?.ksh?.ok===true);set("reset",d.versions?.reset?.ok===true);set("versions",d.versionsAligned===true);set("guard",d.productionGuard===true);set("line",(d.checks||[]).some(x=>x.key==="line_no_token_rejected"&&x.ok));out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent="確認できませんでした。ネットワーク状態をご確認ください。"}}document.getElementById("run").addEventListener("click",run);run();</script></body></html>'''
          write('system-check.html',system_check)

          # Static post-patch assertions.
          d=read('dashboard.html'); i=read('owner-ipad.html'); idx=read('index.html'); mem=read('member.html'); pdemo=read('index-product-demo.html'); sc=read('system-check.html')
          checks={
            'dashboard_no_default_1234':'DEFAULT_DASHBOARD_TOKEN' not in d and '|| DEFAULT_DASHBOARD_TOKEN' not in d,
            'ipad_no_default_1234':'DEFAULT_DASHBOARD_TOKEN' not in i and '|| DEFAULT_DASHBOARD_TOKEN' not in i,
            'dashboard_adapter':ADAPTER in d and '/wangan' in d,
            'ipad_adapter':ADAPTER in i and '/ksh' in i,
            'index_id_token':'getIDToken()' in idx and 'X-Line-ID-Token' in idx,
            'member_id_token':'getIDToken()' in mem and 'X-Line-ID-Token' in mem and '|| queryLineUserId' not in mem,
            'product_demo_adapter':ADAPTER in pdemo and 'X-DPRO-Demo' in pdemo,
            'system_check_wangan':'dpro-wangan-biz-api.dpromstk2000.workers.dev' in sc,
            'system_check_ksh':'ksh-line-demo-api.dpromstk2000.workers.dev' in sc,
            'system_check_reset':'ksh-demo-reset.dpromstk2000.workers.dev' in sc,
            'runtime_contract':FRONTEND_VERSION in read('car-service-runtime-contract.js'),
          }
          Path('product-ready-evidence/car-service-r2/static-apply.json').write_text(json.dumps({'ok':all(checks.values()),'checks':checks},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          if not all(checks.values()): raise SystemExit(1)
          PY

      - name: Commit remediated source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html owner-ipad.html index.html member.html index-product-demo.html system-check.html car-service-runtime-contract.js
          if git diff --cached --quiet; then
            echo "No runtime diff; assuming already applied."
          else
            git commit -m "CAR_SERVICE Product READY R2 security/runtime adapter binding"
            git push
          fi
          SHA="$(git rev-parse HEAD)"
          echo "$SHA" | tee product-ready-evidence/car-service-r2/source-head.txt
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub Pages and adapter version alignment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CONTRACT="$(curl -fsSL --max-time 15 "$FRONT_BASE/car-service-runtime-contract.js?qa=$RANDOM" || true)"
            HEALTH="$(curl -fsSL --max-time 20 "$ADAPTER/health?qa=$RANDOM" || true)"
            if echo "$CONTRACT" | grep -q "$FRONTEND_VERSION" && echo "$HEALTH" | grep -q '"versionsAligned": true'; then
              echo "Pages + adapter aligned"
              exit 0
            fi
            sleep 10
          done
          echo "Pages/adapter alignment did not converge" >&2
          curl -sS "$ADAPTER/health" || true
          exit 1

      - name: Runtime, security and public URL final probes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os,json,urllib.request,urllib.error
          from pathlib import Path
          AD=os.environ['ADAPTER']; ORIGIN='https://dpromstk2000-lab.github.io'
          def req(url,method='GET',headers=None,data=None):
            r=urllib.request.Request(url,method=method,headers={'User-Agent':'DPRO-CAR-SERVICE-R2-QA',**(headers or {})},data=data)
            try:
              with urllib.request.urlopen(r,timeout=30) as x:return x.status,{k.lower():v for k,v in x.headers.items()},x.read()
            except urllib.error.HTTPError as e:return e.code,{k.lower():v for k,v in e.headers.items()},e.read()
          def j(b):
            try:return json.loads(b.decode())
            except:return {}
          out={'ok':True,'checks':{}}
          for key,base in [('wangan',os.environ['WANGAN_API']),('ksh',os.environ['KSH_API']),('reset',os.environ['RESET_API'])]:
            s,h,b=req(base+'/health'); d=j(b); ok=s==200 and d.get('ok') is True; out['checks'][key+'_health']={'ok':ok,'status':s,'body':d}; out['ok'] &= ok
          s,h,b=req(AD+'/health'); health=j(b); ok=s==200 and health.get('ok') is True and health.get('versionsAligned') is True and health.get('productionGuard') is True and health.get('websiteSyncCapability') is True; out['checks']['adapter_health']={'ok':ok,'status':s,'body':health}; out['ok'] &= ok
          s,h,b=req(AD+'/system-check'); sc=j(b); ok=s==200 and sc.get('ok') is True and sc.get('versionsAligned') is True and sc.get('summary',{}).get('failed')==0; out['checks']['adapter_system_check']={'ok':ok,'status':s,'body':sc}; out['ok'] &= ok
          s,h,b=req(AD+'/health','OPTIONS',{'Origin':ORIGIN,'Access-Control-Request-Method':'GET'}); ok=s==204 and h.get('access-control-allow-origin')==ORIGIN; out['checks']['cors_allowed']={'ok':ok,'status':s,'acao':h.get('access-control-allow-origin')}; out['ok'] &= ok
          s,h,b=req(AD+'/health','OPTIONS',{'Origin':'https://evil.example','Access-Control-Request-Method':'GET'}); ok=s==403 and not h.get('access-control-allow-origin'); out['checks']['cors_evil_rejected']={'ok':ok,'status':s,'acao':h.get('access-control-allow-origin')}; out['ok'] &= ok
          s,h,b=req(AD+'/wangan/api/website-admin/bootstrap','GET',{'Origin':ORIGIN,'Authorization':'Bearer 1234'}); ok=s in (401,403); out['checks']['production_1234_negative']={'ok':ok,'status':s,'body':j(b)}; out['ok'] &= ok
          s,h,b=req(AD+'/wangan/api/website-admin/bootstrap','GET',{'Origin':ORIGIN,'X-DPRO-Demo':'1'}); ok=s==200 and j(b).get('ok') is True; out['checks']['demo_admin_positive']={'ok':ok,'status':s}; out['ok'] &= ok
          s,h,b=req(AD+'/ksh/api/public/customer-profile?lineUserId=FORGED','GET',{'Origin':ORIGIN}); ok=s in (401,403); out['checks']['line_forged_negative']={'ok':ok,'status':s,'body':j(b)}; out['ok'] &= ok
          forged=json.dumps({'customerName':'R2 QA','phone':'09000000000','preferredVisitDate':'2099-01-01','preferredVisitTime':'10:30','lineUserId':'FORGED'}).encode(); s,h,b=req(AD+'/ksh/api/inquiries','POST',{'Origin':ORIGIN,'Content-Type':'application/json'},forged); ok=s in (401,403) and j(b).get('code') in ('LINE_ID_TOKEN_REQUIRED','LINE_ID_TOKEN_INVALID'); out['checks']['line_claimed_write_negative']={'ok':ok,'status':s,'body':j(b)}; out['ok'] &= ok
          past=json.dumps({'customerName':'R2 QA','phone':'09000000000','preferredVisitDate':'2020-01-01','preferredVisitTime':'10:30'}).encode(); s,h,b=req(AD+'/ksh/api/inquiries','POST',{'Origin':ORIGIN,'Content-Type':'application/json'},past); ok=s==422 and j(b).get('code')=='PAST_DATE_REJECTED'; out['checks']['past_date_negative']={'ok':ok,'status':s,'body':j(b)}; out['ok'] &= ok
          slot=json.dumps({'customerName':'R2 QA','phone':'09000000000','preferredVisitDate':'2099-01-01','preferredVisitTime':'10:15'}).encode(); s,h,b=req(AD+'/ksh/api/inquiries','POST',{'Origin':ORIGIN,'Content-Type':'application/json'},slot); ok=s==422 and j(b).get('code')=='SLOT_30_MIN_REQUIRED'; out['checks']['slot_negative']={'ok':ok,'status':s,'body':j(b)}; out['ok'] &= ok
          urls={'demo_entry':os.environ['FRONT_BASE']+'/index-product-demo.html?v=step-ksh-next-10','dashboard':os.environ['FRONT_BASE']+'/dashboard.html?embed_demo=1','customer':os.environ['FRONT_BASE']+'/index.html?demo=1','member':os.environ['FRONT_BASE']+'/member.html?demo=1','ipad':os.environ['FRONT_BASE']+'/owner-ipad.html?embed_demo=1','system_check':os.environ['FRONT_BASE']+'/system-check.html','product':os.environ['PRODUCT_URL'],'lp':os.environ['LP_URL'],'a4_html':os.environ['A4_HTML_URL'],'a4_pdf':os.environ['A4_PDF_URL']}
          for key,url in urls.items():
            s,h,b=req(url); required=key in {'demo_entry','dashboard','customer','member','ipad','system_check','product'}; ok=(s==200 if required else s in (200,404)); out['checks']['public_'+key]={'ok':ok,'status':s,'content_type':h.get('content-type'),'bytes':len(b)}; out['ok'] &= ok
          Path('product-ready-evidence/car-service-r2/runtime-final.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['ok']: raise SystemExit(1)
          PY

      - name: Browser QA PC / 390 / 320 / iPad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/car-service-browser product-ready-evidence/car-service-r2/screens
          cd /tmp/car-service-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = process.env.FRONT_BASE;
          const outDir = process.env.GITHUB_WORKSPACE + '/product-ready-evidence/car-service-r2/screens';
          const cases = [
            {key:'pc-dashboard', path:'/dashboard.html?embed_demo=1', viewport:{width:1440,height:1000}},
            {key:'demo-entry-390', path:'/index-product-demo.html?v=pr2', viewport:{width:390,height:844}},
            {key:'customer-390', path:'/index.html?embed_demo=1', viewport:{width:390,height:844}},
            {key:'customer-320', path:'/index.html?embed_demo=1', viewport:{width:320,height:720}},
            {key:'member-390', path:'/member.html?demo=1', viewport:{width:390,height:844}},
            {key:'member-320', path:'/member.html?demo=1', viewport:{width:320,height:720}},
            {key:'ipad', path:'/owner-ipad.html?embed_demo=1', viewport:{width:1024,height:768}},
            {key:'system-check-320', path:'/system-check.html', viewport:{width:320,height:844}},
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true}); const results=[];
            for(const c of cases){
              const page=await browser.newPage({viewport:c.viewport}); const pageErrors=[],consoleErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e))); page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              let status=null,loadError=null; try{const r=await page.goto(base+c.path,{waitUntil:'networkidle',timeout:60000});status=r?.status()??null}catch(e){loadError=String(e)}
              await page.waitForTimeout(1500);
              const metrics=await page.evaluate(()=>({innerWidth,htmlScrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body?.scrollWidth||0,text:(document.body?.innerText||'').slice(0,9000)})).catch(()=>({}));
              const overflow=Math.max(metrics.htmlScrollWidth||0,metrics.bodyScrollWidth||0)>(metrics.innerWidth||0)+2;
              const technicalTerms=/service[_ -]?role|supabase[_ -]?key|channel[_ -]?secret|stack trace|undefined exception/i.test(metrics.text||'');
              const blockingConsole=consoleErrors.filter(x=>/Uncaught|TypeError|ReferenceError|SyntaxError/i.test(x));
              const ok=loadError===null&&status===200&&!overflow&&!technicalTerms&&pageErrors.length===0&&blockingConsole.length===0;
              await page.screenshot({path:`${outDir}/${c.key}.png`,fullPage:true}).catch(()=>{});
              results.push({...c,status,loadError,overflow,technicalTerms,pageErrors,blockingConsole,consoleErrors,metrics,ok}); await page.close();
            }
            await browser.close(); fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/product-ready-evidence/car-service-r2/browser.json',JSON.stringify({ok:results.every(x=>x.ok),results},null,2)+'\n'); if(!results.every(x=>x.ok))process.exitCode=1;
          })();
          JS
          node qa.js

      - name: Final evidence summary
        if: always()
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json,os
          root=Path('product-ready-evidence/car-service-r2')
          def load(n):
            try:return json.loads((root/n).read_text())
            except:return {}
          runtime=load('runtime-final.json'); browser=load('browser.json'); static=load('static-apply.json')
          summary={'source_head':(root/'source-head.txt').read_text().strip() if (root/'source-head.txt').exists() else None,'frontend_version':os.environ['FRONTEND_VERSION'],'adapter_version':os.environ['ADAPTER_VERSION'],'static_ok':static.get('ok'),'runtime_ok':runtime.get('ok'),'browser_ok':browser.get('ok'),'final_ok':bool(static.get('ok') and runtime.get('ok') and browser.get('ok'))}
          (root/'FINAL_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

