name: CAR02 V4.41 Append-Only Manual Review Ledger Disposable PG17 (NO_GO HOLD)
# Strictly isolated: never call LINE, Supabase, Worker or production PostgreSQL.
# This CI success does NOT validate real reviewer authentication or delivery evidence.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-manual-review-ledger-r441.mjs'
      - 'car02-manual-review-ledger-r441.test.mjs'
      - 'car02-v441-disposable-pg17.sql'
      - '.github/workflows/car02-v441-manual-review-ledger-pg17-qa.yml'
      - 'car02-outbox-recovery-r440.mjs'
      - 'car02-edge-entry-r52.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-review-audit:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v441_disposable_only
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: v441_disposable_only
    steps:
      - name: Checkout review-only source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run 100 offline tests, check disconnected release lock
        shell: bash
        run: |
          set -euo pipefail
          for name in CAR02_DATABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN; do
            test -z "${!name:-}" || { echo "Unexpected live env: $name" >&2; exit 1; }
          done
          for f in car02-manual-review-ledger-r441.mjs car02-manual-review-ledger-r441.test.mjs car02-v441-disposable-pg17.sql; do test -s "$f"; done
          node --check car02-manual-review-ledger-r441.mjs
          node --check car02-manual-review-ledger-r441.test.mjs
          node --test car02-staff-generation-r434.test.mjs car02-staff-authority-r435.test.mjs car02-transaction-gate-r436.test.mjs car02-tenant-cas-gate-r437.test.mjs car02-idempotency-r438.test.mjs car02-outbox-r439.test.mjs car02-outbox-recovery-r440.test.mjs car02-manual-review-ledger-r441.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V441_RELEASE_LOCK,CAR02_V441_AUDIT_SQL,CAR02_V441_SUMMARY_SQL} from './car02-manual-review-ledger-r441.mjs';
          assert.equal(CAR02_V441_RELEASE_LOCK,true);
          assert.equal(CAR02_V441_AUDIT_SQL,'SELECT stored,review_count FROM public.v441_qa_record_review($1::text,$2::uuid,$3::uuid,$4::text,$5::text)');
          assert.equal(CAR02_V441_SUMMARY_SQL,'SELECT review_count,status FROM public.v441_qa_review_summary($1::text,$2::uuid)');
          const edge=readFileSync('car02-edge-entry-r52.ts','utf8');
          assert.match(edge,/const\s+CAR02_RELEASE_LOCK\s*=\s*true\s*;/);
          assert.doesNotMatch(edge,/car02-manual-review-ledger-r441|v441_qa_/);
          for(const source of ['car02-staff-generation-r434.mjs','car02-staff-authority-r435.mjs','car02-transaction-gate-r436.mjs','car02-tenant-cas-gate-r437.mjs','car02-idempotency-r438.mjs','car02-outbox-r439.mjs','car02-outbox-recovery-r440.mjs']){
            assert.match(readFileSync(source,'utf8'),/RELEASE_LOCK\s*=\s*true/);
          }
          console.log('V441_SOURCE_AND_100_LOCAL_TESTS_AND_RELEASE_LOCK_PASS');
          console.log('V441_REAL_REVIEWER_IDENTITY_AND_PROVIDER_RECEIPTS_MISSING_NO_GO');
          NODE
      - name: Real disposable PG17 immutable review, cross-tenant and eight concurrent replays
        shell: bash
        run: |
          set -euo pipefail
          pg(){ docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17 psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55441 -U postgres "$@"; }
          pg -d postgres -c 'CREATE DATABASE car02_v441_disposable' >/dev/null
          pg -d car02_v441_disposable -f /workspace/car02-v441-disposable-pg17.sql | tee "$RUNNER_TEMP/v441-pg.log"
          for mark in V441_DISPOSABLE_PG17_UNPRIVILEGED_DENY_PASS V441_DISPOSABLE_PG17_DISTINCT_REVIEWERS_APPEND_ONLY_PASS V441_DISPOSABLE_PG17_TENANT_DELIVERED_THIRD_REJECT_PASS V441_DISPOSABLE_PG17_IMMUTABLE_AUDIT_AND_SUMMARY_PASS; do
            grep -Fq "$mark" "$RUNNER_TEMP/v441-pg.log"
          done
          # Same reviewer, same event, eight independent clients: exactly one durable insert.
          pids=()
          for i in 1 2 3 4 5 6 7 8; do
            (pg -Atq -d car02_v441_disposable -c "SELECT stored::text||':'||review_count::text FROM public.v441_qa_record_review('qa_shop_a','00000000-0000-0000-0000-000000004404','00000000-0000-0000-0000-000000004414',repeat('f',64),'investigated')" > "$RUNNER_TEMP/v441-review-$i.out") &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          inserted=0
          duplicated=0
          for i in 1 2 3 4 5 6 7 8; do
            if grep -Fxq 'true:1' "$RUNNER_TEMP/v441-review-$i.out" || grep -Fxq 't:1' "$RUNNER_TEMP/v441-review-$i.out"; then inserted=$((inserted+1));
            elif grep -Fxq 'false:1' "$RUNNER_TEMP/v441-review-$i.out" || grep -Fxq 'f:1' "$RUNNER_TEMP/v441-review-$i.out"; then duplicated=$((duplicated+1));
            else cat "$RUNNER_TEMP/v441-review-$i.out"; exit 1; fi
          done
          test "$inserted:$duplicated" = '1:7' || { echo "V441_REVIEW_REPLAY_BAD: $inserted:$duplicated" >&2; exit 1; }
          result=$(pg -Atq -d car02_v441_disposable -c "SELECT (SELECT count(*) FROM public.v441_qa_review_audit WHERE event_id='00000000-0000-0000-0000-000000004404')::text||':'||(SELECT status FROM public.v441_qa_outbox WHERE id='00000000-0000-0000-0000-000000004404')::text||':'||(SELECT count(*) FROM public.v441_qa_review_audit)::text")
          test "$result" = '1:manual_review:3' || { echo "V441_REVIEW_LEDGER_BROKEN: $result" >&2; exit 1; }
          echo V441_DISPOSABLE_PG17_EIGHT_REVIEWERS_ONE_AUDIT_PASS
          echo V441_DISPOSABLE_PG17_MANUAL_REVIEW_NEVER_REQUEUED_OR_DELIVERED_PASS
          echo V441_FINAL_RELEASE_NO_GO_HOLD_TRUE
