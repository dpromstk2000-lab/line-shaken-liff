name: DPRO KSH Tutorial R4 Guide Center Apply and LIVE QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpro-tutorial-ksh-r4-apply-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify R3 FULL PASS baseline before R4 write
        shell: bash
        run: |
          set -euo pipefail
          test -f dpro-tutorial-car-service.js
          test -f dpro-tutorial-car-service.css
          test -f dashboard.html
          test -f owner-ipad.html
          grep -q "CAR_SERVICE-R3-20260829" dpro-tutorial-car-service.js
          test "$(grep -o "id:'KSH-F10-" dpro-tutorial-car-service.js | wc -l | tr -d ' ')" = "10"
          grep -q "dpro-tutorial-car-service.js" dashboard.html
          grep -q "dpro-tutorial-car-service.js" owner-ipad.html

      - name: Apply R4 exact First10 Guide Center
        shell: python
        run: |
          from pathlib import Path
          import base64
          js_b64 = """"""
          css_b64 = """"""
          Path('dpro-tutorial-car-service.js').write_bytes(base64.b64decode(js_b64))
          Path('dpro-tutorial-car-service.css').write_bytes(base64.b64decode(css_b64))
          for name in ['dashboard.html','owner-ipad.html']:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              text=text.replace('dpro-tutorial-car-service.css?v=R3-20260829','dpro-tutorial-car-service.css?v=R4-20260829')
              text=text.replace('dpro-tutorial-car-service.js?v=R3-20260829','dpro-tutorial-car-service.js?v=R4-20260829')
              if text.count('dpro-tutorial-car-service.css') != 1:
                  raise SystemExit(f'{name}: css loader count != 1')
              if text.count('dpro-tutorial-car-service.js') != 1:
                  raise SystemExit(f'{name}: js loader count != 1')
              p.write_text(text,encoding='utf-8')

      - name: Verify R4 source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check dpro-tutorial-car-service.js
          grep -q "GUIDE_VERSION='CAR_SERVICE-R4-20260829'" dpro-tutorial-car-service.js
          grep -q "const guideItems=steps.map" dpro-tutorial-car-service.js
          grep -q "guideCount:guideItems.length" dpro-tutorial-car-service.js
          grep -q "dpro-tutorial-guide-start" dpro-tutorial-car-service.js
          grep -q "dpro-tutorial-guide-resume" dpro-tutorial-car-service.js
          grep -q "dpro-tutorial-guide-replay" dpro-tutorial-car-service.js
          ! grep -q "const guide={" dpro-tutorial-car-service.js

      - name: Commit R4 Guide Center when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dpro-tutorial-car-service.js dpro-tutorial-car-service.css dashboard.html owner-ipad.html; then
            echo "R4 Guide Center already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dpro-tutorial-car-service.js dpro-tutorial-car-service.css dashboard.html owner-ipad.html
            git commit -m "KSH R4 align Guide Center to First10"
            git push origin main
          fi

      - name: Wait for GitHub Pages R4 marker
        shell: python
        run: |
          import time, urllib.request
          pages=[
            'https://dpromstk2000-lab.github.io/line-shaken-liff/dashboard.html?embed_demo=1&r4qa=20260829',
            'https://dpromstk2000-lab.github.io/line-shaken-liff/owner-ipad.html?embed_demo=1&r4qa=20260829',
          ]
          html_marker='dpro-tutorial-car-service.js?v=R4-20260829'
          js_url='https://dpromstk2000-lab.github.io/line-shaken-liff/dpro-tutorial-car-service.js?v=R4-20260829&r4qa=1'
          for attempt in range(48):
              ok=True
              try:
                  for url in pages:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'DPRO-R4-QA'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          body=r.read().decode('utf-8','replace')
                      if html_marker not in body: ok=False
                  req=urllib.request.Request(js_url,headers={'Cache-Control':'no-cache','User-Agent':'DPRO-R4-QA'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      js_body=r.read().decode('utf-8','replace')
                  if 'CAR_SERVICE-R4-20260829' not in js_body: ok=False
              except Exception:
                  ok=False
              if ok:
                  print('GitHub Pages R4 marker detected.')
                  break
              time.sleep(10)
          else:
              raise SystemExit('GitHub Pages did not expose the R4 marker in time.')

      - name: Install browser QA dependency
        run: python -m pip install --disable-pip-version-check selenium

      - name: Run exact public R4 LIVE QA
        shell: bash
        run: |
          cat > /tmp/ksh_r4_live_qa.py <<'PY'
          import json, time, traceback
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.common.action_chains import ActionChains
          
          BASE='https://dpromstk2000-lab.github.io/line-shaken-liff/'
          VIEWPORTS=[(1440,1000),(1024,768),(390,844),(320,720)]
          report={'system':'KSH','phase':'R4','tutorialVersion':'CAR_SERVICE-R3-20260829','guideVersion':'CAR_SERVICE-R4-20260829','viewports':[],'overall':'PASS'}
          
          def wait_css(drv, selector, timeout=12):
              return WebDriverWait(drv,timeout).until(EC.presence_of_element_located((By.CSS_SELECTOR,selector)))
          
          def perf_requests(drv):
              out=[]
              for row in drv.get_log('performance'):
                  try:
                      msg=json.loads(row['message'])['message']
                      if msg.get('method')=='Network.requestWillBeSent':
                          r=msg['params']['request']; out.append((r.get('method',''),r.get('url','')))
                  except Exception: pass
              return out
          
          def relevant_console_errors(drv):
              errors=[]
              for row in drv.get_log('browser'):
                  msg=row.get('message','')
                  if row.get('level')=='SEVERE' and ('dpro-tutorial-car-service.js' in msg or 'DPROCarServiceTutorial' in msg or 'Guide Center' in msg):
                      errors.append(msg)
              return errors
          
          def step_text(drv):
              return drv.find_element(By.CSS_SELECTOR,'.dpt-step').text.strip()
          
          def clear_and_open(drv):
              url=BASE+'dashboard.html?embed_demo=1&r4qa=20260829'
              drv.get(url); wait_css(drv,'#dpro-tutorial-launcher')
              drv.execute_script('localStorage.removeItem("dpro_tutorial_car_service_v1_1"); sessionStorage.clear();')
              drv.get(url); wait_css(drv,'#dpro-tutorial-launcher')
              drv.get_log('performance'); drv.get_log('browser')
          
          def open_guide(drv):
              drv.find_element(By.ID,'dpro-tutorial-guide-center-entry').click()
              return wait_css(drv,'#dpro-tutorial-guide-center')
          
          for w,h in VIEWPORTS:
              opts=Options()
              opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage')
              opts.add_argument('--disable-gpu'); opts.add_argument(f'--window-size={w},{h}')
              opts.set_capability('goog:loggingPrefs', {'browser':'ALL','performance':'ALL'})
              drv=webdriver.Chrome(options=opts)
              row={'viewport':f'{w}x{h}','checks':{}}
              try:
                  drv.execute_cdp_cmd('Emulation.setDeviceMetricsOverride',{'width':w,'height':h,'deviceScaleFactor':1,'mobile':False})
                  clear_and_open(drv)
                  row['checks']['TUTORIAL_VERSION']=drv.execute_script('return DPROCarServiceTutorial.version')=='CAR_SERVICE-R3-20260829'
                  row['checks']['GUIDE_VERSION']=drv.execute_script('return DPROCarServiceTutorial.guideVersion')=='CAR_SERVICE-R4-20260829'
                  row['checks']['FIRST10_COUNT']=drv.execute_script('return DPROCarServiceTutorial.stepCount')==10
                  row['checks']['GUIDE_COUNT_API']=drv.execute_script('return DPROCarServiceTutorial.guideCount')==10
          
                  open_guide(drv)
                  row['checks']['GUIDE_COUNT_DOM']=len(drv.find_elements(By.CSS_SELECTOR,'.dpt-guide-step'))==10
                  align_js="const a=DPROCarServiceTutorial.steps,b=DPROCarServiceTutorial.guideItems;return a.length===10&&b.length===10&&a.every((s,i)=>{const g=b[i];return s.id===g.id&&s.order===g.order&&s.surface===g.surface&&s.route===g.route&&s.primary===g.primary&&JSON.stringify(s.fallback)===JSON.stringify(g.fallback)&&s.title===g.title;});"
                  row['checks']['GUIDE_TUTORIAL_ALIGNMENT']=drv.execute_script(align_js) is True
                  row['checks']['KEYBOARD_FOCUS']=drv.execute_script('return document.activeElement && document.activeElement.hasAttribute("data-gclose")') is True
                  row['checks']['RESUME_HIDDEN_WITHOUT_STATE']=len(drv.find_elements(By.ID,'dpro-tutorial-guide-resume'))==0
          
                  drv.find_element(By.ID,'dpro-tutorial-guide-start').click(); wait_css(drv,'.dpt-card')
                  row['checks']['START']=step_text(drv)=='STEP 1 / 10'
                  for _ in range(3): drv.find_element(By.CSS_SELECTOR,'[data-next]').click(); time.sleep(.05)
                  paused=step_text(drv)
                  drv.find_element(By.CSS_SELECTOR,'[data-close]').click()
                  open_guide(drv)
                  resume=drv.find_elements(By.ID,'dpro-tutorial-guide-resume')
                  row['checks']['RESUME_VISIBLE_WITH_STATE']=len(resume)==1
                  if resume:
                      resume[0].click(); wait_css(drv,'.dpt-card')
                  row['checks']['RESUME']=step_text(drv)==paused
          
                  drv.find_element(By.CSS_SELECTOR,'[data-skip]').click(); wait_css(drv,'#dpro-tutorial-guide-center')
                  drv.find_element(By.ID,'dpro-tutorial-guide-replay').click(); wait_css(drv,'.dpt-card')
                  row['checks']['REPLAY']=step_text(drv)=='STEP 1 / 10'
          
                  for _ in range(8):
                      ActionChains(drv).send_keys(Keys.ARROW_RIGHT).perform(); time.sleep(.06)
                  row['checks']['STEP9']=step_text(drv)=='STEP 9 / 10'
                  ActionChains(drv).send_keys(Keys.ARROW_RIGHT).perform()
                  WebDriverWait(drv,12).until(lambda d:'owner-ipad.html' in d.current_url)
                  wait_css(drv,'.dpt-card')
                  row['checks']['CROSS_PAGE_STATE']=step_text(drv)=='STEP 10 / 10' and drv.execute_script('return DPROCarServiceTutorial.state().step')==9
                  drv.find_element(By.CSS_SELECTOR,'[data-close]').click()
                  open_guide(drv)
                  cross_resume=drv.find_elements(By.ID,'dpro-tutorial-guide-resume')
                  row['checks']['CROSS_PAGE_RESUME_VISIBLE']=len(cross_resume)==1
                  if cross_resume:
                      cross_resume[0].click(); wait_css(drv,'.dpt-card')
                  row['checks']['CROSS_PAGE_RESUME']=step_text(drv)=='STEP 10 / 10'
          
                  ActionChains(drv).send_keys(Keys.ARROW_RIGHT).perform(); wait_css(drv,'#dpro-tutorial-guide-center')
                  row['checks']['COMPLETE_OPENS_GUIDE']=drv.execute_script('return DPROCarServiceTutorial.state().done') is True
                  drv.find_element(By.ID,'dpro-tutorial-guide-replay').click()
                  WebDriverWait(drv,12).until(lambda d:'dashboard.html' in d.current_url)
                  wait_css(drv,'.dpt-card')
                  row['checks']['REPLAY_CROSS_PAGE_TO_STEP1']=step_text(drv)=='STEP 1 / 10'
          
                  product_js="return !!document.querySelector('#nav-today')&&!!document.querySelector('#nav-inquiries')&&!!document.querySelector('#nav-reservations')&&!!document.querySelector('#nav-customers')&&!!document.querySelector('#reservationProgressStage')&&!!document.querySelector('button[onclick=\\\"openIpadDashboard()\\\"]')&&typeof openIpadDashboard==='function';"
                  row['checks']['PRODUCT_REGRESSION_0']=drv.execute_script(product_js) is True
          
                  drv.find_element(By.CSS_SELECTOR,'[data-close]').click(); open_guide(drv)
                  widths=drv.execute_script('return [innerWidth,document.documentElement.scrollWidth,document.body.scrollWidth]')
                  row['innerWidth'],row['documentElement_scrollWidth'],row['body_scrollWidth']=widths
                  row['overflow']=max(widths[1],widths[2])-widths[0]
                  row['checks']['OVERFLOW_0']=row['overflow']<=0
          
                  requests=perf_requests(drv)
                  unsafe=[{'method':m,'url':u} for m,u in requests if m.upper() not in ('GET','HEAD','OPTIONS')]
                  row['unsafe_requests']=unsafe
                  row['checks']['UNSAFE_WRITE_REQUEST_0']=len(unsafe)==0
                  row['checks']['BUSINESS_MUTATION_0']=len(unsafe)==0
                  cerr=relevant_console_errors(drv); row['tutorial_guide_console_errors']=cerr
                  row['checks']['TUTORIAL_GUIDE_CONSOLE_ERROR_0']=len(cerr)==0
                  row['checks']['PAGEERROR_0']=len(cerr)==0
                  row['pass']=all(row['checks'].values())
                  if not row['pass']: report['overall']='FAIL'
              except Exception as e:
                  row['pass']=False; row['exception']=repr(e); row['traceback']=traceback.format_exc(); report['overall']='FAIL'
              finally:
                  report['viewports'].append(row); drv.quit()
          
          with open('KSH_R4_LIVE_QA.json','w',encoding='utf-8') as f: json.dump(report,f,ensure_ascii=False,indent=2)
          lines=['DPRO TUTORIAL KSH R4 LIVE QA',f"OVERALL={report['overall']}"]
          for r in report['viewports']:
              lines.append(f"{r['viewport']}={'PASS' if r.get('pass') else 'FAIL'} innerWidth={r.get('innerWidth')} documentElement.scrollWidth={r.get('documentElement_scrollWidth')} body.scrollWidth={r.get('body_scrollWidth')} overflow={r.get('overflow')}")
              for k,v in r.get('checks',{}).items(): lines.append(f"  {k}={v}")
              if r.get('exception'): lines.append('  EXCEPTION='+r['exception'])
          with open('KSH_R4_LIVE_QA.txt','w',encoding='utf-8') as f: f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          if report['overall']!='PASS': raise SystemExit(1)
          PY
          python /tmp/ksh_r4_live_qa.py

      - name: Upload R4 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_KSH_R4_LIVE_QA_20260829
          path: |
            KSH_R4_LIVE_QA.json
            KSH_R4_LIVE_QA.txt
          if-no-files-found: warn
