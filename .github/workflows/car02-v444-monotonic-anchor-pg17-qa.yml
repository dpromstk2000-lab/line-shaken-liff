name: CAR02 V4.44 Witness Anchor Monotonic Key-Epoch Disposable PG17 (NO_GO HOLD)
# REVIEW ONLY, NO production Supabase/Worker/LINE. This PG17 CAS is not an external WORM archive.
# Node verifies detached Ed25519 signatures against local ephemeral/pinned fixture keys;
# SQL does NOT authenticate signatures or supply independent trust roots.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-witness-anchor-r444.mjs'
      - 'car02-witness-anchor-r444.test.mjs'
      - 'car02-v444-disposable-pg17.sql'
      - '.github/workflows/car02-v444-monotonic-anchor-pg17-qa.yml'
      - 'car02-review-witness-r443.mjs'
      - 'car02-review-integrity-r442.mjs'
      - 'car02-edge-entry-r52.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only-monotonic-witness:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v444_disposable_only
        ports:
          - 55444:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: v444_disposable_only
    steps:
      - name: Checkout isolated review branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run 142 offline tests and verify hard release lock
        shell: bash
        run: |
          set -euo pipefail
          for name in CAR02_DATABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN; do
            test -z "${!name:-}" || { echo "Unexpected live env: $name" >&2; exit 1; }
          done
          for file in car02-witness-anchor-r444.mjs car02-witness-anchor-r444.test.mjs car02-v444-disposable-pg17.sql car02-review-witness-r443.mjs car02-review-integrity-r442.mjs; do test -s "$file"; done
          node --check car02-witness-anchor-r444.mjs
          node --check car02-witness-anchor-r444.test.mjs
          node --test car02-staff-generation-r434.test.mjs car02-staff-authority-r435.test.mjs car02-transaction-gate-r436.test.mjs car02-tenant-cas-gate-r437.test.mjs car02-idempotency-r438.test.mjs car02-outbox-r439.test.mjs car02-outbox-recovery-r440.test.mjs car02-manual-review-ledger-r441.test.mjs car02-review-integrity-r442.test.mjs car02-review-witness-r443.test.mjs car02-witness-anchor-r444.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V444_RELEASE_LOCK,CAR02_V444_READ_SQL,CAR02_V444_CAS_SQL} from './car02-witness-anchor-r444.mjs';
          assert.equal(CAR02_V444_RELEASE_LOCK,true);
          assert.equal(CAR02_V444_READ_SQL,'SELECT count,head_hash,issued_at_ms,key_id,key_epoch,signature FROM public.v444_qa_anchor_current WHERE shop_code=$1 AND event_id=$2');
          assert.match(CAR02_V444_CAS_SQL,/^SELECT public\.v444_qa_append_anchor\(/);
          for(const file of ['car02-staff-generation-r434.mjs','car02-staff-authority-r435.mjs','car02-transaction-gate-r436.mjs','car02-tenant-cas-gate-r437.mjs','car02-idempotency-r438.mjs','car02-outbox-r439.mjs','car02-outbox-recovery-r440.mjs','car02-manual-review-ledger-r441.mjs','car02-review-integrity-r442.mjs','car02-review-witness-r443.mjs']){
            assert.match(readFileSync(file,'utf8'),/RELEASE_LOCK\s*=\s*true/);
          }
          const entry=readFileSync('car02-edge-entry-r52.ts','utf8');
          assert.match(entry,/const\s+CAR02_RELEASE_LOCK\s*=\s*true\s*;/);
          assert.doesNotMatch(entry,/car02-witness-anchor-r444|v444_qa_/);
          console.log('V444_SOURCE_HARD_RELEASE_LOCK_AND_142_OFFLINE_PASS');
          console.log('V444_EXTERNAL_ARCHIVE_PINNED_PRODUCTION_KEYS_AND_AUTH_MISSING_NO_GO');
          NODE
      - name: Real disposable PG17 rollback CAS key rotation append-only and eight writer race
        shell: bash
        run: |
          set -euo pipefail
          pg(){ docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17 psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55444 -U postgres "$@"; }
          pg -d postgres -c 'CREATE DATABASE car02_v444_disposable' >/dev/null
          pg -d car02_v444_disposable -f /workspace/car02-v444-disposable-pg17.sql | tee "$RUNNER_TEMP/v444-pg.log"
          for mark in V444_DISPOSABLE_PG17_PUBLIC_ROLES_DENIED_PASS V444_DISPOSABLE_PG17_MONOTONIC_KEY_ROTATION_PASS V444_DISPOSABLE_PG17_APPEND_ONLY_HISTORY_PASS; do
            grep -Fq "$mark" "$RUNNER_TEMP/v444-pg.log"
          done
          # Eight independently committed clients with same proposal: precisely ONE stored.
          pids=()
          for i in 1 2 3 4 5 6 7 8; do
            (pg -Atq -d car02_v444_disposable -c "SELECT public.v444_qa_append_anchor('qa_shop_a','00000000-0000-0000-0000-000000004442',1,repeat('c',64),2000000000000,'K1',1,repeat('x',86),0,repeat('0',64))" > "$RUNNER_TEMP/v444-race-$i.out") &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          accepted=0;rejected=0
          for i in 1 2 3 4 5 6 7 8; do
            if grep -Fxq 't' "$RUNNER_TEMP/v444-race-$i.out"; then accepted=$((accepted+1));
            elif grep -Fxq 'f' "$RUNNER_TEMP/v444-race-$i.out"; then rejected=$((rejected+1));
            else cat "$RUNNER_TEMP/v444-race-$i.out"; exit 1; fi
          done
          test "$accepted:$rejected" = '1:7' || { echo "V444_DUPLICATE_ANCHOR: $accepted:$rejected" >&2; exit 1; }
          final=$(pg -Atq -d car02_v444_disposable -c "SELECT (SELECT count(*) FROM public.v444_qa_anchor_history WHERE event_id='00000000-0000-0000-0000-000000004442')::text||':'||(SELECT count FROM public.v444_qa_anchor_current WHERE event_id='00000000-0000-0000-0000-000000004441')::text")
          test "$final" = '1:2' || { echo "V444_ANCHOR_LEDGER_INCORRECT: $final" >&2; exit 1; }
          # With a keyEpoch2 first witness, epoch1 is rejected even on later count2.
          test "$(pg -Atq -d car02_v444_disposable -c "SELECT public.v444_qa_append_anchor('qa_shop_b','00000000-0000-0000-0000-000000004443',1,repeat('d',64),2000000000000,'K2',2,repeat('y',86),0,repeat('0',64))")" = 't'
          test "$(pg -Atq -d car02_v444_disposable -c "SELECT public.v444_qa_append_anchor('qa_shop_b','00000000-0000-0000-0000-000000004443',2,repeat('e',64),2000000001000,'K1',1,repeat('x',86),1,repeat('d',64))")" = 'f'
          echo V444_DISPOSABLE_PG17_EIGHT_WRITERS_ONE_ANCHOR_PASS
          echo V444_DISPOSABLE_PG17_KEY_EPOCH_DOWNGRADE_DENIED_PASS
          echo V444_FINAL_RELEASE_NO_GO_HOLD_TRUE
