name: CAR02 V4.37 Tenant CAS Strict SQL and Disposable PG17 QA (NO_GO HOLD)
# Review branch ONLY. Success confirms synthetic tenant/CAS isolation, not production auth safety.
# No production Supabase / Worker / LINE / repository secrets. No release permissions.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-tenant-cas-gate-r437.mjs'
      - 'car02-tenant-cas-gate-r437.test.mjs'
      - 'car02-v437-disposable-pg17.sql'
      - 'car02-transaction-gate-r436.mjs'
      - 'car02-staff-authority-r435.mjs'
      - 'car02-staff-generation-r434.mjs'
      - '.github/workflows/car02-v437-tenant-cas-pg17-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only-tenant-cas:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v437_disposable_only
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: v437_disposable_only
    steps:
      - name: Checkout review-only branch (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source and 51 offline test cases
        shell: bash
        run: |
          set -euo pipefail
          for env_name in CAR02_DATABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN; do
            test -z "${!env_name:-}" || { echo "Unexpected live credentials: $env_name" >&2; exit 1; }
          done
          for f in car02-staff-generation-r434.mjs car02-staff-authority-r435.mjs car02-transaction-gate-r436.mjs car02-tenant-cas-gate-r437.mjs car02-v437-disposable-pg17.sql; do test -s "$f"; done
          for f in car02-tenant-cas-gate-r437.mjs car02-tenant-cas-gate-r437.test.mjs; do node --check "$f"; done
          node --test car02-staff-generation-r434.test.mjs car02-staff-authority-r435.test.mjs car02-transaction-gate-r436.test.mjs car02-tenant-cas-gate-r437.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V437_RELEASE_LOCK,CAR02_V437_TOUCH_SQL} from './car02-tenant-cas-gate-r437.mjs';
          assert.equal(CAR02_V437_RELEASE_LOCK,true);
          assert.equal(CAR02_V437_TOUCH_SQL,'UPDATE public.ksh_car02_work_orders SET state_version=state_version+1,updated_at=clock_timestamp() WHERE shop_code=$1 AND id=$2 AND state_version=$3 RETURNING id');
          const entry=readFileSync('car02-edge-entry-r52.ts','utf8');
          assert.match(entry,/const\s+CAR02_RELEASE_LOCK\s*=\s*true\s*;/);
          assert.doesNotMatch(entry,/car02-tenant-cas-gate-r437/);
          for (const file of ['car02-staff-generation-r434.mjs','car02-staff-authority-r435.mjs','car02-transaction-gate-r436.mjs']){
            const code=readFileSync(file,'utf8');assert.match(code,/RELEASE_LOCK\s*=\s*true/);
          }
          console.log('V437_SOURCE_LOCKED_AND_EXACT_SQL_TENANT_CAS_PASS');
          console.log('V437_REMAINING_TRUSTED_PROVIDER_AND_COMMIT_FENCE_GAP_NO_GO');
          NODE
      - name: Real disposable PostgreSQL 17 tenant and CAS isolation
        shell: bash
        run: |
          set -euo pipefail
          pg(){ docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17 psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55437 -U postgres "$@"; }
          pg -d postgres -c 'CREATE DATABASE car02_v437_disposable' >/dev/null
          pg -d car02_v437_disposable -f /workspace/car02-v437-disposable-pg17.sql | tee "$RUNNER_TEMP/v437-pg.log"
          for required in V437_DISPOSABLE_PG17_PRIVILEGE_DENY_PASS V437_DISPOSABLE_PG17_TENANT_AND_VERSION_CAS_PASS V437_DISPOSABLE_PG17_ROLLBACK_ISOLATION_PASS; do
            grep -Fq "$required" "$RUNNER_TEMP/v437-pg.log"
          done
          echo V437_REAL_DISPOSABLE_PG17_SQL_FENCE_PASS
          echo V437_FINAL_RELEASE_NO_GO_HOLD_TRUE
