name: CAR02 V4.85 One-Year Shop Closure Calendar Offline QA Only (NO_GO HOLD)
# No Supabase, Postgres, LINE, Worker, booking creation, owner claims, or deploy.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-booking-calendar-policy-r485.mjs'
      - 'car02-booking-calendar-policy-r485.test.mjs'
      - 'car02-v485-booking-calendar-contract.json'
      - 'CAR02_V485_ONE_YEAR_CLOSED_DAYS_OFFLINE.md'
      - '.github/workflows/car02-v485-one-year-closed-days-offline-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-calendar-policy:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout review-only source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin R52, V4.84 and old booking originals without secrets
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = 'refs/heads/car02-v434-review-only'
          for k in CAR02_DATABASE_URL DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!k:-}" || { echo V485_PROVIDER_CREDENTIAL_REFUSED >&2; exit 1; }
          done
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          test "$(git hash-object car02-evidence-provenance-gate-r484.mjs)" = '1bf29618aaf14a35f0adebda292078ac9b8baea8'
          test "$(git hash-object car02-v484-evidence-provenance-contract.json)" = '890aeaf1bfade280d6de789ab3836160a1030aaf'
          test "$(git hash-object car02-basic-staff-booking-browser-isolated.mjs)" = 'ea531ed3169c7c2936ec569cae9dedb4c3305bde'
          test "$(git hash-object car02-basic-booking-atomic-isolated.mjs)" = 'c348b4842143c52a5d77b016c9cdd87a88a4b2fb'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          for f in car02-booking-calendar-policy-r485.mjs car02-booking-calendar-policy-r485.test.mjs car02-v485-booking-calendar-contract.json CAR02_V485_ONE_YEAR_CLOSED_DAYS_OFFLINE.md; do test -s "$f"; done
          test -s .github/workflows/car02-v485-one-year-closed-days-offline-qa.yml
          echo V485_ORIGINAL_BOOKING_CODE_PINNED_RELEASE_LOCKED_NO_SECRETS_PASS
      - name: Run all repository tests and require at least 1244/1244 PASS
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-booking-calendar-policy-r485.mjs
          node --check car02-booking-calendar-policy-r485.test.mjs
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v485-node.log"
          tests=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v485-node.log")
          pass=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v485-node.log")
          test "$tests" -ge 1244
          test "$pass" = "$tests"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v485-node.log"
          echo V485_ALL_1244_PLUS_NODE_TESTS_PASS
      - name: Compare immutable isolated booking validators with new closure policy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {validateStaffBookingBrowserInput} from './car02-basic-staff-booking-browser-isolated.mjs';
          import {validateAtomicBookingInput} from './car02-basic-booking-atomic-isolated.mjs';
          import {CAR02_V485_RELEASE_LOCK,CAR02_V485_MAX_BOOKING_DAYS,
            CAR02_V485_SLOT_MINUTES,evaluateCar02BookingCalendarR485
          } from './car02-booking-calendar-policy-r485.mjs';
          const c=JSON.parse(readFileSync('car02-v485-booking-calendar-contract.json','utf8'));
          assert.equal(c.systemCode,'CAR02');assert.equal(c.version,'V4.85');
          assert.equal(c.branch,'car02-v434-review-only');
          assert.equal(c.baselineV484Run,39730053633);
          assert.equal(c.baselineV484Commit,'e1f6342134f723832f05f4560efad8ac96399e23');
          assert.equal(c.baselineV484NodeTests,1191);
          assert.equal(c.expectedNewNodeTests,53);
          assert.equal(c.expectedMinimumNodeTests,1244);
          assert.equal(CAR02_V485_RELEASE_LOCK,true);
          assert.equal(CAR02_V485_MAX_BOOKING_DAYS,60);
          assert.equal(CAR02_V485_SLOT_MINUTES,30);
          for(const key of ['providerCredentialsRequired','providerConnectionAllowed',
            'projectCreationAllowed','billingChangeAllowed','databaseMutationAllowed',
            'lineDispatchAllowed','bookingCreationAllowed','commercialReleaseAllowed',
            'nationalHolidayProviderChecked']) assert.equal(c[key],false,key);
          assert.equal(c.verifiedCommercialProviderProofs,0);
          assert.equal(c.requiredCommercialProviderProofs,7);
          assert.equal(c.releaseLock,true);
          assert.equal(c.commercialDecision,'NO_GO_HOLD');
          const now=new Date('2026-10-22T01:10:00Z');
          const customerId='11111111-1111-4111-8111-111111111111';
          const vehicleId='22222222-2222-4222-8222-222222222222';
          const oldInput={customerId,vehicleId,day:'2026-11-05',time:'10:30'};
          assert.equal(validateStaffBookingBrowserInput(oldInput,{now}).time,'10:30');
          assert.equal(validateAtomicBookingInput({...oldInput,requestKey:'syntheticR485longkey'},{now}).time,'10:30');
          const calendar={systemCode:'CAR02',environment:'isolated_qa',coverageThrough:'2027-10-22',
            closedDays:['2026-11-03'],occupiedSlots:['2026-11-04T10:30']};
          const candidate=evaluateCar02BookingCalendarR485({now,selection:{day:'2026-11-05',time:'10:30'},calendar});
          assert.equal(candidate.candidateAvailableInOfflineUi,true);
          assert.equal(candidate.bookingCreationAllowed,false);
          assert.equal(candidate.decision,'HOLD');
          const closure=evaluateCar02BookingCalendarR485({now,selection:{day:'2026-11-03',time:'10:30'},calendar});
          assert.equal(closure.reason,'owner_declared_closed_day');
          const invalid={...oldInput,time:'10:15'};
          assert.throws(()=>validateStaffBookingBrowserInput(invalid,{now}));
          assert.throws(()=>validateAtomicBookingInput({...invalid,requestKey:'syntheticR485longkey'},{now}));
          assert.equal(evaluateCar02BookingCalendarR485({now,selection:{day:'2026-11-05',time:'10:15'},calendar}).candidateAvailableInOfflineUi,false);
          console.log('V485_EXISTING_HALF_HOUR_BOOKING_VALIDATORS_UNCHANGED_PASS');
          console.log('V485_ONE_YEAR_SYNTHETIC_CLOSED_DAYS_PARITY_PASS');
          console.log('V485_FINAL_NO_BOOKING_NO_PROVIDER_NO_GO_HOLD_TRUE');
          NODE
