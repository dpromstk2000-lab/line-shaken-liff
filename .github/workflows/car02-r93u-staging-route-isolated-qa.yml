name: DPRO CAR02 R93U Isolated Upload Route Integration QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r93u-staging-route-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout read-only approved source baseline
        uses: actions/checkout@v5
      - name: Verify R52 hard lock and R93T open-gate inventory remain unchanged
        run: |
          set -euo pipefail
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          node car02-r93t-release-preflight.mjs > /tmp/car02-r93u-r93t-source-gates.json
          node --input-type=module -e 'import{readFileSync}from"node:fs";const a=JSON.parse(readFileSync("/tmp/car02-r93u-r93t-source-gates.json","utf8"));if(a.openCount!==6||a.unsafeCount!==0||a.integrationReady!==false||a.releaseDecision!=="NO_GO"||a.migrationDecision!=="HOLD")process.exit(1);console.log("R93U_R93T_SIX_LEGACY_GAPS_STILL_OPEN")'
          if grep -Fq 'car02-r93u-staging-upload-route-isolated' car02-private-photo-r47.mjs car02-unified-runtime-r50.mjs car02-edge-boundary-r51.mjs car02-edge-entry-r52.ts; then
            echo R93U_UNAUTHORIZED_LEGACY_WIRING; exit 1
          fi
      - name: Run R93U route capacity guard and isolated composition tests
        run: |
          set -euo pipefail
          node --check car02-r93u-staging-upload-route-isolated.mjs
          node --check test-car02-r93u-staging-route.mjs
          node --check test-car02-r93u-audit-contract.mjs
          node --check test-car02-r93u-r82-source-integration.mjs
          node --test test-car02-r93u-staging-route.mjs test-car02-r93u-audit-contract.mjs test-car02-r93u-r82-source-integration.mjs | tee /tmp/car02-r93u-run.txt
          grep -Fq R93U_R82_EXACT_ISOLATED_SOURCE_PASS /tmp/car02-r93u-run.txt
      - name: Recheck R93T pre-release route gap audit baseline
        run: |
          set -euo pipefail
          node --test test-car02-r93t-audit-unit.mjs test-car02-r93t-github-current-contract.mjs
          echo R93U_LEGACY_R93T_BASELINE_STILL_READONLY
      - name: Remove temporary QA reports
        if: always()
        run: rm -f /tmp/car02-r93u-run.txt /tmp/car02-r93u-r93t-source-gates.json
      - name: Verify workflow has no live deployment or secrets authority
        run: |
          node --input-type=module <<'R93U_GUARD'
          import {readFileSync} from 'node:fs';
          const y=readFileSync('.github/workflows/car02-r93u-staging-route-isolated-qa.yml','utf8');
          const last=['      - name: Verify workflow has no live','deployment or secrets authority'].join(' ');
          const at=y.indexOf(last);
          if(at<0||y.indexOf(last,at+last.length)!==-1||y.indexOf('\n      - name: ',at+last.length)!==-1)
            throw Error('R93U_GUARD_MUST_BE_LAST');
          const checked=y.slice(0,at);
          const uses=[...checked.matchAll(/^\s*uses:\s*(.+)$/gm)].map(x=>x[1].trim());
          const bad=[/\bwrangler\s+deploy\b/i,/\bsupabase\s+(?:db\s+push|functions\s+deploy)\b/i,
            /\bsecrets\s*[.:]/i,/\bGITHUB_TOKEN\b/i,/\bcontents\s*:\s*write\b/i,
            /(?:^|\n)\s*environment\s*:/i,/\b(?:curl|wget)\s+.*(?:supabase|workers\.dev)/i,
            /\b(?:npm\s+publish|git\s+push)\b/i];
          if(uses.length!==1||uses[0]!=='actions/checkout@v5'||
            !checked.includes('contents: read')||bad.some(re=>re.test(checked)))
            throw Error('R93U_WORKFLOW_NOT_READONLY');
          console.log('R93U_NO_PRODUCTION_MUTATION_PASS');
          R93U_GUARD
