          grep -q 'renderFollowupCandidates = function' ksh-next-8-followup-cockpit.js
          grep -q 'copyFollowupMessage = function' ksh-next-8-followup-cockpit.js
          grep -q 'existing_followup_action_history_preserved: true' .dpro/ksh-next/ksh-next-8-result.yml
          grep -q 'current_step: "STEP KSH-NEXT-8"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-9"' .dpro/ksh-next/plan.yml | grep -q 'status: "next"'

          node --check ksh-next-8-followup-cockpit.js

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter
          import re
          import subprocess
          import tempfile

          text = Path("dashboard.html").read_text(encoding="utf-8")

          class Parser(HTMLParser):
              pass

          parser = Parser()
          parser.feed(text)
          parser.close()

          ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
          duplicates = sorted(key for key, count in Counter(ids).items() if count > 1)
          if duplicates:
              raise SystemExit("dashboard.html duplicate IDs: " + ", ".join(duplicates))

          required_ids = [
              "nextFollowupCockpit",
              "nextFollowupOverdueCount",
              "nextFollowupTodayCount",
              "nextFollowupWeekCount",
              "nextFollowupMonthCount",
              "nextFollowupVisibleCount",
              "nextFollowupSort",
              "nft-urgent",
              "nft-overdue",
              "nft-today",
              "nft-week",
              "nft-month",
              "nft-no_date",
              "nft-all",
          ]
          for required_id in required_ids:
              if ids.count(required_id) != 1:
                  raise SystemExit(f"required ID count invalid: {required_id}")

          inline_scripts = []
          for attrs, body in re.findall(
              r"<script\b([^>]*)>(.*?)</script>",
              text,
              flags=re.I | re.S,
          ):
              if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                  continue
              if body.strip():
                  inline_scripts.append(body)

          for index, script in enumerate(inline_scripts, start=1):
              temp = Path(tempfile.gettempdir()) / f"ksh-next-8-dashboard-{index}.js"
              temp.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(temp)], check=True)

          print("dashboard HTML and inline JS OK")
          print("unique IDs:", len(ids))
          PY

      - name: Test followup timing logic
        shell: bash
        run: |
          set -euo pipefail

          node <<'JS'
          function timing(days) {
            if (days === null) return "no_date";
            if (days < 0) return "overdue";
            if (days === 0) return "today";
            if (days <= 7) return "week";
            if (days <= 30) return "month";
            return "later";
          }

          function matches(days, filter) {
            if (filter === "all") return true;
            if (filter === "no_date") return days === null;
            if (filter === "urgent") return days !== null && days <= 7;
            if (filter === "overdue") return days !== null && days < 0;
            if (filter === "today") return days === 0;
            if (filter === "week") return days !== null && days >= 0 && days <= 7;
            if (filter === "month") return days !== null && days >= 0 && days <= 30;
            return true;
          }

          const cases = [
            [-5, "overdue"],
            [0, "today"],
            [3, "week"],
            [20, "month"],
            [60, "later"],
            [null, "no_date"]
          ];

          for (const [days, expected] of cases) {
            if (timing(days) !== expected) {
              throw new Error(`timing failed: ${days} -> ${expected}`);
            }
          }

          if (!matches(-2, "urgent")) throw new Error("overdue must be urgent");
          if (!matches(7, "urgent")) throw new Error("7 days must be urgent");
          if (matches(8, "urgent")) throw new Error("8 days must not be urgent");
          if (!matches(null, "no_date")) throw new Error("no date filter failed");
          if (!matches(30, "month")) throw new Error("30 day filter failed");
          if (matches(31, "month")) throw new Error("31 day must not be month");

          const rows = [
            { name: "later", days: 30, handled: false },
            { name: "handled", days: -2, handled: true },
            { name: "urgent", days: -1, handled: false },
            { name: "today", days: 0, handled: false }
          ];

          rows.sort((a, b) => {
            if (a.handled !== b.handled) return a.handled ? 1 : -1;
            return a.days - b.days;
          });

          if (rows.map(row => row.name).join(",") !== "urgent,today,later,handled") {
            throw new Error("followup sort failed");
          }

          console.log("Maintenance followup timing and sorting logic OK");
          JS

          echo "KSH-NEXT-8 logic checks passed."

