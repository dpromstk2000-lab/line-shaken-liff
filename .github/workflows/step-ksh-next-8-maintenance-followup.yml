name: STEP KSH-NEXT-8 Maintenance Followup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/step-ksh-next-8-maintenance-followup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step-ksh-next-8-maintenance-followup
  cancel-in-progress: false

jobs:
  maintenance-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Save pre-change commit
        shell: bash
        run: |
          set -euo pipefail
          echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify KSH-NEXT-7 completion
        shell: bash
        run: |
          set -euo pipefail

          test -f dashboard.html
          test -f ksh-next-5-owner-estimate.js
          test -f ksh-next-7-member-history.js
          test -f .dpro/ksh-next/plan.yml
          test -f .dpro/ksh-next/ksh-next-7-result.yml

          grep -q 'STEP KSH-NEXT-5</title>' dashboard.html
          grep -q 'id="section-followups" class="section"' dashboard.html
          grep -q 'id="followupCandidatesTableBody"' dashboard.html
          grep -q 'id="ff-line_unlinked"' dashboard.html
          grep -q 'function loadFollowupCandidates()' dashboard.html
          grep -q 'function renderFollowupCandidates()' dashboard.html
          grep -q 'function markFollowupHandled(index, actionType)' dashboard.html
          grep -q 'function scheduleFollowupRecontact(index, days)' dashboard.html
          grep -q '/api/followup-candidates?' dashboard.html
          grep -q '/api/followup-actions' dashboard.html
          grep -q 'current_step: "STEP KSH-NEXT-7"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-8"' .dpro/ksh-next/plan.yml | grep -q 'status: "next"'

          if grep -q 'STEP KSH-NEXT-8: MAINTENANCE FOLLOWUP' dashboard.html; then
            echo "STEP KSH-NEXT-8 is already applied."
            exit 1
          fi

          if [ -f ksh-next-8-followup-cockpit.js ]; then
            echo "KSH-NEXT-8 JavaScript already exists. Stop to prevent duplicate application."
            exit 1
          fi

          echo "KSH-NEXT-7 completion verified."

      - name: Create safety tag
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_TAG="ksh-next-8-before-${{ github.run_id }}"
          git tag "$BACKUP_TAG" "$BEFORE_SHA"
          git push origin "$BACKUP_TAG"
          echo "BACKUP_TAG=$BACKUP_TAG" >> "$GITHUB_ENV"

      - name: Apply maintenance followup cockpit
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json

          dashboard_path = Path("dashboard.html")
          plan_path = Path(".dpro/ksh-next/plan.yml")
          result_path = Path(".dpro/ksh-next/ksh-next-8-result.yml")
          followup_js_path = Path("ksh-next-8-followup-cockpit.js")

          original = dashboard_path.read_text(encoding="utf-8")
          text = original

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return source.replace(old, new, 1)

          def quote(value):
              return json.dumps(str(value), ensure_ascii=False)

          def sha256_text(value):
              return hashlib.sha256(value.encode("utf-8")).hexdigest()

          text = replace_once(
              text,
              "<title>DPRO 車検・整備工場 LINE｜オーナー画面 STEP KSH-NEXT-5</title>",
              "<title>DPRO 車検・整備工場 LINE｜オーナー画面 STEP KSH-NEXT-8</title>",
              "dashboard title",
          )

          text = replace_once(
              text,
              '<p><span id="dashboardServiceName">DPRO車検・整備LINE管理システム</span> / STEP KSH-NEXT-5</p>',
              '<p><span id="dashboardServiceName">DPRO車検・整備LINE管理システム</span> / STEP KSH-NEXT-8</p>',
              "dashboard brand",
          )

          text = replace_once(
              text,
              'document.title = `${shopName}｜オーナーダッシュボード STEP KSH-PHONE-2`;',
              'document.title = `${shopName}｜オーナーダッシュボード STEP KSH-NEXT-8`;',
              "dynamic dashboard title",
          )

          css = r'''
              /* STEP KSH-NEXT-8: MAINTENANCE FOLLOWUP */
              .next-followup-board {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 12px;
                margin: 16px 0;
              }

              .next-followup-summary {
                border: 1px solid var(--line);
                border-left: 6px solid var(--blue);
                border-radius: 16px;
                padding: 14px;
                background: #ffffff;
                box-shadow: 0 5px 18px rgba(15, 23, 42, 0.05);
                cursor: pointer;
                text-align: left;
              }

              .next-followup-summary.overdue { border-left-color: var(--red); }
              .next-followup-summary.today { border-left-color: var(--orange); }
              .next-followup-summary.week { border-left-color: var(--amber); }
              .next-followup-summary.month { border-left-color: var(--blue); }

              .next-followup-summary span {
                display: block;
                color: var(--muted);
                font-size: 11px;
                font-weight: 900;
              }

              .next-followup-summary strong {
                display: block;
                margin-top: 5px;
                color: #0f172a;
                font-size: 27px;
                line-height: 1;
              }

              .next-followup-summary small {
                display: block;
                margin-top: 7px;
                color: var(--muted);
                font-size: 11px;
                line-height: 1.45;
              }

              .next-followup-toolbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 10px;
                margin: 14px 0;
                padding: 12px;
                border: 1px solid #dbeafe;
                border-radius: 16px;
                background: linear-gradient(135deg, #eff6ff, #ffffff);
              }

              .next-followup-timing {
                display: flex;
                flex-wrap: wrap;
                gap: 7px;
              }

              .next-followup-timing button {
                border: 1px solid #cbd5e1;
                background: #ffffff;
                color: #334155;
                border-radius: 999px;
                padding: 8px 11px;
                font-size: 11px;
                font-weight: 900;
                cursor: pointer;
              }

              .next-followup-timing button.active {
                border-color: #1e3a8a;
                background: #1e3a8a;
                color: #ffffff;
              }

              .next-followup-list {
                display: grid;
                gap: 12px;
              }

              .next-followup-card {
                border: 1px solid var(--line);
                border-left: 6px solid var(--blue);
                border-radius: 17px;
                background: #ffffff;
                padding: 15px;
                box-shadow: 0 5px 18px rgba(15, 23, 42, 0.05);
              }

              .next-followup-card.overdue { border-left-color: var(--red); }
              .next-followup-card.today { border-left-color: var(--orange); }
              .next-followup-card.week { border-left-color: var(--amber); }
              .next-followup-card.month { border-left-color: var(--blue); }
              .next-followup-card.later { border-left-color: var(--slate); }
              .next-followup-card.handled { opacity: 0.68; }

              .next-followup-head {
                display: grid;
                grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr) auto;
                gap: 12px;
                align-items: start;
              }

              .next-followup-name {
                font-size: 16px;
                font-weight: 950;
                color: #0f172a;
              }

              .next-followup-vehicle {
                margin-top: 4px;
                color: #475569;
                font-size: 12px;
                line-height: 1.55;
              }

              .next-followup-date {
                text-align: right;
              }

              .next-followup-date strong {
                display: block;
                font-size: 14px;
                color: #0f172a;
              }

              .next-followup-date span {
                display: inline-flex;
                margin-top: 5px;
                border-radius: 999px;
                padding: 5px 9px;
                font-size: 11px;
                font-weight: 950;
                background: #eff6ff;
                color: #1e40af;
              }

              .next-followup-date span.overdue {
                background: #fee2e2;
                color: #b91c1c;
              }

              .next-followup-date span.today {
                background: #ffedd5;
                color: #c2410c;
              }

              .next-followup-reason {
                margin-top: 11px;
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
                gap: 10px;
              }

              .next-followup-reason-box {
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                padding: 10px 11px;
                background: #f8fafc;
                color: #334155;
                font-size: 12px;
                line-height: 1.6;
              }

              .next-followup-reason-box strong {
                display: block;
                color: #0f172a;
                margin-bottom: 4px;
              }

              .next-followup-primary-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 11px;
              }

              .next-followup-details {
                margin-top: 10px;
                border: 1px solid #e2e8f0;
                border-radius: 13px;
                overflow: hidden;
                background: #f8fafc;
              }

              .next-followup-details > summary {
                list-style: none;
                cursor: pointer;
                display: flex;
                justify-content: space-between;
                gap: 10px;
                align-items: center;
                padding: 10px 12px;
                color: #334155;
                font-size: 12px;
                font-weight: 900;
              }

              .next-followup-details > summary::-webkit-details-marker {
                display: none;
              }

              .next-followup-details > summary::after {
                content: "＋";
                color: #1e3a8a;
                font-size: 17px;
              }

              .next-followup-details[open] > summary::after {
                content: "－";
              }

              .next-followup-details-body {
                padding: 0 11px 11px;
              }

              .next-followup-message {
                width: 100%;
                min-height: 116px;
                border: 1px solid #bfdbfe;
                border-radius: 12px;
                background: #ffffff;
                padding: 10px;
                font-size: 12px;
                line-height: 1.65;
                resize: vertical;
              }

              .next-followup-record-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 7px;
                margin-top: 9px;
                padding-top: 9px;
                border-top: 1px dashed #cbd5e1;
              }

              .next-followup-empty {
                padding: 24px 15px;
                border: 1px dashed #cbd5e1;
                border-radius: 15px;
                background: #f8fafc;
                color: #64748b;
                text-align: center;
                font-size: 13px;
                font-weight: 800;
              }

              .next-followup-visible-count {
                color: #1e3a8a;
                font-size: 12px;
                font-weight: 950;
              }

              .next-followup-legacy-table {
                display: none;
              }

              @media (max-width: 980px) {
                .next-followup-board {
                  grid-template-columns: repeat(2, minmax(0, 1fr));
                }

                .next-followup-head,
                .next-followup-reason {
                  grid-template-columns: 1fr;
                }

                .next-followup-date {
                  text-align: left;
                }
              }

              @media (max-width: 620px) {
                .next-followup-board {
                  grid-template-columns: 1fr 1fr;
                }

                .next-followup-toolbar {
                  align-items: stretch;
                }

                .next-followup-toolbar select {
                  width: 100%;
                }

                .next-followup-primary-actions .btn {
                  flex: 1 1 calc(50% - 8px);
                }
              }
          '''
          text = replace_once(
              text,
              "  </style>",
              css + "\n  </style>",
              "followup cockpit CSS",
          )

          old_filter_anchor = '''              <button id="ff-line_unlinked" class="followup-filter-btn" onclick="setFollowupFilter('line_unlinked')">LINE未連携</button>
                      </div>

                      <div class="table-wrap">'''

          new_filter_anchor = '''              <button id="ff-line_unlinked" class="followup-filter-btn" onclick="setFollowupFilter('line_unlinked')">LINE未連携</button>
                      </div>

                      <div class="next-followup-board" aria-label="次回フォロー件数">
                        <button class="next-followup-summary overdue" type="button" onclick="setNextFollowupTiming('overdue')">
                          <span>期限超過</span>
                          <strong id="nextFollowupOverdueCount">-</strong>
                          <small>目安日を過ぎています</small>
                        </button>
                        <button class="next-followup-summary today" type="button" onclick="setNextFollowupTiming('today')">
                          <span>本日</span>
                          <strong id="nextFollowupTodayCount">-</strong>
                          <small>今日連絡する候補</small>
                        </button>
                        <button class="next-followup-summary week" type="button" onclick="setNextFollowupTiming('week')">
                          <span>7日以内</span>
                          <strong id="nextFollowupWeekCount">-</strong>
                          <small>今週のフォロー候補</small>
                        </button>
                        <button class="next-followup-summary month" type="button" onclick="setNextFollowupTiming('month')">
                          <span>30日以内</span>
                          <strong id="nextFollowupMonthCount">-</strong>
                          <small>早めに案内する候補</small>
                        </button>
                      </div>

                      <div class="next-followup-toolbar">
                        <div class="next-followup-timing" aria-label="時期で絞り込み">
                          <button id="nft-urgent" class="active" type="button" onclick="setNextFollowupTiming('urgent')">今すぐ・7日以内</button>
                          <button id="nft-overdue" type="button" onclick="setNextFollowupTiming('overdue')">期限超過</button>
                          <button id="nft-today" type="button" onclick="setNextFollowupTiming('today')">本日</button>
                          <button id="nft-week" type="button" onclick="setNextFollowupTiming('week')">7日以内</button>
                          <button id="nft-month" type="button" onclick="setNextFollowupTiming('month')">30日以内</button>
                          <button id="nft-no_date" type="button" onclick="setNextFollowupTiming('no_date')">日付未設定</button>
                          <button id="nft-all" type="button" onclick="setNextFollowupTiming('all')">すべて</button>
                        </div>
                        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                          <span id="nextFollowupVisibleCount" class="next-followup-visible-count">-</span>
                          <select id="nextFollowupSort" onchange="setNextFollowupSort(this.value)" aria-label="フォロー候補の並び順">
                            <option value="due" selected>目安日が近い順</option>
                            <option value="priority">優先度順</option>
                            <option value="type">種別順</option>
                            <option value="name">お名前順</option>
                          </select>
                        </div>
                      </div>

                      <div id="nextFollowupCockpit" class="next-followup-list"></div>

                      <div class="table-wrap next-followup-legacy-table">'''

          text = replace_once(
              text,
              old_filter_anchor,
              new_filter_anchor,
              "followup section cockpit",
          )

          text = replace_once(
              text,
              '  <script src="ksh-next-5-owner-estimate.js?v=20260723"></script>\n</body>',
              '  <script src="ksh-next-5-owner-estimate.js?v=20260723"></script>\n'
              '  <script src="ksh-next-8-followup-cockpit.js?v=20260723"></script>\n'
              '</body>',
              "followup cockpit script",
          )

          followup_js = r'''(() => {
            "use strict";

            let nextFollowupTimingFilter = "urgent";
            let nextFollowupSort = "due";

            const originalRenderFollowupSummary = renderFollowupSummary;

            function candidateDays(row) {
              if (row?.days_until !== null && row?.days_until !== undefined && row?.days_until !== "") {
                const n = Number(row.days_until);
                return Number.isFinite(n) ? n : null;
              }

              const due = normalizeDateInput(row?.due_date || "");
              if (!due) return null;

              const today = new Date(`${dateYmd(new Date())}T00:00:00`);
              const target = new Date(`${due}T00:00:00`);
              const days = Math.round((target.getTime() - today.getTime()) / 86400000);
              return Number.isFinite(days) ? days : null;
            }

            function candidateTiming(row) {
              const days = candidateDays(row);
              if (days === null) return "no_date";
              if (days < 0) return "overdue";
              if (days === 0) return "today";
              if (days <= 7) return "week";
              if (days <= 30) return "month";
              return "later";
            }

            function timingMatches(row, filter) {
              const days = candidateDays(row);

              if (filter === "all") return true;
              if (filter === "no_date") return days === null;
              if (filter === "urgent") return days !== null && days <= 7;
              if (filter === "overdue") return days !== null && days < 0;
              if (filter === "today") return days === 0;
              if (filter === "week") return days !== null && days >= 0 && days <= 7;
              if (filter === "month") return days !== null && days >= 0 && days <= 30;
              return true;
            }

            function priorityWeight(row) {
              const priority = String(row?.priority || "").toLowerCase();
              if (["urgent", "high", "緊急", "高"].includes(priority)) return 0;
              if (["medium", "normal", "中", "通常"].includes(priority)) return 1;
              return 2;
            }

            function typeWeight(row) {
              return {
                shaken: 0,
                estimate: 1,
                oil: 2,
                proposal: 3,
                line_unlinked: 4
              }[row?.type] ?? 9;
            }

            function sortedCandidates(rows) {
              return rows.slice().sort((a, b) => {
                if (Boolean(a?.is_handled) !== Boolean(b?.is_handled)) {
                  return a?.is_handled ? 1 : -1;
                }

                if (nextFollowupSort === "priority") {
                  const byPriority = priorityWeight(a) - priorityWeight(b);
                  if (byPriority) return byPriority;
                }

                if (nextFollowupSort === "type") {
                  const byType = typeWeight(a) - typeWeight(b);
                  if (byType) return byType;
                }

                if (nextFollowupSort === "name") {
                  return String(a?.customer_name || "").localeCompare(String(b?.customer_name || ""), "ja");
                }

                const aDays = candidateDays(a);
                const bDays = candidateDays(b);
                if (aDays === null && bDays !== null) return 1;
                if (aDays !== null && bDays === null) return -1;
                if (aDays !== bDays) return Number(aDays || 0) - Number(bDays || 0);

                const byPriority = priorityWeight(a) - priorityWeight(b);
                if (byPriority) return byPriority;
                return typeWeight(a) - typeWeight(b);
              });
            }

            function fallbackMessage(row) {
              const name = row?.customer_name || "お客様";
              const shop = getShopName();
              const vehicle = buildFollowupVehicleText(row);
              const due = row?.due_date ? formatDate(row.due_date) : "";
              const proposal = row?.proposal_memo || row?.reason || "";

              if (row?.type === "shaken") {
                return `${name}様
          いつも${shop}をご利用いただきありがとうございます。
          ${vehicle}の車検時期が${due ? `${due}頃に` : ""}近づいております。
          ご希望の日程がございましたら、早めのご相談がおすすめです。`;
              }

              if (row?.type === "oil") {
                return `${name}様
          ${shop}です。
          ${vehicle}のオイル交換時期が近づいております。
          お車の状態確認もあわせて、お気軽にご相談ください。`;
              }

              if (row?.type === "estimate") {
                return `${name}様
          ${shop}です。
          先日ご案内したお見積内容について、その後いかがでしょうか。
          ご不明点や変更希望がございましたら、お気軽にご返信ください。`;
              }

              if (row?.type === "proposal") {
                return `${name}様
          ${shop}です。
          ${vehicle}について、${proposal || "次回点検・メンテナンス"}のご案内です。
          ご都合のよい時期がございましたら、お気軽にご相談ください。`;
              }

              return `${name}様
          ${shop}です。
          お車の点検・整備について、LINEからいつでもご相談いただけます。
          気になることがございましたら、お気軽にご連絡ください。`;
            }

            function ensureCandidateMessage(row) {
              if (!row) return "";
              const current = String(row.edited_message_text || row.message_text || "").trim();
              if (current) return current;
              const fallback = fallbackMessage(row);
              row.edited_message_text = fallback;
              return fallback;
            }

            function timingLabel(row) {
              const days = candidateDays(row);
              if (days === null) return "日付未設定";
              if (days < 0) return `${Math.abs(days)}日超過`;
              if (days === 0) return "本日";
              return `あと${days}日`;
            }

            function timingClass(row) {
              return candidateTiming(row);
            }

            function updateTimingButtons() {
              document.querySelectorAll(".next-followup-timing button").forEach(button => {
                button.classList.remove("active");
              });
              document.getElementById(`nft-${nextFollowupTimingFilter}`)?.classList.add("active");
            }

            function updateSummaryCounts() {
              const rows = Array.isArray(followupCandidatesCache) ? followupCandidatesCache : [];
              const activeRows = rows.filter(row => !row?.is_handled);

              const overdue = activeRows.filter(row => {
                const days = candidateDays(row);
                return days !== null && days < 0;
              }).length;
              const today = activeRows.filter(row => candidateDays(row) === 0).length;
              const week = activeRows.filter(row => {
                const days = candidateDays(row);
                return days !== null && days >= 0 && days <= 7;
              }).length;
              const month = activeRows.filter(row => {
                const days = candidateDays(row);
                return days !== null && days >= 0 && days <= 30;
              }).length;

              setText("nextFollowupOverdueCount", `${overdue}件`);
              setText("nextFollowupTodayCount", `${today}件`);
              setText("nextFollowupWeekCount", `${week}件`);
              setText("nextFollowupMonthCount", `${month}件`);
            }

            renderFollowupSummary = function(summary, generatedAt) {
              originalRenderFollowupSummary(summary, generatedAt);
              updateSummaryCounts();
            };

            setFollowupFilter = function(filter) {
              currentFollowupFilter = filter;

              if (["estimate", "line_unlinked"].includes(filter)) {
                nextFollowupTimingFilter = "all";
              }

              updateFollowupFilterButtons();
              updateTimingButtons();
              renderFollowupCandidates();
            };

            window.setNextFollowupTiming = function(filter) {
              nextFollowupTimingFilter = filter || "all";
              updateTimingButtons();
              renderFollowupCandidates();
            };

            window.setNextFollowupSort = function(value) {
              nextFollowupSort = value || "due";
              const select = document.getElementById("nextFollowupSort");
              if (select && select.value !== nextFollowupSort) select.value = nextFollowupSort;
              renderFollowupCandidates();
            };

            function primaryContactButton(row, index) {
              if (row?.line_user_id) {
                return `<button class="btn btn-dark" onclick="openLineManager()">LINE公式チャット</button>`;
              }
              return `<button class="btn btn-slate" onclick="copyFollowupPhone(${index})">電話番号コピー</button>`;
            }

            function reservationButton(row, index) {
              if (!row?.customer_id) return "";
