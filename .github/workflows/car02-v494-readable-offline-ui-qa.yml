name: CAR02 V4.94 Readable Offline UI QA (NO_GO HOLD)
'on':
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-standalone-preview-builder-r494.mjs'
      - 'car02-readable-ui-r494.test.mjs'
      - 'car02-v494-readable-ui-contract.json'
      - 'CAR02_V494_READABLE_STANDALONE_OFFLINE_PREVIEW.html'
      - 'CAR02_V494_READABLE_UI_QA.md'
      - '.github/workflows/car02-v494-readable-offline-ui-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readable-offline-preview:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout review-only branch without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin accepted V4.93 baseline and R52 immutable release lock
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = 'refs/heads/car02-v434-review-only'
          for k in CAR02_DATABASE_URL DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!k:-}" || { echo V494_CREDENTIAL_REFUSED >&2; exit 1; }
          done
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          test "$(git hash-object CAR02_V493_RESILIENT_STANDALONE_OFFLINE_PREVIEW.html)" = '02e21d4f7a50c75ed664cdb29b4b9e010c5e007b'
          test "$(sha256sum CAR02_V493_RESILIENT_STANDALONE_OFFLINE_PREVIEW.html | awk '{print $1}')" = 'e663a41545136a08dbb7f0811885a9c23c7153cdef6f433615e7460398b7c9a3'
          test "$(git hash-object car02-booking-calendar-resilient-r493.mjs)" = '7d6ccdbf2db6d74c16c168c036065ab3376ca547'
          for f in car02-standalone-preview-builder-r494.mjs car02-readable-ui-r494.test.mjs car02-v494-readable-ui-contract.json CAR02_V494_READABLE_STANDALONE_OFFLINE_PREVIEW.html CAR02_V494_READABLE_UI_QA.md; do test -s "$f"; done
          echo V494_V493_ACCEPTED_R52_LOCK_AND_SCRIPT_IMMUTABLE_PASS
      - name: Run 18 new readable UI isolation tests
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-standalone-preview-builder-r494.mjs
          node --check car02-readable-ui-r494.test.mjs
          node --test-reporter=tap car02-readable-ui-r494.test.mjs | tee "$RUNNER_TEMP/v494-new-tests.log"
          total=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v494-new-tests.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v494-new-tests.log")
          test "$total" = 18
          test "$passed" = "$total"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v494-new-tests.log"
          echo V494_READABLE_UI_18_PASS
      - name: Regenerate exact presentation-only HTML
        shell: bash
        run: |
          set -euo pipefail
          node car02-standalone-preview-builder-r494.mjs
          test "$(sha256sum CAR02_V494_READABLE_STANDALONE_OFFLINE_PREVIEW.html | awk '{print $1}')" = 'ac2d04c351892d218894926ea3fd2e45fef399e996b177778f94baadf5be663e'
          git diff --exit-code -- CAR02_V494_READABLE_STANDALONE_OFFLINE_PREVIEW.html
          echo V494_DETERMINISTIC_PRESENTATION_AND_CSP_PASS
      - name: Verify release lock and CSS-only contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {buildCar02StandaloneHtmlR494} from './car02-standalone-preview-builder-r494.mjs';
          const c=JSON.parse(readFileSync('car02-v494-readable-ui-contract.json','utf8'));
          assert.equal(c.systemCode,'CAR02');assert.equal(c.version,'V4.94');
          assert.equal(c.baseRunId,39885099015);assert.equal(c.baseNodeTests,1503);
          assert.equal(c.newNodeTests,18);assert.equal(c.expectedMinimumNodeTests,1521);
          assert.equal(c.changeKind,'offline_presentation_only');
          assert.equal(c.baseV493JavaScriptUnmodified,true);
          assert.equal(c.baseV493CspUnmodified,true);
          assert.equal(c.realBrowserVisualAcceptanceVerified,false);
          for(const k of ['bookingCreationAllowed','productionDeployAllowed','databaseMutationAllowed',
            'lineDispatchAllowed','providerConnectionAllowed','billingChangeAllowed'])assert.equal(c[k],false,k);
          assert.equal(c.releaseLock,true);assert.equal(c.commercialDecision,'NO_GO_HOLD');
          assert.equal(c.providerProofsVerified,0);assert.equal(c.requiredProviderProofs,7);
          const html=buildCar02StandaloneHtmlR494();
          assert.ok(html.includes('READABLE OFFLINE DEMO'));
          assert.ok(html.includes("connect-src 'none'"));
          console.log('V494_PRESENTATION_NEVER_CREATES_BOOKING_PASS');
          NODE
      - name: Run full repository regression retaining all accepted coverage
        shell: bash
        run: |
          set -euo pipefail
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v494-full-tests.log"
          total=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v494-full-tests.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v494-full-tests.log")
          test "$total" -ge 1521
          test "$passed" = "$total"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v494-full-tests.log"
          echo V494_FULL_REGRESSION_MINIMUM_1521_PASS
