name: CAR02 V4.28 R44-R46 Staff Auth Version Bridge (NO_GO HOLD)
# QA-only candidate source copies. No secrets, live DB, deploy, real provider access or LINE.
on:
  push:
    paths:
      - '.github/workflows/car02-v428-identity-bridge-qa.yml'
      - 'car02-identity-r44.mjs'
      - 'car02-auth-providers-r46.mjs'
      - 'car02-pg-adapter.mjs'
      - 'car02-core.mjs'
      - 'car02-edge-entry-r52.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staff-contract:
    name: V4.28 Isolated R44-R46 to R43 candidate (NO_GO HOLD)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify signed staff version bridge candidate in isolated copies
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CAR02_DATABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${LINE_CHANNEL_ACCESS_TOKEN:-}"
          test -s car02-identity-r44.mjs
          test -s car02-auth-providers-r46.mjs
          test -s car02-pg-adapter.mjs
          test -s car02-core.mjs
          test -s car02-edge-entry-r52.ts
          cat > "$RUNNER_TEMP/v428-qa.mjs" <<'V428JS'
          // DPRO CAR02 V4.28: isolate and test a server-trusted R44/R46 auth-version bridge.
          // All identity responses and database queries below are simulated. NO_GO / HOLD.
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,mkdtempSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {tmpdir} from 'node:os';
          import {join,resolve} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const root=process.env.GITHUB_WORKSPACE||process.cwd();
          const expected={
           'car02-pg-adapter.mjs':'cb4c83ddac1205c5855aacbb803fcb3492d46b6101f496140996daf6231d2ed4',
           'car02-identity-r44.mjs':'83baa424c7b5142ec925729e3ceb4c57f07cf428512fe373d1e0595146a49304',
           'car02-auth-providers-r46.mjs':'f4d3c50801d377fee94e97f310e5c6ff3b6b51404d7f22953615e61a02dacfb9'
          };
          const read=p=>readFileSync(resolve(root,p),'utf8');
          const original={};for(const [f,d] of Object.entries(expected)){
           original[f]=read(f);assert.equal(createHash('sha256').update(original[f]).digest('hex'),d,'V428_UPSTREAM_DRIFT_'+f);
          }
          assert.match(read('car02-edge-entry-r52.ts'),/\bconst\s+CAR02_RELEASE_LOCK\s*=\s*true\s*;/);
          const patch=(src,a,b,id)=>{assert.equal(src.split(a).length,2,'V428_ANCHOR_DRIFT_'+id);return src.replace(a,b)};
          let r46=original['car02-auth-providers-r46.mjs'];
          r46=patch(r46,'    return {verified:true,sub:user.id,exp:claims.exp};',
           `    if(!Number.isSafeInteger(claims.iat)||claims.iat<=0||claims.iat>nowSeconds()||claims.iat>=claims.exp)fail();
              return {verified:true,sub:user.id,exp:claims.exp,issuedAt:claims.iat};`,'jwt_issued_at');
          r46=patch(r46,'    return {active:true,userSub,shopCode,role:result.role};',
           `    if(!Number.isSafeInteger(result.trustedAuthVersion)||result.trustedAuthVersion<1||
                 !Number.isSafeInteger(result.credentialNotBeforeEpochMs)||result.credentialNotBeforeEpochMs<0)fail();
              return {active:true,userSub,shopCode,role:result.role,
                trustedAuthVersion:result.trustedAuthVersion,credentialNotBeforeEpochMs:result.credentialNotBeforeEpochMs};`,'resolve_staff');
          r46=patch(r46,'SELECT shop_code,user_sub,staff_role,active\n      FROM public.ksh_car02_staff_access',
           'SELECT shop_code,user_sub,staff_role,active,auth_version,credential_not_before\n      FROM public.ksh_car02_staff_access','membership_columns');
          r46=patch(r46,'    return {active:true,userSub:x.user_sub,shopCode:x.shop_code,role:x.staff_role};',
           `    const version=Number(x.auth_version);
              const notBefore=x.credential_not_before instanceof Date ? x.credential_not_before.getTime() : Date.parse(x.credential_not_before);
              if(!Number.isSafeInteger(version)||version<1||!Number.isSafeInteger(notBefore)||notBefore<0)fail();
              return {active:true,userSub:x.user_sub,shopCode:x.shop_code,role:x.staff_role,
                trustedAuthVersion:version,credentialNotBeforeEpochMs:notBefore};`,'membership_version');
          let r44=original['car02-identity-r44.mjs'];
          r44=patch(r44,'      return Object.freeze({verified:true,role:staff.role,subject:`staff:${jwt.sub}`,shopCode});',
           `      if(!Number.isSafeInteger(jwt.issuedAt)||jwt.issuedAt<=0||jwt.issuedAt>nowSeconds()||
                  !Number.isSafeInteger(staff.trustedAuthVersion)||staff.trustedAuthVersion<1||
                  !Number.isSafeInteger(staff.credentialNotBeforeEpochMs)||
                  jwt.issuedAt*1000<staff.credentialNotBeforeEpochMs)bad();
                return Object.freeze({verified:true,role:staff.role,subject:'staff:'+jwt.sub,shopCode,
                  staffUserSub:jwt.sub,trustedAuthVersion:staff.trustedAuthVersion});`,'trusted_actor');
          let r43=original['car02-pg-adapter.mjs'];
          const anchor="        await c.query('BEGIN');open=true;\n";
          const guard=`        // V4.28 QA ONLY: enforce trusted staff UUID/version BEFORE any old replay.
                  if(actor?.verified!==true||actor.shopCode!==shop||!['staff','owner'].includes(actor.role))
                    throw E('CAR02_TX_UNTRUSTED_ACTOR',403);
                  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(actor.staffUserSub||'')||
                     actor.subject!=='staff:'+actor.staffUserSub||
                     !Number.isSafeInteger(actor.trustedAuthVersion)||actor.trustedAuthVersion<1)
                    throw E('CAR02_TX_STAFF_CONTRACT_INVALID',403);
                  const member=await one(c,\`SELECT active,staff_role,auth_version FROM public.ksh_car02_staff_access
                    WHERE shop_code=$1 AND user_sub=$2 FOR UPDATE\`,[shop,actor.staffUserSub]);
                  if(!member||member.active!==true)throw E('CAR02_TX_REVOKED',403);
                  if(member.staff_role!==actor.role)throw E('CAR02_TX_ROLE_CHANGED',403);
                  if(Number(member.auth_version)!==actor.trustedAuthVersion)throw E('CAR02_TX_VERSION_STALE',403);
          `;
          r43=patch(r43,anchor,anchor+guard,'transaction_guard');
          assert.ok(r43.indexOf('CAR02_TX_REVOKED')<r43.indexOf('pg_advisory_xact_lock'));
          const dir=mkdtempSync(join(process.env.RUNNER_TEMP||tmpdir(),'v428-isolated-'));
          for(const [file,src] of Object.entries({
           'car02-identity-r44.mjs':r44,'car02-auth-providers-r46.mjs':r46,
           'car02-pg-adapter.mjs':r43,'car02-core.mjs':read('car02-core.mjs')
          }))writeFileSync(join(dir,file),src);
          const imp=async f=>import(pathToFileURL(join(dir,f)).href);
          const [{createCar02Authenticator},{createCar02AuthProvidersR46},{createCar02PgAdapter}]=await Promise.all([
           imp('car02-identity-r44.mjs'),imp('car02-auth-providers-r46.mjs'),imp('car02-pg-adapter.mjs')]);
          const shop='v428-qa-shop',sub='00000000-0000-0000-0000-000000004428';
          let now=1800000000,authCalls=0,lookups=0,creates=0;
          const membership={shop_code:shop,user_sub:sub,staff_role:'staff',active:true,auth_version:1,
           credential_not_before:new Date((now-120)*1000)};
          const base64=obj=>Buffer.from(JSON.stringify(obj)).toString('base64url');
          const token=(iat=now-5,claims={})=>[base64({alg:'HS256',typ:'JWT'}),base64({
           sub,iss:'https://v428-project.supabase.co/auth/v1',aud:'authenticated',role:'authenticated',
           exp:now+1200,iat,...claims}),'c2lnbmF0dXJl'].join('.');
          // The /user provider response is stubbed: NOT a cryptographic JWT verifier!
          const fetchImpl=async(url,options)=>{
           authCalls++;
           assert.equal(url,'https://v428-project.supabase.co/auth/v1/user');
           const jwt=options.headers.Authorization.split(' ')[1];
           const claims=JSON.parse(Buffer.from(jwt.split('.')[1],'base64url').toString('utf8'));
           return new Response(JSON.stringify({id:claims.sub,aud:'authenticated',is_anonymous:false}),{status:200});
          };
          const operations=new Map();
          const pool={
           async query(sql,params){
            lookups++;assert.match(sql,/FROM public\.ksh_car02_staff_access/);
            assert.match(sql,/credential_not_before/);
            return {rows:params[0]===shop&&params[1]===sub?[{...membership}]:[]};
           },
           async connect(){let tx=false;return {
            async query(sql,params=[]){
             if(sql==='BEGIN'){tx=true;return {rows:[]};}
             if(sql==='COMMIT'){assert(tx);tx=false;return {rows:[]};}
             if(sql==='ROLLBACK'){tx=false;return {rows:[]};}
             if(sql.includes('FROM public.ksh_car02_staff_access')){
              assert.match(sql,/FOR UPDATE/);return {rows:params[0]===shop&&params[1]===sub?[{...membership}]:[]};
             }
             if(sql.includes('pg_advisory_xact_lock'))return {rows:[{}]};
             if(sql.includes('FROM public.ksh_car02_operations')){
              const r=operations.get(params.join('|'));return {rows:r?[r]:[]};
             }
             if(sql.includes('INSERT INTO public.ksh_car02_operations')){
              assert(tx);operations.set(params.slice(0,3).join('|'),{
               request_digest:params[3],response_snapshot:params[4],completed_at:'now'});
              return {rows:[],rowCount:1};
             }
             throw Error('V428_UNEXPECTED_R43_SQL:'+sql.slice(0,60));
            },release(){}}
           }};
          const providers=createCar02AuthProvidersR46({lineChannelId:'v428-line-client',
           supabaseUrl:'https://v428-project.supabase.co',supabaseAnonKey:'v428-public-key',
           pool,fetchImpl,nowSeconds:()=>now});
          const authenticate=createCar02Authenticator({shopCode:shop,lineClientId:'v428-line-client',
           ...providers,nowSeconds:()=>now});
          const request=jwt=>new Request('https://qa.example/',{headers:{Authorization:'Bearer '+jwt}});
          const adapter=createCar02PgAdapter(pool);
          const args=(actor,key='v428-receipt')=>({actor,shop,key,intent:{op:'unit'}});
          const denied=async(fn,code)=>assert.rejects(Promise.resolve().then(fn),
           e=>code?e.code===code:true);
          const oldToken=token();
          const actor=await authenticate(request(oldToken));
          assert.equal(actor.subject,'staff:'+sub);
          assert.equal(actor.staffUserSub,sub);
          assert.equal(actor.trustedAuthVersion,1);
          assert.equal(actor.role,'staff');
          assert.equal(Object.isFrozen(actor),true);
          console.log('V428_R44_R46_VERSION_CONTRACT_PASS');
          const first=await adapter.transaction(args(actor),()=>{creates++;return {id:'qa-receipt-v428'}});
          assert.equal(first.id,'qa-receipt-v428');
          assert.equal((await adapter.transaction(args(actor),()=>{throw Error('duplicate must not execute')})).id,first.id);
          assert.equal(creates,1);assert.equal(operations.size,1);
          console.log('V428_R43_PREFIXED_SUBJECT_REPLAY_PASS');
          await denied(()=>authenticate(request(token(now+30))));
          await denied(()=>authenticate(request(token(now-20,{iat:undefined}))));
          await denied(()=>authenticate(request(token(now-20,{aud:'wrong'}))));
          await denied(()=>authenticate(request(token(now-20,{iss:'https://other.example/auth/v1'}))));
          await denied(()=>adapter.transaction(args({...actor,staffUserSub:'00000000-0000-0000-0000-000000009999'},'v428-forged'),()=>{creates++;}),'CAR02_TX_STAFF_CONTRACT_INVALID');
          await denied(()=>adapter.transaction(args({...actor,shopCode:'foreign-shop'},'v428-tenant'),()=>{creates++;}),'CAR02_TX_UNTRUSTED_ACTOR');
          await denied(()=>adapter.transaction(args({...actor,role:'owner'},'v428-owner'),()=>{creates++;}),'CAR02_TX_ROLE_CHANGED');
          assert.equal(creates,1);
          console.log('V428_BAD_TIME_ISSUER_TENANT_ACTOR_DENIED_PASS');
          membership.active=false;membership.auth_version=2;
          await denied(()=>authenticate(request(oldToken)));
          await denied(()=>adapter.transaction(args(actor),()=>{creates++;}),'CAR02_TX_REVOKED');
          await denied(()=>adapter.transaction(args(actor,'v428-new'),()=>{creates++;}),'CAR02_TX_REVOKED');
          assert.equal(creates,1);
          membership.active=true;membership.auth_version=3;
          membership.credential_not_before=new Date((now+1)*1000);now+=3;
          await denied(()=>authenticate(request(oldToken)));
          await denied(()=>adapter.transaction(args(actor),()=>{creates++;}),'CAR02_TX_VERSION_STALE');
          console.log('V428_REVOKE_REACTIVATE_OLD_TOKEN_DENIED_PASS');
          const fresh=await authenticate(request(token(now)));
          assert.equal(fresh.trustedAuthVersion,3);
          assert.equal((await adapter.transaction(args(fresh),()=>{throw Error('new token should replay old receipt');})).id,first.id);
          assert.equal(creates,1);assert.equal(operations.size,1);
          assert(authCalls>5);assert(lookups>=3);
          console.log('V428_NEW_TOKEN_VERSION_REPLAY_PASS');
          console.log('V428_FINAL_NO_GO_HOLD: MOCK Auth /user, mock PG, review-only candidate source copies. Production R43/R44/R46, real JWT, migrations and Worker untouched.');
          V428JS
          node --check "$RUNNER_TEMP/v428-qa.mjs"
          node "$RUNNER_TEMP/v428-qa.mjs" | tee "$RUNNER_TEMP/v428-test.log"
          grep -Fq "V428_R44_R46_VERSION_CONTRACT_PASS" "$RUNNER_TEMP/v428-test.log"
          grep -Fq "V428_R43_PREFIXED_SUBJECT_REPLAY_PASS" "$RUNNER_TEMP/v428-test.log"
          grep -Fq "V428_BAD_TIME_ISSUER_TENANT_ACTOR_DENIED_PASS" "$RUNNER_TEMP/v428-test.log"
          grep -Fq "V428_REVOKE_REACTIVATE_OLD_TOKEN_DENIED_PASS" "$RUNNER_TEMP/v428-test.log"
          grep -Fq "V428_NEW_TOKEN_VERSION_REPLAY_PASS" "$RUNNER_TEMP/v428-test.log"
          grep -Fq "V428_FINAL_NO_GO_HOLD" "$RUNNER_TEMP/v428-test.log"
