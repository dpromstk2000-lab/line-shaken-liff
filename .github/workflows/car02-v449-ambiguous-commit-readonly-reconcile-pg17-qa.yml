name: CAR02 V4.49 Read-Only Ambiguous COMMIT Reconciliation PG17 (NO_GO HOLD)
# REVIEW ONLY. Disposable synthetic database. No production/LINE/Supabase access.
# Inspected state is NOT proof of original COMMIT ACK nor authorization for login.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-cutover-reconcile-r449.mjs'
      - 'car02-cutover-reconcile-r449.test.mjs'
      - 'car02-v449-disposable-pg17.sql'
      - '.github/workflows/car02-v449-ambiguous-commit-readonly-reconcile-pg17-qa.yml'
      - 'car02-postcommit-fence-r448.mjs'
      - 'car02-edge-entry-r52.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-read-only-reconciliation:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v449_disposable_only
        ports:
          - 55449:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: v449_disposable_only
    steps:
      - name: Read-only review branch checkout, no stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute 230 offline tests and verify all release locks
        shell: bash
        run: |
          set -euo pipefail
          for key in CAR02_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN; do
            test -z "${!key:-}" || { echo "Unexpected production env: $key" >&2; exit 1; }
          done
          for file in car02-cutover-reconcile-r449.mjs car02-cutover-reconcile-r449.test.mjs car02-v449-disposable-pg17.sql car02-edge-entry-r52.ts; do
            test -s "$file"
          done
          node --check car02-cutover-reconcile-r449.mjs
          node --check car02-cutover-reconcile-r449.test.mjs
          node --test \
            car02-staff-generation-r434.test.mjs car02-staff-authority-r435.test.mjs \
            car02-transaction-gate-r436.test.mjs car02-tenant-cas-gate-r437.test.mjs \
            car02-idempotency-r438.test.mjs car02-outbox-r439.test.mjs \
            car02-outbox-recovery-r440.test.mjs car02-manual-review-ledger-r441.test.mjs \
            car02-review-integrity-r442.test.mjs car02-review-witness-r443.test.mjs \
            car02-witness-anchor-r444.test.mjs car02-independent-witness-r445.test.mjs \
            car02-session-cutover-r446.test.mjs car02-supabase-session-boundary-r447.test.mjs \
            car02-postcommit-fence-r448.test.mjs car02-cutover-reconcile-r449.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V449_RELEASE_LOCK,CAR02_V449_READ_SQL} from './car02-cutover-reconcile-r449.mjs';
          assert.equal(CAR02_V449_RELEASE_LOCK,true);
          assert.equal(CAR02_V449_READ_SQL,'SELECT phase,observed_version FROM v449_private.qa_reconcile_cutover($1::text,$2::uuid,$3::integer,$4::uuid)');
          const edge=readFileSync('car02-edge-entry-r52.ts','utf8');
          assert.match(edge,/const\s+CAR02_RELEASE_LOCK\s*=\s*true\s*;/);
          assert.doesNotMatch(edge,/cutover-reconcile-r449|v449_private/);
          const mods={434:'staff-generation',435:'staff-authority',436:'transaction-gate',437:'tenant-cas-gate',438:'idempotency',439:'outbox',440:'outbox-recovery',441:'manual-review-ledger',442:'review-integrity',443:'review-witness',444:'witness-anchor',445:'independent-witness',446:'session-cutover',447:'supabase-session-boundary',448:'postcommit-fence'};
          for (const [version,name] of Object.entries(mods))
            assert.match(readFileSync(`car02-${name}-r${version}.mjs`,'utf8'),/RELEASE_LOCK\s*=\s*true/);
          const src=readFileSync('car02-cutover-reconcile-r449.mjs','utf8');
          assert.doesNotMatch(src,/\bCAR02_V448_FENCE_SQL\b|\bCAR02_V448_CUTOVER_SQL\b/);
          assert.match(src,/REPEATABLE READ READ ONLY/);
          console.log('V449_OFFLINE_230_AND_ALL_RELEASE_LOCKS_PASS');
          console.log('V449_NO_REAL_AUTH_SESSIONS_OR_EXTERNAL_COMMIT_ACK_NO_GO');
          NODE
      - name: Disposable PostgreSQL 17 snapshot states and eight concurrent read-only clients
        shell: bash
        run: |
          set -euo pipefail
          pg(){ docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17 psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55449 -U postgres "$@"; }
          pg -d postgres -c 'CREATE DATABASE car02_v449_disposable' >/dev/null
          pg -d car02_v449_disposable -f /workspace/car02-v449-disposable-pg17.sql | tee "$RUNNER_TEMP/v449-pg17.log"
          for mark in V449_PG17_PRIVILEGED_READ_ONLY_PUBLIC_DENY_PASS V449_PG17_PRIOR_GENERATION_OBSERVED_NO_ROLLBACK_INFERENCE_PASS V449_PG17_AMBIGUOUS_PHASE1_READ_ONLY_UNFENCED_PASS V449_PG17_AMBIGUOUS_PHASE2_OBSERVED_FENCED_PASS V449_PG17_BAD_NONCE_MISSING_SUBJECT_CROSS_TENANT_DENY_PASS V449_PG17_REVOKED_FENCE_SUPERSEDED_PASS; do
            grep -Fq "$mark" "$RUNNER_TEMP/v449-pg17.log"
          done
          # Eight independent repeatable-read read-only transactions.
          pids=()
          for i in 1 2 3 4 5 6 7 8; do
            (pg -Atq -d car02_v449_disposable -c "BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY; SELECT phase||'|'||observed_version::text FROM v449_private.qa_reconcile_cutover('qa_shop_a','00000000-0000-0000-0000-000000004492',2,'00000000-0000-0000-0000-000000004498'); ROLLBACK;" > "$RUNNER_TEMP/v449-inspect-$i.out") &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          for i in 1 2 3 4 5 6 7 8; do
            grep -Fxq 'fenced|3' "$RUNNER_TEMP/v449-inspect-$i.out" || { cat "$RUNNER_TEMP/v449-inspect-$i.out"; exit 1; }
          done
          state=$(pg -Atq -d car02_v449_disposable -c "SELECT auth_version::text||':'||active::text FROM v449_private.qa_members WHERE shop_code='qa_shop_a' AND user_sub='00000000-0000-0000-0000-000000004492'")
          test "$state" = '3:true' || test "$state" = '3:t'
          superseded=$(pg -Atq -d car02_v449_disposable -c "SELECT phase FROM v449_private.qa_reconcile_cutover('qa_shop_a','00000000-0000-0000-0000-000000004491',2,'00000000-0000-0000-0000-000000004498')")
          test "$superseded" = 'superseded'
          echo V449_PG17_EIGHT_READ_ONLY_SNAPSHOTS_NO_MUTATION_PASS
          echo V449_PG17_STALE_OBSERVATION_NEVER_AUTHORIZES_LOGIN_PASS
          echo V449_FINAL_RELEASE_NO_GO_HOLD_TRUE
