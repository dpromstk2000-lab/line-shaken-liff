permissions:
  contents: read

jobs:
  read-only-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout existing sources only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create evidence folder
        run: mkdir -p car02_legacy_preflight_evidence
      - name: Unit-test non-invasive route checks
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-existing-ui-readonly-preflight.mjs
          node --check test_car02_existing_ui_readonly_preflight.mjs
          node --test test_car02_existing_ui_readonly_preflight.mjs | tee car02_legacy_preflight_evidence/unit.tap
          grep -q '# pass 25' car02_legacy_preflight_evidence/unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/unit.tap
      - name: Verify real checked-out legacy + CAR02 boundaries (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          node car02-existing-ui-readonly-preflight.mjs | tee car02_legacy_preflight_evidence/compatibility_status.txt
          grep -q 'CAR02_READONLY_PREFLIGHT' car02_legacy_preflight_evidence/compatibility_status.txt
          grep -q 'NO_GO / DB HOLD' car02_legacy_preflight_evidence/compatibility_status.txt
          grep -q 'BLOCK=0' car02_legacy_preflight_evidence/compatibility_status.txt
      - name: V2.2 legacy WANGAN vs KSH source boundary (READ ONLY)
