name: CAR02 Existing UI Compatibility Read-only Preflight (NO_GO HOLD)
on:
  workflow_dispatch:
  push:
    paths:
      - dashboard.html
      - owner-ipad.html
      - index.html
      - member.html
      - car02-api.mjs
      - car02-edge-entry-r52.ts
      - car02-browser-client-r57.mjs
      - car02-basic-booking-atomic-isolated.mjs
      - car02-basic-staff-booking-browser-isolated.mjs
      - CAR02_BASIC_UNIFIED_OPERATIONS_ISOLATED_PREVIEW.html
      - car02-basic-unified-operations-isolated.mjs
      - car02-existing-ui-readonly-preflight.mjs
      - car02-legacy-ui-branch-review-isolated.mjs
      - test_car02_legacy_ui_branch_review_isolated.mjs
      - car02-legacy-ui-branch-review-runner-isolated.mjs
      - test_car02_existing_ui_readonly_preflight.mjs
      - car02-v26-release-readiness-audit-isolated.mjs
      - car02-v26-release-readiness-runner-isolated.mjs
      - test_car02_v26_release_readiness_audit_isolated.mjs
      - car02-identity-r44.mjs
      - car02-runtime-r45.mjs
      - car02-v25-concurrent-qa-claim-isolated.mjs
      - BASELINE_QA_ONLY.sql
      - R13_MIGRATION_QA_ONLY.sql
      - car02-v31-live-route-boundary-audit-isolated.mjs
      - car02-v31-live-route-boundary-runner-isolated.mjs
      - test_car02_v31_live_route_boundary_isolated.mjs
      - car02-v32-auth-booking-boundary-isolated.mjs
      - car02-v32-auth-booking-runner-isolated.mjs
      - test_car02_v32_auth_booking_boundary_isolated.mjs
      - test_car02_v32_auth_runtime_isolated.mjs
      - car02-v33-staff-jwt-claims-isolated.mjs
      - car02-v33-staff-jwt-claims-runner-isolated.mjs
      - test_car02_v33_staff_jwt_claims_isolated.mjs
      - test_car02_v33_r44_bridge_isolated.mjs
      - car02-v34-staff-membership-isolated.mjs
      - car02-v34-staff-membership-runner-isolated.mjs
      - test_car02_v34_staff_membership_isolated.mjs
      - test_car02_v34_r44_membership_bridge_isolated.mjs
      - car02-v35-tx-time-membership-isolated.mjs
      - car02-v35-tx-time-membership-runner-isolated.mjs
      - test_car02_v35_tx_recheck_isolated.mjs
      - car02-v36-session-version-fence-isolated.mjs
      - car02-v36-session-version-runner-isolated.mjs
      - test_car02_v36_session_version_fence_isolated.mjs
      - car02-v37-authorized-replay-fence-isolated.mjs
      - car02-v37-authorized-replay-runner-isolated.mjs
      - test_car02_v37_authorized_replay_fence_isolated.mjs
      - .github/workflows/car02-existing-ui-readonly-preflight.yml
      - SUPAbasepass.txt
      - '.env*'

permissions:
  contents: read

jobs:
  read-only-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout existing sources only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create evidence folder
        run: mkdir -p car02_legacy_preflight_evidence
      - name: Unit-test non-invasive route checks
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-existing-ui-readonly-preflight.mjs
          node --check test_car02_existing_ui_readonly_preflight.mjs
          node --test test_car02_existing_ui_readonly_preflight.mjs | tee car02_legacy_preflight_evidence/unit.tap
          grep -q '# pass 25' car02_legacy_preflight_evidence/unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/unit.tap
      - name: Verify real checked-out legacy + CAR02 boundaries (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          node car02-existing-ui-readonly-preflight.mjs | tee car02_legacy_preflight_evidence/compatibility_status.txt
          grep -q 'CAR02_READONLY_PREFLIGHT' car02_legacy_preflight_evidence/compatibility_status.txt
          grep -q 'NO_GO / DB HOLD' car02_legacy_preflight_evidence/compatibility_status.txt
          grep -q 'BLOCK=0' car02_legacy_preflight_evidence/compatibility_status.txt
      - name: V2.2 legacy WANGAN vs KSH source boundary (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-legacy-ui-branch-review-isolated.mjs
          node --check test_car02_legacy_ui_branch_review_isolated.mjs
          node --check car02-legacy-ui-branch-review-runner-isolated.mjs
          node --test test_car02_legacy_ui_branch_review_isolated.mjs | tee car02_legacy_preflight_evidence/v22_unit.tap
          grep -q '# pass 41' car02_legacy_preflight_evidence/v22_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v22_unit.tap
          node car02-legacy-ui-branch-review-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v22_branch_status.txt
          grep -q 'CAR02_V22_LEGACY_BRANCH_READONLY_SOURCE_PASS 4/4 NO_GO HOLD' car02_legacy_preflight_evidence/v22_branch_status.txt
      - name: V2.6 checked-out real source release gap audit (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v26-release-readiness-audit-isolated.mjs
          node --check car02-v26-release-readiness-runner-isolated.mjs
          node --check test_car02_v26_release_readiness_audit_isolated.mjs
          node --test test_car02_v26_release_readiness_audit_isolated.mjs | tee car02_legacy_preflight_evidence/v26_unit.tap
          grep -q '# pass 32' car02_legacy_preflight_evidence/v26_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v26_unit.tap
          node car02-v26-release-readiness-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v26_release_gaps.txt
          grep -q 'CAR02_V26_STATIC_AUDIT_PASS 10/10 RELEASE_BLOCKERS=8 NO_GO HOLD' car02_legacy_preflight_evidence/v26_release_gaps.txt
      - name: V3.1 verify legacy route families and release lock (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v31-live-route-boundary-audit-isolated.mjs
          node --check car02-v31-live-route-boundary-runner-isolated.mjs
          node --check test_car02_v31_live_route_boundary_isolated.mjs
          node --test test_car02_v31_live_route_boundary_isolated.mjs | tee car02_legacy_preflight_evidence/v31_unit.tap
          grep -q '# pass 34' car02_legacy_preflight_evidence/v31_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v31_unit.tap
          node car02-v31-live-route-boundary-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v31_route_audit.txt
          grep -q 'CAR02_V31_LEGACY_ROUTE_SOURCE_PASS 12/12 UNPROVEN=6 NO_GO HOLD' car02_legacy_preflight_evidence/v31_route_audit.txt
          ! grep -Eiq '(https?://|@|token|password|service.role)' car02_legacy_preflight_evidence/v31_route_audit.txt
      - name: V3.2 synthetic R44 staff auth and booking entry source safety (NO_GO HOLD)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v32-auth-booking-boundary-isolated.mjs
          node --check car02-v32-auth-booking-runner-isolated.mjs
          node --check test_car02_v32_auth_booking_boundary_isolated.mjs
          node --check test_car02_v32_auth_runtime_isolated.mjs
          node --test test_car02_v32_auth_booking_boundary_isolated.mjs test_car02_v32_auth_runtime_isolated.mjs | tee car02_legacy_preflight_evidence/v32_unit.tap
          grep -q '# tests 83' car02_legacy_preflight_evidence/v32_unit.tap
          grep -q '# pass 83' car02_legacy_preflight_evidence/v32_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v32_unit.tap
          node car02-v32-auth-booking-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v32_source_audit.txt
          grep -Fq 'CAR02_V32_AUTH_BOOKING_SOURCE_PASS 16/16 UNPROVEN=8 NO_GO HOLD' car02_legacy_preflight_evidence/v32_source_audit.txt
      - name: V3.3 JWT issuer audience expiry guard and R44 bridge (QA NO_GO HOLD)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v33-staff-jwt-claims-isolated.mjs
          node --check car02-v33-staff-jwt-claims-runner-isolated.mjs
          node --check test_car02_v33_staff_jwt_claims_isolated.mjs
          node --check test_car02_v33_r44_bridge_isolated.mjs
          node --test test_car02_v33_staff_jwt_claims_isolated.mjs | tee car02_legacy_preflight_evidence/v33_claims_unit.tap
          grep -q '# tests 79' car02_legacy_preflight_evidence/v33_claims_unit.tap
          grep -q '# pass 79' car02_legacy_preflight_evidence/v33_claims_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v33_claims_unit.tap
          node --test test_car02_v33_r44_bridge_isolated.mjs | tee car02_legacy_preflight_evidence/v33_r44_bridge.tap
          grep -q '# tests 18' car02_legacy_preflight_evidence/v33_r44_bridge.tap
          grep -q '# pass 18' car02_legacy_preflight_evidence/v33_r44_bridge.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v33_r44_bridge.tap
          node car02-v33-staff-jwt-claims-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v33_source_audit.txt
          grep -Fq 'CAR02_V33_STAFF_CLAIMS_SOURCE_PASS 5/5 UNBOUND=4 NO_GO HOLD' car02_legacy_preflight_evidence/v33_source_audit.txt
      - name: V3.4 synthetic membership tenant revocation and R44 bridge (QA NO_GO HOLD)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v34-staff-membership-isolated.mjs
          node --check car02-v34-staff-membership-runner-isolated.mjs
          node --check test_car02_v34_staff_membership_isolated.mjs
          node --check test_car02_v34_r44_membership_bridge_isolated.mjs
          node --test test_car02_v34_staff_membership_isolated.mjs | tee car02_legacy_preflight_evidence/v34_membership_unit.tap
          grep -q '# tests 53' car02_legacy_preflight_evidence/v34_membership_unit.tap
          grep -q '# pass 53' car02_legacy_preflight_evidence/v34_membership_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v34_membership_unit.tap
          node --test test_car02_v34_r44_membership_bridge_isolated.mjs | tee car02_legacy_preflight_evidence/v34_r44_membership_bridge.tap
          grep -q '# tests 18' car02_legacy_preflight_evidence/v34_r44_membership_bridge.tap
          grep -q '# pass 18' car02_legacy_preflight_evidence/v34_r44_membership_bridge.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v34_r44_membership_bridge.tap
          node car02-v34-staff-membership-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v34_source_audit.txt
          grep -Fq 'CAR02_V34_MEMBERSHIP_SOURCE_PASS 7/7 UNBOUND=4 NO_GO HOLD' car02_legacy_preflight_evidence/v34_source_audit.txt
      - name: V3.5 synthetic transaction-time membership revocation gate (QA NO_GO HOLD)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v35-tx-time-membership-isolated.mjs
          node --check car02-v35-tx-time-membership-runner-isolated.mjs
          node --check test_car02_v35_tx_recheck_isolated.mjs
          node --test test_car02_v35_tx_recheck_isolated.mjs | tee car02_legacy_preflight_evidence/v35_tx_unit.tap
          grep -q '# tests 66' car02_legacy_preflight_evidence/v35_tx_unit.tap
          grep -q '# pass 66' car02_legacy_preflight_evidence/v35_tx_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v35_tx_unit.tap
          node car02-v35-tx-time-membership-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v35_source_audit.txt
          grep -Fq 'CAR02_V35_TX_RECHECK_SOURCE_PASS 8/8 BLOCKERS=5 NO_GO HOLD' car02_legacy_preflight_evidence/v35_source_audit.txt
      - name: V3.6 synthetic session authVersion-to-membership fence (QA NO_GO HOLD)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v36-session-version-fence-isolated.mjs
          node --check car02-v36-session-version-runner-isolated.mjs
          node --check test_car02_v36_session_version_fence_isolated.mjs
          node --test test_car02_v36_session_version_fence_isolated.mjs | tee car02_legacy_preflight_evidence/v36_auth_version.tap
          grep -q '# tests 81' car02_legacy_preflight_evidence/v36_auth_version.tap
          grep -q '# pass 81' car02_legacy_preflight_evidence/v36_auth_version.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v36_auth_version.tap
          node car02-v36-session-version-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v36_source_audit.txt
          grep -Fq 'CAR02_V36_SESSION_VERSION_SOURCE_PASS 8/8 BLOCKERS=5 NO_GO HOLD' car02_legacy_preflight_evidence/v36_source_audit.txt
      - name: V3.7 synthetic authorized idempotency replay fence (QA NO_GO HOLD)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v37-authorized-replay-fence-isolated.mjs
          node --check car02-v37-authorized-replay-runner-isolated.mjs
          node --check test_car02_v37_authorized_replay_fence_isolated.mjs
          node --test test_car02_v37_authorized_replay_fence_isolated.mjs | tee car02_legacy_preflight_evidence/v37_replay_unit.tap
          grep -q '# tests 90' car02_legacy_preflight_evidence/v37_replay_unit.tap
          grep -q '# pass 90' car02_legacy_preflight_evidence/v37_replay_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v37_replay_unit.tap
          node car02-v37-authorized-replay-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v37_source_audit.txt
          grep -Fq 'CAR02_V37_REPLAY_FENCE_SOURCE_PASS 8/8 BLOCKERS=5 NO_GO HOLD' car02_legacy_preflight_evidence/v37_source_audit.txt
      - name: Store non-sensitive verification status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car02-existing-ui-readonly-preflight-evidence
          path: car02_legacy_preflight_evidence/
          retention-days: 7
          if-no-files-found: warn
