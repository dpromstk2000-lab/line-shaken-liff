          grep -q '# pass 41' car02_legacy_preflight_evidence/v22_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v22_unit.tap
          node car02-legacy-ui-branch-review-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v22_branch_status.txt
          grep -q 'CAR02_V22_LEGACY_BRANCH_READONLY_SOURCE_PASS 4/4 NO_GO HOLD' car02_legacy_preflight_evidence/v22_branch_status.txt
