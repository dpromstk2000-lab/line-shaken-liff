name: CAR02 Existing UI Compatibility Read-only Preflight (NO_GO HOLD)
on:
  workflow_dispatch:
  push:
    paths:
      - dashboard.html
      - owner-ipad.html
      - index.html
      - member.html
      - car02-api.mjs
      - car02-edge-entry-r52.ts
      - car02-browser-client-r57.mjs
      - car02-basic-booking-atomic-isolated.mjs
      - car02-basic-staff-booking-browser-isolated.mjs
      - CAR02_BASIC_UNIFIED_OPERATIONS_ISOLATED_PREVIEW.html
      - car02-basic-unified-operations-isolated.mjs
      - car02-existing-ui-readonly-preflight.mjs
      - car02-legacy-ui-branch-review-isolated.mjs
      - test_car02_legacy_ui_branch_review_isolated.mjs
      - car02-legacy-ui-branch-review-runner-isolated.mjs
      - test_car02_existing_ui_readonly_preflight.mjs
      - car02-v26-release-readiness-audit-isolated.mjs
      - car02-v26-release-readiness-runner-isolated.mjs
      - test_car02_v26_release_readiness_audit_isolated.mjs
      - car02-identity-r44.mjs
      - car02-runtime-r45.mjs
      - car02-v25-concurrent-qa-claim-isolated.mjs
      - BASELINE_QA_ONLY.sql
      - R13_MIGRATION_QA_ONLY.sql
      - .github/workflows/car02-existing-ui-readonly-preflight.yml
      - SUPAbasepass.txt
      - '.env*'

permissions:
  contents: read

jobs:
  read-only-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout existing sources only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create evidence folder
        run: mkdir -p car02_legacy_preflight_evidence
      - name: Unit-test non-invasive route checks
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-existing-ui-readonly-preflight.mjs
          node --check test_car02_existing_ui_readonly_preflight.mjs
          node --test test_car02_existing_ui_readonly_preflight.mjs | tee car02_legacy_preflight_evidence/unit.tap
          grep -q '# pass 25' car02_legacy_preflight_evidence/unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/unit.tap
      - name: Verify real checked-out legacy + CAR02 boundaries (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          node car02-existing-ui-readonly-preflight.mjs | tee car02_legacy_preflight_evidence/compatibility_status.txt
          grep -q 'CAR02_READONLY_PREFLIGHT' car02_legacy_preflight_evidence/compatibility_status.txt
          grep -q 'NO_GO / DB HOLD' car02_legacy_preflight_evidence/compatibility_status.txt
          grep -q 'BLOCK=0' car02_legacy_preflight_evidence/compatibility_status.txt
      - name: V2.2 legacy WANGAN vs KSH source boundary (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-legacy-ui-branch-review-isolated.mjs
          node --check test_car02_legacy_ui_branch_review_isolated.mjs
          node --check car02-legacy-ui-branch-review-runner-isolated.mjs
          node --test test_car02_legacy_ui_branch_review_isolated.mjs | tee car02_legacy_preflight_evidence/v22_unit.tap
          grep -q '# pass 41' car02_legacy_preflight_evidence/v22_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v22_unit.tap
          node car02-legacy-ui-branch-review-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v22_branch_status.txt
          grep -q 'CAR02_V22_LEGACY_BRANCH_READONLY_SOURCE_PASS 4/4 NO_GO HOLD' car02_legacy_preflight_evidence/v22_branch_status.txt
      - name: V2.6 checked-out real source release gap audit (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v26-release-readiness-audit-isolated.mjs
          node --check car02-v26-release-readiness-runner-isolated.mjs
          node --check test_car02_v26_release_readiness_audit_isolated.mjs
          node --test test_car02_v26_release_readiness_audit_isolated.mjs | tee car02_legacy_preflight_evidence/v26_unit.tap
          grep -q '# pass 32' car02_legacy_preflight_evidence/v26_unit.tap
          grep -q '# fail 0' car02_legacy_preflight_evidence/v26_unit.tap
          node car02-v26-release-readiness-runner-isolated.mjs | tee car02_legacy_preflight_evidence/v26_release_gaps.txt
          grep -q 'CAR02_V26_STATIC_AUDIT_PASS 10/10 RELEASE_BLOCKERS=8 NO_GO HOLD' car02_legacy_preflight_evidence/v26_release_gaps.txt
      - name: Store non-sensitive verification status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car02-existing-ui-readonly-preflight-evidence
          path: car02_legacy_preflight_evidence/
          retention-days: 7
          if-no-files-found: warn
