name: DPRO CAR02 R93G Atomic Photo Tombstone Isolated QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r93g-tombstone-atomic-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-r93g-qa-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout read-only QA source
        uses: actions/checkout@v5
      - name: Preserve the release hard lock and R80 NO_GO HOLD
        run: |
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          node car02-integration-audit-r80.mjs > /tmp/car02-r93g-release-gate.json
          node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync("/tmp/car02-r93g-release-gate.json","utf8"));if(!r.staticEvidenceOk||r.productionReady!==false||r.releaseDecision!=="NO_GO"||r.migrationDecision!=="HOLD")process.exit(1);'
      - name: Confirm isolated module not connected to live router
        run: |
          node --check car02-r93g-photo-tombstone-policy-isolated.mjs
          node --check test-car02-r93g-photo-tombstone-policy.mjs
          node --check test-car02-r93g-sql-contract.mjs
          ! grep -Eq 'car02-r93g-photo-tombstone|R93G' car02-edge-entry-r52.ts car02-edge-boundary-r51.mjs car02-unified-runtime-r50.mjs
          node --input-type=module -e 'import {R93G_INVARIANTS as x} from "./car02-r93g-photo-tombstone-policy-isolated.mjs";if(x.liveWiring!==false||x.productionMigrationReviewed!==false||x.releaseDecision!=="NO_GO"||x.migrationDecision!=="HOLD")process.exit(1);'
      - name: R93G tombstone transition safety and previous R93C through R93F regressions
        run: |
          node --test test-car02-r93g-photo-tombstone-policy.mjs test-car02-r93g-sql-contract.mjs test-car02-r93f-final-lease-fence.mjs test-car02-r93f-sql-safety.mjs test-car02-r93e-tombstone-binding.mjs test-car02-r93d-cleanup-worker-isolated.mjs test-car02-r93c-photo-cleanup-policy.mjs
      - name: Preserve existing R83 R84 photo and R85 staff isolation regressions
        run: |
          node --test test-car02-pg-photo-repository-r83.mjs test-car02-photo-pipeline-isolated-r84.mjs
          node --test test-car02-staff-access-http-r85.mjs test-car02-r85-r70-integration.mjs test-car02-r85-safety.mjs
      - name: PostgreSQL 17 disposable transaction rollback only
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < R93G_PHOTO_TOMBSTONE_ATOMIC_OUTBOX_PG17_QA_ONLY.sql
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -Atqc "SELECT CASE WHEN to_regnamespace('car02_r93g_qa') IS NULL THEN 'R93G_ROLLBACK_CONFIRMED' ELSE 'R93G_SCHEMA_LEAK' END" | grep -Fx R93G_ROLLBACK_CONFIRMED
      - name: Remove temporary local QA evidence
        if: always()
        run: rm -f /tmp/car02-r93g-release-gate.json
