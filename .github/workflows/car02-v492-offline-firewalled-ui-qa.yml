name: CAR02 V4.92 Firewalled Standalone Offline UI QA (NO_GO HOLD)
'on':
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-booking-firewalled-day-r492.mjs'
      - 'car02-booking-calendar-firewalled-r492.mjs'
      - 'car02-standalone-preview-builder-r492.mjs'
      - 'car02-booking-firewalled-ui-r492.test.mjs'
      - 'car02-v492-offline-firewalled-ui-contract.json'
      - 'CAR02_V492_FIREWALLED_STANDALONE_OFFLINE_PREVIEW.html'
      - 'CAR02_V492_FIREWALLED_OFFLINE_UI_QA.md'
      - '.github/workflows/car02-v492-offline-firewalled-ui-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firewalled-standalone-offline-ui:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout review-only branch without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm accepted V4.91 baseline and R52 release lock remain immutable
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = 'refs/heads/car02-v434-review-only'
          for k in CAR02_DATABASE_URL DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!k:-}" || { echo V492_CREDENTIAL_REFUSED >&2; exit 1; }
          done
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          test "$(git hash-object CAR02_V489_STANDALONE_OFFLINE_BOOKING_PREVIEW.html)" = '927221d54fce04dbdf246d85bb5d3809a65ab820'
          test "$(sha256sum CAR02_V489_STANDALONE_OFFLINE_BOOKING_PREVIEW.html | awk '{print $1}')" = '6b07eacfb56aaf2004fdf4bbddb2e40563a3e957304fad3c9abcd763a5ebbc38'
          test "$(git hash-object car02-booking-input-firewall-r491.mjs)" = '215980cec525a9c4d052b639810c2743e3205301'
          for f in car02-booking-firewalled-day-r492.mjs car02-booking-calendar-firewalled-r492.mjs car02-standalone-preview-builder-r492.mjs car02-booking-firewalled-ui-r492.test.mjs car02-v492-offline-firewalled-ui-contract.json CAR02_V492_FIREWALLED_STANDALONE_OFFLINE_PREVIEW.html CAR02_V492_FIREWALLED_OFFLINE_UI_QA.md; do test -s "$f"; done
          echo V492_V491_ACCEPTED_R52_AND_V489_HTML_IMMUTABLE_PASS
      - name: Run 27 independent offline firewall UI tests
        shell: bash
        run: |
          set -euo pipefail
          for f in car02-booking-firewalled-day-r492.mjs car02-booking-calendar-firewalled-r492.mjs car02-standalone-preview-builder-r492.mjs car02-booking-firewalled-ui-r492.test.mjs; do node --check "$f"; done
          node --test-reporter=tap car02-booking-firewalled-ui-r492.test.mjs | tee "$RUNNER_TEMP/v492-new-tests.log"
          total=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v492-new-tests.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v492-new-tests.log")
          test "$total" = 27
          test "$passed" = "$total"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v492-new-tests.log"
          echo V492_OFFLINE_FIREWALLED_UI_27_PASS
      - name: Deterministically rebuild CSP-pinned standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          node car02-standalone-preview-builder-r492.mjs
          test "$(sha256sum CAR02_V492_FIREWALLED_STANDALONE_OFFLINE_PREVIEW.html | awk '{print $1}')" = '9ca5d6576c2ebc56f364a5e46e436df1231c0b67030e9e2969ef15681a3a4b09'
          git diff --exit-code -- CAR02_V492_FIREWALLED_STANDALONE_OFFLINE_PREVIEW.html
          echo V492_DETERMINISTIC_HTML_AND_SHA_CSP_PASS
      - name: Verify the disconnected non-authorizing contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {buildCar02FirewalledDayR492 as project} from './car02-booking-firewalled-day-r492.mjs';
          const c=JSON.parse(readFileSync('car02-v492-offline-firewalled-ui-contract.json','utf8'));
          assert.equal(c.systemCode,'CAR02');assert.equal(c.version,'V4.92');
          assert.equal(c.baseVersion,'V4.91');assert.equal(c.baseRunId,39877125442);
          assert.equal(c.baseNodeTests,1455);assert.equal(c.newNodeTests,27);
          assert.equal(c.expectedMinimumNodeTests,1482);
          assert.equal(c.firewallUsedForIsolatedUiSelection,true);
          assert.equal(c.firewallUsedForRealBooking,false);
          assert.equal(c.acceptedV489HtmlUnmodified,true);
          assert.equal(c.acceptedV488AndV491SourceUnmodified,true);
          for(const k of ['bookingCreationAllowed','productionDeployAllowed','databaseMutationAllowed',
            'lineDispatchAllowed','providerConnectionAllowed','billingChangeAllowed'])assert.equal(c[k],false,k);
          assert.equal(c.releaseLock,true);assert.equal(c.commercialDecision,'NO_GO_HOLD');
          assert.equal(c.providerProofsVerified,0);assert.equal(c.requiredProviderProofs,7);
          const r=project({day:'2026-10-23',now:new Date('2026-10-22T01:10:00.000Z'),
            calendar:{systemCode:'CAR02',environment:'isolated_qa',coverageThrough:'2027-10-22',closedDays:[],occupiedSlots:[]}});
          assert.equal(r.candidateCount,18);
          assert.equal(r.bookingCreationAllowed,false);assert.equal(r.releaseLock,true);
          console.log('V492_SYNTHETIC_UI_NEVER_CREATES_A_BOOKING_PASS');
          NODE
      - name: Run full repository regression preserving accepted coverage
        shell: bash
        run: |
          set -euo pipefail
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v492-full-tests.log"
          total=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v492-full-tests.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v492-full-tests.log")
          test "$total" -ge 1482
          test "$passed" = "$total"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v492-full-tests.log"
          echo V492_FULL_REGRESSION_MINIMUM_1482_PASS
