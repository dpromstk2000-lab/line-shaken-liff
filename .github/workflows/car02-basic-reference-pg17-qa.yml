name: CAR02 Basic Reference to R45 R13 PG17 (isolated)
on:
  workflow_dispatch:
  push:
    paths:
      - 'pg17-car02-basic-reference-to-api-isolated.mjs'
      - 'car02-basic-ui-r45-port-isolated.mjs'
      - 'test_car02_basic_ui_r45_port_isolated.mjs'
      - 'pg17-car02-basic-ui-r45-isolated.mjs'
      - 'car02-basic-booking-atomic-isolated.mjs'
      - 'test_car02_basic_booking_atomic_isolated.mjs'
      - 'CAR02_BASIC_BOOKING_ATOMIC_PG17_QA_ONLY.sql'
      - 'pg17-car02-basic-booking-to-work-order-isolated.mjs'
      - 'pg17-car02-basic-full-journey-isolated.mjs'
      - 'car02-basic-booking-http-isolated.mjs'
      - 'test_car02_basic_booking_http_isolated.mjs'
      - 'pg17-car02-basic-booking-http-isolated.mjs'
      - 'car02-basic-staff-booking-browser-isolated.mjs'
      - 'test_car02_basic_staff_booking_browser_isolated.mjs'
      - 'pg17-car02-basic-staff-booking-browser-isolated.mjs'
      - 'car02-legacy-reservation-handoff-readonly-isolated.mjs'
      - 'test_car02_legacy_reservation_handoff_readonly_isolated.mjs'
      - 'pg17-car02-legacy-reservation-handoff-readonly-isolated.mjs'
      - 'car02-legacy-reservation-inbox-readonly-isolated.mjs'
      - 'test_car02_legacy_reservation_inbox_readonly_isolated.mjs'
      - 'pg17-car02-legacy-reservation-inbox-readonly-isolated.mjs'
      - 'car02-legacy-booking-lifecycle-gate-isolated.mjs'
      - 'test_car02_legacy_booking_lifecycle_gate_isolated.mjs'
      - 'pg17-car02-legacy-booking-lifecycle-gate-isolated.mjs'
      - 'car02-v24-qa-lifecycle-snapshot-isolated.mjs'
      - 'test_car02_v24_qa_lifecycle_snapshot_isolated.mjs'
      - 'pg17-car02-v24-qa-lifecycle-snapshot-isolated.mjs'
      - 'car02-v25-concurrent-qa-claim-isolated.mjs'
      - 'test_car02_v25_concurrent_qa_claim_isolated.mjs'
      - 'pg17-car02-v25-concurrent-qa-claim-isolated.mjs'
      - 'car02-v27-order-uniqueness-audit-isolated.mjs'
      - 'test_car02_v27_order_uniqueness_audit_isolated.mjs'
      - 'pg17-car02-v27-order-uniqueness-isolated.mjs'
      - '01_CATALOG_ONLY_READONLY.sql'
      - '02_DUPLICATE_COUNTS_READONLY.sql'
      - 'car02-v28-premigration-readonly-isolated.mjs'
      - 'test_car02_v28_premigration_readonly_isolated.mjs'
      - 'pg17-car02-v28-premigration-readonly-isolated.mjs'
      - 'car02-v29-strict-index-audit-isolated.mjs'
      - 'test_car02_v29_strict_index_audit_isolated.mjs'
      - 'pg17-car02-v29-strict-index-audit-isolated.mjs'
      - '.github/workflows/car02-basic-reference-pg17-qa.yml'
permissions:
  contents: read
jobs:
  disposable-pg17-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_ACTIONS: 'true'
      NODE_ENV: test
      CAR02_RELEASE_LOCK: 'true'
      CAR02_BASIC_PG17_QA: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: qa_only_local
      PGDATABASE: car02_qa
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa_only_local
          POSTGRES_DB: car02_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d car02_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout existing approved CAR02 sources
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify R52 lock and existing R13 R45 reference source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$CAR02_RELEASE_LOCK" = true
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = car02_qa
          grep -Fq 'const CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          for pin in \
            'BASELINE_QA_ONLY.sql 47fa141bcc3cf6f9d54a8dcd8c11290f72abd2be' \
            'R13_MIGRATION_QA_ONLY.sql 5136872276b3403f036bae768410c937119398b2' \
            'R13_EMPTY_ONLY_ROLLBACK_QA.sql 012875c4aabc7f0e6f66e6868d94c1949cae8cc9' \
            'car02-core.mjs 8748ea9d79c4a5bc35321472f48cd06e3e435f1f' \
            'car02-api.mjs e3216bf265bbb6fc6ac1c893334b76a2f429ccc1' \
            'car02-identity-r44.mjs 91c3ef3475c837828ae7640d9cab75bcc46e3ced' \
            'car02-pg-adapter.mjs dc57effaec3ed9b6ec309420b3506a57ec7a599f' \
            'car02-runtime-r45.mjs f53cc297c2e968845cccd54a258bf0d2006f7007' \
            'car02-edge-entry-r52.ts f0e31fb9f9d98524519d01dffd3489893d3d3302' \
            'car02-basic-api-contract-isolated.mjs dfdafcfbd251ae95525c68a7e331205ebd732394' \
            'car02-basic-reference-resolver-isolated.mjs 8d630f0ad2e160800e86e5e27d9d0d13b667f746' \
            'car02-basic-reference-bridge-isolated.mjs 7a35791e152215a4682ec28c6e8bbebefdba0712' \
            'pg17-integration.mjs ce8ca15fd78db2cd3dd8a8fcaa415428b9e7bbf1'; do
            path="${pin%% *}"; expected="${pin##* }"
            test "$(git hash-object "$path")" = "$expected" || { echo "CAR02_SOURCE_DRIFT $path"; exit 1; }
          done
          node --check pg17-car02-basic-reference-to-api-isolated.mjs
      - name: Run existing isolated reference unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p car02_basic_pg17_evidence
          node --test test_car02_basic_api_contract_isolated.mjs test_car02_basic_reference_resolver_isolated.mjs test_car02_basic_reference_bridge_isolated.mjs | tee car02_basic_pg17_evidence/reference_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/reference_unit.tap
      - name: Verify basic UI to R45 projection adapter with synthetic data
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-basic-ui-r45-port-isolated.mjs
          node --check pg17-car02-basic-ui-r45-isolated.mjs
          node --test test_car02_basic_ui_r45_port_isolated.mjs | tee car02_basic_pg17_evidence/ui_port_unit.tap
          grep -q '# pass 15' car02_basic_pg17_evidence/ui_port_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/ui_port_unit.tap
      - name: Install PostgreSQL client library for disposable job only
        run: npm install --no-save --ignore-scripts --no-audit --no-fund pg@8
      - name: Initialize existing R13 and verify previous PostgreSQL QA baseline
        shell: bash
        run: |
          set -euo pipefail
          node pg17-integration.mjs | tee car02_basic_pg17_evidence/r13_initialization.log
          grep -q 'R43 PG17 INTEGRATION: 14 PASS' car02_basic_pg17_evidence/r13_initialization.log
      - name: Verify linked reservation to real R45 API in disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-basic-reference-to-api-isolated.mjs | tee car02_basic_pg17_evidence/reservation_to_work_order.log
          grep -q 'CAR02_BASIC_REFERENCE_R45_R13_PG17_ISOLATED_PASS 15/15 NO_GO HOLD SYNTHETIC_ONLY' car02_basic_pg17_evidence/reservation_to_work_order.log
      - name: Verify UI to R57 R45 R13 integration in disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-basic-ui-r45-isolated.mjs | tee car02_basic_pg17_evidence/ui_r57_r45_pg17.log
          grep -q 'CAR02_BASIC_UI_R57_R45_R13_PG17_ISOLATED_PASS 15/15 NO_GO HOLD SYNTHETIC_ONLY' car02_basic_pg17_evidence/ui_r57_r45_pg17.log
      - name: Verify atomic booking UUID inputs isolated only
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-basic-booking-atomic-isolated.mjs
          node --check pg17-car02-basic-booking-to-work-order-isolated.mjs
          node --test test_car02_basic_booking_atomic_isolated.mjs | tee car02_basic_pg17_evidence/booking_atomic_unit.tap
          grep -q '# pass 15' car02_basic_pg17_evidence/booking_atomic_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/booking_atomic_unit.tap
      - name: Verify atomic booking to R45 work order in disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-basic-booking-to-work-order-isolated.mjs | tee car02_basic_pg17_evidence/booking_to_work_order.log
          grep -q 'CAR02_BASIC_ATOMIC_BOOKING_R45_R13_PG17_SYNTHETIC_PASS 17/17 NO_GO HOLD' car02_basic_pg17_evidence/booking_to_work_order.log
      - name: Verify complete booking to UI R57 R45 R13 journey in disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          node --check pg17-car02-basic-full-journey-isolated.mjs
          node pg17-car02-basic-full-journey-isolated.mjs | tee car02_basic_pg17_evidence/full_journey.log
          grep -q 'CAR02_BASIC_FULL_JOURNEY_R57_R45_R13_PG17_PASS 16/16 SYNTHETIC_ONLY NO_GO HOLD' car02_basic_pg17_evidence/full_journey.log
      - name: Verify staff-assisted synthetic HTTP booking input contract
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-basic-booking-http-isolated.mjs
          node --check pg17-car02-basic-booking-http-isolated.mjs
          node --test test_car02_basic_booking_http_isolated.mjs | tee car02_basic_pg17_evidence/booking_http_unit.tap
          grep -q '# pass 21' car02_basic_pg17_evidence/booking_http_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/booking_http_unit.tap
      - name: Verify staff-assisted HTTP booking to R45 R13 in disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-basic-booking-http-isolated.mjs | tee car02_basic_pg17_evidence/booking_http_pg17.log
          grep -q 'CAR02_BASIC_BOOKING_HTTP_R44_R57_R45_R13_PG17_PASS 15/15 SYNTHETIC_ONLY NO_GO HOLD' car02_basic_pg17_evidence/booking_http_pg17.log
      - name: Verify staff booking browser contract (isolated only)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-basic-staff-booking-browser-isolated.mjs
          node --check pg17-car02-basic-staff-booking-browser-isolated.mjs
          node --test test_car02_basic_staff_booking_browser_isolated.mjs | tee car02_basic_pg17_evidence/staff_booking_browser_unit.tap
          grep -q '# pass 27' car02_basic_pg17_evidence/staff_booking_browser_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/staff_booking_browser_unit.tap
      - name: Verify browser to R44 booking HTTP and R57 R45 R13 disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-basic-staff-booking-browser-isolated.mjs | tee car02_basic_pg17_evidence/staff_booking_browser_pg17.log
          grep -q 'CAR02_BASIC_STAFF_BOOKING_BROWSER_R44_R57_R45_R13_PG17_PASS 15/15 SYNTHETIC_ONLY NO_GO HOLD' car02_basic_pg17_evidence/staff_booking_browser_pg17.log
      - name: Verify V2.0 R13 reservation handoff input contract (isolated only)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-legacy-reservation-handoff-readonly-isolated.mjs
          node --check pg17-car02-legacy-reservation-handoff-readonly-isolated.mjs
          node --test test_car02_legacy_reservation_handoff_readonly_isolated.mjs | tee car02_basic_pg17_evidence/legacy_handoff_unit.tap
          grep -q '# pass 31' car02_basic_pg17_evidence/legacy_handoff_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/legacy_handoff_unit.tap
      - name: Verify V2.0 R13 booking to R45 preview READ ONLY in disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-legacy-reservation-handoff-readonly-isolated.mjs | tee car02_basic_pg17_evidence/legacy_handoff_pg17.log
          grep -q 'CAR02_LEGACY_RESERVATION_R13_R45_READONLY_PG17_PASS 16/16 SYNTHETIC_ONLY NO_GO HOLD' car02_basic_pg17_evidence/legacy_handoff_pg17.log
      - name: Verify V2.1 legacy reservation list safe projection unit contract
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-legacy-reservation-inbox-readonly-isolated.mjs
          node --check pg17-car02-legacy-reservation-inbox-readonly-isolated.mjs
          node --test test_car02_legacy_reservation_inbox_readonly_isolated.mjs | tee car02_basic_pg17_evidence/legacy_inbox_unit.tap
          grep -q '# pass 47' car02_basic_pg17_evidence/legacy_inbox_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/legacy_inbox_unit.tap
      - name: Verify V2.1 legacy booking list to R13 R45 read only in disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-legacy-reservation-inbox-readonly-isolated.mjs | tee car02_basic_pg17_evidence/legacy_inbox_pg17.log
          grep -q 'CAR02_LEGACY_INBOX_R13_R45_READONLY_PG17_PASS 16/16 SYNTHETIC_ONLY NO_GO HOLD' car02_basic_pg17_evidence/legacy_inbox_pg17.log
      - name: V2.3 booking lifecycle source-only unit safety (NO_GO)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-legacy-booking-lifecycle-gate-isolated.mjs
          node --check pg17-car02-legacy-booking-lifecycle-gate-isolated.mjs
          node --test test_car02_legacy_booking_lifecycle_gate_isolated.mjs | tee car02_basic_pg17_evidence/v23_lifecycle_unit.tap
          grep -q '# pass 42' car02_basic_pg17_evidence/v23_lifecycle_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/v23_lifecycle_unit.tap
      - name: V2.3 verify R13 lacks booking lifecycle status in disposable PG17 (HOLD)
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-legacy-booking-lifecycle-gate-isolated.mjs | tee car02_basic_pg17_evidence/v23_lifecycle_pg17.log
          grep -q 'CAR02_V23_LIFECYCLE_R13_SCHEMA_GAP_PG17_PASS 10/10 NOT_READY SYNTHETIC_ONLY NO_GO HOLD' car02_basic_pg17_evidence/v23_lifecycle_pg17.log
      - name: V2.4 QA lifecycle snapshot unit contract (no public API)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v24-qa-lifecycle-snapshot-isolated.mjs
          node --check pg17-car02-v24-qa-lifecycle-snapshot-isolated.mjs
          node --test test_car02_v24_qa_lifecycle_snapshot_isolated.mjs | tee car02_basic_pg17_evidence/v24_snapshot_unit.tap
          grep -q '# pass 58' car02_basic_pg17_evidence/v24_snapshot_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/v24_snapshot_unit.tap
      - name: V2.4 verified QA-sidecar-only booking lifecycle on disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-v24-qa-lifecycle-snapshot-isolated.mjs | tee car02_basic_pg17_evidence/v24_snapshot_pg17.log
          grep -q 'CAR02_V24_LIFECYCLE_SNAPSHOT_PG17_PASS 17/17 QA_SIDECAR_ONLY NON_SENDABLE NO_GO HOLD' car02_basic_pg17_evidence/v24_snapshot_pg17.log
      - name: V2.5 disposable concurrent QA claims unit safety (NO_GO)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v25-concurrent-qa-claim-isolated.mjs
          node --check pg17-car02-v25-concurrent-qa-claim-isolated.mjs
          node --test test_car02_v25_concurrent_qa_claim_isolated.mjs | tee car02_basic_pg17_evidence/v25_concurrent_unit.tap
          grep -q '# pass 53' car02_basic_pg17_evidence/v25_concurrent_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/v25_concurrent_unit.tap
      - name: V2.5 concurrent claims in disposable PostgreSQL 17 sidecars only
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-v25-concurrent-qa-claim-isolated.mjs | tee car02_basic_pg17_evidence/v25_concurrent_pg17.log
          grep -q 'CAR02_V25_CONCURRENT_QA_CLAIM_PG17_PASS 20/20 QA_CLAIMS_ONLY NON_SENDABLE NO_GO HOLD' car02_basic_pg17_evidence/v25_concurrent_pg17.log
      - name: V2.7 audit R13 baseline booking uniqueness gap (source-only)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v27-order-uniqueness-audit-isolated.mjs
          node --check test_car02_v27_order_uniqueness_audit_isolated.mjs
          node --check pg17-car02-v27-order-uniqueness-isolated.mjs
          node --test test_car02_v27_order_uniqueness_audit_isolated.mjs | tee car02_basic_pg17_evidence/v27_uniqueness_unit.tap
          grep -q '# pass 37' car02_basic_pg17_evidence/v27_uniqueness_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/v27_uniqueness_unit.tap
      - name: V2.7 prove DB-level one-order-per-reservation on disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-v27-order-uniqueness-isolated.mjs | tee car02_basic_pg17_evidence/v27_one_order_pg17.log
          grep -q 'CAR02_V27_ONE_ORDER_PER_BOOKING_PG17_PASS 20/20 SYNTHETIC_ONLY NO_GO HOLD' car02_basic_pg17_evidence/v27_one_order_pg17.log
          grep -q 'CAR02_V27_DISPOSABLE_FIXTURE_RESTORED' car02_basic_pg17_evidence/v27_one_order_pg17.log
      - name: V2.8 pinned catalog and aggregate pre-migration source safety (NO_GO HOLD)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v28-premigration-readonly-isolated.mjs
          node --check test_car02_v28_premigration_readonly_isolated.mjs
          node --check pg17-car02-v28-premigration-readonly-isolated.mjs
          node --test test_car02_v28_premigration_readonly_isolated.mjs | tee car02_basic_pg17_evidence/v28_premigration_unit.tap
          grep -q '# pass 80' car02_basic_pg17_evidence/v28_premigration_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/v28_premigration_unit.tap
      - name: V2.8 pre-migration READ ONLY inventory on disposable PG17 (NO_GO HOLD)
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-v28-premigration-readonly-isolated.mjs | tee car02_basic_pg17_evidence/v28_premigration_pg17.log
          grep -q 'CAR02_V28_PREMIGRATION_READONLY_PG17_PASS 20/20 AGGREGATE_ONLY NON_SENDABLE NO_GO HOLD' car02_basic_pg17_evidence/v28_premigration_pg17.log
      - name: V2.9 strict index catalog unit contract (NO_GO HOLD)
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-v29-strict-index-audit-isolated.mjs
          node --check test_car02_v29_strict_index_audit_isolated.mjs
          node --check pg17-car02-v29-strict-index-audit-isolated.mjs
          node --test test_car02_v29_strict_index_audit_isolated.mjs | tee car02_basic_pg17_evidence/v29_strict_index_unit.tap
          grep -q '# pass 38' car02_basic_pg17_evidence/v29_strict_index_unit.tap
          grep -q '# fail 0' car02_basic_pg17_evidence/v29_strict_index_unit.tap
      - name: V2.9 prove actual unique index key semantics in disposable PG17 only
        shell: bash
        run: |
          set -euo pipefail
          node pg17-car02-v29-strict-index-audit-isolated.mjs | tee car02_basic_pg17_evidence/v29_strict_index_pg17.log
          grep -q 'CAR02_V29_STRICT_INDEX_PG17_PASS 20/20 QA_PROBE_ONLY NO_GO HOLD' car02_basic_pg17_evidence/v29_strict_index_pg17.log
      - name: Store redacted QA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car02-basic-reference-pg17-isolated-evidence
          path: car02_basic_pg17_evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove disposable QA databases
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = car02_qa
          if ! node -e "require.resolve('pg')" >/dev/null 2>&1; then
            echo 'PostgreSQL client absent; disposable service is removed by GitHub runner.'
            exit 0
          fi
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const c=new pg.Client({host:'127.0.0.1',port:5432,user:'postgres',password:'qa_only_local',database:'postgres'});
          await c.connect();
          try {
            for (const db of ['car02_empty_rollback_qa','car02_qa']) await c.query(`DROP DATABASE IF EXISTS ${db} WITH (FORCE)`);
            const q=await c.query("SELECT datname FROM pg_database WHERE datname IN ('car02_empty_rollback_qa','car02_qa')");
            if(q.rowCount)throw Error('CAR02_DISPOSABLE_DB_CLEANUP_FAILED');
            console.log('CAR02_DISPOSABLE_PG17_REMOVED');
          } finally {await c.end()}
          NODE
