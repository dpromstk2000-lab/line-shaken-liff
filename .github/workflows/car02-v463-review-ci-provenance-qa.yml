name: CAR02 V4.63R1 Current HEAD CI Provenance and Old V457 Dynamic QA (NO_GO HOLD)
# GitHub review branch only; no network, external provider, SQL, Supabase or LINE access.
# Current branch CI is a QA result, never a commercial release approval.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-review-ci-provenance-r463.mjs'
      - 'car02-review-ci-provenance-r463.test.mjs'
      - 'car02-v463-offline-provenance-inventory.json'
      - '.github/workflows/car02-v463-review-ci-provenance-qa.yml'
      - 'car02-edge-entry-r52.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-current-head-provenance:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated review branch without stored GitHub token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce actual R52 release lock, no external provider secrets
        shell: bash
        run: |
          set -euo pipefail
          for secret in CAR02_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!secret:-}" || { echo "Unexpected provider environment $secret" >&2; exit 1; }
          done
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          test -s car02-review-ci-provenance-r463.mjs
          test -s car02-review-ci-provenance-r463.test.mjs
          test -s car02-v463-offline-provenance-inventory.json
          node --check car02-review-ci-provenance-r463.mjs
          node --check car02-review-ci-provenance-r463.test.mjs
          echo V463_ORIGINAL_R52_IMMUTABLE_NO_LIVE_ENV_PASS
      - name: Execute complete dynamic regression suite and fail-closed CI provenance QA
        shell: bash
        run: |
          set -euo pipefail
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v463-node.log"
          tests=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v463-node.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v463-node.log")
          test "$tests" -ge 504
          test "$passed" = "$tests"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v463-node.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V463_RELEASE_LOCK,CAR02_V463_MAIN_SHA,CAR02_V463_CHECKS} from './car02-review-ci-provenance-r463.mjs';
          const x=JSON.parse(readFileSync('car02-v463-offline-provenance-inventory.json','utf8'));
          assert.equal(CAR02_V463_RELEASE_LOCK,true);
          assert.equal(Object.keys(CAR02_V463_CHECKS).length,3);
          assert.equal(x.mainCommitUnchanged,CAR02_V463_MAIN_SHA);
          assert.equal(x.releaseDecision,'NO_GO_HOLD');
          assert.equal(x.commercialBlockersUnchanged.length,7);
          assert.match(readFileSync('.github/workflows/car02-v457-signed-evidence-manifest-pg17-qa.yml','utf8'),
            /test "\$passed" = "\$tests"/);
          const live=readFileSync('car02-edge-entry-r52.ts','utf8');
          assert.match(live,/const\s+CAR02_RELEASE_LOCK\s*=\s*true/);
          assert.doesNotMatch(live,/car02-review-ci-provenance-r463|releasePermitted:true/);
          console.log('V463_CURRENT_HEAD_STALE_CI_AND_ECHOED_MARKER_DENY_PASS');
          console.log('V463_V457R1_DYNAMIC_TEST_COUNT_REGRESSION_PASS');
          NODE
          echo V463_FINAL_RELEASE_NO_GO_HOLD_TRUE
