name: CAR02 R194-R196 PG17 SAVEPOINT Atomicity HOLD QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: car02-r194-r196-synthetic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-pg17-savepoint-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r194-disposable-admin-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAR02_RELEASE_LOCK: 'true'
      R194_DISPOSABLE_QA: 'yes'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout read only and discard credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Lock six immutable source identities and NO GO HOLD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence-r194
          test "$(git rev-parse HEAD:R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql)" = '3784f8a28549bc40343646bf88657c9d9b0b80f2'
          test "$(git rev-parse HEAD:car02_r138_pg17_lifecycle_qa.py)" = 'ff98dd74916ff3ea77412b986138151a4fddab90'
          test "$(git rev-parse HEAD:car02_r159_concurrent_booking_isolated.py)" = '318921e951cf1578bb00f32eb77f2054ca350ed6'
          test "$(git rev-parse HEAD:car02_r162_booking_stress_isolated.py)" = 'd6dd3a48a48ffe045ce4ab5df3c2fdd86b3e0e5e'
          test "$(git rev-parse HEAD:car02_r171_rejection_immutability_isolated.py)" = '23f082a6b247d26cb772c6eee5084000f12d72a2'
          test "$(git rev-parse HEAD:car02_r191_transaction_rollback_isolated.py)" = '7bf3c1b690db14e6dcbe27831d18231488c91d5f'
          echo R194_R196_RELEASE_NO_GO_MIGRATION_HOLD > qa-evidence-r194/release-lock.log
          echo R194_SIX_ORIGINALS_PINNED > qa-evidence-r194/source-pins.log
      - name: R195 no database negative tests repeated three complete rounds
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            python3 -m unittest -v test_car02_r195_savepoint_atomicity.py 2>&1 | tee "qa-evidence-r194/r195-negative-${round}.log"
            grep -Eq '^Ran 77 tests in ' "qa-evidence-r194/r195-negative-${round}.log"
            grep -Fxq OK "qa-evidence-r194/r195-negative-${round}.log"
            ! grep -Eq 'FAILED|ERROR|skipped=' "qa-evidence-r194/r195-negative-${round}.log"
          done
      - name: R196 validate manual read only workflow safety
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_car02_r196_workflow_contract.py 2>&1 | tee qa-evidence-r194/r196-workflow-contract.log
          grep -Fxq OK qa-evidence-r194/r196-workflow-contract.log
      - name: Create only disposable PostgreSQL 17 database and five synthetic users
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r138_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -v ON_ERROR_STOP=1 < R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql > qa-evidence-r194/schema.log
          grep -Fxq R138_DISPOSABLE_PG17_SCHEMA_READY qa-evidence-r194/schema.log
      - name: Assert all five disposable business tables are empty
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          for table in bookings service_cases case_operations booking_operations audit_events; do
            docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -Atqc "SELECT count(*) FROM car02_r138_qa.$table;" | grep -Fxq 0
          done
          echo R194_FIVE_TABLES_EMPTY_BEFORE_PROBE > qa-evidence-r194/empty-fixture.log
      - name: Run R194 real PG17 eight SAVEPOINT and two partial rollback probes
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          python3 car02_r194_savepoint_atomicity_isolated.py --cid "$CID" --commit "$GITHUB_SHA" 2>&1 | tee qa-evidence-r194/r194-probe.log
          grep -Fxq R194_DISPOSABLE_PG17_SAVEPOINT_EIGHT_AND_PARTIAL_ATOMICITY_PASS_NO_GO_HOLD qa-evidence-r194/r194-probe.log
          python3 - <<'PYVERIFY'
          import json,os
          from pathlib import Path
          from car02_r194_savepoint_atomicity_isolated import verify_report,OPS,STEPS
          proof=json.loads(Path('qa-evidence-r194/r194-savepoint-atomicity.json').read_text(encoding='ascii'))
          assert verify_report(proof) and proof['githubCommit']==os.environ['GITHUB_SHA']
          assert len(proof['savepointOperations'])==len(OPS)==8
          assert len(proof['partialRollbacks'])==len(STEPS)==2
          assert proof['release']=='NO_GO' and proof['migration']=='HOLD' and proof['realWorldGatesOpen']==12
          print('R194_SAVEPOINT_AUDIT_EVIDENCE_REREAD_PASS')
          PYVERIFY
      - name: Always drop disposable PG17 database and five synthetic users
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r138_qa_ci WITH (FORCE);'
          for role in car02_r138_a_staff_ci car02_r138_a_one_ci car02_r138_a_two_ci car02_r138_b_staff_ci car02_r138_b_one_ci; do
            docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS $role;"
          done
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS(SELECT 1 FROM pg_database WHERE datname='car02_r138_qa_ci') AND NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname LIKE 'car02_r138_%_ci') THEN 'R194_ALL_DISPOSABLE_RESOURCES_DELETED' ELSE 'R194_CLEANUP_FAILED' END" | grep -Fxq R194_ALL_DISPOSABLE_RESOURCES_DELETED
          echo R194_ALL_DISPOSABLE_RESOURCES_DELETED > qa-evidence-r194/cleanup.log
      - name: Verify cleanup original hashes and NO GO HOLD
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq R194_ALL_DISPOSABLE_RESOURCES_DELETED qa-evidence-r194/cleanup.log
          grep -Fxq R194_R196_RELEASE_NO_GO_MIGRATION_HOLD qa-evidence-r194/release-lock.log
          test "$(git rev-parse HEAD:R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql)" = '3784f8a28549bc40343646bf88657c9d9b0b80f2'
          test "$(git rev-parse HEAD:car02_r138_pg17_lifecycle_qa.py)" = 'ff98dd74916ff3ea77412b986138151a4fddab90'
          test "$(git rev-parse HEAD:car02_r159_concurrent_booking_isolated.py)" = '318921e951cf1578bb00f32eb77f2054ca350ed6'
          test "$(git rev-parse HEAD:car02_r162_booking_stress_isolated.py)" = 'd6dd3a48a48ffe045ce4ab5df3c2fdd86b3e0e5e'
          test "$(git rev-parse HEAD:car02_r171_rejection_immutability_isolated.py)" = '23f082a6b247d26cb772c6eee5084000f12d72a2'
          test "$(git rev-parse HEAD:car02_r191_transaction_rollback_isolated.py)" = '7bf3c1b690db14e6dcbe27831d18231488c91d5f'
          python3 - <<'PYHOLD'
          import json,os
          from pathlib import Path
          from car02_r194_savepoint_atomicity_isolated import verify_report
          proof=json.loads(Path('qa-evidence-r194/r194-savepoint-atomicity.json').read_text(encoding='ascii'))
          assert verify_report(proof) and proof['githubCommit']==os.environ['GITHUB_SHA']
          assert proof['release']=='NO_GO' and proof['migration']=='HOLD' and proof['realWorldGatesOpen']==12
          assert proof['productionTouched'] is False and proof['realRLSVerified'] is False
          print('R194_R196_POST_CLEANUP_NO_GO_HOLD_PASS')
          PYHOLD
      - name: Preserve seven day disposable QA artifacts only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: car02-r194-r196-pg17-savepoint-disposable-only
          path: qa-evidence-r194/
          if-no-files-found: warn
          retention-days: 7
