        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            python3 -m unittest -v test_car02_r247_prepared_plan_rls.py 2>&1 | tee "qa-evidence-r246/r247-negative-${round}.log"
            grep -Eq '^Ran 418 tests in ' "qa-evidence-r246/r247-negative-${round}.log"
            grep -Fxq OK "qa-evidence-r246/r247-negative-${round}.log"
            ! grep -Eq 'FAILED|ERROR|skipped=' "qa-evidence-r246/r247-negative-${round}.log"
          done
      - name: R248 workflow no-production safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_car02_r248_workflow_contract.py 2>&1 | tee qa-evidence-r246/r248-contract.log
          grep -Fxq OK qa-evidence-r246/r248-contract.log
      - name: Create exact disposable PG17 database and five synthetic roles
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r138_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -v ON_ERROR_STOP=1 < R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql > qa-evidence-r246/schema.log
          grep -Fxq R138_DISPOSABLE_PG17_SCHEMA_READY qa-evidence-r246/schema.log
      - name: Require five business tables empty before test
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          for table in bookings service_cases case_operations booking_operations audit_events; do
            docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -Atqc "SELECT count(*) FROM car02_r138_qa.$table;" | grep -Fxq 0
          done
          echo R246_FIVE_TABLES_EMPTY_PASS > qa-evidence-r246/empty-fixture.log
      - name: Run prepared generic custom plan per actor exact row RLS proof on disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          python3 car02_r246_prepared_plan_rls_isolated.py --cid "$CID" --commit "$GITHUB_SHA" 2>&1 | tee qa-evidence-r246/r246-probe.log
