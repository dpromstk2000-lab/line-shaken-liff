name: CAR02 R246-R248 PG17 Prepared Plan Role Isolation HOLD QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: car02-r246-r248-disposable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-pg17-prepared-plan-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r246-disposable-pg17-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAR02_RELEASE_LOCK: 'true'
      R246_DISPOSABLE_QA: 'yes'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout read only without retained credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Pin thirty-four immutable prior source identities and unconditional NO GO HOLD
