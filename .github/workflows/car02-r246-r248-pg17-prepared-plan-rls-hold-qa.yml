          python3 - <<'PYVERIFY'
          import json,os
          from pathlib import Path
          from car02_r246_prepared_plan_rls_isolated import validate,required_keys,TABLES
          path=Path('qa-evidence-r246/r246-prepared-plan-rls-proof.json')
          proof=json.loads(path.read_text(encoding='ascii'))
          assert validate(proof) and proof['githubCommit']==os.environ['GITHUB_SHA']
          assert len(proof['readbacks'])==len(required_keys())==20
          assert len(proof['oracle'])==len(TABLES)==5
          assert proof['release']=='NO_GO' and proof['migration']=='HOLD'
          assert proof['realWorldGatesOpen']==12 and not proof['productionTouched']
          print('R246_PREPARED_PLAN_RLS_DISPOSABLE_EVIDENCE_PASS')
          PYVERIFY
      - name: Always remove disposable DB and five synthetic roles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r138_qa_ci WITH (FORCE);'
          for role in car02_r138_a_staff_ci car02_r138_a_one_ci car02_r138_a_two_ci car02_r138_b_staff_ci car02_r138_b_one_ci; do
            docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS $role;"
          done
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS(SELECT 1 FROM pg_database WHERE datname='car02_r138_qa_ci') AND NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname LIKE 'car02_r138_%_ci') THEN 'R246_DISPOSABLE_DB_AND_ROLES_DELETED' ELSE 'R246_CLEANUP_FAILED' END" | grep -Fxq R246_DISPOSABLE_DB_AND_ROLES_DELETED
