                  WHERE shop_code=$1 AND user_sub=$2 FOR SHARE`,[requestedShop,identity.subject]);
                if(m.rows?.length!==1||m.rows[0].active!==true||m.rows[0].staff_role!==identity.role||m.rows[0].auth_version!==identity.authVersion)
                  err('V419_MEMBERSHIP_REVOKED');
                const ticket=await c.query(`SELECT active FROM public.car02_v418_staff_sessions_qa_only
                  WHERE shop_code=$1 AND user_sub=$2 AND session_id=$3 FOR SHARE`,[requestedShop,identity.subject,identity.jti]);
                if(ticket.rows?.length!==1||ticket.rows[0].active!==true)err('V419_SESSION_REVOKED');
