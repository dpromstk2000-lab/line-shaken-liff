            assert.equal((await pool.query('SELECT active FROM public.car02_v418_staff_sessions_qa_only WHERE session_id=$1',[freshJti])).rows[0].active,true);
            assert.equal(await count(),before+2);
            await revoke(freshJti);
            await denied(()=>tx(refreshed,'v418-concurrent-transaction'),'CAR02_TX_SESSION_REVOKED');
            console.log('V418_CONCURRENT_LOGOUT_ROW_LOCK_PASS: logout cannot overtake an already authorized transaction; subsequent calls blocked');
            console.log('V418_FINAL_NO_GO_HOLD: isolated CI-only session ledger; no provider logout webhook, no deployed jti storage or real signer, HTTP/Worker unchanged');
          } finally {await pool.end()}
          NODEJS
          node --check "$RUNNER_TEMP/v418-session-jti-qa.mjs"
          node "$RUNNER_TEMP/v418-session-jti-qa.mjs" | tee "$RUNNER_TEMP/v418-session-jti-qa.log"
          for marker in \
            V418_SIGNED_JTI_TENANT_SCOPE_PASS \
            V418_LOGOUT_REPLAY_AND_WRITE_DENIED_PASS \
            V418_NEW_JTI_IDEMPOTENT_REPLAY_PASS \
            V418_CONCURRENT_LOGOUT_ROW_LOCK_PASS \
            V418_FINAL_NO_GO_HOLD; do
            grep -Fq "$marker" "$RUNNER_TEMP/v418-session-jti-qa.log"
          done
      - name: V4.19 guarded R43 lookup/history with signed JTI and staff role fence (QA NO_GO HOLD)
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CAR02_DATABASE_URL:-}"
