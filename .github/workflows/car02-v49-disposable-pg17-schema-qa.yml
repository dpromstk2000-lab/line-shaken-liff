            return Object.freeze({subject:p.sub,shopCode:p.shop,role:p.role,authVersion:p.authVersion,jti:p.jti});
          }
          function createCar02ReadGuardV419({pool,adapter,verifySession}) {
            // All staff identity fields are derived from a validated server-issued signature.
            // Hold FOR SHARE membership + session locks for the entire actual R43 lookup/history.
