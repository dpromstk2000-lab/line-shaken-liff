                SET active=false,revoked_at=now() WHERE shop_code=$1 AND user_sub=$2 AND session_id=$3`,[shop,sub,freshJti]).then(()=>null,e=>e);
              await new Promise(r=>setTimeout(r,850));release();
              assert.equal((await held).status,'draft');caught=await pending;
