          async function deny(fn){await assert.rejects(Promise.resolve().then(fn),e=>e?.code==='V420_CLAIM_REJECTED');}
          async function seed(order,tag){const key=prefix+tag;return (await pool.query(`INSERT INTO public.ksh_car02_notification_outbox
            (work_order_id,event_type,channel,dedupe_key) VALUES($1,$2,'LINE',$3) RETURNING id`,[order,kind,key])).rows[0].id}
