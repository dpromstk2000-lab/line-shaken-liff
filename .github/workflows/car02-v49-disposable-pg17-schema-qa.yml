            await denied(()=>tx(token,key),'CAR02_TX_SESSION_REVOKED');
            await denied(()=>tx(token,'v418-old-token-new-operation'),'CAR02_TX_SESSION_REVOKED');
            assert.equal(await count(),before+1);
            console.log('V418_LOGOUT_REPLAY_AND_WRITE_DENIED_PASS: signed token still valid but session ledger revoked; membership version unchanged');
            const freshJti=randomUUID();await grant(freshJti);const refreshed=issue(freshJti);
            assert.equal((await tx(refreshed,key,()=>{throw Error('V418_NEW_JTI_DUPLICATE')})).id,first.id);
            assert.equal(await count(),before+1);
            console.log('V418_NEW_JTI_IDEMPOTENT_REPLAY_PASS: new session can replay original receipt without creating new work');
            // Concurrency: a transaction holding the JTI row lock is allowed to commit first.
            // A second connection's logout must not bypass that row lock.
            let entered,release;const didEnter=new Promise(r=>{entered=r}),mayFinish=new Promise(r=>{release=r});
            const held=tx(refreshed,'v418-concurrent-transaction',async t=>{
              entered();await mayFinish;await t.assertLinks({customerId,vehicleId,reservationId:null});
              return t.create({customerId,vehicleId,reservationId:null});
            });
