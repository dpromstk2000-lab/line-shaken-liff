            await pool.query('GRANT SELECT,INSERT,UPDATE ON public.car02_v418_staff_sessions_qa_only TO service_role');
            await pool.query(`INSERT INTO public.ksh_car02_staff_access(shop_code,user_sub,staff_role,active,grant_source)
