               p?.sub!==sub||!uuid.test(p?.sub||'')||p?.shop!==shop||p?.role!=='staff'||
               !Number.isSafeInteger(p?.authVersion)||p.authVersion<1||!uuid.test(p?.jti||'')||
               !Number.isSafeInteger(p?.iat)||!Number.isSafeInteger(p?.exp)||p.iat>now()||p.exp<=now()||p.exp-p.iat>90)
                err('V419_SESSION_INVALID');
