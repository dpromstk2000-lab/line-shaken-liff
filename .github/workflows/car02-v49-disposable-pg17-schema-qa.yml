          const pool=new Pool({host:'127.0.0.1',port:55432,database:'car02_v412_full',user:'postgres',
            password:process.env.PGPASSWORD,max:5,connectionTimeoutMillis:5000});
          const uuid=/^[a-f\d]{8}-(?:[a-f\d]{4}-){3}[a-f\d]{12}$/i;
          const shop='street_house_kitsuki',sub='00000000-0000-0000-0000-000000000425';
          const photoId='00000000-0000-0000-0000-000000000625',
            orderId='00000000-0000-0000-0000-000000000725',reportId='00000000-0000-0000-0000-000000000825';
          const photoPath=[shop,orderId,reportId,photoId+'.png'].join('/');
          const bytes=Uint8Array.from([137,80,78,71,13,10,26,10,0,0,0,0]);
          const digest=createHash('sha256').update(bytes).digest('hex');
          const meta={id:photoId,shop,orderId,reportId,bucket:'ksh-car02-private-photos',path:photoPath,
            mime:'image/png',bytes:bytes.length,sha256:digest};
          const {publicKey,privateKey}=generateKeyPairSync('ed25519');
          const now=()=>Math.floor(Date.now()/1000),b64=v=>Buffer.from(JSON.stringify(v)).toString('base64url');
          const decode=s=>JSON.parse(Buffer.from(s,'base64url').toString('utf8'));
