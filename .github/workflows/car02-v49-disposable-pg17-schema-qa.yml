            assert.equal(init.redirect,'error');
            assert.equal(input,'https://qa-only.supabase.co/storage/v1/object/authenticated/ksh-car02-private-photos/'+photoPath);
            if(holdDownload){signalEntered();await released;}
            return new Response(bytes,{status:200,headers:{'content-type':'image/png'}});
