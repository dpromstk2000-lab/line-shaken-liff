          async function denied(p,code){await assert.rejects(Promise.resolve().then(p),e=>e?.code===code||e?.message===code,code)}
          const count=async()=>Number((await pool.query('SELECT count(*)::int AS n FROM public.ksh_car02_work_orders WHERE shop_code=$1',[shop])).rows[0].n);
          async function grant(jti){await pool.query('INSERT INTO public.car02_v418_staff_sessions_qa_only(shop_code,user_sub,session_id,active) VALUES ($1,$2,$3,true)',[shop,sub,jti]);}
          async function revoke(jti){await pool.query('UPDATE public.car02_v418_staff_sessions_qa_only SET active=false,revoked_at=now() WHERE shop_code=$1 AND user_sub=$2 AND session_id=$3',[shop,sub,jti]);}
          try{
