          // CAR02 V4.19: isolated read-only authorization boundary / REVIEW-ONLY.
          // Uses actual R43 lookup/history on disposable PostgreSQL 17. NEVER deploy as an HTTP endpoint.
          import assert from 'node:assert/strict';
          import {generateKeyPairSync,randomUUID,sign,verify} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {createRequire} from 'node:module';
          const temp=process.env.RUNNER_TEMP;
          const require=createRequire(join(temp,'v413-deps','package.json'));
          const {Pool}=require('pg');
          const {createCar02PgAdapter}=await import(pathToFileURL(join(temp,'v418-disposable-copy','car02-pg-adapter.mjs')).href);
          const pool=new Pool({host:'127.0.0.1',port:55432,database:'car02_v412_full',user:'postgres',password:process.env.PGPASSWORD,max:8,connectionTimeoutMillis:5000});
          const adapter=createCar02PgAdapter(pool);
          const shop='street_house_kitsuki',sub='00000000-0000-0000-0000-000000000418';
          const {privateKey,publicKey}=generateKeyPairSync('ed25519');
          const now=()=>Math.floor(Date.now()/1000),b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
          const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          const err=code=>{const e=new Error(code);e.code=code;throw e};
          const parse=s=>JSON.parse(Buffer.from(s,'base64url').toString('utf8'));
          function issue(jti,{role='staff',shopCode=shop,authVersion=1,issuedAt=now(),expiresAt=now()+90}={}){
            const h=b64({alg:'EdDSA',typ:'JWT'}),p=b64({iss:'car02-v419-read-qa',aud:'car02-disposable-only',sub,shop:shopCode,role,authVersion,jti,iat:issuedAt,exp:expiresAt});
            const msg=h+'.'+p;
            return msg+'.'+sign(null,Buffer.from(msg),privateKey).toString('base64url');
          }
          function verifySession(token){
            if(typeof token!=='string'||!/^[-_A-Za-z0-9]+\.[-_A-Za-z0-9]+\.[-_A-Za-z0-9]+$/.test(token))err('V419_SESSION_INVALID');
            const parts=token.split('.');let h,p;
