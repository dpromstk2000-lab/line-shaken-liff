              AND o.dedupe_key LIKE $4 FOR UPDATE OF o`,[job,target,kind,prefix+'%']);
            if(r.rows.length!==1||r.rows[0].delivery_status!=='sending'||
               r.rows[0].claim_token!==token||new Date(r.rows[0].lease_until).getTime()<=Date.now())rejected();
