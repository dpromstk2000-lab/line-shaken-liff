          const viewer=createCar02PrivatePhotoViewR48({repository,releaseEnabled:async()=>true,
            baseUrl:'https://qa-only.supabase.co',serviceRoleKey:'qa_fake_storage_private_key_v425_nonsecret',fetchImpl});
          function issue({jti=randomUUID(),subId=sub,tenant=shop,role='staff',version=1,iat=now(),exp=now()+90,
