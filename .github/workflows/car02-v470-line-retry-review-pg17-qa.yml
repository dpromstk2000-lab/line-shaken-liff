name: CAR02 V4.70 LINE Retry Key and Acceptance Review Disposable PG17 (NO_GO HOLD)
# Review branch ONLY. No real LINE sends or API calls, credentials, production DB, or deployment.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-line-retry-review-r470.mjs'
      - 'car02-line-retry-review-r470.test.mjs'
      - 'car02-v470-disposable-line-retry-pg17.sql'
      - 'car02-v470-line-retry-offline-contract.json'
      - '.github/workflows/car02-v470-line-retry-review-pg17-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-line-retry-review:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v470_disposable_only
        ports:
          - 55470:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: v470_disposable_only
    steps:
      - name: Checkout review branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce original R52 release lock and no live provider keys
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = 'refs/heads/car02-v434-review-only'
          for key in CAR02_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!key:-}" || { echo 'V470_LIVE_PROVIDER_ENV_DENIED' >&2; exit 1; }
          done
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          for f in car02-line-retry-review-r470.mjs car02-line-retry-review-r470.test.mjs car02-v470-disposable-line-retry-pg17.sql car02-v470-line-retry-offline-contract.json; do test -s "$f"; done
          test -s .github/workflows/car02-v470-line-retry-review-pg17-qa.yml
          test ! -e car02-v470-line-retry-review-pg17-qa.yml
          echo V470_R52_HARD_RELEASE_LOCK_AND_NO_LIVE_LINE_OR_DB_PASS
      - name: Entire Node regression plus official LINE retry behavior mock
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-line-retry-review-r470.mjs
          node --check car02-line-retry-review-r470.test.mjs
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v470-node.log"
          tests=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v470-node.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v470-node.log")
          test "$tests" -ge 657
          test "$passed" = "$tests"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v470-node.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V470_RELEASE_LOCK,CAR02_V470_RETRY_WINDOW_MS} from './car02-line-retry-review-r470.mjs';
          const c=JSON.parse(readFileSync('car02-v470-line-retry-offline-contract.json','utf8'));
          assert.equal(c.releasePermitted,false);
          assert.equal(c.realDeliveryProven,false);
          assert.equal(c.usesLiveLine,false);
          assert.equal(c.retryWindowMs,86400000);
          assert.equal(CAR02_V470_RELEASE_LOCK,true);
          assert.equal(CAR02_V470_RETRY_WINDOW_MS,86400000);
          assert.equal(c.unverifiedCommercialConditions.length,7);
          console.log('V470_NODE_OFFLINE_LINE_ACCEPTANCE_NOT_DELIVERY_AND_EXPIRED_KEY_PASS');
          NODE
      - name: Disposable PostgreSQL17 retry key cross-tenant and expiry QA
        shell: bash
        run: |
          set -euo pipefail
          pg(){ docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17 psql -X -Atq -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55470 -U postgres "$@"; }
          pg -d postgres -c 'CREATE DATABASE car02_v470_disposable' > "$RUNNER_TEMP/v470-created.txt"
          pg -d car02_v470_disposable -f /workspace/car02-v470-disposable-line-retry-pg17.sql | tee "$RUNNER_TEMP/v470-pg.log"
          for marker in V470_PG17_PRIVATE_ROLE_AND_FUNCTION_DENY_PASS V470_PG17_TENANT_RECIPIENT_AND_PAYLOAD_BOUND_REVIEW_PASS V470_PG17_RETRY_24H_EXPIRY_AND_CLOCK_ROLLBACK_DENY_PASS V470_PG17_GLOBAL_RETRY_KEY_UNIQUE_CROSS_SHOP_PASS V470_FINAL_RELEASE_NO_GO_HOLD_TRUE; do
            grep -Fxq "$marker" "$RUNNER_TEMP/v470-pg.log"
          done
          pids=()
          for n in 1 2 3 4 5 6 7 8; do
            (pg -d car02_v470_disposable -c "BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY; SELECT count(*) FROM v470_private.qa_attempts; ROLLBACK;" > "$RUNNER_TEMP/v470-rd-$n") &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          for n in 1 2 3 4 5 6 7 8; do grep -Fxq '2' "$RUNNER_TEMP/v470-rd-$n"; done
          test "$(pg -d car02_v470_disposable -c 'SELECT count(*) FROM v470_private.qa_attempts')" = '2'
          echo V470_PG17_EIGHT_READERS_SOURCE_UNCHANGED_PASS
          echo V470_FINAL_RELEASE_NO_GO_HOLD_TRUE
