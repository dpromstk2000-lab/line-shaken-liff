      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter
          import re
          import subprocess
          import tempfile

          text = Path("dashboard.html").read_text(encoding="utf-8")

          class Parser(HTMLParser):
              pass

          parser = Parser()
          parser.feed(text)
          parser.close()

          ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
          duplicates = sorted(key for key, count in Counter(ids).items() if count > 1)
          if duplicates:
              raise SystemExit("duplicate IDs: " + ", ".join(duplicates))

          required = [
              "STEP KSH-NEXT-3: RECEPTION UNIFY",
              'id="reservationReceptionChannel"',
              'id="reservationChannelFilter"',
              "openNewReservationFormWithChannel",
              "inferReservationReceptionChannel",
              "applyReceptionChannelMarker",
              "stripReceptionChannelMarker",
              "badgeReceptionChannel",
              "【受付経路：",
              "<th>受付経路</th>",
              'colspan="10"',
              "STEP KSH-NEXT-3",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit("missing marker: " + marker)

          if text.count('id="reservationReceptionChannel"') != 1:
              raise SystemExit("reservationReceptionChannel ID count is not 1")

          if text.count('id="reservationChannelFilter"') != 1:
              raise SystemExit("reservationChannelFilter ID count is not 1")

          inline_scripts = []
          for attrs, body in re.findall(
              r"<script\b([^>]*)>(.*?)</script>",
              text,
              flags=re.I | re.S,
          ):
              if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                  continue
              if body.strip():
                  inline_scripts.append(body)

          if not inline_scripts:
              raise SystemExit("inline JavaScript was not found")

          for index, script in enumerate(inline_scripts, start=1):
              temp = Path(tempfile.gettempdir()) / f"ksh-next-3-script-{index}.js"
              temp.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(temp)], check=True)
              print("JavaScript syntax OK:", index)

          print("HTML parser OK")
          print("ID uniqueness OK:", len(ids), "IDs")
          PY

      - name: Test reception marker logic
        shell: bash
        run: |
          set -euo pipefail

          node <<'JS'
          const pattern = /^【受付経路：(LINE|電話|店頭|管理者代理)】\s*/;

          function extract(memo) {
            const match = String(memo || "").match(pattern);
            return match ? match[1] : "";
          }

          function strip(memo) {
            return String(memo || "").replace(pattern, "").trim();
          }

          function apply(memo, channel) {
            const normalized = ["LINE", "電話", "店頭", "管理者代理"].includes(channel)
              ? channel
              : "管理者代理";
            const plain = strip(memo);
            return `【受付経路：${normalized}】${plain ? `\n${plain}` : ""}`;
          }

          const cases = [
            ["電話", "代車希望"],
            ["店頭", ""],
            ["LINE", "車検相談"],
            ["管理者代理", "既存客"]
          ];

          for (const [channel, memo] of cases) {
            const saved = apply(memo, channel);
            if (extract(saved) !== channel) throw new Error(`extract failed: ${channel}`);
            if (strip(saved) !== memo) throw new Error(`strip failed: ${channel}`);
            if ((saved.match(/【受付経路：/g) || []).length !== 1) {
              throw new Error(`duplicate marker: ${channel}`);
            }
          }

          const replaced = apply("【受付経路：電話】\n古いメモ", "店頭");
          if (extract(replaced) !== "店頭") throw new Error("marker replacement failed");
          if (strip(replaced) !== "古いメモ") throw new Error("memo preservation failed");

          console.log("Reception marker logic OK");
          JS

          test -f .dpro/ksh-next/ksh-next-3-result.yml
          grep -q 'step: "STEP KSH-NEXT-3"' .dpro/ksh-next/ksh-next-3-result.yml
          grep -q 'database_changed: false' .dpro/ksh-next/ksh-next-3-result.yml
          grep -q 'worker_changed: false' .dpro/ksh-next/ksh-next-3-result.yml
          grep -q 'historical_data_reclassified_automatically: false' .dpro/ksh-next/ksh-next-3-result.yml
          grep -q 'current_step: "STEP KSH-NEXT-3"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-4"' .dpro/ksh-next/plan.yml | grep -q 'status: "next"'

          echo "KSH-NEXT-3 policy checks passed."

