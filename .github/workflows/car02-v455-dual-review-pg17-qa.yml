name: CAR02 V4.55 Dual Reviewer Signoff + V454R1 Repair PG17 (NO_GO HOLD)
# STRICTLY REVIEW ONLY. Corrected V454 SQL, synthetic V455 review, disposable PG17.
# No production Supabase, Worker, LINE, delivery claims, real IAM or deployment.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-v454-disposable-pg17.sql'
      - 'car02-manual-review-dual-control-r455.mjs'
      - 'car02-manual-review-dual-control-r455.test.mjs'
      - 'car02-v455-disposable-pg17.sql'
      - '.github/workflows/car02-v455-dual-review-pg17-qa.yml'
      - 'car02-edge-entry-r52.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-v454r1-v455-dual-review:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v455_disposable_only
        ports:
          - 55455:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: v455_disposable_only
    steps:
      - name: Checkout isolated review branch without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run 347 isolated Node tests and mandatory release-lock checks
        shell: bash
        run: |
          set -euo pipefail
          for name in CAR02_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN; do
            test -z "${!name:-}" || { echo "Unexpected live secret: $name" >&2; exit 1; }
          done
          for file in car02-manual-review-dual-control-r455.mjs car02-manual-review-dual-control-r455.test.mjs car02-v455-disposable-pg17.sql car02-v454-disposable-pg17.sql car02-v453-disposable-pg17.sql car02-edge-entry-r52.ts; do test -s "$file"; done
          test "$(sha256sum car02-v453-disposable-pg17.sql | cut -d' ' -f1)" = '2c04737685ee335856a275c59ccd85169387c856102360a80091847a603a4b6d'
          grep -Fq 'ON CONFLICT ON CONSTRAINT qa_claims_pkey DO NOTHING' car02-v454-disposable-pg17.sql
          ! grep -Fq 'ON CONFLICT(shop_code,event_id) DO NOTHING' car02-v454-disposable-pg17.sql
          node --check car02-manual-review-dual-control-r455.mjs
          node --check car02-manual-review-dual-control-r455.test.mjs
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v455-node.log"
          grep -Fxq '# tests 347' "$RUNNER_TEMP/v455-node.log"
          grep -Fxq '# pass 347' "$RUNNER_TEMP/v455-node.log"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v455-node.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V455_RELEASE_LOCK,CAR02_V455_REVIEW_SQL} from './car02-manual-review-dual-control-r455.mjs';
          assert.equal(CAR02_V455_RELEASE_LOCK,true);
          assert.equal(CAR02_V455_REVIEW_SQL,'SELECT stage,case_id FROM v455_private.qa_review_attest($1::text,$2::uuid,$3::uuid,$4::text,$5::text)');
          const original=readFileSync('car02-edge-entry-r52.ts','utf8');
          assert.match(original,/const\s+CAR02_RELEASE_LOCK\s*=\s*true\s*;/);
          assert.doesNotMatch(original,/manual-review-dual-control-r455|v455_private/);
          const a=readFileSync('car02-outbox-claim-r454.mjs','utf8');
          const b=readFileSync('car02-atomic-job-outbox-r453.mjs','utf8');
          assert.match(a,/RELEASE_LOCK\s*=\s*true/);
          assert.match(b,/RELEASE_LOCK\s*=\s*true/);
          console.log('V455_NODE_347_HARD_RELEASE_LOCKS_AND_V454_R1_SOURCE_PASS');
          console.log('V455_REAL_IAM_EXTERNAL_WORM_AND_PROVIDER_DELIVERY_UNVERIFIED_NO_GO');
          NODE
      - name: Real disposable PG17 V453 source, V454R1 fixed claim, V455 two-person review and eight competing supervisors
        shell: bash
        run: |
          set -euo pipefail
          pg(){ docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17 psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55455 -U postgres "$@"; }
          pg -d postgres -c 'CREATE DATABASE car02_v455_disposable' >/dev/null
          pg -d car02_v455_disposable -f /workspace/car02-v453-disposable-pg17.sql | tee "$RUNNER_TEMP/v455-v453.log" > /dev/null
          grep -Fxq V453_PG17_ATOMIC_JOB_RECEIPT_OUTBOX_PASS "$RUNNER_TEMP/v455-v453.log"
          pg -d car02_v455_disposable -f /workspace/car02-v454-disposable-pg17.sql | tee "$RUNNER_TEMP/v455-v454r1.log"
          for marker in V454_PG17_DISPOSABLE_PRIVILEGE_GUARDS_PASS V454_PG17_SINGLE_CLAIM_TENANT_NONCE_AND_REVIEW_PASS V454_PG17_CLAIM_LEDGER_ONE_WAY_IMMUTABLE_PASS V454_PG17_INTEGRATED_V453_PENDING_SOURCE_PASS; do
            grep -Fxq "$marker" "$RUNNER_TEMP/v455-v454r1.log"
          done
          echo V454_R1_AMBIGUOUS_OUT_PARAMETER_CONFLICT_SQL_REPAIRED_PASS
          pg -d car02_v455_disposable -f /workspace/car02-v455-disposable-pg17.sql | tee "$RUNNER_TEMP/v455-pg.log"
          for marker in V455_PG17_PRIVATE_REVIEW_ROSTER_AND_PUBLIC_DENIED_PASS V455_PG17_DISTINCT_INVESTIGATOR_SUPERVISOR_ATOMIC_SIGNOFF_PASS V455_PG17_DUPLICATE_CROSSSHOP_REVOKED_AND_SOURCE_PROTECTED_PASS V455_PG17_APPEND_ONLY_AND_IRREVERSIBLE_CASE_PASS V455_PG17_EIGHT_REVIEWERS_RACE_FIXTURE_READY_PASS; do
            grep -Fxq "$marker" "$RUNNER_TEMP/v455-pg.log"
          done
          # Eight distinct synthetic supervisors compete for the one signoff slot.
          pids=()
          for i in 1 2 3 4 5 6 7 8; do
            (
              if pg -Atq -d car02_v455_disposable -c "SELECT stage FROM v455_private.qa_review_attest('qa_shop_a','00000000-0000-0000-0000-000000004541','00000000-0000-0000-0000-00000000456$i','close_no_delivery_claim',repeat('e',64))" > "$RUNNER_TEMP/v455-race-$i.out" 2> "$RUNNER_TEMP/v455-race-$i.err"; then
                echo ACCEPTED > "$RUNNER_TEMP/v455-race-$i.status"
              elif grep -Fq 'V455_CASE_ALREADY_CLOSED' "$RUNNER_TEMP/v455-race-$i.err"; then
                echo DENIED > "$RUNNER_TEMP/v455-race-$i.status"
              else
                cat "$RUNNER_TEMP/v455-race-$i.err" >&2
                echo BAD > "$RUNNER_TEMP/v455-race-$i.status"
              fi
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          winner=0;loser=0
          for i in 1 2 3 4 5 6 7 8; do
            state=$(cat "$RUNNER_TEMP/v455-race-$i.status")
            if test "$state" = ACCEPTED; then
              grep -Fxq 'closed_without_delivery_assertion' "$RUNNER_TEMP/v455-race-$i.out"
              winner=$((winner+1))
            elif test "$state" = DENIED; then loser=$((loser+1));
            else echo "V455_BAD_SUPERVISOR_$i" >&2; exit 1; fi
          done
          test "$winner:$loser" = '1:7' || { echo "V455_SUPERVISOR_SIGNOFF_RACE_FAILED: $winner:$loser" >&2; exit 1; }
          counts=$(pg -Atq -d car02_v455_disposable -c "SELECT (SELECT count(*) FROM v455_private.qa_review_audit)::text||':'||(SELECT count(*) FROM v455_private.qa_review_audit WHERE event_id='00000000-0000-0000-0000-000000004541')::text||':'||(SELECT stage FROM v455_private.qa_cases WHERE event_id='00000000-0000-0000-0000-000000004541')||':'||(SELECT state FROM v454_private.qa_claims WHERE event_id='00000000-0000-0000-0000-000000004541')||':'||(SELECT dispatch_state FROM v453_private.qa_outbox WHERE event_id='00000000-0000-0000-0000-000000004541')")
          test "$counts" = '4:2:closed_without_delivery_assertion:manual_review:pending' || { echo "V455_REVIEW_LEDGER_STATE_MISMATCH: $counts" >&2;exit 1; }
          echo V455_PG17_EIGHT_SUPERVISORS_EXACTLY_ONE_SIGNOFF_PASS
          echo V455_PG17_TWO_STEPS_NO_DELIVERY_ASSERTION_NO_REQUEUE_PASS
          echo V455_FINAL_RELEASE_NO_GO_HOLD_TRUE
