name: DPRO CAR02 R120 PG17 Cancel Rebook and Audit QA (Isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: car02-r120-disposable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r120-disposable-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r120-disposable-db-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAR02_RELEASE_LOCK: 'true'
      R120_DISPOSABLE_QA: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: car02_r120_qa_ci
    steps:
      - name: Read-only checkout without retained credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify seven protected source hashes and release lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence-r120
          python3 car02_r118_readonly_source_gate.py --strict --out qa-evidence-r120/protected-sources.json
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
      - name: Verify offline safety contract and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-r120-pg17-lifecycle-qa.mjs
          node --test test-car02-r120-contract.mjs > qa-evidence-r120/contract-tests.txt
          grep -Fq '# fail 0' qa-evidence-r120/contract-tests.txt
          tail -n 7 qa-evidence-r120/contract-tests.txt
      - name: Install ephemeral PostgreSQL driver only in runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Create disposable PG17 database and isolated roles
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r120_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r120_qa_ci -v ON_ERROR_STOP=1 < R120_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql > qa-evidence-r120/fixture-ready.log
          grep -Fxq R120_DISPOSABLE_PG17_LIFECYCLE_SCHEMA_READY qa-evidence-r120/fixture-ready.log
      - name: Check concurrency cancel rebook stale retry and immutable audit scope
        shell: bash
        env:
          R120_EVIDENCE_FILE: qa-evidence-r120/pg17-source-proof.json
        run: |
          set -euo pipefail
          node car02-r120-pg17-lifecycle-qa.mjs > qa-evidence-r120/pg17-source.log
          grep -Fxq R120_PG17_CANCELLATION_REBOOK_AUDIT_RLS_PASS qa-evidence-r120/pg17-source.log
          grep -Fxq R120_RELEASE_NO_GO_MIGRATION_HOLD qa-evidence-r120/pg17-source.log
      - name: Dump synthetic DB test corruption refusal and restore into separate DB
        shell: bash
        env:
          PGDATABASE: car02_r120_restore_ci
          R120_EVIDENCE_FILE: qa-evidence-r120/pg17-restore-proof.json
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          docker exec -i "$CID" pg_dump -U postgres -d car02_r120_qa_ci --format=custom --no-owner > /tmp/car02-r120-ci-synthetic.dump
          sha256sum /tmp/car02-r120-ci-synthetic.dump | awk '{print $1}' > qa-evidence-r120/backup-sha256.txt
          docker exec -i "$CID" pg_restore -l < /tmp/car02-r120-ci-synthetic.dump > /dev/null
          head -c 16 /tmp/car02-r120-ci-synthetic.dump > /tmp/car02-r120-ci-corrupt.dump
          if docker exec -i "$CID" pg_restore -l < /tmp/car02-r120-ci-corrupt.dump > /dev/null 2>&1; then
            echo R120_CORRUPT_DUMP_ACCEPTED >&2
            exit 1
          fi
          echo R120_CORRUPT_DUMP_REJECTED > qa-evidence-r120/corrupt-guard.txt
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r120_restore_ci;'
          docker exec -i "$CID" pg_restore -U postgres -d car02_r120_restore_ci --no-owner < /tmp/car02-r120-ci-synthetic.dump
          node car02-r120-pg17-lifecycle-qa.mjs --restore > qa-evidence-r120/pg17-restore.log
          grep -Fxq R120_PG17_RESTORE_LIFECYCLE_RLS_PASS qa-evidence-r120/pg17-restore.log
          grep -Fxq R120_RELEASE_NO_GO_MIGRATION_HOLD qa-evidence-r120/pg17-restore.log
      - name: Always delete disposable CI databases synthetic dump and roles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r120_restore_ci WITH (FORCE);'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r120_qa_ci WITH (FORCE);'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP ROLE IF EXISTS car02_r120_a_ci;'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP ROLE IF EXISTS car02_r120_b_ci;'
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS(SELECT 1 FROM pg_database WHERE datname IN ('car02_r120_qa_ci','car02_r120_restore_ci')) AND NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname IN ('car02_r120_a_ci','car02_r120_b_ci')) THEN 'R120_DISPOSABLE_RESOURCES_DELETED' ELSE 'R120_CLEANUP_FAILED' END" | grep -Fxq R120_DISPOSABLE_RESOURCES_DELETED
          rm -f /tmp/car02-r120-ci-synthetic.dump /tmp/car02-r120-ci-corrupt.dump
      - name: Verify release and migration remain closed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('qa-evidence-r120/pg17-source-proof.json').read_text())
          b=json.loads(Path('qa-evidence-r120/pg17-restore-proof.json').read_text())
          for x in (a,b):
            assert x['decision']=='NO_GO' and x['migration']=='HOLD'
            assert x['productionDataUsed'] is False and x['productionReady'] is False
            assert x['sourceRows']==4 and x['auditRows']==6
          print('R120_CLOSED_GATE_SOURCE_AND_RESTORE_PASS')
          PY
      - name: Upload synthetic non-secret QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car02-r120-disposable-pg17-proof
          path: qa-evidence-r120/
          retention-days: 7
          if-no-files-found: warn
