name: DPRO CAR02 R93D Durable Cleanup Outbox Isolated QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r93d-cleanup-outbox-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only-for-ephemeral-github-runner
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository source (read only; no production secrets)
        uses: actions/checkout@v5
      - name: Validate original published release gates remain closed
        run: |
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          node car02-integration-audit-r80.mjs > /tmp/r93d-release.json
          node --input-type=module -e 'import fs from "node:fs";const x=JSON.parse(fs.readFileSync("/tmp/r93d-release.json"));if(!x.staticEvidenceOk||x.productionReady!==false||x.releaseDecision!=="NO_GO"||x.migrationDecision!=="HOLD")process.exit(1);console.log("R93D NO_GO and HOLD preserved")'
      - name: Validate isolated worker syntax and SQL contract
        run: |
          node --check car02-r93d-cleanup-worker-isolated.mjs
          node --check test-car02-r93d-cleanup-worker-isolated.mjs
          node --check test-car02-r93d-sql-safety.mjs
          node --test test-car02-r93d-cleanup-worker-isolated.mjs test-car02-r93d-sql-safety.mjs
      - name: Preserve R93C policy security regressions
        run: node --test test-car02-r93c-photo-cleanup-policy.mjs
      - name: Exercise disposable PostgreSQL 17, never Supabase
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < R93D_DURABLE_CLEANUP_OUTBOX_QA_ONLY.sql
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < R93D_OUTBOX_PG17_ASSERT_QA_ONLY.sql
      - name: Re-run R83/R84 DB/photo and R85 staff isolation tests
        run: |
          node --test test-car02-pg-photo-repository-r83.mjs test-car02-photo-pipeline-isolated-r84.mjs
          node --test test-car02-staff-access-http-r85.mjs test-car02-r85-r70-integration.mjs test-car02-r85-safety.mjs
      - name: Reaffirm never deploy from this workflow
        run: |
          node --input-type=module <<'R93D_GUARD'
          import {readFileSync} from 'node:fs';
          const src = readFileSync('.github/workflows/car02-r93d-cleanup-outbox-isolated-qa.yml', 'utf8');
          // Exclude this self-inspection block so forbidden-token examples cannot trigger a false positive.
          const ownHeader = '      - name: ' + ['Reaffirm never', 'deploy from this workflow'].join(' ');
          const afterHeader = '      - name: ' + ['Remove local release', 'evidence'].join(' ');
          const start = src.indexOf(ownHeader);
          // Exclude precisely this YAML step, stopping at the VERY NEXT step (not a later marker).
          const next = src.slice(start + ownHeader.length).match(/\n      - name: /);
          const end = next ? start + ownHeader.length + next.index : -1;
          if (start < 0 || end <= start || src.indexOf(ownHeader, start + ownHeader.length) !== -1 ||
              !src.slice(end + 1).startsWith(afterHeader + '\n'))
            throw new Error('R93D_GUARD_STRUCTURE_INVALID');
          const checked = src.slice(0, start) + src.slice(end);
          const forbidden = [
            /(?:^|\n)\s*(?:deploy|environment)\s*:/i,
            /\bwrangler\s+deploy\b/i,
            /\bsupabase\s+(?:db\s+push|functions\s+deploy)\b/i,
            /\bnpx\s+(?:wrangler|supabase)\b/i,
            /\bsecrets\s*[.:]/i,
            /\b(?:github\.token|GITHUB_TOKEN|GITHUB_PAT)\b/i
          ];
          const actions = checked.match(/^\s*uses:\s*.+$/gm) || [];
          if (actions.length !== 1 || actions[0].trim() !== 'uses: actions/checkout@v5')
            throw new Error('R93D_UNAPPROVED_ACTION');
          if (forbidden.some(pattern => pattern.test(checked)))
            throw new Error('R93D_FORBIDDEN_DEPLOY_STEP');
          if (!checked.includes('contents: read') || checked.includes('contents: write'))
            throw new Error('R93D_PERMISSIONS_CHANGED');
          console.log('R93D isolated workflow guard PASS — no deploy commands, no secrets, no write permission');
          R93D_GUARD
      - name: Remove local release evidence
        if: always()
        run: rm -f /tmp/r93d-release.json
