name: CAR02 V4.71 Raw LINE Webhook Signature and Replay PG17 (NO_GO HOLD)
# REVIEW-ONLY. Synthetic HMAC, mock event fixtures and disposable PG17.
# No LINE provider secret, no real webhook ingress, no Supabase, no dispatch/deploy.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-line-webhook-review-r471.mjs'
      - 'car02-line-webhook-review-r471.test.mjs'
      - 'car02-v471-disposable-line-webhook-pg17.sql'
      - 'car02-v471-line-webhook-offline-contract.json'
      - '.github/workflows/car02-v471-line-webhook-signature-pg17-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-raw-webhook-replay:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v471_disposable_only
        ports:
          - 55471:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: v471_disposable_only
    steps:
      - name: Checkout review branch without credential persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm actual R52 lock, no provider secrets, and expected file layout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = 'refs/heads/car02-v434-review-only'
          for name in CAR02_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!name:-}" || { echo V471_LIVE_CREDENTIAL_DENIED >&2; exit 1; }
          done
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          for f in car02-line-webhook-review-r471.mjs car02-line-webhook-review-r471.test.mjs car02-v471-disposable-line-webhook-pg17.sql car02-v471-line-webhook-offline-contract.json; do test -s "$f"; done
          test -s .github/workflows/car02-v471-line-webhook-signature-pg17-qa.yml
          test ! -e car02-v471-line-webhook-signature-pg17-qa.yml
          echo V471_R52_LOCK_AND_NO_REAL_LINE_OR_DB_PASS
      - name: Execute all 683 or more Node regression tests including official LINE HMAC example
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-line-webhook-review-r471.mjs
          node --check car02-line-webhook-review-r471.test.mjs
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v471-node.log"
          tests=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v471-node.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v471-node.log")
          test "$tests" -ge 683
          test "$passed" = "$tests"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v471-node.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V471_RELEASE_LOCK} from './car02-line-webhook-review-r471.mjs';
          const c=JSON.parse(readFileSync('car02-v471-line-webhook-offline-contract.json','utf8'));
          assert.equal(CAR02_V471_RELEASE_LOCK,true);
          for(const p of ['releasePermitted','usesRealLine','webhookProcessed','eventAcknowledged','lineDeliveryProven'])assert.equal(c[p],false);
          assert.equal(c.unverifiedCommercialConditions.length,7);
          console.log('V471_OFFICIAL_RAW_HMAC_AND_DEDUP_NODE_REGRESSIONS_PASS');
          NODE
      - name: Disposable PG17 cross-tenant replay collision and 8 simultaneous registrations
        shell: bash
        run: |
          set -euo pipefail
          pg(){ docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17 psql -X -Atq -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55471 -U postgres "$@"; }
          pg -d postgres -c 'CREATE DATABASE car02_v471_disposable' >/dev/null
          pg -d car02_v471_disposable -f /workspace/car02-v471-disposable-line-webhook-pg17.sql | tee "$RUNNER_TEMP/v471-pg.log"
          for mark in V471_PG17_PRIVATE_LEDGER_AND_ROLE_DENY_PASS V471_PG17_DUPLICATE_COLLISION_AND_CROSS_SHOP_REVIEW_PASS V471_PG17_GLOBAL_EVENT_ID_UNIQUENESS_CROSS_TENANT_PASS V471_FINAL_RELEASE_NO_GO_HOLD_TRUE; do
            grep -Fxq "$mark" "$RUNNER_TEMP/v471-pg.log"
          done
          pids=()
          for n in 1 2 3 4 5 6 7 8; do
            (pg -d car02_v471_disposable -c "WITH ins AS (INSERT INTO v471_private.qa_webhook_events VALUES ('01ARZ3NDEKTSV4RRFFQ69G5FAY','qa_shop_a',repeat('d',64),1800000000002) ON CONFLICT (event_id) DO NOTHING RETURNING 1) SELECT count(*) FROM ins" > "$RUNNER_TEMP/v471-race-$n") &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          success=0; collision=0
          for n in 1 2 3 4 5 6 7 8; do
            r=$(cat "$RUNNER_TEMP/v471-race-$n")
            if [ "$r" = '1' ]; then success=$((success+1));
            elif [ "$r" = '0' ]; then collision=$((collision+1));
            else echo V471_UNEXPECTED_WEBHOOK_RESULT >&2; exit 1; fi
          done
          test "$success" -eq 1
          test "$collision" -eq 7
          test "$(pg -d car02_v471_disposable -c 'SELECT count(*) FROM v471_private.qa_webhook_events')" = '3'
          echo V471_PG17_EIGHT_CONCURRENT_EVENT_INSERT_ONE_WINNER_PASS
          echo V471_FINAL_RELEASE_NO_GO_HOLD_TRUE
