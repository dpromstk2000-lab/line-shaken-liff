name: DPRO CAR02 R137 PG17 Customer Ownership QA (Isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: car02-r137-disposable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r137-customer-ownership-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r137-disposable-container-admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAR02_RELEASE_LOCK: 'true'
      R137_DISPOSABLE_QA: 'yes'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read-only checkout without retained credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Protect seven originals and enforce closed production gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence-r137
          python3 car02_r118_readonly_source_gate.py --strict --out qa-evidence-r137/protected-originals.json | tee qa-evidence-r137/protected.log
          grep -Fxq R118_READONLY_GATE_PASS qa-evidence-r137/protected.log
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
      - name: Python syntax and repeated offline contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ast car02_r137_pg17_customer_qa.py > /dev/null
          node --check test-car02-r137-contract.mjs
          for i in 1 2 3; do
            node --test test-car02-r137-contract.mjs > "qa-evidence-r137/contract-${i}.log" 2>&1
            grep -Fxq '# pass 34' "qa-evidence-r137/contract-${i}.log"
            grep -Fxq '# fail 0' "qa-evidence-r137/contract-${i}.log"
          done
      - name: Create exact disposable PostgreSQL 17 schema and customer principals
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r137_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r137_qa_ci -v ON_ERROR_STOP=1 < R137_PG17_CUSTOMER_OWNERSHIP_QA_ONLY.sql > qa-evidence-r137/schema.log
          grep -Fxq R137_DISPOSABLE_PG17_SCHEMA_READY qa-evidence-r137/schema.log
      - name: Verify per-customer ownership concurrent approval RLS and idempotency
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          python3 car02_r137_pg17_customer_qa.py source --cid "$CID" --evidence qa-evidence-r137/source.json | tee qa-evidence-r137/source.log
          grep -Fxq R137_PG17_CUSTOMER_OBJECT_ISOLATION_PASS qa-evidence-r137/source.log
          grep -Fxq R137_RELEASE_NO_GO_MIGRATION_HOLD qa-evidence-r137/source.log
      - name: Reject corrupt backup and verify restored customer ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          docker exec -i "$CID" pg_dump -U postgres -d car02_r137_qa_ci --format=custom --no-owner > /tmp/car02-r137-disposable.dump
          sha256sum /tmp/car02-r137-disposable.dump | awk '{print $1}' > qa-evidence-r137/dump-sha256.txt
          docker exec -i "$CID" pg_restore -l < /tmp/car02-r137-disposable.dump > /dev/null
          head -c 16 /tmp/car02-r137-disposable.dump > /tmp/car02-r137-corrupt.dump
          if docker exec -i "$CID" pg_restore -l < /tmp/car02-r137-corrupt.dump > /dev/null 2>&1; then
            echo R137_CORRUPT_BACKUP_ACCEPTED >&2
            exit 1
          fi
          echo R137_CORRUPT_BACKUP_REJECTED > qa-evidence-r137/corrupt-backup.txt
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r137_restore_ci;'
          docker exec -i "$CID" pg_restore -U postgres -d car02_r137_restore_ci --no-owner < /tmp/car02-r137-disposable.dump
          python3 car02_r137_pg17_customer_qa.py restore --cid "$CID" --source-evidence qa-evidence-r137/source.json --evidence qa-evidence-r137/restore.json | tee qa-evidence-r137/restore.log
          grep -Fxq R137_PG17_RESTORE_CUSTOMER_RLS_REPLAY_PASS qa-evidence-r137/restore.log
          grep -Fxq R137_RELEASE_NO_GO_MIGRATION_HOLD qa-evidence-r137/restore.log
      - name: Always destroy disposable databases principals and backup files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r137_restore_ci WITH (FORCE);'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r137_qa_ci WITH (FORCE);'
          for role in car02_r137_a_staff_ci car02_r137_a_one_ci car02_r137_a_two_ci car02_r137_b_staff_ci car02_r137_b_one_ci; do
            docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS $role;"
          done
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS(SELECT 1 FROM pg_database WHERE datname IN ('car02_r137_restore_ci','car02_r137_qa_ci')) AND NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname LIKE 'car02_r137_%_ci') THEN 'R137_DISPOSABLE_RESOURCES_DELETED' ELSE 'R137_CLEANUP_FAILED' END" | grep -Fxq R137_DISPOSABLE_RESOURCES_DELETED
          rm -f /tmp/car02-r137-disposable.dump /tmp/car02-r137-corrupt.dump
          echo R137_DISPOSABLE_RESOURCES_DELETED > qa-evidence-r137/cleanup.txt
      - name: Confirm public release NO_GO migration HOLD and synthetic only evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          for fn in ('source.json','restore.json'):
            x=json.loads((Path('qa-evidence-r137')/fn).read_text())
            assert x['release']=='NO_GO' and x['migration']=='HOLD' and x['syntheticOnly'] is True
            assert x['snapshot']['a1']['counts']['service_cases']==1
            assert x['snapshot']['a2']['counts']['service_cases']==1
            assert x['snapshot']['as']['counts']['service_cases']==2
          assert Path('qa-evidence-r137/cleanup.txt').read_text().strip()=='R137_DISPOSABLE_RESOURCES_DELETED'
          print('R137_ISOLATED_PG17_NO_GO_HOLD_PASS')
          PY
      - name: Upload sanitized synthetic-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car02-r137-disposable-customer-ownership-proof
          path: qa-evidence-r137/
          retention-days: 7
          if-no-files-found: warn
