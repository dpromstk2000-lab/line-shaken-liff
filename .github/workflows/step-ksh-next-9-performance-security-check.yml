              '''          このページはブラウザ内に管理コードを保存します。共有PCで使った後は、ブラウザの履歴・保存情報に注意してください。''',
              '''          管理コードはこのタブを閉じるまでの一時保存です。以前の永続保存値が残っている場合は自動削除します。共有PCでは確認後に「削除」を押してください。''',
              "session storage notice",
          )

          text = replace_once(
              text,
              '''      <div class="panel-body">
                  <div id="checkList" class="check-list"></div>
                </div>''',
              '''      <div class="panel-body">
                  <div class="audit-metrics">
                    <div class="audit-metric"><span>OK</span><strong id="auditOkCount">0</strong><small>正常に完了した検査</small></div>
                    <div class="audit-metric"><span>注意</span><strong id="auditWarnCount">0</strong><small>動作するが速度・容量を確認</small></div>
                    <div class="audit-metric"><span>NG</span><strong id="auditNgCount">0</strong><small>営業前に修正が必要</small></div>
                    <div class="audit-metric"><span>検査時間</span><strong id="auditDuration">-</strong><small>全チェックの実行時間</small></div>
                  </div>
                  <div class="security-note">
