name: STEP KSH-NEXT-9 Performance Security Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/step-ksh-next-9-performance-security-check.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step-ksh-next-9-performance-security-check
  cancel-in-progress: false

jobs:
  performance-security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Save pre-change commit
        shell: bash
        run: |
          set -euo pipefail
          echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify KSH-NEXT-8 completion
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f dashboard.html
          test -f owner-ipad.html
          test -f member.html
          test -f system-check.html
          test -f ksh-next-5-owner-estimate.js
          test -f ksh-next-5-member-estimate.js
          test -f ksh-next-6-ipad-operations.js
          test -f ksh-next-7-member-history.js
          test -f ksh-next-8-followup-cockpit.js
          test -f .dpro/ksh-next/plan.yml
          test -f .dpro/ksh-next/ksh-next-8-result.yml

          grep -q 'STEP KSH-NEXT-8</title>' dashboard.html
          grep -q 'STEP KSH-NEXT-6' owner-ipad.html
          grep -q 'STEP KSH-NEXT-7' member.html
          grep -q 'STEP KSH-BRUSH-9' system-check.html
          grep -q 'ksh-next-8-followup-cockpit.js' dashboard.html
          grep -q 'ksh-next-6-ipad-operations.js' owner-ipad.html
          grep -q 'ksh-next-7-member-history.js' member.html
          grep -q 'current_step: "STEP KSH-NEXT-8"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-9"' .dpro/ksh-next/plan.yml | grep -q 'status: "next"'

          if grep -q 'STEP KSH-NEXT-9: SYSTEM AUDIT' system-check.html; then
            echo "STEP KSH-NEXT-9 is already applied."
            exit 1
          fi

          if [ -f ksh-next-9-system-audit.js ]; then
            echo "KSH-NEXT-9 JavaScript already exists. Stop to prevent duplicate application."
            exit 1
          fi

          echo "KSH-NEXT-8 completion verified."

      - name: Create safety tag
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_TAG="ksh-next-9-before-${{ github.run_id }}"
          git tag "$BACKUP_TAG" "$BEFORE_SHA"
          git push origin "$BACKUP_TAG"
          echo "BACKUP_TAG=$BACKUP_TAG" >> "$GITHUB_ENV"

      - name: Apply system audit enhancement
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json

          check_path = Path("system-check.html")
          plan_path = Path(".dpro/ksh-next/plan.yml")
          result_path = Path(".dpro/ksh-next/ksh-next-9-result.yml")
          audit_js_path = Path("ksh-next-9-system-audit.js")

          original = check_path.read_text(encoding="utf-8")
          text = original

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return source.replace(old, new, 1)

          def quote(value):
              return json.dumps(str(value), ensure_ascii=False)

          def sha256_text(value):
              return hashlib.sha256(value.encode("utf-8")).hexdigest()

          text = replace_once(
              text,
              '<meta name="viewport" content="width=device-width, initial-scale=1.0" />',
              '''<meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta name="robots" content="noindex,nofollow,noarchive" />
            <meta name="referrer" content="no-referrer" />''',
              "internal page meta",
          )

          text = replace_once(
              text,
              "<title>DPRO CAR LINE｜営業前システム確認 STEP KSH-BRUSH-9</title>",
              "<title>DPRO 車検・整備工場 LINE｜性能・セキュリティ確認 STEP KSH-NEXT-9</title>",
              "system check title",
          )

          text = replace_once(
              text,
              "      grid-template-columns: 170px minmax(0, 1fr) auto;",
              "      grid-template-columns: 170px minmax(0, 1fr) auto auto;",
              "token input grid",
          )

          audit_css = r'''
              /* STEP KSH-NEXT-9: SYSTEM AUDIT */
              .audit-metrics {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 10px;
                margin-bottom: 14px;
              }

              .audit-metric {
                border: 1px solid var(--line);
                border-radius: 15px;
                padding: 13px;
                background: #f9fafb;
              }

              .audit-metric span {
                display: block;
                color: var(--muted);
                font-size: 11px;
                font-weight: 900;
              }

              .audit-metric strong {
                display: block;
                margin-top: 5px;
                color: #111827;
                font-size: 23px;
                line-height: 1;
              }

              .audit-metric small {
                display: block;
                margin-top: 6px;
                color: var(--muted);
                font-size: 10px;
                line-height: 1.4;
              }

              .status-pill.attention {
                background: #fff7ed;
                color: #9a3412;
                border-color: #fdba74;
              }

              .security-note {
                margin-top: 12px;
                border: 1px solid #bfdbfe;
                border-radius: 14px;
                padding: 12px 14px;
                background: #eff6ff;
                color: #1e3a8a;
                font-size: 12px;
                line-height: 1.65;
              }

              .audit-result-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 12px;
              }

              @media (max-width: 980px) {
                .audit-metrics {
                  grid-template-columns: 1fr 1fr;
                }

                .input-row {
                  grid-template-columns: 1fr;
                }
              }
          '''
          text = replace_once(
              text,
              "  </style>",
              audit_css + "\n  </style>",
              "audit CSS",
          )

          text = replace_once(
              text,
              '<span class="badge">STEP KSH-BRUSH-9 / INTERNAL CHECK</span>',
              '<span class="badge">STEP KSH-NEXT-9 / INTERNAL AUDIT</span>',
              "audit badge",
          )

          text = replace_once(
              text,
              '''            商談前に、Worker・店舗設定・管理API・営業前DEMO準備・主要画面URLを一括確認する内部用ページです。<br>
                      お客様・商談先オーナーにそのまま渡すページではありません。''',
              '''            Worker・管理API・公開画面・追加JavaScript・読込時間・管理ガードを一括確認する内部監査ページです。<br>
                      お客様・商談先オーナーにそのまま渡すページではありません。''',
              "audit lead",
          )

          text = replace_once(
              text,
              '''          <button class="btn btn-green" onclick="runAllChecks()">全チェック実行</button>
                    <button class="btn btn-orange" onclick="runDemoReset()">営業前DEMO準備</button>
                    <button class="btn btn-light" onclick="copyAllUrls()">URL一覧コピー</button>''',
              '''          <button class="btn btn-green" onclick="runAllChecks()">全チェック実行</button>
                    <button class="btn btn-orange" onclick="runDemoReset()">営業前DEMO準備</button>
                    <button class="btn btn-purple" onclick="copyCheckReport()">検査結果コピー</button>
                    <button class="btn btn-light" onclick="copyAllUrls()">URL一覧コピー</button>''',
              "hero audit actions",
          )

          text = replace_once(
              text,
              '''          <label for="adminTokenInput">管理コード</label>
                    <input id="adminTokenInput" type="password" value="1234" inputmode="numeric" autocomplete="off" />
                    <button class="btn btn-blue" onclick="saveToken()">保存</button>''',
              '''          <label for="adminTokenInput">管理コード</label>
                    <input id="adminTokenInput" type="password" value="1234" inputmode="numeric" autocomplete="new-password" />
                    <button class="btn btn-blue" onclick="saveToken()">一時保存</button>
                    <button class="btn btn-red" onclick="clearToken()">削除</button>''',
              "session token controls",
          )

          text = replace_once(
