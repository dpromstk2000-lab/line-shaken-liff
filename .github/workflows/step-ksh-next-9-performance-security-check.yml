          old_manual = '''        <div class="manual-grid">
                    <label class="manual-item"><input type="checkbox"> <span>PC管理画面の店舗名が設定した店舗名で表示されている</span></label>
                    <label class="manual-item"><input type="checkbox"> <span>今日やることに未対応相談・入庫予定・フォロー候補が表示されている</span></label>
                    <label class="manual-item"><input type="checkbox"> <span>売上金額がトップに大きく出ず、オーナー確認側に分離されている</span></label>
                    <label class="manual-item"><input type="checkbox"> <span>臨時休み・特別営業日の過去日登録ができない</span></label>
                    <label class="manual-item"><input type="checkbox"> <span>iPad画面で電話予約・店頭予約が登録できる</span></label>
                    <label class="manual-item"><input type="checkbox"> <span>お客様フォームで初回・再訪、登録済み車両・新しい車両の流れが分かる</span></label>
