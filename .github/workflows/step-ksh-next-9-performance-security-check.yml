                    <label class="manual-item"><input type="checkbox"> <span>電話・店頭・LINE・管理者代理の受付経路が一覧で区別できる</span></label>
                    <label class="manual-item"><input type="checkbox"> <span>受付から引渡しまでの作業進捗を一覧から更新できる</span></label>
