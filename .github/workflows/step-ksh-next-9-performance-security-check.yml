      - name: Run static frontend audit
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          from datetime import datetime, timezone
          import hashlib
          import json
          import re
          import subprocess
          import tempfile

          root = Path(".")
          report_path = Path(".dpro/ksh-next/frontend-audit.yml")
          report_path.parent.mkdir(parents=True, exist_ok=True)

          html_files = [
              Path("index.html"),
              Path("dashboard.html"),
              Path("owner-ipad.html"),
              Path("member.html"),
              Path("system-check.html"),
          ]

          required_js = [
              Path("ksh-next-5-owner-estimate.js"),
              Path("ksh-next-5-member-estimate.js"),
              Path("ksh-next-6-ipad-operations.js"),
              Path("ksh-next-7-member-history.js"),
              Path("ksh-next-8-followup-cockpit.js"),
              Path("ksh-next-9-system-audit.js"),
          ]

          required_markers = {
              "dashboard.html": [
                  "STEP KSH-NEXT-8",
                  "ksh-next-5-owner-estimate.js",
                  "ksh-next-8-followup-cockpit.js",
                  "reservationProgressStage",
                  "nextFollowupCockpit",
              ],
              "owner-ipad.html": [
                  "STEP KSH-NEXT-6",
                  "ksh-next-6-ipad-operations.js",
                  "arrivalReservationList",
                  "workingReservationList",
                  "readyReservationList",
              ],
              "member.html": [
                  "STEP KSH-NEXT-7",
                  "ksh-next-5-member-estimate.js",
                  "ksh-next-7-member-history.js",
              ],
              "system-check.html": [
                  "STEP KSH-NEXT-9",
                  "ksh-next-9-system-audit.js",
                  'name="robots" content="noindex,nofollow,noarchive"',
                  'name="referrer" content="no-referrer"',
              ],
          }

          size_limits = {
              "index.html": 1400000,
              "dashboard.html": 1900000,
              "owner-ipad.html": 1500000,
              "member.html": 1300000,
              "system-check.html": 1100000,
              "ksh-next-5-owner-estimate.js": 350000,
              "ksh-next-5-member-estimate.js": 350000,
              "ksh-next-6-ipad-operations.js": 380000,
              "ksh-next-7-member-history.js": 400000,
              "ksh-next-8-followup-cockpit.js": 400000,
              "ksh-next-9-system-audit.js": 450000,
          }

          for path in html_files + required_js:
              if not path.is_file():
                  raise SystemExit(f"required file missing: {path}")

          for path in html_files + required_js:
              if path.stat().st_size > size_limits[path.name]:
                  raise SystemExit(
                      f"size budget exceeded: {path} "
                      f"{path.stat().st_size} > {size_limits[path.name]}"
                  )

          total_bytes = sum(path.stat().st_size for path in html_files + required_js)
          if total_bytes > 6500000:
              raise SystemExit(f"total frontend budget exceeded: {total_bytes}")

          class Parser(HTMLParser):
              pass

          local_script_references = []
          html_results = []

          for path in html_files:
              text = path.read_text(encoding="utf-8")
              parser = Parser()
              parser.feed(text)
              parser.close()

              ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
              duplicates = sorted(key for key, count in Counter(ids).items() if count > 1)
              if duplicates:
                  raise SystemExit(f"{path} duplicate IDs: {', '.join(duplicates)}")

              if "http://" in text:
                  raise SystemExit(f"insecure http URL detected: {path}")

              for marker in required_markers.get(path.name, []):
                  if marker not in text:
                      raise SystemExit(f"{path} missing marker: {marker}")

              srcs = re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']', text, flags=re.I)
              duplicate_srcs = sorted(key for key, count in Counter(srcs).items() if count > 1)
              if duplicate_srcs:
                  raise SystemExit(f"{path} duplicate script refs: {', '.join(duplicate_srcs)}")

              for src in srcs:
                  if re.match(r"^(?:https?:)?//", src):
                      continue
                  local_path = Path(src.split("?", 1)[0])
                  if not local_path.is_file():
                      raise SystemExit(f"{path} references missing script: {local_path}")
                  local_script_references.append((path.name, str(local_path)))

              inline_scripts = []
              for attrs, body in re.findall(
                  r"<script\b([^>]*)>(.*?)</script>",
                  text,
                  flags=re.I | re.S,
              ):
                  if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                      continue
                  if body.strip():
                      inline_scripts.append(body)

              for index, script in enumerate(inline_scripts, start=1):
                  temp = Path(tempfile.gettempdir()) / f"ksh-next-9-{path.stem}-{index}.js"
                  temp.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(temp)], check=True)

              html_results.append({
                  "path": path.name,
                  "bytes": path.stat().st_size,
                  "ids": len(ids),
                  "inline_scripts": len(inline_scripts),
                  "local_scripts": len([src for src in srcs if not re.match(r"^(?:https?:)?//", src)]),
              })

          for path in required_js:
              subprocess.run(["node", "--check", str(path)], check=True)

          def assert_script_order(html_name, first, second):
              text = Path(html_name).read_text(encoding="utf-8")
              first_index = text.find(first)
              second_index = text.find(second)
              if first_index < 0 or second_index < 0 or first_index >= second_index:
                  raise SystemExit(f"script order invalid in {html_name}: {first} -> {second}")

          assert_script_order(
              "dashboard.html",
              "ksh-next-5-owner-estimate.js",
              "ksh-next-8-followup-cockpit.js",
          )
          assert_script_order(
              "member.html",
              "ksh-next-5-member-estimate.js",
              "ksh-next-7-member-history.js",
          )

          public_files = [
              Path("index.html"),
              Path("member.html"),
              Path("ksh-next-5-member-estimate.js"),
              Path("ksh-next-7-member-history.js"),
          ]

          public_forbidden = [
              "X-Dashboard-Token",
              "x-ksh-demo-reset-secret",
              "RESET_WORKER_BASE",
              "ksh_dashboard_token",
          ]

          for path in public_files:
              text = path.read_text(encoding="utf-8")
              for marker in public_forbidden:
                  if marker in text:
                      raise SystemExit(f"public admin marker detected: {path}: {marker}")

          member_sources = (
              Path("ksh-next-5-member-estimate.js").read_text(encoding="utf-8") +
              "\n" +
              Path("ksh-next-7-member-history.js").read_text(encoding="utf-8")
          )
          for marker in [
              "RECEPTION_PATTERN",
              "PROGRESS_PATTERN",
              "ESTIMATE_VERSION_PATTERN",
              "stripMemberMetadata",
          ]:
              if marker not in member_sources:
                  raise SystemExit(f"member metadata hiding marker missing: {marker}")

          system_check = Path("system-check.html").read_text(encoding="utf-8")
          for marker in [
              'name="robots" content="noindex,nofollow,noarchive"',
              'name="referrer" content="no-referrer"',
              "sessionStorage",
              "clearToken()",
          ]:
              if marker not in system_check:
                  raise SystemExit(f"system-check security marker missing: {marker}")

          def sha256(path):
              digest = hashlib.sha256()
              digest.update(path.read_bytes())
              return digest.hexdigest()

          lines = [
              'schema_version: "1.0"',
              "document:",
              '  id: "DPRO-KSH-NEXT-9-FRONTEND-AUDIT"',
              '  step: "STEP KSH-NEXT-9"',
              f'  generated_at_utc: {json.dumps(datetime.now(timezone.utc).isoformat())}',
              "summary:",
              "  html_parse_ok: true",
              "  duplicate_html_ids: false",
              "  javascript_syntax_ok: true",
              "  missing_local_scripts: false",
              "  duplicate_script_references: false",
              "  script_order_ok: true",
              "  public_admin_markers_detected: false",
              "  member_metadata_hiding_present: true",
              "  system_check_noindex: true",
              f"  audited_total_bytes: {total_bytes}",
              "files:",
          ]

          for path in html_files + required_js:
              lines.extend([
                  f'  - path: {json.dumps(path.as_posix())}',
                  f"    bytes: {path.stat().st_size}",
                  f'    sha256: {json.dumps(sha256(path))}',
                  f"    hard_limit_bytes: {size_limits[path.name]}",
              ])

          lines.append("html_details:")
          for result in html_results:
              lines.extend([
                  f'  - path: {json.dumps(result["path"])}',
                  f'    bytes: {result["bytes"]}',
                  f'    ids: {result["ids"]}',
                  f'    inline_scripts: {result["inline_scripts"]}',
                  f'    local_scripts: {result["local_scripts"]}',
              ])

          lines.append("local_script_references:")
          for html_name, script_name in local_script_references:
              lines.extend([
                  f'  - html: {json.dumps(html_name)}',
                  f'    script: {json.dumps(script_name)}',
              ])

          report_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("Static frontend audit OK")
          print("Audited total bytes:", total_bytes)
          print("Report:", report_path)
          PY

