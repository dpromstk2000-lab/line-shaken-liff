name: CAR02 V5.08 corrected R13 + R46 disposable PG17 (NO_GO HOLD)

# Review-only branch. A GitHub-hosted disposable PostgreSQL container is the ONLY DB target.
# Does not use Supabase secrets, run migrations against an external DB, deploy, or merge.
on:
  push:
    branches:
      - car02-v434-review-only
    paths:
      - '.github/workflows/car02-v508-r13-r46-corrected-pg17-disposable.yml'
permissions:
  contents: read

jobs:
  corrected-r13-r46-pg17:
    name: Single disposable PG17 smoke; not production approval
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: car02_v508_disposable_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: car02_v508_disposable_only
    steps:
      - name: Read-only checkout of pinned source files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prove revised SQL identities and exercise disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'car02-v434-review-only'
          for var in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CAR02_DATABASE_URL LINE_CHANNEL_ACCESS_TOKEN; do
            test -z "${!var:-}"
          done
          for file in R13_MIGRATION_QA_ONLY.sql R46_STAFF_GRANTS_QA_ONLY.sql; do
            test -s "$file"
          done

          # Refuse repository source drift. NO modification of the checked-in R13 or R46.
          test "$(git hash-object R13_MIGRATION_QA_ONLY.sql)" = '5136872276b3403f036bae768410c937119398b2'
          test "$(git hash-object R46_STAFF_GRANTS_QA_ONLY.sql)" = '2a63ac0788cb6b0deb6bb3f9ca30db4da752b9fc'
          python3 - <<'PY'
          from pathlib import Path
          import os
          original = Path('R13_MIGRATION_QA_ONLY.sql').read_text(encoding='utf-8')
          old = 'CREATE INDEX ksh_car02_work_orders_reservation_idx ON public.ksh_car02_work_orders(reservation_id);'
          new = 'CREATE UNIQUE INDEX ksh_car02_work_orders_shop_reservation_uidx ON public.ksh_car02_work_orders(shop_code,reservation_id);'
          if original.count(old) != 1 or new in original:
              raise SystemExit('V508_ORIGINAL_R13_INDEX_DRIFT')
          header = (
              '-- DPRO CAR02 V5.05 ISOLATED DB QA CANDIDATE / NOT APPROVED FOR SUPABASE OR PRODUCTION.\n'
              '-- Same R13 review-only SQL with exactly one index change; requires explicit backup and migration review.\n'
              '-- DO NOT execute in existing KSH, Supabase production, Worker, or any shared environment.\n'
          )
          destination = Path(os.environ['RUNNER_TEMP']) / 'car02-v508-corrected-r13.sql'
          destination.write_text(header + original.replace(old, new), encoding='utf-8')
          PY
          # Exact byte-for-byte Git blob of locally verified V5.05 corrected SQL.
          test "$(git hash-object "$RUNNER_TEMP/car02-v508-corrected-r13.sql")" = 'c350d4d601d51c4c4d3ef16d61e717c5f2657d72'

          run_pg() {
            docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$RUNNER_TEMP:/scratch:ro" \
              postgres:17 psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres "$@"
          }
          run_pg -d postgres -c 'CREATE ROLE service_role NOLOGIN; CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;' >/dev/null
          run_pg -d postgres -c 'CREATE DATABASE car02_v508_disposable;' >/dev/null

          # Entirely fictitious prerequisite data; no actual customer or KSH records.
          cat > "$RUNNER_TEMP/car02-v508-qa.sql" <<'PGSQL'
          \set ON_ERROR_STOP on
          DO $version$ BEGIN
            IF current_setting('server_version_num')::integer NOT BETWEEN 170000 AND 179999 THEN
              RAISE EXCEPTION 'V508_REAL_POSTGRES_17_REQUIRED';
            END IF;
          END $version$;

          CREATE TABLE public.ksh_demo_shop_settings(shop_code text PRIMARY KEY);
          CREATE TABLE public.ksh_demo_customers(id uuid PRIMARY KEY,shop_code text NOT NULL);
          CREATE TABLE public.ksh_demo_vehicles(id uuid PRIMARY KEY,shop_code text NOT NULL,customer_id uuid NOT NULL);
          CREATE TABLE public.ksh_demo_reservations(
            id uuid PRIMARY KEY,shop_code text NOT NULL,customer_id uuid,vehicle_id uuid,
            reservation_date date,reservation_time time,status text);
          INSERT INTO public.ksh_demo_shop_settings VALUES ('street_house_kitsuki'),('qa-other-shop');
          INSERT INTO public.ksh_demo_customers VALUES ('22222222-2222-4222-8222-222222222222','street_house_kitsuki');
          INSERT INTO public.ksh_demo_vehicles VALUES
            ('33333333-3333-4333-8333-333333333333','street_house_kitsuki','22222222-2222-4222-8222-222222222222');
          INSERT INTO public.ksh_demo_reservations VALUES
            ('11111111-1111-4111-8111-111111111111','street_house_kitsuki',
             '22222222-2222-4222-8222-222222222222','33333333-3333-4333-8333-333333333333',
             '2026-10-30','10:30','入庫済み');

          \i /scratch/car02-v508-corrected-r13.sql
          \i /workspace/R46_STAFF_GRANTS_QA_ONLY.sql

          DO $contract$ DECLARE n integer;
          BEGIN
            SELECT COUNT(*) INTO n FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace ns ON ns.oid=c.relnamespace
              WHERE ns.nspname='public' AND c.relname=ANY(ARRAY[
                'ksh_car02_work_orders','ksh_car02_reports','ksh_car02_photos',
                'ksh_car02_quotes','ksh_car02_decisions','ksh_car02_events',
                'ksh_car02_operations','ksh_car02_notification_outbox'])
                AND c.relrowsecurity=true;
            IF n<>8 THEN RAISE EXCEPTION 'V508_R13_RLS_COUNT_FAILED: %',n; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_index i
                JOIN pg_catalog.pg_class idx ON idx.oid=i.indexrelid
               WHERE i.indrelid='public.ksh_car02_work_orders'::regclass
                 AND idx.relname='ksh_car02_work_orders_shop_reservation_uidx'
                 AND i.indisunique AND i.indisvalid AND i.indisready
            ) THEN RAISE EXCEPTION 'V508_UNIQUE_RESERVATION_INDEX_MISSING'; END IF;
            IF NOT (SELECT relrowsecurity FROM pg_catalog.pg_class
              WHERE oid='public.ksh_car02_staff_access'::regclass)
              OR has_table_privilege('anon','public.ksh_car02_staff_access','SELECT')
              OR has_table_privilege('authenticated','public.ksh_car02_staff_access','SELECT')
              OR NOT has_table_privilege('service_role','public.ksh_car02_staff_access','SELECT')
            THEN RAISE EXCEPTION 'V508_R46_STAFF_RLS_OR_GRANT_FAILED'; END IF;
          END $contract$;

          INSERT INTO public.ksh_car02_work_orders(shop_code,reservation_id)
            VALUES ('street_house_kitsuki','11111111-1111-4111-8111-111111111111');
          DO $duplicate$ BEGIN
            BEGIN
              INSERT INTO public.ksh_car02_work_orders(shop_code,reservation_id)
                VALUES ('street_house_kitsuki','11111111-1111-4111-8111-111111111111');
              RAISE EXCEPTION 'V508_DUPLICATE_RESERVATION_ACCEPTED';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END $duplicate$;

          INSERT INTO public.ksh_car02_staff_access(shop_code,user_sub,staff_role)
            VALUES ('street_house_kitsuki','44444444-4444-4444-8444-444444444444','owner');
          DO $inactive$ BEGIN
            IF NOT EXISTS(SELECT 1 FROM public.ksh_car02_staff_access
              WHERE shop_code='street_house_kitsuki' AND user_sub='44444444-4444-4444-8444-444444444444'
              AND staff_role='owner' AND active=false)
              OR EXISTS(SELECT 1 FROM public.ksh_car02_staff_access
              WHERE shop_code='qa-other-shop' AND user_sub='44444444-4444-4444-8444-444444444444')
            THEN RAISE EXCEPTION 'V508_DEFAULT_INACTIVE_OR_TENANT_SCOPE_FAILED'; END IF;
          END $inactive$;
          \echo V508_REAL_PG17_R13_CORRECTED_R46_PASS
          \echo V508_NO_GO_DB_HOLD_RELEASE_LOCK_STILL_TRUE
          PGSQL
          run_pg -d car02_v508_disposable -f /scratch/car02-v508-qa.sql | tee "$RUNNER_TEMP/car02-v508-qa.log"
          grep -Fqx 'V508_REAL_PG17_R13_CORRECTED_R46_PASS' "$RUNNER_TEMP/car02-v508-qa.log"
          grep -Fqx 'V508_NO_GO_DB_HOLD_RELEASE_LOCK_STILL_TRUE' "$RUNNER_TEMP/car02-v508-qa.log"
