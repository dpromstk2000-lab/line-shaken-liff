name: DPRO KSH Tutorial R5 Manuals LIVE Capture and PDF QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpro-tutorial-ksh-r5-manuals-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout newest industry main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Adopt newest main forward-only and record R5 source lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --ff-only origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          {
            echo "DPRO TUTORIAL BATCH08 KSH R5 SOURCE LOCK"
            echo "HEAD=${HEAD_SHA}"
            echo "TREE=${TREE_SHA}"
            echo "FORWARD_ONLY=PASS"
            echo "RESET=NO"
            echo "REVERT=NO"
            echo "FORCE_PUSH=NO"
          } > KSH_R5_SOURCE_LOCK.txt
          echo "R5_SOURCE_HEAD=${HEAD_SHA}" >> "$GITHUB_ENV"
          echo "R5_SOURCE_TREE=${TREE_SHA}" >> "$GITHUB_ENV"

      - name: Verify accepted R4 baseline remains intact
        shell: bash
        run: |
          set -euo pipefail
          test -f dpro-tutorial-car-service.js
          test -f dpro-tutorial-car-service.css
          test -f dashboard.html
          test -f owner-ipad.html
          grep -q "CAR_SERVICE-R3-20260829" dpro-tutorial-car-service.js
          grep -q "CAR_SERVICE-R4-20260829" dpro-tutorial-car-service.js
          test "$(grep -o "id:'KSH-F10-" dpro-tutorial-car-service.js | wc -l | tr -d ' ')" = "10"
          grep -q "const guideItems=steps.map" dpro-tutorial-car-service.js
          grep -q "guideCount:guideItems.length" dpro-tutorial-car-service.js
          grep -q "dpro-tutorial-car-service.js" dashboard.html
          grep -q "dpro-tutorial-car-service.js" owner-ipad.html

      - name: Install R5 capture PDF render and QR dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >/dev/null
          python -m pip install --disable-pip-version-check \
            selenium reportlab qrcode pillow pypdfium2 opencv-python-headless pyyaml

      - name: Capture current public Tutorial and Guide screenshots safely
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ksh_r5_capture.py <<'PY'
          import json, os, time, hashlib
          from pathlib import Path
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          DASH='https://dpromstk2000-lab.github.io/line-shaken-liff/dashboard.html?embed_demo=1&r5capture=20260829'
          IPAD='https://dpromstk2000-lab.github.io/line-shaken-liff/owner-ipad.html?embed_demo=1&r5capture=20260829'
          OUT=Path('r5_capture')
          OUT.mkdir(exist_ok=True)

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1440,1000')
          opts.set_capability('goog:loggingPrefs', {'browser':'ALL','performance':'ALL'})
          for candidate in ['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser']:
              if Path(candidate).exists():
                  opts.binary_location=candidate
                  break
          drv=webdriver.Chrome(options=opts)
          wait=WebDriverWait(drv,20)
          report={'dashboard':DASH,'ipad':IPAD,'screenshots':{},'unsafe_requests':[],'tutorial_console_errors':[]}

          def wait_api():
              wait.until(lambda d: d.execute_script('return !!window.DPROCarServiceTutorial && DPROCarServiceTutorial.stepCount===10 && DPROCarServiceTutorial.guideCount===10'))

          def clear_state_and_logs():
              drv.execute_script("localStorage.removeItem('dpro_tutorial_car_service_v1_1'); sessionStorage.clear();")
              try: drv.get_log('performance')
              except Exception: pass
              try: drv.get_log('browser')
              except Exception: pass

          def element_shot(selector, filename):
              el=wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,selector)))
              path=OUT/filename
              el.screenshot(str(path))
              with Image.open(path) as im:
                  if im.width < 240 or im.height < 120:
                      raise SystemExit(f'screenshot too small: {filename} {im.size}')
              report['screenshots'][filename]={'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'selector':selector}

          def collect_logs():
              unsafe=[]
              for row in drv.get_log('performance'):
                  try:
                      msg=json.loads(row['message'])['message']
                      if msg.get('method')=='Network.requestWillBeSent':
                          r=msg['params']['request']; m=r.get('method','').upper(); u=r.get('url','')
                          if m not in ('GET','HEAD','OPTIONS'):
                              unsafe.append({'method':m,'url':u})
                  except Exception:
                      pass
              report['unsafe_requests'].extend(unsafe)
              for row in drv.get_log('browser'):
                  msg=row.get('message','')
                  if row.get('level')=='SEVERE' and ('dpro-tutorial-car-service.js' in msg or 'DPROCarServiceTutorial' in msg or 'Guide Center' in msg):
                      report['tutorial_console_errors'].append(msg)

          try:
              drv.get(DASH); wait_api(); clear_state_and_logs()
              drv.execute_script('DPROCarServiceTutorial.open(0)')
              element_shot('.dpt-card','tutorial_step01.png')
              drv.find_element(By.CSS_SELECTOR,'[data-close]').click()

              drv.execute_script('DPROCarServiceTutorial.open(4)')
              element_shot('.dpt-card','tutorial_step05.png')
              drv.find_element(By.CSS_SELECTOR,'[data-close]').click()

              drv.execute_script('DPROCarServiceTutorial.open(8)')
              element_shot('.dpt-card','tutorial_step09.png')
              drv.find_element(By.CSS_SELECTOR,'[data-close]').click()

              drv.execute_script('DPROCarServiceTutorial.openGuide()')
              gc=wait.until(EC.presence_of_element_located((By.ID,'dpro-tutorial-guide-center')))
              full=OUT/'guide_full_temp.png'
              drv.save_screenshot(str(full))
              rect=drv.execute_script("const r=document.getElementById('dpro-tutorial-guide-center').getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height};")
              with Image.open(full) as im:
                  x=max(0,int(rect['x'])); y=max(0,int(rect['y']))
                  x2=min(im.width,int(rect['x']+rect['w'])); y2=min(im.height,int(rect['y']+rect['h']))
                  crop=im.crop((x,y,x2,y2))
                  crop.save(OUT/'guide_center.png',optimize=True)
              full.unlink(missing_ok=True)
              report['screenshots']['guide_center.png']={'sha256':hashlib.sha256((OUT/'guide_center.png').read_bytes()).hexdigest(),'selector':'#dpro-tutorial-guide-center'}
              collect_logs()

              drv.get(IPAD); wait_api(); clear_state_and_logs()
              drv.execute_script('DPROCarServiceTutorial.open(9)')
              element_shot('.dpt-card','tutorial_step10.png')
              collect_logs()
          finally:
              drv.quit()

          if report['unsafe_requests']:
              raise SystemExit('unsafe write request detected during Tutorial/Guide capture')
          if report['tutorial_console_errors']:
              raise SystemExit('Tutorial/Guide console error detected')
          report['business_mutation']=0
          report['status']='PASS'
          Path('KSH_R5_LIVE_CAPTURE_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/ksh_r5_capture.py

      - name: Generate A4 Quick Start and Detailed Manual PDFs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ksh_r5_manuals.py <<'PY'
          from pathlib import Path
          import os, json, math, hashlib
          from PIL import Image as PILImage
          import qrcode
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.units import mm
          from reportlab.lib import colors
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.cidfonts import UnicodeCIDFont
          from reportlab.platypus import Paragraph
          from reportlab.lib.styles import ParagraphStyle
          from reportlab.lib.utils import ImageReader
          from reportlab.pdfbase.pdfmetrics import stringWidth

          QUICK=Path('DPRO_TUTORIAL_KSH_QUICK_START_V1.0.pdf')
          DETAIL=Path('DPRO_TUTORIAL_KSH_DETAILED_MANUAL_V1.0.pdf')
          CAP=Path('r5_capture')
          TUTORIAL_URL='https://dpromstk2000-lab.github.io/line-shaken-liff/dashboard.html?embed_demo=1'
          GUIDE_URL='https://dpromstk2000-lab.github.io/line-shaken-liff/dashboard.html?embed_demo=1#dpro-tutorial-guide-center-entry'
          W,H=A4

          # ReportLab built-in Japanese CID fonts render reliably in PDFium without shipping font files.
          pdfmetrics.registerFont(UnicodeCIDFont('HeiseiMin-W3'))
          pdfmetrics.registerFont(UnicodeCIDFont('HeiseiKakuGo-W5'))
          REG_FONT='HeiseiMin-W3'
          BOLD_FONT='HeiseiKakuGo-W5'

          NAVY=colors.HexColor('#0F172A')
          BLUE=colors.HexColor('#1E3A8A')
          SKY=colors.HexColor('#EAF2FF')
          AMBER=colors.HexColor('#FFF7ED')
          GREEN=colors.HexColor('#ECFDF5')
          GRAY=colors.HexColor('#475569')
          LIGHT=colors.HexColor('#F8FAFC')
          BORDER=colors.HexColor('#CBD5E1')

          def pstyle(size=9.4,leading=14,color=NAVY,bold=False,align=0):
              return ParagraphStyle('s',fontName=BOLD_FONT if bold else REG_FONT,fontSize=size,leading=leading,textColor=color,alignment=align,wordWrap='CJK')

          def draw_para(c,text,x,y_top,w,h,size=9.4,leading=14,color=NAVY,bold=False,align=0):
              p=Paragraph(text,pstyle(size,leading,color,bold,align))
              rw,rh=p.wrap(w,h)
              if rh>h+0.1:
                  raise SystemExit(f'paragraph overflow: {text[:50]} h={rh} box={h}')
              p.drawOn(c,x,y_top-rh)
              return rh

          def fit_image(c,path,x,y,w,h,border=True,bg=colors.white):
              path=Path(path)
              if not path.exists(): raise SystemExit(f'missing image {path}')
              with PILImage.open(path) as im:
                  iw,ih=im.size
              scale=min(w/iw,h/ih)
              dw,dh=iw*scale,ih*scale
              dx=x+(w-dw)/2; dy=y+(h-dh)/2
              c.setFillColor(bg); c.roundRect(x,y,w,h,3*mm,fill=1,stroke=0)
              c.drawImage(ImageReader(str(path)),dx,dy,width=dw,height=dh,preserveAspectRatio=True,mask='auto')
              if border:
                  c.setStrokeColor(BORDER); c.roundRect(x,y,w,h,3*mm,fill=0,stroke=1)

          def make_qr(data,path):
              qr=qrcode.QRCode(version=None,error_correction=qrcode.constants.ERROR_CORRECT_M,box_size=8,border=4)
              qr.add_data(data); qr.make(fit=True)
              img=qr.make_image(fill_color='black',back_color='white').convert('RGB')
              img.save(path,optimize=True)

          make_qr(TUTORIAL_URL,'qr_tutorial.png')
          make_qr(GUIDE_URL,'qr_guide.png')

          def header(c,kicker,title,page=None):
              c.setFillColor(NAVY); c.rect(0,H-25*mm,W,25*mm,fill=1,stroke=0)
              c.setFillColor(colors.white); c.setFont(BOLD_FONT,8.5); c.drawString(14*mm,H-9*mm,kicker)
              c.setFont(BOLD_FONT,18); c.drawString(14*mm,H-18*mm,title)
              if page:
                  c.setFont(REG_FONT,8); c.drawRightString(W-14*mm,H-9*mm,page)

          def footer(c,text='DPRO TUTORIAL / KSH - Guidance only, business mutation 0'):
              c.setStrokeColor(BORDER); c.line(14*mm,12*mm,W-14*mm,12*mm)
              c.setFillColor(GRAY); c.setFont(REG_FONT,7.2); c.drawString(14*mm,7.5*mm,text)

          def pill(c,x,y,w,text,fill=SKY,color=BLUE):
              c.setFillColor(fill); c.roundRect(x,y,w,8*mm,4*mm,fill=1,stroke=0)
              c.setFillColor(color); c.setFont(BOLD_FONT,8.2); c.drawCentredString(x+w/2,y+2.65*mm,text)

          def step_box(c,n,title,body,safe,x,y_top,w,h):
              c.setFillColor(colors.white); c.setStrokeColor(BORDER); c.roundRect(x,y_top-h,w,h,3*mm,fill=1,stroke=1)
              pill(c,x+4*mm,y_top-11*mm,24*mm,f'STEP {n} / 10')
              draw_para(c,title,x+4*mm,y_top-16*mm,w-8*mm,12*mm,size=10.5,leading=14,bold=True)
              draw_para(c,body,x+4*mm,y_top-31*mm,w-8*mm,23*mm,size=8.5,leading=12.5,color=GRAY)
              c.setFillColor(AMBER); c.roundRect(x+4*mm,y_top-h+4*mm,w-8*mm,13*mm,2*mm,fill=1,stroke=0)
              draw_para(c,'安全: '+safe,x+7*mm,y_top-h+14.5*mm,w-14*mm,10*mm,size=7.3,leading=10.2,color=colors.HexColor('#9A3412'))

          steps=[
              (1,'まず「今日やること」を確認','相談対応・入庫対応・顧客/車両確認へ進む前に、今日の全体像を確認します。','場所確認だけ。保存・送信・確定・データ更新はしません。'),
              (2,'新しい相談は「相談一覧」','LINEや受付から入った相談内容を確認し、相談種別や希望入庫日から次の対応を判断します。','相談状態変更・保存・返信送信はしません。'),
              (3,'入庫予定を確認','仮希望と店舗確認済みの入庫予定を区別して確認します。','追加・編集・日時確定・保存はしません。'),
              (4,'顧客と車両を一緒に確認','顧客ごとの登録車両を確認する入口です。Tutorialは実顧客の検索語を自動入力しません。','顧客/車両の追加・編集・削除はしません。'),
              (5,'作業進捗の見方','受付→点検→見積→お客様確認→作業→最終確認→引渡し、という進捗の意味を確認します。','セレクト値を変更せず、onchangeや保存も発火しません。'),
              (6,'見積エリアを確認','見積金額・作業内訳と、お客様への提示状態を確認する位置を理解します。','見出しだけを対象にし、見積提示・保存・承認はしません。'),
              (7,'次回連絡は「チャット候補」','車検案内、オイル交換、見積後再連絡など、次に連絡したい候補の入口を確認します。','LINE送信・送信済み記録・再連絡登録はしません。'),
              (8,'営業候補の見方','車検・オイル交換・次回提案など、次の案内につながる候補の入口を確認します。','顧客状態・営業結果・通知状態は変更しません。'),
              (9,'iPad現場画面へ移動','現場向け4タブを確認するため、次のステップでiPad画面へ安全に移動します。','製品ボタンを自動クリックせず、安全なページ遷移だけを行います。'),
              (10,'iPadの4つの入口を確認','「今日の現場」「電話・店頭受付」「今後の予定」「顧客検索」の4タブを確認します。','タブの場所を説明するだけ。受付登録・進捗更新・顧客変更はしません。'),
          ]

          # Quick Start - exactly 1 A4 portrait page.
          c=canvas.Canvas(str(QUICK),pagesize=A4,pageCompression=1)
          c.setTitle('DPRO TUTORIAL KSH Quick Start V1.0')
          header(c,'DPRO TUTORIAL / KSH','車検・整備工場 Quick Start')
          y=H-34*mm
          draw_para(c,'First10を安全に確認するための1ページ手引きです。現在の公開デモ画面にあるTutorial / Guide Centerを使います。',14*mm,y,W-28*mm,16*mm,size=9.5,leading=14,color=GRAY)
          y-=19*mm
          left=14*mm; colw=105*mm
          items=[
              '<b>1. Start</b> - 「操作ガイド」から開始。STEP 1 / 10へ進みます。',
              '<b>2. Resume</b> - 途中で閉じても、保存された現在STEPから再開できます。',
              '<b>3. Replay</b> - 完了後もSTEP 1からやり直せます。',
              '<b>4. Drag / touch</b> - カード上部「ここをドラッグ」で移動。画面外へ出ないようclampされます。',
              '<b>5. Keyboard</b> - →で次へ、←で戻る、Escで閉じる。フォーカス表示を確認できます。',
          ]
          c.setFillColor(LIGHT); c.roundRect(left,y-64*mm,colw,64*mm,4*mm,fill=1,stroke=0)
          ty=y-7*mm
          for item in items:
              h=draw_para(c,item,left+6*mm,ty,colw-12*mm,13*mm,size=8.4,leading=12.2)
              ty-=12*mm
          fit_image(c,CAP/'tutorial_step01.png',126*mm,y-64*mm,70*mm,64*mm)
          y-=72*mm
          fit_image(c,CAP/'guide_center.png',14*mm,y-61*mm,116*mm,61*mm)
          c.setFillColor(GREEN); c.roundRect(136*mm,y-61*mm,60*mm,61*mm,4*mm,fill=1,stroke=0)
          draw_para(c,'公開Tutorialを開く',142*mm,y-8*mm,48*mm,10*mm,size=10,leading=13,bold=True,align=1)
          c.drawImage('qr_tutorial.png',150*mm,y-47*mm,width=32*mm,height=32*mm,mask='auto')
          draw_para(c,'QR: '+TUTORIAL_URL,141*mm,y-51*mm,50*mm,9*mm,size=5.8,leading=7,color=GRAY,align=1)
          y-=69*mm
          c.setFillColor(AMBER); c.roundRect(14*mm,y-30*mm,W-28*mm,30*mm,3*mm,fill=1,stroke=0)
          draw_para(c,'<b>安全ルール</b> - Tutorialは案内とハイライトだけです。実顧客・車両・見積・整備履歴を作成/変更せず、保存・削除・承認・送信・ステータス変更を行いません。画面上の製品ボタンを操作する必要もありません。',20*mm,y-7*mm,W-40*mm,19*mm,size=8.2,leading=12,color=colors.HexColor('#9A3412'))
          footer(c)
          c.save()

          # Detailed manual - 6 fixed A4 portrait pages.
          c=canvas.Canvas(str(DETAIL),pagesize=A4,pageCompression=1)
          c.setTitle('DPRO TUTORIAL KSH Detailed Manual V1.0')

          # Page 1
          header(c,'DPRO TUTORIAL / KSH','車検・整備工場 Detailed Manual','1 / 6')
          draw_para(c,'R4 CENTRAL ACCEPT済みのFirst10=10 / Guide Center=10を前提にした詳細操作マニュアルです。公開デモ上の案内UIだけを使用し、業務データを変更しません。',14*mm,H-34*mm,W-28*mm,18*mm,size=9.5,leading=14,color=GRAY)
          fit_image(c,CAP/'guide_center.png',14*mm,96*mm,W-28*mm,102*mm)
          c.setFillColor(GREEN); c.roundRect(14*mm,33*mm,72*mm,52*mm,4*mm,fill=1,stroke=0)
          c.drawImage('qr_tutorial.png',32*mm,43*mm,width=32*mm,height=32*mm,mask='auto')
          draw_para(c,'Tutorial Start',20*mm,81*mm,60*mm,8*mm,size=9.2,leading=12,bold=True,align=1)
          draw_para(c,TUTORIAL_URL,18*mm,40*mm,64*mm,7*mm,size=5.6,leading=6.5,color=GRAY,align=1)
          draw_para(c,'このマニュアルで確認すること',97*mm,82*mm,99*mm,10*mm,size=11,leading=14,bold=True)
          draw_para(c,'・First10のSTEP 1-10<br/>・Guide CenterとStart / Resume / Replay<br/>・ドラッグ / タッチ / キーボード<br/>・画面遷移と再開<br/>・business mutation 0の安全境界',97*mm,69*mm,99*mm,40*mm,size=8.6,leading=12.4,color=GRAY)
          footer(c); c.showPage()

          # Pages 2-4: 3 steps each
          page_groups=[(2,'First10 STEP 1-3',steps[0:3],CAP/'tutorial_step01.png'),(3,'First10 STEP 4-6',steps[3:6],CAP/'tutorial_step05.png'),(4,'First10 STEP 7-9',steps[6:9],CAP/'tutorial_step09.png')]
          for pageno,title,group,img in page_groups:
              header(c,'DPRO TUTORIAL / KSH',title,f'{pageno} / 6')
              x=14*mm; ytop=H-33*mm; bw=112*mm; bh=63*mm; gap=5*mm
              for j,s in enumerate(group):
                  step_box(c,*s,x,ytop-j*(bh+gap),bw,bh)
              fit_image(c,img,132*mm,83*mm,64*mm,147*mm)
              c.setFillColor(SKY); c.roundRect(132*mm,38*mm,64*mm,36*mm,3*mm,fill=1,stroke=0)
              note={2:'操作カードは対象位置をハイライトします。対象が見つからない場合も、代替位置または説明カードだけで安全に続行できます。',3:'STEP 5は進捗selectの値を変えません。STEP 6は見積エリアの見出しだけを案内し、保存や承認をしません。',4:'STEP 9の「次へ」は製品ボタンを自動クリックしません。状態を保存してowner-ipad.htmlへ安全に遷移します。'}[pageno]
              draw_para(c,note,137*mm,69*mm,54*mm,27*mm,size=7.9,leading=11.2,color=BLUE)
              footer(c); c.showPage()

          # Page 5
          header(c,'DPRO TUTORIAL / KSH','STEP 10 と Guide Center','5 / 6')
          step_box(c,*steps[9],14*mm,H-34*mm,W-28*mm,57*mm)
          fit_image(c,CAP/'tutorial_step10.png',14*mm,91*mm,78*mm,105*mm)
          fit_image(c,CAP/'guide_center.png',99*mm,91*mm,97*mm,105*mm)
          draw_para(c,'<b>Start</b> - STEP 1から開始<br/><b>Resume</b> - 途中状態がある場合のみ表示し、保存されたSTEPから再開<br/><b>Replay</b> - 完了/スキップ後でもSTEP 1へ戻して再実行<br/><b>完了</b> - STEP 10完了後はGuide Centerが開きます。',14*mm,82*mm,W-28*mm,49*mm,size=8.8,leading=13,color=GRAY)
