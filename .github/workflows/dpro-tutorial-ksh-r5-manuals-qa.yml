      - name: Verify published PDF bytes and all public destinations
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ksh_r5_public_verify.py <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          urls={
            'tutorial':'https://dpromstk2000-lab.github.io/line-shaken-liff/dashboard.html?embed_demo=1',
            'guide':'https://dpromstk2000-lab.github.io/line-shaken-liff/dashboard.html?embed_demo=1#dpro-tutorial-guide-center-entry',
            'quick':'https://dpromstk2000-lab.github.io/line-shaken-liff/DPRO_TUTORIAL_KSH_QUICK_START_V1.0.pdf',
            'detailed':'https://dpromstk2000-lab.github.io/line-shaken-liff/DPRO_TUTORIAL_KSH_DETAILED_MANUAL_V1.0.pdf',
          }
          expected={
            'quick':hashlib.sha256(Path('DPRO_TUTORIAL_KSH_QUICK_START_V1.0.pdf').read_bytes()).hexdigest(),
            'detailed':hashlib.sha256(Path('DPRO_TUTORIAL_KSH_DETAILED_MANUAL_V1.0.pdf').read_bytes()).hexdigest(),
          }
          for attempt in range(60):
              ok=True
              try:
                  for k,u in urls.items():
                      req=urllib.request.Request(u.split('#')[0]+('&' if '?' in u.split('#')[0] else '?')+f'r5pub={attempt}',headers={'Cache-Control':'no-cache','User-Agent':'DPRO-R5-PDF-QA'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          body=r.read()
                      if k in expected and hashlib.sha256(body).hexdigest()!=expected[k]:
                          ok=False
              except Exception:
                  ok=False
              if ok:
                  print('R5 public URLs verified:',urls)
                  break
              time.sleep(10)
          else:
              raise SystemExit('R5 PDFs/public destinations not verified on GitHub Pages in time')
          Path('KSH_R5_PUBLIC_LINKS.txt').write_text('\n'.join([f'{k.upper()}={v}' for k,v in urls.items()])+'\nPUBLIC_REACHABLE=PASS\nPDF_BYTES_MATCH=PASS\n',encoding='utf-8')
          PY
          python /tmp/ksh_r5_public_verify.py

