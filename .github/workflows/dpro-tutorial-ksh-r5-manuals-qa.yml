      - name: Ensure main did not advance during R5 generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"
          if [ "$CURRENT" != "$REMOTE" ]; then
            echo "main advanced during R5 generation: current=$CURRENT remote=$REMOTE"
            echo "R5 HOLD - rerun from newest main"
            exit 1
          fi

