name: DPRO CAR02 R101 Pooled Session RLS Isolation QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r101-disposable-session-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-r93s-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout immutable reviewed sources
        uses: actions/checkout@v5
      - name: Verify historic release lock and R99 success baseline
        run: |
          set -euo pipefail
          test "$(git hash-object car02-private-photo-r47.mjs)" = e0f3abec6bcf57830d9f3b72fe2eee099b1dff1d
          test "$(git hash-object car02-unified-runtime-r50.mjs)" = 76e4e8cae27599f27e3d887118148718c32ebb80
          test "$(git hash-object car02-edge-boundary-r51.mjs)" = 6614f2ed1933aa787576cb8074cb7d4bc704efa0
          test "$(git hash-object car02-edge-entry-r52.ts)" = f0e31fb9f9d98524519d01dffd3489893d3d3302
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          node car02-r97-readonly-preflight.mjs > /tmp/car02-r100-preflight.log
          grep -Fq 'R97_PRODUCT_READINESS_SOURCE_ONLY_NO_GO_HOLD_PASS' /tmp/car02-r100-preflight.log
      - name: Run existing R94B-R100 and R101 session regression tests
        run: |
          set -euo pipefail
          node --check car02-r100-pg17-tenant-rls-qa.mjs
          node --check car02-r100-workflow-readonly-guard.mjs
          node --check car02-r101-session-reuse-qa.mjs
          node --check car02-r101-workflow-guard.mjs
          node --test test-car02-r94b-backup-restore-contract.mjs test-car02-r94b-workflow-guard.mjs test-car02-r95-restore-drift-qa.mjs test-car02-r96-backup-recovery-qa.mjs test-car02-r97-product-readiness.mjs test-car02-r98-order-intake.mjs test-car02-r98-browser-events.mjs test-car02-r99-upload-boundary.mjs test-car02-r100-tenant-rls-qa.mjs test-car02-r101-session-reuse-qa.mjs | tee /tmp/car02-r101-tests.log
          grep -Fq '# fail 0' /tmp/car02-r101-tests.log
          node car02-r100-workflow-readonly-guard.mjs
          node car02-r101-workflow-guard.mjs
      - name: Install PostgreSQL driver in isolated runner
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Create disposable PG17 schema and low privilege roles
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r93q_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r93q_qa_ci -v ON_ERROR_STOP=1 < R93R_PG17_DRIVER_FIXTURE_QA_ONLY.sql | tee /tmp/car02-r100-r93r.log
          grep -Fxq R93R_DISPOSABLE_PG17_FIXTURE_READY /tmp/car02-r100-r93r.log
          docker exec -i "$CID" psql -X -U postgres -d car02_r93q_qa_ci -v ON_ERROR_STOP=1 < R93S_PG17_DURABLE_INTENT_FIXTURE_QA_ONLY.sql | tee /tmp/car02-r100-r93s.log
          grep -Fxq R93S_DISPOSABLE_DURABLE_INTENT_SCHEMA_READY /tmp/car02-r100-r93s.log
          docker exec -i "$CID" psql -X -U postgres -d car02_r93q_qa_ci -v ON_ERROR_STOP=1 < R100_PG17_TENANT_RLS_FIXTURE_QA_ONLY.sql | tee /tmp/car02-r100-rls-setup.log
          grep -Fxq R100_DISPOSABLE_RLS_FIXTURE_READY /tmp/car02-r100-rls-setup.log
      - name: Verify seven table RLS with distinct tenant logins
        env:
          R100_DISPOSABLE_RLS_QA: 'yes'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: car02_r93q_qa_ci
        run: |
          set -euo pipefail
          node car02-r100-pg17-tenant-rls-qa.mjs | tee /tmp/car02-r100-rls-proof.log
          grep -Fxq R100_RLS_SEVEN_TABLES_ENABLED_FORCE_PASS /tmp/car02-r100-rls-proof.log
          grep -Fxq R100_TENANT_LOW_PRIVILEGE_ISOLATION_PASS /tmp/car02-r100-rls-proof.log
          grep -Fxq R100_GUC_SPOOF_ROLE_ESCALATION_BLOCKED_PASS /tmp/car02-r100-rls-proof.log
          grep -Fxq R100_RLS_WRITE_SCOPE_ROLLBACK_PASS /tmp/car02-r100-rls-proof.log
          grep -Fxq R100_DISPOSABLE_TENANT_RLS_QA_PASS /tmp/car02-r100-rls-proof.log
      - name: Challenge pooled session reuse and mixed tenant atomicity
        env:
          R101_DISPOSABLE_SESSION_QA: 'yes'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: car02_r93q_qa_ci
        run: |
          set -euo pipefail
          node car02-r101-session-reuse-qa.mjs | tee /tmp/car02-r101-session.log
          grep -Fxq R101_POOLED_SESSION_IDENTITY_PRESERVED_PASS /tmp/car02-r101-session.log
          grep -Fxq R101_FORGED_GUC_CANNOT_SWITCH_TENANT_PASS /tmp/car02-r101-session.log
          grep -Fxq R101_RLS_OFF_ROLLBACK_RECOVERY_PASS /tmp/car02-r101-session.log
          grep -Fxq R101_MIXED_TENANT_BATCH_ATOMIC_REJECTION_PASS /tmp/car02-r101-session.log
          grep -Fxq R101_DISPOSABLE_SESSION_RLS_QA_PASS /tmp/car02-r101-session.log
      - name: Remove disposable database, roles and temp files
        if: always()
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r93q_qa_ci WITH (FORCE);'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP ROLE IF EXISTS car02_r100_a_ci;'
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP ROLE IF EXISTS car02_r100_b_ci;'
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS(SELECT 1 FROM pg_database WHERE datname='car02_r93q_qa_ci') AND NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname IN ('car02_r100_a_ci','car02_r100_b_ci')) THEN 'R100_DB_AND_ROLES_REMOVED' ELSE 'R100_CLEANUP_FAILED' END" | grep -Fxq R100_DB_AND_ROLES_REMOVED
          rm -f /tmp/car02-r100-*.log /tmp/car02-r101-*.log
      - name: Final release remains NO_GO and migration HOLD
        run: |
          set -euo pipefail
          node car02-r100-workflow-readonly-guard.mjs
          node car02-r101-workflow-guard.mjs
          grep -Fq 'const CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          echo R101_PRODUCTION_NO_GO_MIGRATION_HOLD
