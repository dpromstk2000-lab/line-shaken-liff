name: CAR02 V4.73 Disposable Webhook Inbox Worker Lease PG17 (NO_GO HOLD)
# REVIEW-ONLY. Fake webhook inbox, synthetic lease workers, disposable PG17.
# NO real webhook acknowledgment, LINE, business processing, Supabase or deployment.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-inbox-lease-review-r473.mjs'
      - 'car02-inbox-lease-review-r473.test.mjs'
      - 'car02-v473-disposable-worker-lease-pg17.sql'
      - 'car02-v473-worker-lease-offline-contract.json'
      - '.github/workflows/car02-v473-inbox-worker-lease-pg17-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-synthetic-webhook-worker-lease:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v473_disposable_only
        ports:
          - 55473:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: v473_disposable_only
    steps:
      - name: Checkout review-only branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify actual R52 hard lock, no live secrets, expected layout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = 'refs/heads/car02-v434-review-only'
          for name in CAR02_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!name:-}" || { echo V473_REFUSED_LIVE_CREDENTIALS >&2; exit 1; }
          done
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true;' car02-edge-entry-r52.ts
          for f in car02-inbox-lease-review-r473.mjs car02-inbox-lease-review-r473.test.mjs car02-v473-disposable-worker-lease-pg17.sql car02-v473-worker-lease-offline-contract.json car02-v472-disposable-webhook-inbox-pg17.sql car02-v471-disposable-line-webhook-pg17.sql; do test -s "$f"; done
          test -s .github/workflows/car02-v473-inbox-worker-lease-pg17-qa.yml
          test ! -e car02-v473-inbox-worker-lease-pg17-qa.yml
          echo V473_R52_LOCK_NO_PROVIDER_SECRETS_AND_LAYOUT_PASS
      - name: Run all 741 or more Node tests and hard NO_GO contract
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-inbox-lease-review-r473.mjs
          node --check car02-inbox-lease-review-r473.test.mjs
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v473-node.log"
          tests=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v473-node.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v473-node.log")
          test "$tests" -ge 741
          test "$passed" = "$tests"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v473-node.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {CAR02_V473_RELEASE_LOCK} from './car02-inbox-lease-review-r473.mjs';
          const c=JSON.parse(readFileSync('car02-v473-worker-lease-offline-contract.json','utf8'));
          assert.equal(CAR02_V473_RELEASE_LOCK,true);
          for(const f of ['releasePermitted','jobDispatched','realWebhookAcknowledged','realWorkerVerified','lineDeliveryProven','realSupabaseUsed','realBusinessWrites','liveProviderCredentialsUsed'])assert.equal(c[f],false);
          assert.equal(c.unverifiedCommercialConditions.length,7);
          console.log('V473_NODE_ALL_OFFLINE_LEASE_AND_NO_REAL_SIDE_EFFECTS_PASS');
          NODE
      - name: Disposable PG17 private worker lease expiry, fencing, eight racing owners
        shell: bash
        run: |
          set -euo pipefail
          pg(){ docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17 psql -X -Atq -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55473 -U postgres "$@"; }
          pg -d postgres -c 'CREATE DATABASE car02_v473_disposable' > /dev/null
          pg -d car02_v473_disposable -f /workspace/car02-v471-disposable-line-webhook-pg17.sql > "$RUNNER_TEMP/v473-base471.log"
          grep -Fxq 'V471_FINAL_RELEASE_NO_GO_HOLD_TRUE' "$RUNNER_TEMP/v473-base471.log"
          pg -d car02_v473_disposable -f /workspace/car02-v472-disposable-webhook-inbox-pg17.sql > "$RUNNER_TEMP/v473-base472.log"
          grep -Fxq 'V472_FINAL_RELEASE_NO_GO_HOLD_TRUE' "$RUNNER_TEMP/v473-base472.log"
          pg -d car02_v473_disposable -f /workspace/car02-v473-disposable-worker-lease-pg17.sql | tee "$RUNNER_TEMP/v473-pg.log"
          for mark in V473_PG17_PRIVATE_LEASE_FUNCTIONS_AND_TABLE_DENIED_PASS V473_PG17_ONE_LEASE_OWNER_CROSS_TENANT_AND_CLOCK_ROLLBACK_DENIED_PASS V473_PG17_EXPIRED_RECLAIM_STALE_EPOCH_AND_NO_DELIVERY_PASS V473_PG17_ROLLBACK_AND_PENDING_ONLY_PASS V473_FINAL_RELEASE_NO_GO_HOLD_TRUE; do
            grep -Fxq "$mark" "$RUNNER_TEMP/v473-pg.log"
          done
          pids=()
          for n in 1 2 3 4 5 6 7 8; do
            (pg -d car02_v473_disposable -c "SELECT v473_private.qa_acquire('qa_shop_a','01ARZ3NDEKTSV4RRFFQ69G5FAZ',repeat('c',64),'worker_$n',repeat('d',64),1800000000000,30000)" > "$RUNNER_TEMP/v473-race-$n") &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          win=0; conflict=0
          for n in 1 2 3 4 5 6 7 8; do
            result=$(cat "$RUNNER_TEMP/v473-race-$n")
            if [ "$result" = 'leased_mock' ]; then win=$((win+1));
            elif [ "$result" = 'active_lease_conflict' ]; then conflict=$((conflict+1));
            else echo "V473_UNEXPECTED_SYNTHETIC_LEASE_RESULT: $result" >&2; exit 1; fi
          done
          test "$win" -eq 1
          test "$conflict" -eq 7
          test "$(pg -d car02_v473_disposable -c "SELECT lease_epoch::text||':'||lease_state FROM v473_private.qa_leases WHERE event_id='01ARZ3NDEKTSV4RRFFQ69G5FAZ'")" = '1:leased'
          test "$(pg -d car02_v473_disposable -c "SELECT count(*) FROM v473_private.qa_leases WHERE lease_state='review_only'")" = '1'
          test "$(pg -d car02_v473_disposable -c 'SELECT count(*) FROM v472_private.qa_inbox')" = '3'
          echo V473_PG17_EIGHT_CONCURRENT_WORKER_LEASES_SINGLE_WINNER_PASS
          echo V473_FINAL_RELEASE_NO_GO_HOLD_TRUE
