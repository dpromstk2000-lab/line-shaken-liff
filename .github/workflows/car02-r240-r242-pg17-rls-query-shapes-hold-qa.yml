          test "$(git hash-object car02_r215_first_write_race_isolated.py)" = '22f4a7678eac6bb87bb5c875e43d56bae13d3175'
          test "$(git rev-parse HEAD:car02_r218_tenant_namespace_race_isolated.py)" = 'c1bbe5cff75a4709df0d09791df1ab424bb9156f'
          test "$(git hash-object car02_r218_tenant_namespace_race_isolated.py)" = 'c1bbe5cff75a4709df0d09791df1ab424bb9156f'
          test "$(git rev-parse HEAD:car02_r221_forged_owner_ops_isolated.py)" = '057f05639dcfda64585eb42089dbefceca9289ef'
          test "$(git hash-object car02_r221_forged_owner_ops_isolated.py)" = '057f05639dcfda64585eb42089dbefceca9289ef'
          test "$(git rev-parse HEAD:car02_r224_used_key_auth_precedence_isolated.py)" = '6211db3cdda6623e1d77138e61ab0049e5bca0a9'
          test "$(git hash-object car02_r224_used_key_auth_precedence_isolated.py)" = '6211db3cdda6623e1d77138e61ab0049e5bca0a9'
          test "$(git rev-parse HEAD:car02_r227_search_path_shadow_isolated.py)" = 'efc31b42dc982b0ba4efca968e697527140a3a87'
          test "$(git hash-object car02_r227_search_path_shadow_isolated.py)" = 'efc31b42dc982b0ba4efca968e697527140a3a87'
