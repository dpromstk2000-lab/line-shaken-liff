          test "$(git hash-object car02_r230_ddl_tamper_isolated.py)" = '9691a85583937e201f40e5d8fdb79640e96b06f1'
          test "$(git hash-object car02_r233_role_grant_isolated.py)" = '073dba18de205815c07815d01790b6be9f8fe896'
          test "$(git hash-object test_car02_r234_role_grant.py)" = '8f8a8c0395a56a8c58cd0d91e73d601427272783'
          test "$(git hash-object car02_r237_exact_row_rls_isolated.py)" = '06f321f6bfcaf94604dab2edb06fae10dc548471'
          test "$(git hash-object test_car02_r238_exact_row_rls.py)" = '69fb2274054e5660cbc6ad794e4f2d372704e8a7'
          test "$(git hash-object test_car02_r239_workflow_contract.py)" = '819eb66ac1b2be63fb55242a2f42c7083fffba44'
          test "$(git hash-object .github/workflows/car02-r237-r239-pg17-exact-row-rls-hold-qa.yml)" = 'f3d021a8d02a0d63f771b0aae247056dbd887aba'
          python3 - <<'PYHOLD'
          import json,os
          from pathlib import Path
          from car02_r240_rls_query_shapes_isolated import verify
          doc=json.loads(Path('qa-evidence-r240/r240-rls-query-shapes-proof.json').read_text(encoding='ascii'))
          assert verify(doc) and doc['githubCommit']==os.environ['GITHUB_SHA']
          assert doc['release']=='NO_GO' and doc['migration']=='HOLD' and doc['realWorldGatesOpen']==12
          assert not doc['productionTouched'] and not doc['productionAuthorized'] and not doc['productionReady']
          print('R240_R242_POST_CLEANUP_NO_GO_HOLD_PASS')
          PYHOLD
      - name: Preserve only synthetic evidence for seven days
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: car02-r240-r242-synthetic-only-evidence
          path: qa-evidence-r240/
          retention-days: 7
          if-no-files-found: error
      - name: Post checkout read only without retained credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git config --local --get credential.helper || true)" = ''
          git status --short
