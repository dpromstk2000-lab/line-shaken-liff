          test "$(git rev-parse HEAD:test_car02_r238_exact_row_rls.py)" = '69fb2274054e5660cbc6ad794e4f2d372704e8a7'
          test "$(git hash-object test_car02_r238_exact_row_rls.py)" = '69fb2274054e5660cbc6ad794e4f2d372704e8a7'
          test "$(git rev-parse HEAD:test_car02_r239_workflow_contract.py)" = '819eb66ac1b2be63fb55242a2f42c7083fffba44'
          test "$(git hash-object test_car02_r239_workflow_contract.py)" = '819eb66ac1b2be63fb55242a2f42c7083fffba44'
          test "$(git rev-parse HEAD:.github/workflows/car02-r237-r239-pg17-exact-row-rls-hold-qa.yml)" = 'f3d021a8d02a0d63f771b0aae247056dbd887aba'
          test "$(git hash-object .github/workflows/car02-r237-r239-pg17-exact-row-rls-hold-qa.yml)" = 'f3d021a8d02a0d63f771b0aae247056dbd887aba'
          echo R240_TWENTYSIX_IMMUTABLE_PINS_PASS > qa-evidence-r240/source-pins.log
          echo R240_NO_GO_HOLD_TWELVE_GATES_OPEN > qa-evidence-r240/release-lock.log
      - name: R241 query shape proof tamper tests in three rounds
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            python3 -m unittest -v test_car02_r241_rls_query_shapes.py 2>&1 | tee "qa-evidence-r240/r241-negative-${round}.log"
            grep -Eq '^Ran 202 tests in ' "qa-evidence-r240/r241-negative-${round}.log"
            grep -Fxq OK "qa-evidence-r240/r241-negative-${round}.log"
            ! grep -Eq 'FAILED|ERROR|skipped=' "qa-evidence-r240/r241-negative-${round}.log"
          done
      - name: R242 no production workflow safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_car02_r242_workflow_contract.py 2>&1 | tee qa-evidence-r240/r242-contract.log
          grep -Fxq OK qa-evidence-r240/r242-contract.log
      - name: Create disposable PG17 database and five fixture roles
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r138_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -v ON_ERROR_STOP=1 < R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql > qa-evidence-r240/schema.log
          grep -Fxq R138_DISPOSABLE_PG17_SCHEMA_READY qa-evidence-r240/schema.log
      - name: Require all five disposable tables initially empty
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          for table in bookings service_cases case_operations booking_operations audit_events; do
            docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -Atqc "SELECT count(*) FROM car02_r138_qa.$table;" | grep -Fxq 0
          done
          echo R240_EMPTY_FIVE_TABLES_PASS > qa-evidence-r240/empty.log
      - name: Run real disposable PG17 five table pagination count owner join RLS evidence
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          python3 car02_r240_rls_query_shapes_isolated.py --cid "$CID" --commit "$GITHUB_SHA" 2>&1 | tee qa-evidence-r240/r240-probe.log
          grep -Fxq R240_DISPOSABLE_PG17_RLS_PAGINATION_COUNTS_OWNER_FILTERS_JOIN_NO_GO_HOLD_PASS qa-evidence-r240/r240-probe.log
          python3 - <<'PYVERIFY'
          import json,os
          from pathlib import Path
          from car02_r240_rls_query_shapes_isolated import verify, TABLES, ACTORS, PROFILES
          doc=json.loads(Path('qa-evidence-r240/r240-rls-query-shapes-proof.json').read_text(encoding='ascii'))
          assert verify(doc) and doc['githubCommit']==os.environ['GITHUB_SHA']
          assert len(doc['oracle'])==len(TABLES)==5
          assert len(doc['readbacks'])==len(ACTORS)*len(PROFILES)==10
          assert len(doc['oracleJoin'])==3
          assert doc['release']=='NO_GO' and doc['migration']=='HOLD'
          assert doc['realWorldGatesOpen']==12 and not doc['productionTouched']
          print('R240_INDEPENDENT_PAGINATION_OWNER_JOIN_EVIDENCE_PASS')
          PYVERIFY
      - name: Always remove disposable database and five synthetic roles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r138_qa_ci WITH (FORCE);'
          for role in car02_r138_a_staff_ci car02_r138_a_one_ci car02_r138_a_two_ci car02_r138_b_staff_ci car02_r138_b_one_ci; do
            docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS $role;"
          done
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS(SELECT 1 FROM pg_database WHERE datname='car02_r138_qa_ci') AND NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname LIKE 'car02_r138_%_ci') THEN 'R240_THROWAWAY_DATABASE_AND_FIVE_ROLES_DELETED' ELSE 'R240_CLEANUP_FAILED' END" | grep -Fxq R240_THROWAWAY_DATABASE_AND_FIVE_ROLES_DELETED
          echo R240_THROWAWAY_DATABASE_AND_FIVE_ROLES_DELETED > qa-evidence-r240/cleanup.log
      - name: Assert post cleanup protected sources and unconditional NO GO HOLD
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq R240_THROWAWAY_DATABASE_AND_FIVE_ROLES_DELETED qa-evidence-r240/cleanup.log
          grep -Fxq R240_NO_GO_HOLD_TWELVE_GATES_OPEN qa-evidence-r240/release-lock.log
