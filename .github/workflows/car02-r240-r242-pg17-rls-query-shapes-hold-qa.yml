          test "$(git hash-object car02_r206_disconnect_atomicity_isolated.py)" = '110c7640b9cdf233741ea9fdc59d903517f983eb'
          test "$(git hash-object car02_r209_commit_ack_loss_isolated.py)" = '72e0fd3bf6cdf536280c34fe0e8b19231b3bfe1a'
          test "$(git hash-object car02_r212_parallel_replay_isolated.py)" = '19264cdafa04685995bd9cf24e55b22685cd1dab'
          test "$(git hash-object car02_r215_first_write_race_isolated.py)" = '22f4a7678eac6bb87bb5c875e43d56bae13d3175'
