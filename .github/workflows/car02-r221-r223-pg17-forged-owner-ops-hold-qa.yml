name: CAR02 R221-R223 PG17 Parallel Forged Owner and Tenant ID Denial HOLD QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: car02-r221-r223-disposable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-pg17-forged-owner-ops-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r221-disposable-admin-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAR02_RELEASE_LOCK: 'true'
      R221_DISPOSABLE_QA: 'yes'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout read only without retained credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Pin fifteen immutable source identities and unconditional NO GO HOLD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence-r221
          test "$(git rev-parse HEAD:R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql)" = '3784f8a28549bc40343646bf88657c9d9b0b80f2'
          test "$(git rev-parse HEAD:car02_r138_pg17_lifecycle_qa.py)" = 'ff98dd74916ff3ea77412b986138151a4fddab90'
          test "$(git rev-parse HEAD:car02_r159_concurrent_booking_isolated.py)" = '318921e951cf1578bb00f32eb77f2054ca350ed6'
          test "$(git rev-parse HEAD:car02_r171_rejection_immutability_isolated.py)" = '23f082a6b247d26cb772c6eee5084000f12d72a2'
          test "$(git rev-parse HEAD:car02_r188_role_escalation_isolated.py)" = 'd61fc9d6d2248e1851187a6b20dea4184fea564d'
          test "$(git rev-parse HEAD:car02_r191_transaction_rollback_isolated.py)" = '7bf3c1b690db14e6dcbe27831d18231488c91d5f'
          test "$(git rev-parse HEAD:car02_r194_savepoint_atomicity_isolated.py)" = 'b30b081cc019692739e8a4182be00bed73ed1ecc'
          test "$(git rev-parse HEAD:car02_r197_error_recovery_isolated.py)" = '561a282301a5133f37881a04a8459a0ca87b05e1'
          test "$(git rev-parse HEAD:car02_r200_lock_timeout_isolated.py)" = '565d6d0528b23202bbb61910b83bad0b8678370a'
          test "$(git rev-parse HEAD:car02_r203_deadlock_recovery_isolated.py)" = '084906c336dcd2011fdadc1eca8f264ccd423327'
          test "$(git rev-parse HEAD:car02_r206_disconnect_atomicity_isolated.py)" = '110c7640b9cdf233741ea9fdc59d903517f983eb'
          test "$(git rev-parse HEAD:car02_r209_commit_ack_loss_isolated.py)" = '72e0fd3bf6cdf536280c34fe0e8b19231b3bfe1a'
          test "$(git rev-parse HEAD:car02_r212_parallel_replay_isolated.py)" = '19264cdafa04685995bd9cf24e55b22685cd1dab'
          test "$(git rev-parse HEAD:car02_r215_first_write_race_isolated.py)" = '22f4a7678eac6bb87bb5c875e43d56bae13d3175'
          test "$(git rev-parse HEAD:car02_r218_tenant_namespace_race_isolated.py)" = 'c1bbe5cff75a4709df0d09791df1ab424bb9156f'
          echo R221_FIFTEEN_SOURCE_PINS_PASS > qa-evidence-r221/source-pins.log
          echo R221_RELEASE_NO_GO_MIGRATION_HOLD > qa-evidence-r221/release-lock.log
      - name: R222 namespace, ownership and evidence tests three rounds
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            python3 -m unittest -v test_car02_r222_forged_owner_ops.py 2>&1 | tee "qa-evidence-r221/r222-negative-${round}.log"
            grep -Eq '^Ran 78 tests in ' "qa-evidence-r221/r222-negative-${round}.log"
            grep -Fxq OK "qa-evidence-r221/r222-negative-${round}.log"
            ! grep -Eq 'FAILED|ERROR|skipped=' "qa-evidence-r221/r222-negative-${round}.log"
          done
      - name: R223 workflow safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_car02_r223_workflow_contract.py 2>&1 | tee qa-evidence-r221/r223-contract.log
          grep -Fxq OK qa-evidence-r221/r223-contract.log
      - name: Create only disposable PG17 fixture and five synthetic roles
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE car02_r138_qa_ci;'
          docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -v ON_ERROR_STOP=1 < R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql > qa-evidence-r221/schema.log
          grep -Fxq R138_DISPOSABLE_PG17_SCHEMA_READY qa-evidence-r221/schema.log
      - name: Require empty five-table fixture
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          for table in bookings service_cases case_operations booking_operations audit_events; do
            docker exec -i "$CID" psql -X -U postgres -d car02_r138_qa_ci -Atqc "SELECT count(*) FROM car02_r138_qa.$table;" | grep -Fxq 0
          done
          echo R221_FIVE_TABLES_EMPTY > qa-evidence-r221/empty-fixture.log
      - name: Run PG17 parallel forged owner and cross tenant ID denials
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          python3 car02_r221_forged_owner_ops_isolated.py --cid "$CID" --commit "$GITHUB_SHA" 2>&1 | tee qa-evidence-r221/r221-probe.log
          grep -Fxq R221_DISPOSABLE_PG17_PARALLEL_FORGED_OWNER_IDS_DENIED_FIVE_TABLE_IMMUTABLE_AUTHORIZED_ONCE_NO_GO_HOLD qa-evidence-r221/r221-probe.log
          python3 - <<'PYVERIFY'
          import json,os
          from pathlib import Path
          from car02_r221_forged_owner_ops_isolated import verify_report,STAGES,N
          proof=json.loads(Path('qa-evidence-r221/r221-forged-owner-operations-proof.json').read_text(encoding='ascii'))
          assert verify_report(proof) and proof['githubCommit']==os.environ['GITHUB_SHA']
          assert len(proof['stages'])==len(STAGES)==4
          assert all(len(x['attacks'])==N==8 and x['operationRows']==x['auditRows']==1 for x in proof['stages'].values())
          assert all(x['before']==x['afterDenied'] for x in proof['stages'].values())
          assert proof['release']=='NO_GO' and proof['migration']=='HOLD' and proof['realWorldGatesOpen']==12
          assert proof['productionTouched'] is False and proof['realAuthenticationVerified'] is False
          print('R221_PARALLEL_FOREIGN_IDS_DENIED_AND_AUTHORIZED_SURVIVES_VERIFIED')
          PYVERIFY
      - name: Always remove disposable DB and all five synthetic roles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.postgres.id }}'
          test -n "$CID"
          docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS car02_r138_qa_ci WITH (FORCE);'
          for role in car02_r138_a_staff_ci car02_r138_a_one_ci car02_r138_a_two_ci car02_r138_b_staff_ci car02_r138_b_one_ci; do
            docker exec -i "$CID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS $role;"
          done
          docker exec -i "$CID" psql -X -U postgres -d postgres -Atqc "SELECT CASE WHEN NOT EXISTS(SELECT 1 FROM pg_database WHERE datname='car02_r138_qa_ci') AND NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname LIKE 'car02_r138_%_ci') THEN 'R221_ALL_THROWAWAY_RESOURCES_DELETED' ELSE 'R221_CLEANUP_FAILED' END" | grep -Fxq R221_ALL_THROWAWAY_RESOURCES_DELETED
          echo R221_ALL_THROWAWAY_RESOURCES_DELETED > qa-evidence-r221/cleanup.log
      - name: Verify immutable original sources and unconditional NO GO HOLD after cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq R221_ALL_THROWAWAY_RESOURCES_DELETED qa-evidence-r221/cleanup.log
          grep -Fxq R221_RELEASE_NO_GO_MIGRATION_HOLD qa-evidence-r221/release-lock.log
          test "$(git rev-parse HEAD:R138_PG17_BOOKING_LIFECYCLE_QA_ONLY.sql)" = '3784f8a28549bc40343646bf88657c9d9b0b80f2'
          test "$(git rev-parse HEAD:car02_r138_pg17_lifecycle_qa.py)" = 'ff98dd74916ff3ea77412b986138151a4fddab90'
          test "$(git rev-parse HEAD:car02_r159_concurrent_booking_isolated.py)" = '318921e951cf1578bb00f32eb77f2054ca350ed6'
          test "$(git rev-parse HEAD:car02_r171_rejection_immutability_isolated.py)" = '23f082a6b247d26cb772c6eee5084000f12d72a2'
          test "$(git rev-parse HEAD:car02_r188_role_escalation_isolated.py)" = 'd61fc9d6d2248e1851187a6b20dea4184fea564d'
          test "$(git rev-parse HEAD:car02_r191_transaction_rollback_isolated.py)" = '7bf3c1b690db14e6dcbe27831d18231488c91d5f'
          test "$(git rev-parse HEAD:car02_r194_savepoint_atomicity_isolated.py)" = 'b30b081cc019692739e8a4182be00bed73ed1ecc'
          test "$(git rev-parse HEAD:car02_r197_error_recovery_isolated.py)" = '561a282301a5133f37881a04a8459a0ca87b05e1'
          test "$(git rev-parse HEAD:car02_r200_lock_timeout_isolated.py)" = '565d6d0528b23202bbb61910b83bad0b8678370a'
          test "$(git rev-parse HEAD:car02_r203_deadlock_recovery_isolated.py)" = '084906c336dcd2011fdadc1eca8f264ccd423327'
          test "$(git rev-parse HEAD:car02_r206_disconnect_atomicity_isolated.py)" = '110c7640b9cdf233741ea9fdc59d903517f983eb'
          test "$(git rev-parse HEAD:car02_r209_commit_ack_loss_isolated.py)" = '72e0fd3bf6cdf536280c34fe0e8b19231b3bfe1a'
          test "$(git rev-parse HEAD:car02_r212_parallel_replay_isolated.py)" = '19264cdafa04685995bd9cf24e55b22685cd1dab'
          test "$(git rev-parse HEAD:car02_r215_first_write_race_isolated.py)" = '22f4a7678eac6bb87bb5c875e43d56bae13d3175'
          test "$(git rev-parse HEAD:car02_r218_tenant_namespace_race_isolated.py)" = 'c1bbe5cff75a4709df0d09791df1ab424bb9156f'
          python3 - <<'PYHOLD'
          import json,os
          from pathlib import Path
          from car02_r221_forged_owner_ops_isolated import verify_report
          p=json.loads(Path('qa-evidence-r221/r221-forged-owner-operations-proof.json').read_text(encoding='ascii'))
          assert verify_report(p) and p['githubCommit']==os.environ['GITHUB_SHA']
          assert p['release']=='NO_GO' and p['migration']=='HOLD' and p['realWorldGatesOpen']==12
          assert p['productionTouched'] is False and p['productionAuthorized'] is False
          print('R221_R223_CLEANUP_NO_GO_HOLD_PASS')
          PYHOLD
      - name: Preserve only synthetic seven-day evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: car02-r221-r223-disposable-pg17-forged-owner-ops
          path: qa-evidence-r221/
          if-no-files-found: warn
          retention-days: 7
