          grep -q 'approval_required_before_working: true' .dpro/ksh-next/ksh-next-5-result.yml
          grep -q 'current_step: "STEP KSH-NEXT-5"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-6"' .dpro/ksh-next/plan.yml | grep -q 'status: "next"'

          node --check ksh-next-5-owner-estimate.js
          node --check ksh-next-5-member-estimate.js

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter
          import re
          import subprocess
          import tempfile

          class Parser(HTMLParser):
              pass

          for filename in ["dashboard.html", "member.html"]:
              text = Path(filename).read_text(encoding="utf-8")
              parser = Parser()
              parser.feed(text)
              parser.close()

              ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
              duplicates = sorted(key for key, count in Counter(ids).items() if count > 1)
              if duplicates:
                  raise SystemExit(f"{filename} duplicate IDs: " + ", ".join(duplicates))

              inline_scripts = []
              for attrs, body in re.findall(
                  r"<script\b([^>]*)>(.*?)</script>",
                  text,
                  flags=re.I | re.S,
              ):
                  if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                      continue
                  if body.strip():
                      inline_scripts.append(body)

              for index, script in enumerate(inline_scripts, start=1):
                  temp = Path(tempfile.gettempdir()) / f"ksh-next-5-{filename}-{index}.js"
                  temp.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(temp)], check=True)

              print(filename, "HTML and inline JS OK")
          PY

      - name: Test estimate and approval logic
        shell: bash
        run: |
          set -euo pipefail

          node <<'JS'
          const versionPattern = /^【見積版：(\d+)】\s*/m;
          const amountPattern = /^【見積金額：(\d+)】\s*/m;
          const datePattern = /^【見積提示日：([^】]+)】\s*/m;
          const detailsPattern = /^【見積内容：([^】]*)】\s*/m;

          function strip(memo) {
            return String(memo || "")
              .replace(versionPattern, "")
              .replace(amountPattern, "")
              .replace(datePattern, "")
              .replace(detailsPattern, "")
              .trim();
          }

          function apply(memo, version, amount, details) {
            return [
              strip(memo),
              `【見積版：${version}】`,
              `【見積金額：${amount}】`,
              `【見積提示日：2026-07-23T00:00:00.000Z】`,
              `【見積内容：${encodeURIComponent(details)}】`
            ].filter(Boolean).join("\n");
          }

          function parse(memo) {
            return {
              version: Number(String(memo).match(versionPattern)?.[1] || 0),
              amount: Number(String(memo).match(amountPattern)?.[1] || 0),
              details: decodeURIComponent(String(memo).match(detailsPattern)?.[1] || "")
            };
          }

          const saved = apply(
            "【受付経路：LINE】\n【進捗：お客様確認待ち】\n代車希望",
            2,
            132000,
            "車検基本料金\nオイル交換"
          );
          const parsed = parse(saved);

          if (parsed.version !== 2) throw new Error("estimate version failed");
          if (parsed.amount !== 132000) throw new Error("estimate amount failed");
          if (parsed.details !== "車検基本料金\nオイル交換") throw new Error("estimate details failed");
          if (!strip(saved).includes("【受付経路：LINE】")) throw new Error("reception metadata lost");
          if (!strip(saved).includes("【進捗：お客様確認待ち】")) throw new Error("progress metadata lost");
          if (!strip(saved).includes("代車希望")) throw new Error("plain memo lost");

          const responseMessage = [
            "【見積回答】",
            "予約ID：reservation-1",
            "見積版：2",
            "回答：承認",
            "見積金額：132000",
            "回答キー：reservation-1:v2:承認:1",
            "お客様メモ：見積内容を承認します。"
          ].join("\n");

          if (!/^回答：承認$/m.test(responseMessage)) throw new Error("approval response failed");
          if (!/^予約ID：reservation-1$/m.test(responseMessage)) throw new Error("reservation link failed");

          console.log("Estimate metadata and approval response logic OK");
          JS

          echo "KSH-NEXT-5 logic checks passed."

