                render();
                showToast(answer === "承認"
                  ? "見積を承認しました。店舗へ回答を送信しました。"
                  : "確認内容を店舗へ送信しました。");
              } catch (error) {
                console.error(error);
                showToast(error.message || "回答の送信に失敗しました。");
              }
            };

            window.KSH_NEXT_5_ESTIMATE_MEMBER = {
              parseEstimateMetadata,
              parseEstimateResponseInquiry,
              stripMemberMetadata
            };
          })();
          '''

          owner_js_path.write_text(owner_js, encoding="utf-8")
