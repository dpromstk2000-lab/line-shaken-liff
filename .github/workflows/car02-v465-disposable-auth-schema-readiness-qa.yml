name: CAR02 V4.65 Disposable Staging Auth Schema Readiness PG17 (NO_GO HOLD)
# REVIEW ONLY. Made-up empty PG17 tables. Never connect to real Supabase.
# Metadata cannot certify provider sessions or grant permissions for business writes.
on:
  push:
    branches: [car02-v434-review-only]
    paths:
      - 'car02-staging-schema-probe-r465.mjs'
      - 'car02-staging-schema-probe-r465.test.mjs'
      - 'car02-v465-disposable-schema-pg17.sql'
      - '.github/workflows/car02-v465-disposable-auth-schema-readiness-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-disposable-schema-metadata:
    if: github.ref == 'refs/heads/car02-v434-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v465_disposable_only
        ports:
          - 55465:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: v465_disposable_only
    steps:
      - name: Checkout isolated review only without credential persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject production credentials and verify locked original source
        shell: bash
        run: |
          set -euo pipefail
          for key in CAR02_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET; do
            test -z "${!key:-}" || { echo "V465_REFUSE_REAL_PROVIDER_ENV: $key" >&2; exit 1; }
          done
          test "$(git hash-object car02-edge-entry-r52.ts)" = 'f0e31fb9f9d98524519d01dffd3489893d3d3302'
          grep -Eq 'const[[:space:]]+CAR02_RELEASE_LOCK=true' car02-edge-entry-r52.ts
          for item in car02-staging-schema-probe-r465.mjs car02-staging-schema-probe-r465.test.mjs car02-v465-disposable-schema-pg17.sql; do test -s "$item"; done
          test -s .github/workflows/car02-v465-disposable-auth-schema-readiness-qa.yml
          test ! -e car02-v465-disposable-auth-schema-readiness-qa.yml
          echo V465_ACTUAL_R52_LOCK_NO_PROVIDER_CREDS_AND_WORKFLOW_LAYOUT_PASS
      - name: Run entire dynamic Node regression including catalog deny paths
        shell: bash
        run: |
          set -euo pipefail
          node --check car02-staging-schema-probe-r465.mjs
          node --check car02-staging-schema-probe-r465.test.mjs
          node --test car02-*.test.mjs | tee "$RUNNER_TEMP/v465-node.log"
          tests=$(awk '/^# tests / {print $3}' "$RUNNER_TEMP/v465-node.log")
          passed=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/v465-node.log")
          test "$tests" -ge 542
          test "$passed" = "$tests"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/v465-node.log"
          echo V465_ALL_NODE_METADATA_ONLY_RELEASE_LOCK_PASS
      - name: Execute real disposable PG17 zero-data schema inspection
        shell: bash
        run: |
          set -euo pipefail
          pg(){ docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17 psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55465 -U postgres "$@"; }
          pg -d postgres -c 'CREATE DATABASE car02_v465_disposable' >/dev/null
          pg -d car02_v465_disposable -f /workspace/car02-v465-disposable-schema-pg17.sql | tee "$RUNNER_TEMP/v465-pg.log"
          for marker in V465_PG17_EMPTY_AUTH_FIXTURE_WITH_NO_ROW_READ_GRANTS_PASS V465_PG17_SEVEN_REQUIRED_COLUMNS_METADATA_READ_ONLY_PASS V465_PG17_NEGATIVE_MISSING_COLUMN_AND_ROLLBACK_PASS V465_FINAL_RELEASE_NO_GO_HOLD_TRUE; do
            grep -Fxq "$marker" "$RUNNER_TEMP/v465-pg.log"
          done
          test "$(pg -Atq -d car02_v465_disposable -c 'SELECT COUNT(*) FROM auth.sessions')" = '0'
          test "$(pg -Atq -d car02_v465_disposable -c 'SELECT COUNT(*) FROM public.ksh_car02_staff_access')" = '0'
          echo V465_PG17_ZERO_PERSONAL_ROWS_AND_RELEASE_NO_GO_PASS
