        shell: bash
        run: |
          set -euo pipefail

          rm -f ".github/workflows/step-ksh-next-9-performance-security-check.yml"
          rm -f ".github/workflows/step-ksh-next-10a-operation-sheet.yml"
          rm -f ".github/workflows/step-ksh-next-10a-operation-sheet-r2.yml"

          git config user.name "DPRO STEP KSH-NEXT-10A R2"
