          cat > /tmp/ksh-next-10-playwright/print-pdf.mjs <<'JS'
          import { chromium } from "playwright";
          import path from "path";
          import { pathToFileURL } from "url";

          const root = process.cwd();
          const deliver = path.join(root, "deliverables", "ksh-next-10");
          const htmlPath = path.join(deliver, "operation-sheet.html");
          const pdfPath = path.join(deliver, "DPRO_KSH_NEXT_operation_experience_sheet_20260723.pdf");

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ locale: "ja-JP" });
          await page.goto(pathToFileURL(htmlPath).href, { waitUntil: "load", timeout: 60000 });
          await page.emulateMedia({ media: "print" });
          await page.pdf({
            path: pdfPath,
            format: "A4",
            printBackground: true,
            margin: { top: "0mm", right: "0mm", bottom: "0mm", left: "0mm" },
            preferCSSPageSize: true,
          });
          await browser.close();
          console.log(pdfPath);
          JS

          node /tmp/ksh-next-10-playwright/print-pdf.mjs

      - name: Render and verify PDF and QR codes
        shell: bash
        run: |
          set -euo pipefail

          DELIVER="deliverables/ksh-next-10"
          PDF="$DELIVER/DPRO_KSH_NEXT_operation_experience_sheet_20260723.pdf"
          RENDERS="$DELIVER/_renders"

          test -s "$PDF"

          python3 <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          pdf = Path("deliverables/ksh-next-10/DPRO_KSH_NEXT_operation_experience_sheet_20260723.pdf")
          reader = PdfReader(str(pdf))
          if len(reader.pages) != 2:
              raise SystemExit(f"PDF page count must be 2, found {len(reader.pages)}")

          for index, page in enumerate(reader.pages, start=1):
              width = float(page.mediabox.width)
              height = float(page.mediabox.height)
              if not (590 <= width <= 600 and 838 <= height <= 850):
                  raise SystemExit(f"Page {index} is not A4 portrait: {width} x {height}")

          print("PDF page count and A4 portrait size OK")
          PY

          rm -rf "$RENDERS"
          mkdir -p "$RENDERS"
          pdftoppm -png -r 200 "$PDF" "$RENDERS/page"

          test -s "$RENDERS/page-1.png"
          test -s "$RENDERS/page-2.png"

          cp "$RENDERS/page-1.png" "$DELIVER/DPRO_KSH_NEXT_owner_operation_sheet_page1.png"
          cp "$RENDERS/page-2.png" "$DELIVER/DPRO_KSH_NEXT_internal_sales_sheet_page2.png"

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat

          for path in [
              Path("deliverables/ksh-next-10/DPRO_KSH_NEXT_owner_operation_sheet_page1.png"),
              Path("deliverables/ksh-next-10/DPRO_KSH_NEXT_internal_sales_sheet_page2.png"),
          ]:
              image = Image.open(path).convert("RGB")
              if image.width < 1500 or image.height < 2200:
                  raise SystemExit(f"Rendered PNG resolution is too small: {path}: {image.size}")
              variance = sum(ImageStat.Stat(image.resize((160, 220))).var) / 3
              if variance < 120:
                  raise SystemExit(f"Rendered page appears blank: {path}: variance={variance:.2f}")
              print(path, image.size, path.stat().st_size, f"variance={variance:.1f}")
          PY

          python3 <<'PY'
          from pathlib import Path
          import json
          import subprocess

          deliver = Path("deliverables/ksh-next-10")
          config = json.loads((deliver / "urls.json").read_text(encoding="utf-8"))
          expected = {
              config["qr_urls"]["customer"],
              config["qr_urls"]["member"],
              config["qr_urls"]["ipad"],
              config["qr_urls"]["dashboard"],
          }

          result = subprocess.run(
              ["zbarimg", "--quiet", "--raw", str(deliver / "_renders" / "page-1.png")],
              check=False,
              text=True,
              capture_output=True,
          )

          decoded = {line.strip() for line in result.stdout.splitlines() if line.strip()}
          missing = expected - decoded
          unexpected = decoded - expected

          if missing:
              raise SystemExit(
                  "QR decoding from rendered PDF failed.\n"
                  f"missing={sorted(missing)}\n"
                  f"decoded={sorted(decoded)}\n"
                  f"stderr={result.stderr}"
              )

          verification = [
              "DPRO KSH NEXT QR READING VERIFICATION",
              "Result: PASS",
              "Source: rendered PDF page 1 at 200 dpi",
              "",
          ]
          for url in sorted(expected):
              verification.append(f"PASS: {url}")
          if unexpected:
              verification.append("")
              verification.append("Additional decoded values:")
              verification.extend(sorted(unexpected))

          (deliver / "DPRO_KSH_NEXT_QR_READING_VERIFICATION.txt").write_text(
              "\n".join(verification) + "\n",
              encoding="utf-8",
          )

          print("QR decoding from rendered PDF: PASS")
          for url in sorted(decoded):
              print(url)
          PY

          rm -f "$DELIVER/DPRO_KSH_NEXT_operation_sheet_PDF_PNG_20260723.zip"
          rm -f "$DELIVER/DPRO_KSH_NEXT_operation_sheet_PNG_ONLY_20260723.zip"

          (
            cd "$DELIVER"
            zip -9 "DPRO_KSH_NEXT_operation_sheet_PDF_PNG_20260723.zip" \
              "DPRO_KSH_NEXT_operation_experience_sheet_20260723.pdf" \
              "DPRO_KSH_NEXT_owner_operation_sheet_page1.png" \
              "DPRO_KSH_NEXT_internal_sales_sheet_page2.png" \
              "DPRO_KSH_NEXT_QR_READING_VERIFICATION.txt"

            zip -9 "DPRO_KSH_NEXT_operation_sheet_PNG_ONLY_20260723.zip" \
              "DPRO_KSH_NEXT_owner_operation_sheet_page1.png" \
              "DPRO_KSH_NEXT_internal_sales_sheet_page2.png" \
              "DPRO_KSH_NEXT_QR_READING_VERIFICATION.txt"
          )

          test -s "$DELIVER/DPRO_KSH_NEXT_operation_sheet_PDF_PNG_20260723.zip"
          test -s "$DELIVER/DPRO_KSH_NEXT_operation_sheet_PNG_ONLY_20260723.zip"

          rm -rf "$DELIVER/_renders"
          rm -rf "$DELIVER/qr"
          rm -rf "$DELIVER/screens"
          rm -f "$DELIVER/operation-sheet.html"
          rm -f "$DELIVER/urls.json"

          echo "PDF, rendered PNGs, QR verification and ZIP packages: OK"

      - name: Finalize completion candidate
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json

          plan_path = Path(".dpro/ksh-next/plan.yml")
          result_path = Path(".dpro/ksh-next/ksh-next-10a-result.yml")
          check_path = Path("system-check.html")
          deliver = Path("deliverables/ksh-next-10")

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return source.replace(old, new, 1)

          def sha256(path):
              digest = hashlib.sha256()
              digest.update(path.read_bytes())
              return digest.hexdigest()

          pdf_name = "DPRO_KSH_NEXT_operation_experience_sheet_20260723.pdf"
          owner_png = "DPRO_KSH_NEXT_owner_operation_sheet_page1.png"
          internal_png = "DPRO_KSH_NEXT_internal_sales_sheet_page2.png"
          all_zip = "DPRO_KSH_NEXT_operation_sheet_PDF_PNG_20260723.zip"
          png_zip = "DPRO_KSH_NEXT_operation_sheet_PNG_ONLY_20260723.zip"
          verify_txt = "DPRO_KSH_NEXT_QR_READING_VERIFICATION.txt"

          for name in [pdf_name, owner_png, internal_png, all_zip, png_zip, verify_txt]:
              path = deliver / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"deliverable missing: {path}")

          check = check_path.read_text(encoding="utf-8")
          pdf_url = (
              "https://dpromstk2000-lab.github.io/line-shaken-liff/"
              f"deliverables/ksh-next-10/{pdf_name}"
          )
          button = (
              f'<a class="btn btn-dark" href="{pdf_url}" target="_blank" rel="noopener">'
              "操作体験シートPDF</a>"
          )

          anchor = '<button class="btn btn-light" onclick="copyAllUrls()">URL一覧コピー</button>'
          if button not in check:
              check = replace_once(check, anchor, anchor + "\n          " + button, "system-check PDF button")
          check_path.write_text(check, encoding="utf-8")

          plan = plan_path.read_text(encoding="utf-8")
          plan = replace_once(
              plan,
              '  current_step: "STEP KSH-NEXT-9"',
              '  current_step: "STEP KSH-NEXT-10A"',
              "plan current step",
          )
          plan = replace_once(
              plan,
              '''  - id: "KSH-NEXT-10"
              title: "製品サイト・操作体験シート・完成判定"
              status: "next"''',
              '''  - id: "KSH-NEXT-10"
              title: "製品サイト・操作体験シート・完成判定"
              status: "operation_sheet_completed_product_site_pending"''',
              "plan step 10",
          )
          plan_path.write_text(plan, encoding="utf-8")

          files = []
          for name in [pdf_name, owner_png, internal_png, all_zip, png_zip, verify_txt]:
              path = deliver / name
              files.append({
                  "path": path.as_posix(),
                  "bytes": path.stat().st_size,
                  "sha256": sha256(path),
              })

          lines = [
              'schema_version: "1.0"',
              "document:",
              '  id: "DPRO-KSH-NEXT-10A-RESULT"',
              '  step: "STEP KSH-NEXT-10A"',
              '  title: "操作体験シート・QR検査・完成候補パッケージ"',
              f'  generated_at_utc: {json.dumps(datetime.now(timezone.utc).isoformat())}',
              "completion_state:",
              '  core_system: "completed"',
              '  system_check: "18/18 OK"',
              '  operation_sheet: "completed"',
              '  qr_reading: "PASS from rendered PDF"',
              '  product_site: "pending STEP KSH-NEXT-10B"',
              '  final_judgment: "pending product-site publication"',
              "deliverables:",
          ]

          for item in files:
              lines.extend([
                  f'  - path: {json.dumps(item["path"])}',
                  f'    bytes: {item["bytes"]}',
                  f'    sha256: {json.dumps(item["sha256"])}',
              ])

          lines.extend([
              "public_urls:",
              f'  operation_sheet_pdf: {json.dumps(pdf_url)}',
              '  customer: "https://dpromstk2000-lab.github.io/line-shaken-liff/index.html?v=step-ksh-next-10"',
              '  member: "https://dpromstk2000-lab.github.io/line-shaken-liff/member.html?demo=1&v=step-ksh-next-7"',
              '  ipad: "https://dpromstk2000-lab.github.io/line-shaken-liff/owner-ipad.html?embed_demo=1&v=step-ksh-next-6"',
              '  dashboard: "https://dpromstk2000-lab.github.io/line-shaken-liff/dashboard.html?embed_demo=1&v=step-ksh-next-8"',
              '  system_check: "https://dpromstk2000-lab.github.io/line-shaken-liff/system-check.html?v=step-ksh-next-9"',
              "safety:",
              "  database_changed: false",
              "  worker_changed: false",
              "  existing_api_changed: false",
              "  qr_decoded_from_pdf_render: true",
              "  pdf_page_count: 2",
              "  pdf_a4_portrait: true",
              "  backup_tag_created: true",
              "next_action:",
              '  id: "KSH-NEXT-10B"',
              '  title: "DPRO製品サイト更新・最終完成判定"',
          ])

          result_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("KSH-NEXT-10A result and plan updated")
          PY

          grep -q 'current_step: "STEP KSH-NEXT-10A"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-10"' .dpro/ksh-next/plan.yml | grep -q 'operation_sheet_completed_product_site_pending'
          grep -q 'qr_decoded_from_pdf_render: true' .dpro/ksh-next/ksh-next-10a-result.yml
          grep -q 'product_site: "pending STEP KSH-NEXT-10B"' .dpro/ksh-next/ksh-next-10a-result.yml
          grep -q '操作体験シートPDF' system-check.html

          echo "KSH-NEXT-10A completion candidate checks passed."

