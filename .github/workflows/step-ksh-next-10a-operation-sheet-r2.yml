          .url-mini {{ font-size: 6.8pt !important; word-break: break-all; }}
          </style>
          </head>
          <body>
          <section class="page">
            <div class="header">
              <div>
                <div class="eyebrow">DPRO NEXT / OWNER OPERATION EXPERIENCE</div>
                <h1>DPRO 車検・整備工場 LINE<br>オーナー様用 操作体験シート</h1>
                <p class="lead">当日使う4画面をQRから確認できます。PC・iPadのデモ管理コードは <b>1234</b> です。</p>
