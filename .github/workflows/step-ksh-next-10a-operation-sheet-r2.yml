name: STEP KSH-NEXT-10A Operation Sheet Completion R2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/step-ksh-next-10a-operation-sheet-r2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step-ksh-next-10a-operation-sheet-r2
  cancel-in-progress: false

jobs:
  operation-sheet-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Save pre-change commit
        shell: bash
        run: |
          set -euo pipefail
          echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify KSH-NEXT-9 completion
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f index-product-demo.html
          test -f dashboard.html
          test -f owner-ipad.html
          test -f member.html
          test -f system-check.html
          test -f .dpro/ksh-next/plan.yml
          test -f .dpro/ksh-next/ksh-next-9-result.yml
          test -f .dpro/ksh-next/frontend-audit.yml

          grep -q 'STEP KSH-NEXT-8</title>' dashboard.html
          grep -q 'STEP KSH-NEXT-6' owner-ipad.html
          grep -q 'STEP KSH-NEXT-7' member.html
          grep -q 'STEP KSH-NEXT-9' system-check.html
          grep -q 'current_step: "STEP KSH-NEXT-9"' .dpro/ksh-next/plan.yml
          grep -A2 'id: "KSH-NEXT-10"' .dpro/ksh-next/plan.yml | grep -q 'status: "next"'
          grep -q 'html_parse_ok: true' .dpro/ksh-next/frontend-audit.yml
          grep -q 'javascript_syntax_ok: true' .dpro/ksh-next/frontend-audit.yml
          grep -q 'public_admin_markers_detected: false' .dpro/ksh-next/frontend-audit.yml

          if [ -f .dpro/ksh-next/ksh-next-10a-result.yml ]; then
            echo "STEP KSH-NEXT-10A is already applied."
            exit 1
          fi

          if [ -d deliverables/ksh-next-10 ]; then
            echo "STEP KSH-NEXT-10 deliverables already exist. Stop to prevent overwrite."
            exit 1
          fi

          echo "KSH-NEXT-9 completion and frontend audit verified."

      - name: Create safety tag
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_TAG="ksh-next-10a-r2-before-${{ github.run_id }}"
          git tag "$BACKUP_TAG" "$BEFORE_SHA"
          git push origin "$BACKUP_TAG"
          echo "BACKUP_TAG=$BACKUP_TAG" >> "$GITHUB_ENV"

      - name: Install PDF and browser tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            fonts-ipafont-gothic \
            poppler-utils \
            zbar-tools \
            zip

          python3 -m pip install --disable-pip-version-check \
            "qrcode[pil]>=7.4,<9" \
            "Pillow>=10,<12" \
            "pypdf>=5,<7"

          rm -rf /tmp/ksh-next-10-playwright
          mkdir -p /tmp/ksh-next-10-playwright
          cd /tmp/ksh-next-10-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.60.0 >/dev/null
          node -e "const p=require('playwright/package.json'); if(p.version!=='1.60.0') throw new Error('Unexpected Playwright version: '+p.version); console.log('Playwright', p.version)"
          npx playwright install --with-deps chromium

      - name: Capture live screens and generate sheet
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import json
          import qrcode

          root = Path.cwd()
          deliver = root / "deliverables" / "ksh-next-10"
          screens = deliver / "screens"
          qrs = deliver / "qr"
          renders = deliver / "_renders"
          for path in [deliver, screens, qrs, renders]:
              path.mkdir(parents=True, exist_ok=True)

          base = "https://dpromstk2000-lab.github.io/line-shaken-liff"
          urls = {
              "customer": f"{base}/index.html?v=step-ksh-next-10",
              "member": f"{base}/member.html?demo=1&v=step-ksh-next-7",
              "ipad": f"{base}/owner-ipad.html?embed_demo=1&v=step-ksh-next-6",
              "dashboard": f"{base}/dashboard.html?embed_demo=1&v=step-ksh-next-8",
              "system_check": f"{base}/system-check.html?v=step-ksh-next-9",
              "product": "https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/car-service.html",
          }

          capture_urls = {
              "customer": f"{base}/index-product-demo.html?v=step-ksh-next-10",
              "member": urls["member"],
              "ipad": urls["ipad"],
              "dashboard": urls["dashboard"],
          }

          (deliver / "urls.json").write_text(
              json.dumps({"qr_urls": urls, "capture_urls": capture_urls}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          for key in ["customer", "member", "ipad", "dashboard"]:
              qr = qrcode.QRCode(
                  version=None,
                  error_correction=qrcode.constants.ERROR_CORRECT_H,
                  box_size=10,
                  border=4,
              )
              qr.add_data(urls[key])
              qr.make(fit=True)
              image = qr.make_image(fill_color="black", back_color="white").convert("RGB")
              image.save(qrs / f"{key}.png", quality=100)

          print("QR images generated")
          print(json.dumps(urls, ensure_ascii=False, indent=2))
          PY

          cat > /tmp/ksh-next-10-playwright/capture.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "fs";
          import path from "path";

          const root = process.cwd();
          const deliver = path.join(root, "deliverables", "ksh-next-10");
          const config = JSON.parse(fs.readFileSync(path.join(deliver, "urls.json"), "utf8"));
          const browser = await chromium.launch({ headless: true });

          async function capture(name, url, viewport, waitMs = 3500) {
            const page = await browser.newPage({
              viewport,
              deviceScaleFactor: 1.5,
              locale: "ja-JP",
              colorScheme: "light",
            });

            const response = await page.goto(url, {
              waitUntil: "networkidle",
              timeout: 90000,
            });

            if (!response || !response.ok()) {
              throw new Error(`${name}: HTTP ${response?.status() || "no response"}: ${url}`);
            }

            await page.waitForTimeout(waitMs);
            await page.screenshot({
              path: path.join(deliver, "screens", `${name}.png`),
              fullPage: false,
            });

            const title = await page.title();
            console.log(`${name}: ${response.status()} / ${title}`);
            await page.close();
          }

          await capture("customer", config.capture_urls.customer, { width: 430, height: 900 }, 2500);
          await capture("member", config.capture_urls.member, { width: 430, height: 900 }, 4000);
          await capture("ipad", config.capture_urls.ipad, { width: 1180, height: 820 }, 4000);
          await capture("dashboard", config.capture_urls.dashboard, { width: 1440, height: 920 }, 4500);

          await browser.close();
          JS

          node /tmp/ksh-next-10-playwright/capture.mjs

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import json
          import html

          root = Path.cwd()
          deliver = root / "deliverables" / "ksh-next-10"
          screens = deliver / "screens"

          for name in ["customer", "member", "ipad", "dashboard"]:
              path = screens / f"{name}.png"
              if not path.is_file() or path.stat().st_size < 20000:
                  raise SystemExit(f"screenshot missing or too small: {path}")
              image = Image.open(path).convert("RGB")
              stat = ImageStat.Stat(image.resize((120, 120)))
              variance = sum(stat.var) / 3
              if variance < 80:
                  raise SystemExit(f"screenshot appears blank: {path}, variance={variance:.2f}")
              print(name, image.size, path.stat().st_size, f"variance={variance:.1f}")

          config = json.loads((deliver / "urls.json").read_text(encoding="utf-8"))
          urls = config["qr_urls"]

          def e(value):
              return html.escape(str(value), quote=True)

          cards = [
              ("customer", "お客様用LINE相談", "車検・修理・オイル交換・希望日時を入力", "管理コード不要"),
              ("member", "マイカー会員ページ", "現在進捗・見積承認・車両別整備履歴", "DEMO表示"),
              ("ipad", "店頭受付iPad", "到着待ち・作業中・引渡し待ちを現場確認", "管理コード 1234"),
              ("dashboard", "PCオーナー管理", "受付・進捗・見積・顧客車両・次回フォロー", "管理コード 1234"),
          ]

          qr_cards = []
          for key, title, desc, code in cards:
              qr_cards.append(f"""
                <article class="qr-card">
                  <div class="qr-copy">
                    <span>{e(code)}</span>
                    <h3>{e(title)}</h3>
                    <p>{e(desc)}</p>
                  </div>
                  <img class="qr" src="qr/{key}.png" alt="{e(title)} QRコード">
                </article>
              """)

          html_text = f"""<!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <title>DPRO 車検・整備工場 LINE 操作体験シート</title>
          <style>
