            </div>

            <div class="qr-grid">
              {''.join(qr_cards)}
            </div>

            <div class="check-area">
              <h2>営業前の確認</h2>
              <div class="check-list">
                <div>店舗名・営業時間・定休日を確認</div>
                <div>LINE相談から仮入庫を1件確認</div>
                <div>iPadで到着待ち・作業中を確認</div>
                <div>PCで見積提示・承認状態を確認</div>
                <div>マイカー履歴・次回目安を確認</div>
                <div>system-checkで全項目OKを確認</div>
              </div>
            </div>

            <div class="footer"><span>DPRO SHOP / STREET HOUSE 杵築 デモ</span><span>STEP KSH-NEXT-10A / 2026-07-23</span></div>
          </section>

          <section class="page">
            <div class="header">
              <div>
                <div class="eyebrow">DPRO NEXT / SALES & INTERNAL GUIDE</div>
                <h1>5分で伝える 操作体験ルート</h1>
                <p class="lead">お客様の相談から、受付、見積承認、整備履歴、次回フォローまでを順番に見せます。</p>
              </div>
              <div class="complete">完成候補パッケージ</div>
            </div>

            <div class="section-title"><b>1</b><h2>実画面</h2></div>
            <div class="preview-main"><img src="screens/dashboard.png" alt="PC管理画面"></div>
            <div class="preview-row">
              <div class="preview-small"><img src="screens/customer.png" alt="お客様相談"></div>
              <div class="preview-small"><img src="screens/member.png" alt="マイカー会員"></div>
